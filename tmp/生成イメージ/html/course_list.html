<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/course_list.css">
</head>
<body>
<div class="app">
  <iframe src="sidebar.html?active=master&sub=course" width="220" height="1040" style="border:0; flex-shrink:0; display:block;" title="サイドバー"></iframe>

  <div class="main">
    <div class="topbar">
      <div class="crumb-block">
        <div class="crumb">マスタ管理<span>／</span>コース</div>
        <p class="crumb-sub">コース情報を管理します</p>
      </div>
      <div class="user"><span>山田 太郎（BD事業部）</span><div class="avatar">山田</div></div>
    </div>

    <div class="content">
      <div class="toolbar">
        <div class="left">
          <h1>コース一覧</h1>
        </div>
        <div class="btn-group">
          <a class="btn primary" href="course_regist.html">＋ 新規登録</a>
        </div>
      </div>

      <div class="filter-panel">
        <div class="field"><label>キーワード検索</label><input type="text" class="field-control-input" placeholder="コースコード・コース名で検索"></div>
        <div class="field"><label>コース区分</label><div class="control small js-select" data-options="すべて,新CDPB,旧CDPB,新入社員研修">すべて<span class="caret">▾</span></div></div>
        <div class="field"><label>販売区分</label><div class="control small js-select" data-options="すべて,外販,内販">すべて<span class="caret">▾</span></div></div>
        <div class="field"><label>稼働状況</label><div class="control small js-select" data-options="すべて,稼働中,停止中">すべて<span class="caret">▾</span></div></div>
        <div class="search-btn">検索</div>
      </div>

      <div class="table-card">
        <div class="table-meta"><div class="count">全 <b>4</b> 件</div></div>
        <table>
          <thead>
            <tr>
              <th>コースコード</th>
              <th>コース区分</th>
              <th>コース名</th>
              <th>販売区分</th>
              <th>実施形態（推奨）</th>
              <th>日数（推奨）</th>
              <th>人数（推奨）</th>
              <th>稼働状況</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody>
            <tr><td>BC02</td><td><span class="tag orange">新入社員研修</span></td><td>ビジネス基礎研修</td><td><span class="tag hybrid">内販</span></td><td><span class="tag onsite">集合</span></td><td>3日</td><td>24名</td><td><span class="state on"><span class="dot"></span>稼働中</span></td><td><a class="link-btn" href="course_modify.html">編集</a></td></tr>
            <tr><td>GCD</td><td><span class="tag blue">新CDPB</span></td><td>グローバル基礎コース</td><td><span class="tag online">外販</span></td><td><span class="tag online">オンライン</span></td><td>1日</td><td>40名</td><td><span class="state on"><span class="dot"></span>稼働中</span></td><td><a class="link-btn" href="course_modify.html">編集</a></td></tr>
            <tr><td>NDU</td><td><span class="tag blue">新CDPB</span></td><td>次世代リーダー育成研修</td><td><span class="tag online">外販</span></td><td><span class="tag onsite">集合</span></td><td>3日</td><td>30名</td><td><span class="state on"><span class="dot"></span>稼働中</span></td><td><a class="link-btn" href="course_modify.html">編集</a></td></tr>
            <tr><td>CEC</td><td><span class="tag gray">旧CDPB</span></td><td>マネジメント基礎研修</td><td><span class="tag online">外販</span></td><td><span class="tag onsite">集合</span></td><td>2日</td><td>20名</td><td><span class="state off"><span class="dot"></span>停止中</span></td><td><a class="link-btn" href="course_modify.html">編集</a></td></tr>
          </tbody>
        </table>
        <div class="pagination">
          <div class="page-btn">‹</div><div class="page-btn active">1</div><div class="page-btn">›</div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="js/select.js" defer></script>
</body>
</html>

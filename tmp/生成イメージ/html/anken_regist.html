<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/anken_regist.css">
</head>
<body>
<div class="app">
  <iframe src="sidebar.html?active=anken" width="220" height="1040" style="border:0; flex-shrink:0; display:block;" title="サイドバー"></iframe>
  <div class="main">
    <div class="topbar"></div>
    <div class="content"><div class="toolbar"><h1>案件一覧</h1></div><div class="table-card"></div></div>
  </div>

  <div class="overlay">
    <div class="modal">
      <div class="modal-header">
        <div>
          <h2>案件新規登録</h2>
          <div class="sub">新規の案件情報を登録します</div>
        </div>
        <a class="close-x" href="anken_list.html">✕</a>
      </div>
      <div class="modal-body">
        <div class="form-field">
          <label>年度<span class="req">必須</span></label>
          <div class="form-control js-select" data-options="2024年度,2025年度,2026年度,2027年度">選択してください<span class="caret">▾</span></div>
        </div>
        <div class="form-field"></div>
        <div class="form-field">
          <label>案件コード</label>
          <div class="form-control readonly">自動採番（PJ-2608）</div>
        </div>
        <div class="form-field"></div>
        <div class="form-field">
          <label>販売区分<span class="req">必須</span></label>
          <div class="radio-group">
            <label class="radio-option"><input type="radio" name="salesType" value="外販"><span class="radio-dot"></span><span class="tag online">外販</span></label>
            <label class="radio-option"><input type="radio" name="salesType" value="内販"><span class="radio-dot"></span><span class="tag hybrid">内販</span></label>
          </div>
        </div>
        <div class="form-field">
          <label>参加区分<span class="req">必須</span></label>
          <div class="radio-group">
            <label class="radio-option"><input type="radio" name="participationType" value="受託"><span class="radio-dot"></span><span class="tag blue">受託</span></label>
            <label class="radio-option"><input type="radio" name="participationType" value="公募"><span class="radio-dot"></span><span class="tag orange">公募</span></label>
          </div>
        </div>
        <div class="form-field full">
          <label>案件名<span class="req">必須</span></label>
          <input type="text" class="form-control" placeholder="例）ビジネス基礎研修 定期開催">
        </div>
        <div class="form-field">
          <label>顧客名</label>
          <div class="form-control js-select" data-options="NTTデータ金融,株式会社ABC商事,DEFホールディングス,CECトラスト,NTTデータUNIV,グループ各社,（公募）">選択してください<span class="caret">▾</span></div>
        </div>
        <div class="form-field">
          <label>実施開始月<span class="req">必須</span></label>
          <div class="form-control js-month">例）2026/09<span class="caret">▾</span></div>
        </div>
        <div class="form-section">管理担当者</div>
        <div class="form-field">
          <label>PM<span class="req">必須</span></label>
          <div class="form-control js-select" data-options="山口 直人,田中 誠,高橋 健,伊藤 美咲,渡辺 直樹,佐藤 一郎">選択してください<span class="caret">▾</span></div>
        </div>
        <div class="form-field"></div>
        <div class="form-field full">
          <label>PL（複数選択可）</label>
          <div class="chip-box js-chip-select" data-options="細野 恵美,木村 隆,中島 拓海,小林 由美,松本 健二,市村 拓也,岡田 沙織" data-chip-class="pl">
            <span class="chip-add">＋ PLを追加</span>
          </div>
        </div>
        <div class="form-field full">
          <label>備考</label>
          <textarea class="form-control textarea" placeholder="特記事項があれば入力"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <a class="btn" href="anken_list.html">キャンセル</a>
        <a class="btn primary" href="anken_list.html">登録する</a>
      </div>
    </div>
  </div>
</div>
<script src="js/select.js" defer></script>
<script src="js/datepicker.js" defer></script>
<script src="js/chip-select.js" defer></script>
</body>
</html>

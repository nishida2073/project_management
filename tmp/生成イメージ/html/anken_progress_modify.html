<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="anken_progress_modify.css">
</head>
<body>
<div class="app">
  <iframe src="sidebar.html?active=shanai" width="220" height="1040" style="border:0; flex-shrink:0; display:block;" title="サイドバー"></iframe>
  <div class="main">
    <div class="topbar"></div>
    <div class="content"><div class="toolbar"><h1>案件進捗一覧</h1></div><div class="table-card"></div></div>
  </div>

  <div class="overlay">
    <div class="modal">
      <div class="modal-header">
        <div>
          <h2>案件進捗の更新</h2>
          <div class="sub">PJ-2601　G新人研修（NTTデータ金融共催）　実施開始月：2026/09　PM：山口／PL：細野・市村</div>
        </div>
        <a class="close-x" href="anken_progress_list.html">✕</a>
      </div>
      <div class="tabs">
        <div class="tab">社内承認フェーズ<span class="count">4/7</span></div>
        <div class="tab active">契約・開発準備<span class="count">0/2</span></div>
        <div class="tab">完了・請求<span class="count">0/4</span></div>
      </div>
      <div class="modal-body">
        <table class="step-table">
          <thead>
            <tr>
              <th style="width:260px;">工程名</th>
              <th style="width:110px;">予定日</th>
              <th style="width:110px;">実績日</th>
              <th style="width:120px;">担当者</th>
              <th style="width:110px;">ステータス</th>
              <th>報告事項 / メモ</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="step-name"><span class="step-no">1</span>顧客契約締結</td>
              <td><div class="mini-control">2026/03/11</div></td>
              <td><div class="mini-control">未実施</div></td>
              <td><div class="mini-control wide">荒牧</div></td>
              <td><div class="status-select progress">調整中<span class="caret">▾</span></div></td>
              <td><div class="memo-input">契約書ドラフト送付済み、押印待ち</div></td>
            </tr>
            <tr>
              <td class="step-name"><span class="step-no">2</span>開発実施準備</td>
              <td><div class="mini-control">2026/03/20</div></td>
              <td><div class="mini-control">未実施</div></td>
              <td><div class="mini-control wide">細野</div></td>
              <td><div class="status-select wait">未着手<span class="caret">▾</span></div></td>
              <td><div class="memo-input">契約締結後に着手予定</div></td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="modal-footer">
        <a class="btn" href="anken_progress_list.html">キャンセル</a>
        <a class="btn primary" href="anken_progress_list.html">保存する</a>
      </div>
    </div>
  </div>
</div>
</body>
</html>

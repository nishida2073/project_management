<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/anken_modify.css">
</head>
<body>
<div class="app">
  <iframe src="sidebar.html?active=anken" width="220" height="1040" style="border:0; flex-shrink:0; display:block;" title="サイドバー"></iframe>
  <div class="overlay">
    <div class="modal">
      <div class="modal-header">
        <div>
          <h2>案件編集</h2>
          <div class="sub">PJ-2601　G新人研修（NTTデータ金融共催）の情報を編集します</div>
        </div>
        <a class="close-x" href="anken_list.html">✕</a>
      </div>
      <div class="modal-body">
        <div class="form-field">
          <label>案件ID</label>
          <div class="form-control readonly">PJ-2601</div>
        </div>
        <div class="form-field full">
          <label>案件名<span class="req">必須</span></label>
          <input type="text" class="form-control" value="G新人研修（NTTデータ金融共催）">
        </div>
        <div class="form-field">
          <label>顧客名<span class="req">必須</span></label>
          <div class="form-control js-select" data-options="NTTデータ金融,株式会社ABC商事,DEFホールディングス,CECトラスト,NTTデータUNIV,グループ各社,（公募）">NTTデータ金融<span class="caret">▾</span></div>
        </div>
        <div class="form-field">
          <label>実施開始月<span class="req">必須</span></label>
          <div class="form-control js-month">2026/09<span class="caret">▾</span></div>
        </div>
        <div class="form-section">管理担当者</div>
        <div class="form-field">
          <label>PM<span class="req">必須</span></label>
          <div class="form-control js-select" data-options="山口 直人,田中 誠,高橋 健,伊藤 美咲,渡辺 直樹,佐藤 一郎">山口 直人<span class="caret">▾</span></div>
        </div>
        <div class="form-field">
          <label>PL</label>
          <div class="form-control js-select" data-options="細野 恵美,木村 隆,中島 拓海,小林 由美,松本 健二,市村 拓也,岡田 沙織">細野 恵美<span class="caret">▾</span></div>
        </div>
        <div class="form-field full">
          <label>備考</label>
          <textarea class="form-control textarea" placeholder="特記事項があれば入力"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <a class="btn" href="anken_list.html">キャンセル</a>
        <a class="btn primary" href="anken_list.html">保存する</a>
      </div>
    </div>
  </div>
</div>
<script src="js/select.js" defer></script>
<script src="js/datepicker.js" defer></script>
</body>
</html>

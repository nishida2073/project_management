<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/course_modify.css">
</head>
<body>
<div class="app">
  <iframe src="sidebar.html?active=master&sub=course" width="220" height="1040" style="border:0; flex-shrink:0; display:block;" title="サイドバー"></iframe>
  <div class="overlay">
    <div class="modal">
      <div class="modal-header">
        <div>
          <h2>コース編集</h2>
          <div class="sub">BC02　ビジネス基礎研修の情報を編集します</div>
        </div>
        <a class="close-x" href="course_list.html">✕</a>
      </div>
      <div class="modal-body">
        <div class="form-field">
          <label>コースコード</label>
          <div class="form-control readonly">BC02</div>
        </div>
        <div class="form-field"></div>
        <div class="form-field full">
          <label>コース区分</label>
          <div class="radio-group">
            <label class="radio-option"><input type="radio" name="courseType" value="新CDPB"><span class="radio-dot"></span><span class="tag blue">新CDPB</span></label>
            <label class="radio-option"><input type="radio" name="courseType" value="旧CDPB"><span class="radio-dot"></span><span class="tag gray">旧CDPB</span></label>
            <label class="radio-option"><input type="radio" name="courseType" value="新入社員研修" checked><span class="radio-dot"></span><span class="tag orange">新入社員研修</span></label>
          </div>
        </div>
        <div class="form-field full">
          <label>コース名<span class="req">必須</span></label>
          <input type="text" class="form-control" value="ビジネス基礎研修">
        </div>
        <div class="form-field">
          <label>販売区分</label>
          <div class="radio-group">
            <label class="radio-option"><input type="radio" name="salesType" value="外販"><span class="radio-dot"></span><span class="tag online">外販</span></label>
            <label class="radio-option"><input type="radio" name="salesType" value="内販" checked><span class="radio-dot"></span><span class="tag hybrid">内販</span></label>
          </div>
        </div>
        <div class="form-section">推奨設定</div>
        <div class="form-field full">
          <label>実施形態</label>
          <div class="radio-group">
            <label class="radio-option"><input type="radio" name="deliveryType" value="集合" checked><span class="radio-dot"></span><span class="tag onsite">集合</span></label>
            <label class="radio-option"><input type="radio" name="deliveryType" value="オンライン"><span class="radio-dot"></span><span class="tag online">オンライン</span></label>
            <label class="radio-option"><input type="radio" name="deliveryType" value="ハイブリッド"><span class="radio-dot"></span><span class="tag hybrid">ハイブリッド</span></label>
          </div>
        </div>
        <div class="form-field">
          <label>日数</label>
          <div class="form-control number-select" data-options="1,2,3,4,5">
            <input type="text" inputmode="numeric" value="3">
            <span class="caret">▾</span>
          </div>
        </div>
        <div class="form-field">
          <label>人数</label>
          <div class="form-control number-select" data-options="10,15,20,24,30,35,40,50">
            <input type="text" inputmode="numeric" value="24">
            <span class="caret">▾</span>
          </div>
        </div>
        <div class="form-field toggle-field">
          <label>稼働状況</label>
          <div class="toggle-row"><div class="toggle"><div class="knob"></div></div><span>稼働中</span></div>
        </div>
      </div>
      <div class="modal-footer">
        <a class="btn" href="course_list.html">キャンセル</a>
        <a class="btn primary" href="course_list.html">保存する</a>
      </div>
    </div>
  </div>
</div>
<script src="js/select.js" defer></script>
<script src="js/number-select.js" defer></script>
<script src="js/toggle.js" defer></script>
</body>
</html>

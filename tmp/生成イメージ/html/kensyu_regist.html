<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/kensyu_regist.css">
</head>
<body>
<div class="app">
  <iframe src="sidebar.html?active=kensyu" width="220" height="1040" style="border:0; flex-shrink:0; display:block;" title="サイドバー"></iframe>
  <div class="main">
    <div class="topbar"></div>
    <div class="content"><div class="toolbar"><h1>研修一覧</h1></div><div class="table-card"></div></div>
  </div>

  <div class="overlay">
    <div class="modal">
      <div class="modal-header">
        <div>
          <h2>研修新規登録</h2>
          <div class="sub">新規の研修情報を登録します</div>
        </div>
        <a class="close-x" href="kensyu_list.html">✕</a>
      </div>
      <div class="modal-body">
        <div class="form-field">
          <label>コースコード<span class="req">必須</span></label>
          <div class="form-control">例）BC02-03</div>
        </div>
        <div class="form-field">
          <label>コース名<span class="req">必須</span></label>
          <div class="form-control">例）ビジネス基礎研修</div>
        </div>
        <div class="form-field">
          <label>クラスコード</label>
          <div class="form-control">自動採番（BC02-03-C1）</div>
        </div>
        <div class="form-field">
          <label>区分<span class="req">必須</span></label>
          <div class="form-control">選択してください<span class="caret">▾</span></div>
        </div>
        <div class="form-field">
          <label>開始日<span class="req">必須</span></label>
          <div class="form-control">例）2026/09/02</div>
        </div>
        <div class="form-field">
          <label>終了日<span class="req">必須</span></label>
          <div class="form-control">例）2026/09/04</div>
        </div>
        <div class="form-field">
          <label>管理担当者</label>
          <div class="form-control">選択してください<span class="caret">▾</span></div>
        </div>
        <div class="form-field"></div>
        <div class="form-field">
          <label>実施形態<span class="req">必須</span></label>
          <div class="form-control">選択してください<span class="caret">▾</span></div>
        </div>
        <div class="form-field">
          <label>ロケーション名</label>
          <div class="form-control">選択してください<span class="caret">▾</span></div>
        </div>
        <div class="form-section">メイン</div>
        <div class="form-field">
          <label>ベンダー名</label>
          <div class="form-control">選択してください<span class="caret">▾</span></div>
        </div>
        <div class="form-field">
          <label>講師名</label>
          <div class="form-control">例）田中 誠</div>
        </div>
        <div class="form-section">サブ</div>
        <div class="form-field full">
          <div class="sub-grid sub-row-header"><span>ベンダー名</span><span>講師名</span></div>
          <div class="sub-list"></div>
          <div class="link-btn add-row">＋ サブを追加</div>
        </div>
        <div class="form-field">
          <label>受講者数</label>
          <div class="form-control">例）24</div>
        </div>
      </div>
      <div class="modal-footer">
        <a class="btn" href="kensyu_list.html">キャンセル</a>
        <a class="btn primary" href="kensyu_list.html">登録する</a>
      </div>
    </div>
  </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/kensyu_regist.css">
</head>
<body>
<div class="app">
  <iframe src="sidebar.html?active=kensyu" width="220" height="1040" style="border:0; flex-shrink:0; display:block;" title="サイドバー"></iframe>
  <div class="main">
    <div class="topbar"></div>
    <div class="content"><div class="toolbar"><h1>研修一覧</h1></div><div class="table-card"></div></div>
  </div>

  <div class="overlay">
    <div class="modal">
      <div class="modal-header">
        <div>
          <h2>研修新規登録</h2>
          <div class="sub">新規の研修情報を登録します</div>
        </div>
        <a class="close-x" href="kensyu_list.html">✕</a>
      </div>
      <div class="modal-body">
        <div class="form-field">
          <label>コースコード<span class="req">必須</span></label>
          <div class="form-control js-select" data-options="BC02-01,BC02-02,GCD-114,GCD-115,NDU-203,NDU-204,CEC-051" data-target="#courseName" data-map='{"BC02-01":"ビジネス基礎研修","BC02-02":"ビジネス基礎研修","GCD-114":"グローバル基礎コース","GCD-115":"グローバル基礎コース","NDU-203":"次世代リーダー育成研修","NDU-204":"次世代リーダー育成研修","CEC-051":"マネジメント基礎研修"}'>選択してください<span class="caret">▾</span></div>
        </div>
        <div class="form-field">
          <label>コース名</label>
          <div class="form-control readonly" id="courseName">選択すると自動入力されます</div>
        </div>
        <div class="form-field">
          <label>クラスコード</label>
          <div class="form-control readonly">自動採番（BC02-03-C1）</div>
        </div>
        <div class="form-field">
          <label>区分<span class="req">必須</span></label>
          <div class="form-control js-select" data-options="受託,公募">選択してください<span class="caret">▾</span></div>
        </div>
        <div class="form-field">
          <label>開始日<span class="req">必須</span></label>
          <div class="form-control js-date">例）2026/09/02<span class="caret">▾</span></div>
        </div>
        <div class="form-field">
          <label>終了日<span class="req">必須</span></label>
          <div class="form-control js-date">例）2026/09/04<span class="caret">▾</span></div>
        </div>
        <div class="form-field">
          <label>管理担当者</label>
          <div class="form-control js-select" data-options="佐藤 一郎,鈴木 花子,高橋 健,伊藤 美咲,渡辺 直樹">選択してください<span class="caret">▾</span></div>
        </div>
        <div class="form-field"></div>
        <div class="form-field">
          <label>実施形態<span class="req">必須</span></label>
          <div class="form-control js-select" data-options="集合,オンライン,ハイブリッド">選択してください<span class="caret">▾</span></div>
        </div>
        <div class="form-field">
          <label>ロケーション名</label>
          <div class="form-control js-select" data-options="本社5F 研修室A,本社5F 研修室B,本社5F 研修室C,本社3F 研修室A,大阪支社 3F">選択してください<span class="caret">▾</span></div>
        </div>
        <div class="form-section">メイン</div>
        <div class="form-field">
          <label>講師ベンダー名</label>
          <div class="form-control js-select" data-options="株式会社NEUトレーニング,NDUパートナーズ,ユニバ研修サービス,CECトラスト">選択してください<span class="caret">▾</span></div>
        </div>
        <div class="form-field">
          <label>講師名</label>
          <input type="text" class="form-control" placeholder="例）田中 誠">
        </div>
        <div class="form-section">サブ</div>
        <div class="form-field full">
          <div class="sub-grid sub-row-header"><span>ベンダー名</span><span>講師名</span></div>
          <div class="sub-list"></div>
          <div class="link-btn add-row">＋ サブを追加</div>
        </div>
        <div class="form-field">
          <label>受講者数</label>
          <div class="form-control number-select" data-options="10,15,20,24,30,35,40,50">
            <input type="text" inputmode="numeric" placeholder="例）24">
            <span class="caret">▾</span>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <a class="btn" href="kensyu_list.html">キャンセル</a>
        <a class="btn primary" href="kensyu_list.html">登録する</a>
      </div>
    </div>
  </div>
</div>
<script src="js/select.js" defer></script>
<script src="js/datepicker.js" defer></script>
<script src="js/number-select.js" defer></script>
</body>
</html>

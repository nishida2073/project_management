<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/course_regist.css">
</head>
<body>
<div class="app">
  <iframe src="sidebar.html?active=master&sub=course" width="220" height="1040" style="border:0; flex-shrink:0; display:block;" title="サイドバー"></iframe>
  <div class="main">
    <div class="topbar"></div>
    <div class="content"><div class="toolbar"><h1>コース一覧</h1></div><div class="table-card"></div></div>
  </div>

  <div class="overlay">
    <div class="modal">
      <div class="modal-header">
        <div>
          <h2>コース新規登録</h2>
          <div class="sub">新規のコース情報を登録します</div>
        </div>
        <a class="close-x" href="course_list.html">✕</a>
      </div>
      <div class="modal-body">
        <div class="form-field full">
          <label>年度<span class="req">必須</span></label>
          <div class="form-control js-select" data-options="2024年度,2025年度,2026年度,2027年度">選択してください<span class="caret">▾</span></div>
        </div>
        <div class="form-field full">
          <label>コースコード<span class="req">必須</span></label>
          <input type="text" class="form-control" placeholder="例）BC02B">
        </div>
        <div class="form-field">
          <label>参加区分</label>
          <div class="radio-group">
            <label class="radio-option"><input type="radio" name="participationType" value="公募"><span class="radio-dot"></span><span class="tag orange">公募</span></label>
            <label class="radio-option"><input type="radio" name="participationType" value="受託"><span class="radio-dot"></span><span class="tag blue">受託</span></label>
          </div>
        </div>
        <div class="form-field full">
          <label>科目<span class="req">必須</span></label>
          <div class="form-control js-select" id="subjectSelect" data-options="システム開発入門,基盤技術基礎,AP要件定義基礎,AP設計・製造基礎,AP試験基礎,データモデル設計基礎,基盤構築プロセス基礎,営業基本Ⅰ,営業リスクマネジメントⅠ,IT-PM入門,品質管理入門,システム基盤実践">選択してください<span class="caret">▾</span></div>
        </div>
        <div class="form-field full">
          <label>コース名<span class="req">必須</span></label>
          <input type="text" class="form-control" id="courseName" placeholder="選択すると自動生成されます（編集可）">
        </div>
        <div class="form-section">推奨設定</div>
        <div class="form-field full">
          <label>実施形態</label>
          <div class="radio-group">
            <label class="radio-option"><input type="radio" name="deliveryType" value="集合"><span class="radio-dot"></span><span class="tag onsite">集合</span></label>
            <label class="radio-option"><input type="radio" name="deliveryType" value="オンライン"><span class="radio-dot"></span><span class="tag online">オンライン</span></label>
            <label class="radio-option"><input type="radio" name="deliveryType" value="ハイブリッド"><span class="radio-dot"></span><span class="tag hybrid">ハイブリッド</span></label>
          </div>
        </div>
        <div class="form-field full">
          <label>日数</label>
          <div class="form-control number-select" data-options="1,2,3,4,5">
            <input type="text" inputmode="numeric" placeholder="例）3">
            <span class="caret">▾</span>
          </div>
        </div>
        <div class="form-field">
          <label>最小人数</label>
          <div class="form-control number-select" data-options="10,15,20,24,30,35,40,50">
            <input type="text" inputmode="numeric" placeholder="例）20">
            <span class="caret">▾</span>
          </div>
        </div>
        <div class="form-field">
          <label>最大人数</label>
          <div class="form-control number-select" data-options="10,15,20,24,30,35,40,50">
            <input type="text" inputmode="numeric" placeholder="例）24">
            <span class="caret">▾</span>
          </div>
        </div>
        <div class="form-field toggle-field">
          <label>稼働状況</label>
          <div class="toggle-row"><div class="toggle"><div class="knob"></div></div><span>稼働中</span></div>
        </div>
      </div>
      <div class="modal-footer">
        <a class="btn" href="course_list.html">キャンセル</a>
        <a class="btn primary" href="course_list.html">登録する</a>
      </div>
    </div>
  </div>
</div>
<script src="js/select.js" defer></script>
<script src="js/number-select.js" defer></script>
<script src="js/toggle.js" defer></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var subjectEl = document.getElementById('subjectSelect');
  var courseNameEl = document.getElementById('courseName');
  var courseNameEdited = false;
  courseNameEl.addEventListener('input', function () { courseNameEdited = true; });
  function updateCourseName() {
    if (courseNameEdited) return;
    var participationRadio = document.querySelector('input[name="participationType"]:checked');
    var participation = participationRadio ? participationRadio.value : '';
    var subject = subjectEl.getAttribute('data-value') || '';
    courseNameEl.value = (participation && subject) ? (participation + '_' + subject) : '';
  }
  document.querySelectorAll('input[name="participationType"]').forEach(function (r) { r.addEventListener('change', updateCourseName); });
  new MutationObserver(updateCourseName).observe(subjectEl, { attributes: true, attributeFilter: ['data-value'] });
});
</script>
</body>
</html>

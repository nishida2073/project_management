<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/tantousya_regist.css">
</head>
<body>
<div class="app">
  <iframe src="sidebar.html?active=master&sub=tantousya" width="220" height="1040" style="border:0; flex-shrink:0; display:block;" title="サイドバー"></iframe>
  <div class="main">
    <div class="topbar"></div>
    <div class="body-area"><div class="subnav"></div><div class="content"><div class="toolbar"><h1>担当者</h1></div><div class="table-card"></div></div></div>
  </div>

  <div class="overlay">
    <div class="modal">
      <div class="modal-header">
        <div>
          <h2>担当者登録</h2>
          <div class="sub">新規の担当者情報を登録します</div>
        </div>
        <a class="close-x" href="tantousya_list.html">✕</a>
      </div>
      <div class="modal-body">
        <div class="form-field">
          <label>担当者コード</label>
          <div class="form-control readonly">自動採番（TAN-058）</div>
        </div>
        <div class="form-field"></div>
        <div class="form-field">
          <label>所属区分<span class="req">必須</span></label>
          <div class="radio-group">
            <label class="radio-option"><input type="radio" name="affiliation" value="社内"><span class="radio-dot"></span><span class="tag blue">社内</span></label>
            <label class="radio-option"><input type="radio" name="affiliation" value="パートナー"><span class="radio-dot"></span><span class="tag orange">パートナー</span></label>
          </div>
        </div>
        <div class="form-field"></div>
        <div class="form-field">
          <label>担当者名<span class="req">必須</span></label>
          <input type="text" class="form-control" placeholder="例）山田 太郎">
        </div>
        <div class="form-field"></div>
        <div class="form-field">
          <label>メールアドレス</label>
          <input type="email" class="form-control" placeholder="例）yamada@company.co.jp">
        </div>
        <div class="form-field full">
          <label>担当区分（複数選択可）<span class="req">必須</span></label>
          <div class="chip-box js-chip-select" data-options="案件,クラス" data-chip-map='{"案件":"anken","クラス":"class"}'>
            <span class="chip-add">＋ 担当区分を追加</span>
          </div>
        </div>
        <div class="form-field full">
          <label>業務区分<span class="req">必須</span></label>
          <div class="radio-group" data-target="#roleChipBox" data-options-map='{"営業":["-"],"管理":["PM","PL"],"実施":["-"]}'>
            <label class="radio-option"><input type="radio" name="jobType" value="営業"><span class="radio-dot"></span><span class="tag orange">営業</span></label>
            <label class="radio-option"><input type="radio" name="jobType" value="管理"><span class="radio-dot"></span><span class="tag mgmt">管理</span></label>
            <label class="radio-option"><input type="radio" name="jobType" value="実施"><span class="radio-dot"></span><span class="tag exec">実施</span></label>
          </div>
        </div>
        <div class="form-field full">
          <label>役職（複数選択可）</label>
          <div class="chip-box js-chip-select" id="roleChipBox" data-options="PM,PL" data-chip-map='{"PM":"pm","PL":"pl"}'>
            <span class="chip pm">PM <x>✕</x></span>
            <span class="chip pl">PL <x>✕</x></span>
            <span class="chip-add">＋ 役職を追加</span>
          </div>
        </div>
        <div class="form-field toggle-field">
          <label>稼働状況</label>
          <div class="toggle-row"><div class="toggle"><div class="knob"></div></div><span>稼働中</span></div>
        </div>
      </div>
      <div class="modal-footer">
        <a class="btn" href="tantousya_list.html">キャンセル</a>
        <a class="btn primary" href="tantousya_list.html">登録する</a>
      </div>
    </div>
  </div>
</div>
<script src="js/select.js" defer></script>
<script src="js/chip-select.js" defer></script>
<script src="js/toggle.js" defer></script>
</body>
</html>

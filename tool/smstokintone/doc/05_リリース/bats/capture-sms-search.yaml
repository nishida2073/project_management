# 4.2 SMSの検索の画像を撮る（05_リリース/screenshots に出力する名前）
# 注: 受信用の SMS（sms-search-sms.json）は run-capture.bat が sms-search のときに送る。SMS は 90 秒後に届き、自動で送信されるため、本文が出るまで「検索」を繰り返す
# 注: 長押し（手動の返信）は外部のメッセージアプリを開くため、この flow では撮らない（sms_search_reply_long_press_01 は別に撮った画像を使う）
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: ../../03_結合テスト/maestro/setup/setup-import-environment.yaml
- stopApp
- launchApp
- assertVisible: "送信先の設定"
- takeScreenshot: sms_search_top_tap_01
- tapOn: "SMSの検索"
- assertVisible: "検索条件"
- takeScreenshot: sms_search_screen_open_01
- runFlow:
    file: ../../03_結合テスト/maestro/common/scroll-down-and-tap-by-id.yaml
    env:
      ID: cbSmsSearchSentAutoOnly
      INDEX: 0
- takeScreenshot: sms_search_conditions_input_01
- takeScreenshot: sms_search_search_tap_01
- repeat:
    times: 60
    while:
      notVisible: '(?s).*body-search.*'
    commands:
      - tapOn: "検索"
      - waitForAnimationToEnd:
          timeout: 3000
- takeScreenshot: sms_search_list_view_01
- tapOn:
    text: '(?s).*body-search.*'
    index: 0
- takeScreenshot: sms_search_list_select_01
- tapOn: "選択したSMSを送信"
- takeScreenshot: sms_search_send_tap_01
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: sms_search_queue_count_check_01

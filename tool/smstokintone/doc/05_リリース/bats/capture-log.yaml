# 5.1 ログの一覧の画像を撮る（05_リリース/screenshots に出力する名前）
# 注: 受信用の SMS（log-sms.json）は run-capture.bat が log のときに送る
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: ../../03_結合テスト/maestro/setup/setup-import-environment.yaml
- stopApp
- launchApp
- assertVisible: "送信先の設定"
- takeScreenshot: log_top_tap_01
- tapOn: "ログの確認"
- assertVisible: "ログの一覧"
- takeScreenshot: log_screen_open_01
- runFlow:
    file: ../../03_結合テスト/maestro/common/refresh-log-until-visible.yaml
    env:
      TEXT: '\[受信完了\].*'
- takeScreenshot: log_list_check_01
- takeScreenshot: log_refresh_tap_01
- tapOn:
    text: "更新"
    index: 0
- longPressOn:
    text: '(?s).*\[受信完了\].*'
    index: 0
- takeScreenshot: log_extraction_result_check_01
- pressKey: Back
- takeScreenshot: log_delete_tap_01
- tapOn:
    text: "削除"
    index: 0
- takeScreenshot: log_delete_confirm_tap_01
- pressKey: Back

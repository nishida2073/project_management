# 3.2 アプリの設定の画像を撮る（05_リリース/screenshots に出力する名前）
# 注: 端末の許可は、許可する前（_01）と許可した後（_02）の両方を撮る。2.3-27〜29 と同じく、launchApp の permissions で 1 つずつ拒否して起動する
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: ../../03_結合テスト/maestro/setup/setup-import-environment.yaml

# 端末の許可（SMSの読み取り）
- stopApp
- launchApp:
    permissions:
      all: allow
      android.permission.READ_SMS: deny
- assertVisible: "送信先の設定"
- takeScreenshot: top_app_settings_tap_01
- tapOn: "アプリの設定"
- assertVisible: "アプリの設定"
- takeScreenshot: app_settings_screen_open_01
- runFlow:
    file: ../../03_結合テスト/maestro/common/scroll-down-by-id.yaml
    env:
      ID: btnRequestReadPermission
- runFlow:
    file: ../../03_結合テスト/maestro/common/assert-visible-by-id.yaml
    env:
      ID: btnRequestReadPermission
      INDEX: 0
- takeScreenshot: app_settings_read_permission_allow_01
- runFlow:
    file: ../../03_結合テスト/maestro/common/scroll-down-and-tap-by-id.yaml
    env:
      ID: btnRequestReadPermission
      INDEX: 0
- runFlow:
    file: ../../03_結合テスト/maestro/common/scroll-down-and-assert-text-by-id.yaml
    env:
      ID: tvReadPermissionStatus
      INDEX: 0
      TEXT: "許可済み"
- takeScreenshot: app_settings_read_permission_allow_02

# 端末の許可（SMSの受信）
- stopApp
- launchApp:
    permissions:
      all: allow
      android.permission.RECEIVE_SMS: deny
- tapOn: "アプリの設定"
- runFlow:
    file: ../../03_結合テスト/maestro/common/scroll-down-by-id.yaml
    env:
      ID: btnRequestPermission
- runFlow:
    file: ../../03_結合テスト/maestro/common/assert-visible-by-id.yaml
    env:
      ID: btnRequestPermission
      INDEX: 0
- takeScreenshot: app_settings_receive_permission_allow_01
- runFlow:
    file: ../../03_結合テスト/maestro/common/scroll-down-and-tap-by-id.yaml
    env:
      ID: btnRequestPermission
      INDEX: 0
- runFlow:
    file: ../../03_結合テスト/maestro/common/scroll-down-and-assert-text-by-id.yaml
    env:
      ID: tvPermissionStatus
      INDEX: 0
      TEXT: "許可済み"
- takeScreenshot: app_settings_receive_permission_allow_02

# 端末の許可（SMSの送信）
- stopApp
- launchApp:
    permissions:
      all: allow
      android.permission.SEND_SMS: deny
- tapOn: "アプリの設定"
- runFlow:
    file: ../../03_結合テスト/maestro/common/scroll-down-by-id.yaml
    env:
      ID: btnRequestSendPermission
- runFlow:
    file: ../../03_結合テスト/maestro/common/assert-visible-by-id.yaml
    env:
      ID: btnRequestSendPermission
      INDEX: 0
- takeScreenshot: app_settings_send_permission_allow_01
- runFlow:
    file: ../../03_結合テスト/maestro/common/scroll-down-and-tap-by-id.yaml
    env:
      ID: btnRequestSendPermission
      INDEX: 0
- runFlow:
    file: ../../03_結合テスト/maestro/common/scroll-down-and-assert-text-by-id.yaml
    env:
      ID: tvSendPermissionStatus
      INDEX: 0
      TEXT: "許可済み"
- takeScreenshot: app_settings_send_permission_allow_02

# 以降の項目（すべて許可した状態）
- stopApp
- launchApp
- tapOn: "アプリの設定"
- assertVisible: "アプリの設定"
- takeScreenshot: app_settings_send_mode_select_01
- takeScreenshot: app_settings_reply_mode_select_01
- takeScreenshot: app_settings_extraction_select_01
- takeScreenshot: app_settings_continuation_select_01
- takeScreenshot: app_settings_log_select_01

# 3.3 引継ぎ内容の設定の画像を撮る（05_リリース/screenshots に出力する名前）
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: ../../03_結合テスト/maestro/setup/setup-import-environment.yaml
- stopApp
- launchApp
- assertVisible: "送信先の設定"
- tapOn: "アプリの設定"
- runFlow:
    when:
      notVisible: "引継ぎ内容の設定"
    commands:
      - repeat:
          times: 10
          commands:
            - swipe:
                direction: UP
      - scrollUntilVisible:
          element:
            text: "引継ぎ内容の設定"
          direction: UP
- tapOn: "引継ぎ内容の設定"
- takeScreenshot: continuation_info_settings_screen_open_01
- takeScreenshot: continuation_info_settings_keyword_input_01
- takeScreenshot: continuation_info_settings_name_edit_01
- tapOn:
    text: "削除"
    index: 0
- takeScreenshot: continuation_info_settings_delete_tap_01
- takeScreenshot: continuation_info_settings_save_tap_01

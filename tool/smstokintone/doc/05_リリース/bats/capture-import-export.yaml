# 3.4 設定のインポート・エクスポートの画像を撮る（05_リリース/screenshots に出力する名前）
# 注: インポートは、ファイルを選んでから有効になる。ダイアログは「インポート」を押すと出る
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: ../../03_結合テスト/maestro/setup/setup-import-environment.yaml
- stopApp
- launchApp
- assertVisible: "送信先の設定"
- takeScreenshot: top_settings_import_export_tap_01
- tapOn: "設定のインポート・エクスポート"
- assertVisible: "ファイルを選択"
- takeScreenshot: settings_import_export_screen_open_01
- takeScreenshot: settings_import_export_export_tap_01
- tapOn: "ファイルを選択"
- takeScreenshot: settings_import_export_file_select_tap_01
- runFlow:
    file: ../../03_結合テスト/maestro/common/select-download-file-by-text.yaml
    env:
      TEXT: ${SETUP_FILE_PATTERN}
- assertVisible: '(?s).*${SETUP_FILE_PATTERN}.*'
- takeScreenshot: settings_import_export_content_check_01
- takeScreenshot: settings_import_export_import_tap_01
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/btnImportSettings"
- assertVisible: "設定をインポートしますか？"
- takeScreenshot: settings_import_export_confirm_dialog_tap_01

# 2.3 アプリの設定: 統合範囲（秒）を入力する（テスト仕様書の 2.3 の 17 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- runFlow:
    file: common/scroll-up-by-id.yaml
    env:
      ID: rbThemeLight
- takeScreenshot: 2.3-17-log-match-tolerance-save-01
- runFlow:
    file: common/scroll-down-by-id.yaml
    env:
      ID: etLogMatchToleranceSeconds
- takeScreenshot: 2.3-17-log-match-tolerance-save-02
- runFlow:
    file: common/input-text-by-id.yaml
    env:
      ID: etLogMatchToleranceSeconds
      INDEX: 0
      VALUE: "${LOG_MATCH_TOLERANCE_SECONDS}"
- takeScreenshot: 2.3-17-log-match-tolerance-save-03
- runFlow:
    file: common/scroll-down-and-assert-text-by-id.yaml
    env:
      ID: etLogMatchToleranceSeconds
      INDEX: 0
      TEXT: "${LOG_MATCH_TOLERANCE_SECONDS}"
- takeScreenshot: 2.3-17-log-match-tolerance-save-04

# 2.7 SMSの検索: SMS選択の対象（抽出状況が異常）をオンにすると、抽出が異常の SMS も送信キューに追加される（テスト仕様書の 2.7 の 11 に対応）
# 外部条件: 端末に抽出が異常の SMS がある
# 前提（フローで設定）: アプリの設定で「SMS選択の対象（抽出状況が異常）」をオンにする（既定はオフ）
# 注: 抽出が異常の行（${SEARCH_ABNORMAL_ROW_TEXT}）が一覧にあり、その行のチェックボックス（id cbSmsItemSelect の index ${SMS_ABNORMAL_CHECKBOX_INDEX}）が全選択の後にチェック済みであることを確認する。送信キューの件数と送信完了のトーストは、件数を書かず正規表現で確認する
# 外部条件: 端末に、抽出が異常の SMS（本文に ${SEARCH_ABNORMAL_ROW_TEXT} を含む）と、抽出が正常の SMS が、今日の受信日の範囲にある。${SMS_ABNORMAL_CHECKBOX_INDEX} は、一覧の上から数えた抽出が異常の行の位置（0 始まり）で、一覧の並び順（新しい順）に依存するため、実施日の端末の一覧に合わせて vars で書き換える
# 未確認: index によるチェックボックスの指定（id と index の組み合わせ）は、この Maestro で未確認
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: swSearchExtractionFailedEnabled
      INDEX: 0
- runFlow:
    file: common/assert-id-checked.yaml
    env:
      ID: swSearchExtractionFailedEnabled
      INDEX: 0
- pressKey: Back
- tapOn: "SMSの検索"
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "検索条件"
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: cbSmsSearchSendNoneOnly
      INDEX: 0
- runFlow:
    file: common/assert-id-checked.yaml
    env:
      ID: cbSmsSearchSendNoneOnly
      INDEX: 0
- tapOn: "検索"
- assertVisible: '(?s).*🆖.*${SEARCH_ABNORMAL_ROW_TEXT}.*'
- tapOn: "全選択"
- runFlow:
    file: common/assert-id-checked.yaml
    env:
      ID: cbSmsItemSelect
      INDEX: ${SMS_ABNORMAL_CHECKBOX_INDEX}
- tapOn: "選択したSMSを送信"
- tapOn: "ログの確認"
- extendedWaitUntil:
    visible: '(?s).*\[(送信完了|失敗)\].*'
    timeout: 180000
- pressKey: Back
- takeScreenshot: 2.7-11-include-failed-send-01

# 2.1 トップ: 送信モードが手動、返信モードが自動のときの表示を確認する（テスト仕様書の 2.1 の 2 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（フローで設定）: この flow の中で、アプリの設定の SMSの送信モードを手動、SMSの返信モードを自動に切り替えてから確認する
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- takeScreenshot: 2.1-02-top-modes-manual-auto-01
- runFlow:
    file: common/scroll-down-and-tap-by-id.yaml
    env:
      ID: rbSendManual
      INDEX: 0
- takeScreenshot: 2.1-02-top-modes-manual-auto-02
- runFlow:
    file: common/scroll-down-and-tap-by-id.yaml
    env:
      ID: rbSmsReplyModeAuto
      INDEX: 0
- takeScreenshot: 2.1-02-top-modes-manual-auto-03
- pressKey: Back
- takeScreenshot: 2.1-02-top-modes-manual-auto-04
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "SMSの送信モード"
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "SMSの返信モード"
- runFlow:
    file: common/scroll-down-and-assert-text-by-id.yaml
    env:
      ID: tvTopSendStatus
      INDEX: 0
      TEXT: "手動"
- runFlow:
    file: common/scroll-down-and-assert-text-by-id.yaml
    env:
      ID: tvTopReplyStatus
      INDEX: 0
      TEXT: "自動"
- takeScreenshot: 2.1-02-top-modes-manual-auto-05

# 2.1 トップ: 送信モードが手動、返信モードが自動のときの表示を確認する（テスト仕様書の 2.1 の 2 に対応）
appId: com.ssfrontier.smstokintone
---
# 前提: 仕様書 2.1 の前提条件（SMSの送信モード手動、SMSの返信モード自動。2.3 の 3、4 で設定）
- launchApp
- assertVisible: "SMSの送信モード"
- assertVisible: "SMSの返信モード"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/tvTopSendStatus"
    text: "手動"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/tvTopReplyStatus"
    text: "自動"
- takeScreenshot: 2.1-02-top-modes-manual-auto

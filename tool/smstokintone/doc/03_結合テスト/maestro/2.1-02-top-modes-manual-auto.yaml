# 2.1 トップ: 送信モードが手動、返信モードが自動のときの表示を確認する（テスト仕様書の 2.1 の 2 に対応）
# 前提: 既定値（送信：自動、返信：手動）。この flow の中で、アプリの設定を手動・自動に切り替えてから確認する
appId: com.ssfrontier.smstokintone
---
- launchApp
- tapOn: "アプリの設定"
- takeScreenshot: 2.1-02-top-modes-manual-auto-01
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/rbSendManual"
    direction: DOWN
- tapOn:
    id: "com.ssfrontier.smstokintone:id/rbSendManual"
- takeScreenshot: 2.1-02-top-modes-manual-auto-02
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/rbSmsReplyModeAuto"
    direction: DOWN
- tapOn:
    id: "com.ssfrontier.smstokintone:id/rbSmsReplyModeAuto"
- takeScreenshot: 2.1-02-top-modes-manual-auto-03
- pressKey: Back
- takeScreenshot: 2.1-02-top-modes-manual-auto-04
- assertVisible: "SMSの送信モード"
- assertVisible: "SMSの返信モード"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/tvTopSendStatus"
    text: "手動"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/tvTopReplyStatus"
    text: "自動"
- takeScreenshot: 2.1-02-top-modes-manual-auto-05

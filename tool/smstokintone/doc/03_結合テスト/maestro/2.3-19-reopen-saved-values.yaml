# 2.3 アプリの設定: 入力した設定値を開き直しても保持している（テスト仕様書の 2.3 の 19 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（フローで設定）: 返信メッセージ（正常・異常）、自動返信の間隔、統合範囲（秒）、本文の最大表示文字数を、2.3 の 18 から 21 と同じ値で入力する
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- runFlow:
    file: common/scroll-up-to-id.yaml
    env:
      ID: rbThemeLight
- takeScreenshot: 2.3-19-reopen-saved-values-01
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: rbSmsReplyModeAuto
      INDEX: 0
- runFlow:
    file: common/assert-id-checked.yaml
    env:
      ID: rbSmsReplyModeAuto
      INDEX: 0
- runFlow:
    file: common/scroll-down-to-id.yaml
    env:
      ID: etReplyCooldownSeconds
- takeScreenshot: 2.3-19-reopen-saved-values-02
- runFlow:
    file: common/input-text-field.yaml
    env:
      ID: etReplyCooldownSeconds
      INDEX: 0
      VALUE: "${REPLY_COOLDOWN_SECONDS}"
- takeScreenshot: 2.3-19-reopen-saved-values-03
- runFlow:
    file: common/scroll-down-to-id.yaml
    env:
      ID: etReplySuccessBody
- takeScreenshot: 2.3-19-reopen-saved-values-04
- runFlow:
    file: common/input-text-field.yaml
    env:
      ID: etReplySuccessBody
      INDEX: 0
      VALUE: "${REPLY_SUCCESS_BODY}"
- takeScreenshot: 2.3-19-reopen-saved-values-05
- runFlow:
    file: common/scroll-down-to-id.yaml
    env:
      ID: etReplyFailedBody
- takeScreenshot: 2.3-19-reopen-saved-values-06
- runFlow:
    file: common/input-text-field.yaml
    env:
      ID: etReplyFailedBody
      INDEX: 0
      VALUE: "${REPLY_FAILED_BODY}"
- takeScreenshot: 2.3-19-reopen-saved-values-07
- runFlow:
    file: common/scroll-down-to-id.yaml
    env:
      ID: etLogMatchToleranceSeconds
- takeScreenshot: 2.3-19-reopen-saved-values-08
- runFlow:
    file: common/input-text-field.yaml
    env:
      ID: etLogMatchToleranceSeconds
      INDEX: 0
      VALUE: "${LOG_MATCH_TOLERANCE_SECONDS}"
- takeScreenshot: 2.3-19-reopen-saved-values-09
- runFlow:
    file: common/scroll-down-to-id.yaml
    env:
      ID: etLogBodyExcerptLength
- takeScreenshot: 2.3-19-reopen-saved-values-10
- runFlow:
    file: common/input-text-field.yaml
    env:
      ID: etLogBodyExcerptLength
      INDEX: 0
      VALUE: "${LOG_BODY_EXCERPT_LENGTH}"
- takeScreenshot: 2.3-19-reopen-saved-values-11
- pressKey: Back
- takeScreenshot: 2.3-19-reopen-saved-values-12
- tapOn: "アプリの設定"
- runFlow:
    file: common/scroll-up-to-id.yaml
    env:
      ID: rbThemeLight
- takeScreenshot: 2.3-19-reopen-saved-values-13
- runFlow:
    file: common/scroll-down-to-id.yaml
    env:
      ID: etReplyCooldownSeconds
- runFlow:
    file: common/scroll-down-and-assert-field-text.yaml
    env:
      ID: etReplyCooldownSeconds
      INDEX: 0
      TEXT: "${REPLY_COOLDOWN_SECONDS}"
- takeScreenshot: 2.3-19-reopen-saved-values-14
- runFlow:
    file: common/scroll-down-to-id.yaml
    env:
      ID: etReplySuccessBody
- runFlow:

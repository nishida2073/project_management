# 2.2 送信先の設定: ログイン名が不正なときテスト送信が失敗する（テスト仕様書の 2.2 の 21 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提: 仕様書 2.2 の前提条件（test-send-target-1（振り分け：test-company）が保存済み）。このフローでログイン名を不正な値にする
# 外部条件: kintone 接続が必要（不正なログイン名の応答を得るため）
# テスト送信は画面の未保存の入力値（ログイン名）を使う
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "送信先の設定"
- takeScreenshot: 2.2-21-test-send-invalid-login-error-01
- assertVisible: "設定を追加"
# 前提確認: test-send-target-1（振り分け：test-company）が保存済み
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/etSendTargetName"
    index: 0
    text: "test-send-target-1"
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/etKeyword"
      index: 0
    direction: DOWN
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/etKeyword"
    index: 0
    text: "test-company"
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/etLoginName"
    direction: DOWN
- runFlow:
    file: common/input-text-field.yaml
    env:
      FIELD_ID: etLoginName
      INPUT_VALUE: "${INVALID_LOGIN_NAME}"
- scrollUntilVisible:
    element: "テスト送信"
    direction: DOWN
- tapOn: "テスト送信"
- takeScreenshot: 2.2-21-test-send-invalid-login-error-02
- assertVisible: "テスト本文"
- tapOn: "送信"
- takeScreenshot: 2.2-21-test-send-invalid-login-error-03
- assertVisible: ".*送信失敗.*"  # 未確認
# 未確認: kintone の応答内容は kintone 側の応答文に依存するため、ここでは確認しない
- takeScreenshot: 2.2-21-test-send-invalid-login-error-04

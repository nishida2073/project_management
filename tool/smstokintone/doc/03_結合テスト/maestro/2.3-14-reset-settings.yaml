    env:
      ID: rbThemeDark
- runFlow:
    file: common/assert-id-checked.yaml
    env:
      ID: rbThemeDark
      INDEX: 0
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: rbSendManual
      INDEX: 0
- takeScreenshot: 2.3-14-reset-settings-03
- runFlow:
    file: common/scroll-down-to-id.yaml
    env:
      ID: rbSendManual
- runFlow:
    file: common/assert-id-checked.yaml
    env:
      ID: rbSendManual
      INDEX: 0
- runFlow:
    file: common/scroll-down-and-tap-id.yaml

# 2.3 アプリの設定: 初期化を実行し、既定値に戻ることを確認する（テスト仕様書の 2.3 の 14 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（フローで設定）: 表示テーマをダークに、SMSの送信モードを手動に切り替え、SMSの返信モードを自動、検索条件の表示を隠す、統合範囲（秒）を ${LOG_MATCH_TOLERANCE_PRE} にしてから、設定を初期化する
# 注意: 送信先・ログ・引継ぎ内容が残ることは、このフローでは確認しません（未確認）
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- runFlow:
    file: common/scroll-up-to-setting.yaml
    env:
      ELEMENT_ID: rbThemeLight
- takeScreenshot: 2.3-14-reset-settings-01
- assertVisible: "端末の許可"
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: rbSmsReplyModeManual
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/rbSmsReplyModeManual"
    checked: true
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: swCompanyNameExtractionEnabled
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/swCompanyNameExtractionEnabled"
    checked: true
- runFlow:
    file: common/scroll-up-to-setting.yaml
    env:
      ELEMENT_ID: rbThemeDark
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/rbThemeDark"
- takeScreenshot: 2.3-14-reset-settings-02
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: rbThemeDark
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/rbThemeDark"
    checked: true
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: rbSendManual
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/rbSendManual"
- takeScreenshot: 2.3-14-reset-settings-03
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: rbSendManual
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/rbSendManual"
    checked: true
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: rbSmsReplyModeAuto
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/rbSmsReplyModeAuto"
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: rbSmsReplyModeAuto
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/rbSmsReplyModeAuto"
    checked: true
- runFlow:
    file: common/scroll-up-to-setting.yaml
    env:
      ELEMENT_ID: rbSearchFiltersHidden
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/rbSearchFiltersHidden"
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: rbSearchFiltersHidden
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/rbSearchFiltersHidden"
    checked: true
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: etLogMatchToleranceSeconds
- runFlow:
    file: common/input-number-field.yaml
    env:
      FIELD_ID: etLogMatchToleranceSeconds
      INPUT_VALUE: "${LOG_MATCH_TOLERANCE_PRE}"
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: etLogMatchToleranceSeconds
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/etLogMatchToleranceSeconds"
    text: "${LOG_MATCH_TOLERANCE_PRE}"
- takeScreenshot: 2.3-14-reset-settings-04
- runFlow:
    file: common/scroll-up-to-setting.yaml
    env:
      ELEMENT_ID: btnResetSettings
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/btnResetSettings"
- takeScreenshot: 2.3-14-reset-settings-05
- assertVisible: "設定を初期化しますか？"
- tapOn: "初期化" # 未確認: 画面の後ろの初期化ボタンと同じ文字のため、ダイアログのボタンが選ばれるか確認する
- takeScreenshot: 2.3-14-reset-settings-06
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: rbThemeLight
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/rbThemeLight"
    checked: true
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: rbSearchFiltersVisible
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/rbSearchFiltersVisible"
    checked: true
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: rbSendAuto
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/rbSendAuto"
    checked: true
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: rbSmsReplyModeManual
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/rbSmsReplyModeManual"
    checked: true
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: etLogMatchToleranceSeconds
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/etLogMatchToleranceSeconds"
    text: "15"
- takeScreenshot: 2.3-14-reset-settings-07

# 2.3 アプリの設定: 返信メッセージを入力する（テスト仕様書の 2.3 の 15 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（フローで設定）: 返信メッセージ（正常・異常）は JSON に指定がなく、アプリの既定値のため、このフローで入力する
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- runFlow:
    file: common/scroll-up-by-id.yaml
    env:
      ID: rbThemeLight
- takeScreenshot: 2.3-15-reply-message-save-01
- runFlow:
    file: common/scroll-down-by-id.yaml
    env:
      ID: etReplySuccessBody
- takeScreenshot: 2.3-15-reply-message-save-02
- runFlow:
    file: common/input-text-by-id.yaml
    env:
      ID: etReplySuccessBody
      INDEX: 0
      VALUE: "${REPLY_SUCCESS_BODY}"
- takeScreenshot: 2.3-15-reply-message-save-03
- assertVisible: "${REPLY_SUCCESS_BODY}" # 未確認: 複数行欄の表示確認（入力した文字列の全体を見る）
- runFlow:
    file: common/scroll-down-by-id.yaml
    env:
      ID: etReplyFailedBody
- takeScreenshot: 2.3-15-reply-message-save-04
- runFlow:
    file: common/input-text-by-id.yaml
    env:
      ID: etReplyFailedBody
      INDEX: 0
      VALUE: "${REPLY_FAILED_BODY}"
- takeScreenshot: 2.3-15-reply-message-save-05
- assertVisible: "${REPLY_FAILED_BODY}" # 未確認: 複数行欄の表示確認（入力した文字列の全体を見る）
- takeScreenshot: 2.3-15-reply-message-save-06

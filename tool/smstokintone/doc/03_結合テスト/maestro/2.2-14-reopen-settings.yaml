# 2.2 送信先の設定: 保存した設定を開き直して確認する（テスト仕様書の 2.2 の 14 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（フローで設定）: この flow の中で保存する値を入力して「設定を保存」を押してから、開き直して確認する
# 統合範囲（時間）: 統合条件を時間にして TOLERANCE_HOURS_SAVED を入力し、同一日付に戻してから保存する（統合条件の入力値は同一日付のまま、統合範囲（時間）の保存値を確認する）
# 注: 別の flow を runFlow で呼ぶと、その中の setup（clearState）で保存値が消えるため、入力は common の手順を直接呼ぶ
# 未確認: 伏せ字のパスワードは、テキストで一致を取れない可能性がある
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "送信先の設定"
- takeScreenshot: 2.2-14-reopen-settings-01
- assertVisible: "設定を追加"
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/etSendTargetName"
    index: 0
    text: "test-send-target-1"
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: etSendTargetName
- runFlow:
    file: common/input-text-field.yaml
    env:
      FIELD_ID: etSendTargetName
      INPUT_VALUE: "${SAVED_SEND_TARGET_NAME}"
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: etKeyword
- runFlow:
    file: common/input-text-field.yaml
    env:
      FIELD_ID: etKeyword
      INPUT_VALUE: "${SAVED_KEYWORD}"
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: etSubdomain
- runFlow:
    file: common/input-text-field.yaml
    env:
      FIELD_ID: etSubdomain
      INPUT_VALUE: "${SUBDOMAIN}"
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: etLoginName
- runFlow:
    file: common/input-text-field.yaml
    env:
      FIELD_ID: etLoginName
      INPUT_VALUE: "${LOGIN_NAME}"
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: etLoginPassword
- runFlow:
    file: common/input-password-field.yaml
    env:
      FIELD_ID: etLoginPassword
      INPUT_VALUE: "${LOGIN_PASSWORD}"
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: etAppId
- runFlow:
    file: common/input-text-field.yaml
    env:
      FIELD_ID: etAppId
      INPUT_VALUE: "${APP_ID}"
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: etFieldType
- runFlow:
    file: common/input-text-field.yaml
    env:
      FIELD_ID: etFieldType
      INPUT_VALUE: "${SAVED_FIELD_TYPE}"
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: etFieldDatetime
- runFlow:
    file: common/input-text-field.yaml
    env:
      FIELD_ID: etFieldDatetime
      INPUT_VALUE: "${SAVED_FIELD_DATETIME}"
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: etFieldSender
- runFlow:
    file: common/input-text-field.yaml
    env:
      FIELD_ID: etFieldSender
      INPUT_VALUE: "${SAVED_FIELD_SENDER}"
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: etFieldCompanyName
- runFlow:
    file: common/input-text-field.yaml
    env:
      FIELD_ID: etFieldCompanyName
      INPUT_VALUE: "${SAVED_FIELD_COMPANY}"
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: etFieldUserName
- runFlow:
    file: common/input-text-field.yaml
    env:
      FIELD_ID: etFieldUserName
      INPUT_VALUE: "${SAVED_FIELD_USER}"
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: etFieldBody
- runFlow:
    file: common/input-text-field.yaml
    env:
      FIELD_ID: etFieldBody
      INPUT_VALUE: "${SAVED_FIELD_BODY}"
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: etFieldHistory
- runFlow:
    file: common/input-text-field.yaml
    env:
      FIELD_ID: etFieldHistory
      INPUT_VALUE: "${SAVED_FIELD_HISTORY}"
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/rbUpdateToleranceModeHours"
    direction: DOWN
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/rbUpdateToleranceModeHours"
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/etUpdateToleranceHours"
    enabled: true
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/etUpdateToleranceHours"
    direction: DOWN
- runFlow:
    file: common/input-text-field.yaml
    env:
      FIELD_ID: etUpdateToleranceHours
      INPUT_VALUE: "${TOLERANCE_HOURS_SAVED}"
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: rbUpdateToleranceModeSameDate
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/rbUpdateToleranceModeSameDate"
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/rbUpdateToleranceModeSameDate"
    checked: true
- tapOn: "設定を保存"
# 確認: 保存後にトップ画面に戻る（トーストは短時間で消えるため、確認しない）
- assertVisible: "SMSの送信モード"
- takeScreenshot: 2.2-14-reopen-settings-02
- tapOn: "送信先の設定"
- takeScreenshot: 2.2-14-reopen-settings-03
- assertVisible: "設定を追加"
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/etSendTargetName"
    index: 0
    text: "${SAVED_SEND_TARGET_NAME}"
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: etKeyword
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/etKeyword"
    index: 0
    text: "${SAVED_KEYWORD}"
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: etSubdomain
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/etSubdomain"
    text: "${SUBDOMAIN}"
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: etLoginName
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/etLoginName"
    text: "${LOGIN_NAME}"
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: etLoginPassword
# 確認: パスワードは伏せ字で表示される（スクリーンショットで目視）。欄の値は Maestro からも読めるため、文字での確認はしない
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: etAppId
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/etAppId"
    text: "${APP_ID}"
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: etFieldType
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/etFieldType"
    text: "${SAVED_FIELD_TYPE}"
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: etFieldDatetime
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/etFieldDatetime"
    text: "${SAVED_FIELD_DATETIME}"
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: etFieldSender
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/etFieldSender"
    text: "${SAVED_FIELD_SENDER}"
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: etFieldCompanyName
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/etFieldCompanyName"
    text: "${SAVED_FIELD_COMPANY}"
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: etFieldUserName
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/etFieldUserName"
    text: "${SAVED_FIELD_USER}"
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: etFieldBody
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/etFieldBody"
    text: "${SAVED_FIELD_BODY}"
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: etFieldHistory
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/etFieldHistory"
    text: "${SAVED_FIELD_HISTORY}"
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: rbUpdateToleranceModeSameDate
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/rbUpdateToleranceModeSameDate"
    checked: true
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: etUpdateToleranceHours
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/etUpdateToleranceHours"
    text: "${TOLERANCE_HOURS_SAVED}"
- takeScreenshot: 2.2-14-reopen-settings-04

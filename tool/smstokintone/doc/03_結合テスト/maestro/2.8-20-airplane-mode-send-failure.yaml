# 2.8 自動処理: 通信がないとき、SMSの送信が失敗し、再試行のログが残る（テスト仕様書の 2.8 の 20 に対応）
appId: com.ssfrontier.smstokintone
---
# 前提（JSON）: 既定値（2.8 の 1 と同じ）
# 前提（フローで設定）: なし
# 外部条件（手動）: 端末の機内モードを ON にしてから、このフローを実行する（Maestro では機内モードを切り替えない）。解除は、確認の後に手動で行う
# 外部条件（事前に別端末から SMS を送る）: 送信元 test-phone-a、本文は 1 行目「test-company」、2 行目「test-taro」、3 行目「body-test」。待ち時間（下の extendedWaitUntil）に送る
# 未確認: 失敗のメッセージ（通信エラーの内容）と、再試行の回数は、端末の状態で変わるため、ここでは失敗の文言だけを確認する
- runFlow: setup/setup-import-environment.yaml
- launchApp
- runFlow: common/enable-log-auto-refresh.yaml
- tapOn:
    id: "com.ssfrontier.smstokintone:id/btnTopOpenLog"
- takeScreenshot: 2.8-20-airplane-mode-send-failure-01
- extendedWaitUntil:
    visible: "(?s).*SMSを受信しました.*"
    timeout: 180000
- extendedWaitUntil:
    visible: "(?s).*SMSの送信に失敗しました.*"
    timeout: 180000
- takeScreenshot: 2.8-20-airplane-mode-send-failure-02

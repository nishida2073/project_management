# 2.3 アプリの設定: 会社名の抽出を無効にし、送信先の設定の表示を確認する（テスト仕様書の 2.3 の 8 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（フローで設定）: 検索条件の表示：表示（既定値の確認）。会社名の抽出をなしに切り替える
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/rbThemeLight"
    direction: UP
    visibilityPercentage: 100
- takeScreenshot: 2.3-08-company-name-extraction-off-01
- assertVisible: "端末の許可"
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/swCompanyNameExtractionEnabled"
    direction: DOWN
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/swCompanyNameExtractionEnabled"
    checked: true
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/swCompanyNameAutoConversionEnabled"
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/swCompanyNameAutoConversionEnabled"
    checked: true
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/rbSearchFiltersVisible"
    direction: UP
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/rbSearchFiltersVisible"
- takeScreenshot: 2.3-08-company-name-extraction-off-02
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/rbSearchFiltersVisible"
    direction: DOWN
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/rbSearchFiltersVisible"
    checked: true
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/swCompanyNameExtractionEnabled"
    direction: DOWN
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/swCompanyNameExtractionEnabled"
- takeScreenshot: 2.3-08-company-name-extraction-off-03
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/swCompanyNameExtractionEnabled"
    direction: DOWN
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/swCompanyNameExtractionEnabled"
    checked: false
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/btnAddFixedConversion"
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/btnAddFixedConversion"
    enabled: false
- pressKey: Back
- takeScreenshot: 2.3-08-company-name-extraction-off-04
- tapOn: "送信先の設定"
- takeScreenshot: 2.3-08-company-name-extraction-off-05
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/etCompanyName"
- assertNotVisible: "送信先の振り分け"
- takeScreenshot: 2.3-08-company-name-extraction-off-06

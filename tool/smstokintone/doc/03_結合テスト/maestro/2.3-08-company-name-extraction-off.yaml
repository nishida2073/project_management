# 2.3 アプリの設定: 会社名の抽出を無効にし、送信先の設定の表示を確認する（テスト仕様書の 2.3 の 8 に対応）
appId: com.ssfrontier.smstokintone
---
# 前提（JSON）: 表示テーマ：ライト、SMSの送信モード：自動、SMSの返信モード：手動、会社名の抽出：あり、会社名の自動変換：あり、引継ぎ：あり
# 前提（フローで設定）: 検索条件の表示：表示（既定値の確認）。会社名の抽出をなしに切り替える
- launchApp
- tapOn: "アプリの設定"
- takeScreenshot: 2.3-08-company-name-extraction-off-01
- assertVisible: "端末の許可"
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/swCompanyNameExtractionEnabled"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/swCompanyNameExtractionEnabled"
    checked: true
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/swCompanyNameAutoConversionEnabled"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/swCompanyNameAutoConversionEnabled"
    checked: true
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/rbSearchFiltersVisible"
- tapOn:
    id: "com.ssfrontier.smstokintone:id/rbSearchFiltersVisible"
- takeScreenshot: 2.3-08-company-name-extraction-off-02
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/rbSearchFiltersVisible"
    checked: true
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/swCompanyNameExtractionEnabled"
- tapOn:
    id: "com.ssfrontier.smstokintone:id/swCompanyNameExtractionEnabled"
- takeScreenshot: 2.3-08-company-name-extraction-off-03
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/swCompanyNameExtractionEnabled"
    checked: false
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/btnAddFixedConversion"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/btnAddFixedConversion"
    enabled: false
- pressKey: Back
- takeScreenshot: 2.3-08-company-name-extraction-off-04
- tapOn: "送信先の設定"
- takeScreenshot: 2.3-08-company-name-extraction-off-05
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/etCompanyName"
- assertNotVisible: "送信先の振り分け"
- takeScreenshot: 2.3-08-company-name-extraction-off-06

# 2.3 アプリの設定: 会社名の抽出を無効にし、送信先の設定の表示を確認する（テスト仕様書の 2.3 の 8 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（フローで設定）: 検索条件の表示：表示（既定値の確認）。会社名の抽出をなしに切り替える
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- runFlow:
    file: common/scroll-up-to-id.yaml
    env:
      ID: rbThemeLight
- takeScreenshot: 2.3-08-company-name-extraction-off-01
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "端末の許可"
- runFlow:
    file: common/scroll-down-to-id.yaml
    env:
      ID: swCompanyNameExtractionEnabled
- runFlow:
    file: common/assert-id-checked.yaml
    env:
      ID: swCompanyNameExtractionEnabled
      INDEX: 0
- runFlow:
    file: common/scroll-down-to-id.yaml
    env:
      ID: swCompanyNameAutoConversionEnabled
- runFlow:
    file: common/assert-id-checked.yaml
    env:
      ID: swCompanyNameAutoConversionEnabled
      INDEX: 0
- runFlow:
    file: common/scroll-up-to-id.yaml
    env:
      ID: rbSearchFiltersVisible
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: rbSearchFiltersVisible
      INDEX: 0
- takeScreenshot: 2.3-08-company-name-extraction-off-02
- runFlow:
    file: common/scroll-down-to-id.yaml
    env:
      ID: rbSearchFiltersVisible
- runFlow:
    file: common/assert-id-checked.yaml
    env:
      ID: rbSearchFiltersVisible
      INDEX: 0
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: swCompanyNameExtractionEnabled
      INDEX: 0
- takeScreenshot: 2.3-08-company-name-extraction-off-03
- runFlow:
    file: common/scroll-down-to-id.yaml
    env:
      ID: swCompanyNameExtractionEnabled
- runFlow:
    file: common/assert-id-unchecked.yaml
    env:
      ID: swCompanyNameExtractionEnabled
      INDEX: 0
- runFlow:
    file: common/scroll-down-to-id.yaml
    env:
      ID: btnAddFixedConversion
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/btnAddFixedConversion"
    index: 0
    enabled: false
- pressKey: Back
- takeScreenshot: 2.3-08-company-name-extraction-off-04
- tapOn: "送信先の設定"
- takeScreenshot: 2.3-08-company-name-extraction-off-05
- runFlow:
    file: common/assert-id-visible.yaml
    env:
      ID: etCompanyName
      INDEX: 0
- assertNotVisible: "送信先の振り分け"
- takeScreenshot: 2.3-08-company-name-extraction-off-06

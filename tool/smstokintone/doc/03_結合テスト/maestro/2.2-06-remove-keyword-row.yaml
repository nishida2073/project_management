# 2.2 送信先の設定: 振り分けの行を削除する（テスト仕様書の 2.2 の 6 に対応）
# 前提: JSON 読み込み後の状態（test-send-target-1 の振り分けは test-company の 1 行）。この flow の中で sample-company の行を追加してから削除する
appId: com.ssfrontier.smstokintone
---
- launchApp
- tapOn: "送信先の設定"
- assertVisible: "設定を追加"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/etKeyword"
    index: 0
    text: "${KEYWORD_TEST}"
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/btnAddKeyword"
      index: 0
    direction: DOWN
- tapOn:
    id: "com.ssfrontier.smstokintone:id/btnAddKeyword"
    index: 0
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/etKeyword"
      index: 1
    direction: DOWN
- tapOn:
    id: "com.ssfrontier.smstokintone:id/etKeyword"
    index: 1
- inputText: "${KEYWORD_SAMPLE}"
- hideKeyboard
- assertVisible: "${KEYWORD_SAMPLE}"
- tapOn:
    id: "com.ssfrontier.smstokintone:id/btnDeleteKeyword"
    index: 1
- assertNotVisible: "${KEYWORD_SAMPLE}"
- assertVisible: "${KEYWORD_TEST}"
- takeScreenshot: 2.2-06-after-remove-keyword-row

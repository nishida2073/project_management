# 2.2 送信先の設定: 振り分けの行を削除する（テスト仕様書の 2.2 の 6 に対応）
appId: com.ssfrontier.smstokintone
---
# 前提: 仕様書 2.2 の前提条件（test-send-target-1 の振り分けに test-company と sample-company の 2 行が保存済み）
- launchApp
- tapOn: "送信先の設定"
- assertVisible: "設定を追加"
# 前提確認: test-send-target-1 の振り分けは test-company（1 行目）と sample-company（2 行目）
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/etKeyword"
    index: 0
    text: "${KEYWORD_TEST}"
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/etKeyword"
      index: 1
    direction: DOWN
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/etKeyword"
    index: 1
    text: "${KEYWORD_SAMPLE}"
- tapOn:
    id: "com.ssfrontier.smstokintone:id/btnDeleteKeyword"
    index: 1
- assertNotVisible: "${KEYWORD_SAMPLE}"
- assertVisible: "${KEYWORD_TEST}"
- takeScreenshot: 2.2-06-after-remove-keyword-row

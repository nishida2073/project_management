# 2.3 アプリの設定: 受信日の範囲を入力して、SMSの検索の初期値に反映する（テスト仕様書の 2.3 の 6 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（フローで設定）: 受信日の範囲を ${SEARCH_DATE_RANGE_DAYS} 日に入力する
# 外部条件: SMSの読み取りの権限が許可されている必要があります（SMSの検索を開くため）
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- runFlow:
    file: common/scroll-up-by-id.yaml
    env:
      ID: rbThemeLight
- takeScreenshot: 2.3-06-search-date-range-01
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "端末の許可"
- runFlow:
    file: common/scroll-down-by-id.yaml
    env:
      ID: rbThemeLight
- runFlow:
    file: common/assert-checked-by-id.yaml
    env:
      ID: rbThemeLight
      INDEX: 0
- runFlow:
    file: common/scroll-down-by-id.yaml
    env:
      ID: etSmsSearchDateRangeDays
- runFlow:
    file: common/input-text-by-id.yaml
    env:
      ID: etSmsSearchDateRangeDays
      INDEX: 0
      VALUE: "${SEARCH_DATE_RANGE_DAYS}"
- takeScreenshot: 2.3-06-search-date-range-02
- runFlow:
    file: common/scroll-down-and-assert-text-by-id.yaml
    env:
      ID: etSmsSearchDateRangeDays
      INDEX: 0
      TEXT: "${SEARCH_DATE_RANGE_DAYS}"
- pressKey: Back
- takeScreenshot: 2.3-06-search-date-range-03
- tapOn: "SMSの検索"
- takeScreenshot: 2.3-06-search-date-range-04
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "受信日の範囲"
- runFlow:
    file: common/scroll-down-and-assert-text-by-id.yaml
    env:
      ID: etDateFrom
      INDEX: 0
      TEXT: '\d{4}/\d{2}/\d{2}'
- runFlow:
    file: common/scroll-down-and-assert-text-by-id.yaml
    env:
      ID: etDateTo
      INDEX: 0
      TEXT: '\d{4}/\d{2}/\d{2}'
# 注意: EXPECTED_DATE_FROM と EXPECTED_DATE_TO は vars に固定で書いている（今日が 2026-11-03 の場合の値。表示は yyyy/MM/dd）。実行日が変わったら vars を書き換える
- takeScreenshot: 2.3-06-search-date-range-05

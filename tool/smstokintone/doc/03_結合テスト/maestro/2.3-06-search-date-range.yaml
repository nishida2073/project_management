# 2.3 アプリの設定: 受信日の範囲を入力して、SMSの検索の初期値に反映する（テスト仕様書の 2.3 の 6 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（フローで設定）: 受信日の範囲を ${SEARCH_DATE_RANGE_DAYS} 日に入力する
# 外部条件: SMSの読み取りの権限が許可されている必要があります（SMSの検索を開くため）
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/rbThemeLight"
    direction: UP
    visibilityPercentage: 100
    timeout: 60000
- takeScreenshot: 2.3-06-search-date-range-01
- assertVisible: "端末の許可"
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/rbThemeLight"
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/rbThemeLight"
    checked: true
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/etSmsSearchDateRangeDays"
- runFlow:
    file: common/input-text-field.yaml
    env:
      FIELD_ID: etSmsSearchDateRangeDays
      INPUT_VALUE: "${SEARCH_DATE_RANGE_DAYS}"
- takeScreenshot: 2.3-06-search-date-range-02
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/etSmsSearchDateRangeDays"
    direction: DOWN
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/etSmsSearchDateRangeDays"
    text: "${SEARCH_DATE_RANGE_DAYS}"
- pressKey: Back
- takeScreenshot: 2.3-06-search-date-range-03
- tapOn: "SMSの検索"
- takeScreenshot: 2.3-06-search-date-range-04
- assertVisible: "受信日の範囲"
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/etDateFrom"
    text: "${EXPECTED_DATE_FROM}"
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/etDateTo"
    text: "${EXPECTED_DATE_TO}"
# 注意: EXPECTED_DATE_FROM と EXPECTED_DATE_TO は vars に固定で書いている（今日が 2026-11-02 の場合の値。表示は yyyy/MM/dd）。実行日が変わったら vars を書き換える
- takeScreenshot: 2.3-06-search-date-range-05

# 2.3 アプリの設定: 引継ぎ内容の設定を開く（テスト仕様書の 2.3 の 13 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（フローで設定）: 引継ぎの範囲を制限なしにする（既定値の確認）
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/rbThemeLight"
    direction: UP
    visibilityPercentage: 100
- takeScreenshot: 2.3-13-continuation-edit-open-01
- assertVisible: "端末の許可"
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/swContinuationEnabled"
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/swContinuationEnabled"
    checked: true
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/rbContinuationScopeUnlimited"
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/rbContinuationScopeUnlimited"
- takeScreenshot: 2.3-13-continuation-edit-open-02
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/rbContinuationScopeUnlimited"
    direction: DOWN
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/rbContinuationScopeUnlimited"
    checked: true
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/btnEditContinuationInfo"
    direction: UP
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/btnEditContinuationInfo"
- takeScreenshot: 2.3-13-continuation-edit-open-03
- assertVisible: "設定を保存"
- takeScreenshot: 2.3-13-continuation-edit-open-04

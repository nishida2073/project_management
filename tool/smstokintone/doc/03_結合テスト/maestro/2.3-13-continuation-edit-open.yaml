# 2.3 アプリの設定: 引継ぎ内容の設定を開く（テスト仕様書の 2.3 の 13 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（フローで設定）: 引継ぎの範囲を制限なしにする（既定値の確認）
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- runFlow:
    file: common/scroll-up-to-id.yaml
    env:
      ID: rbThemeLight
- takeScreenshot: 2.3-13-continuation-edit-open-01
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "端末の許可"
- runFlow:
    file: common/scroll-down-to-id.yaml
    env:
      ID: swContinuationEnabled
- runFlow:
    file: common/assert-id-checked.yaml
    env:
      ID: swContinuationEnabled
      INDEX: 0
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: rbContinuationScopeUnlimited
      INDEX: 0
- takeScreenshot: 2.3-13-continuation-edit-open-02
- runFlow:
    file: common/scroll-down-to-id.yaml
    env:
      ID: rbContinuationScopeUnlimited
- runFlow:
    file: common/assert-id-checked.yaml
    env:
      ID: rbContinuationScopeUnlimited
      INDEX: 0
- runFlow:
    file: common/scroll-up-to-id.yaml
    env:
      ID: btnEditContinuationInfo
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: btnEditContinuationInfo
      INDEX: 0
- takeScreenshot: 2.3-13-continuation-edit-open-03
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "設定を保存"
- takeScreenshot: 2.3-13-continuation-edit-open-04

# 2.2 送信先の設定: 振り分けの行を追加する（テスト仕様書の 2.2 の 4 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "送信先の設定"
- takeScreenshot: 2.2-04-add-keyword-row-01
- assertVisible: "設定を追加"
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/etKeyword"
      index: 0
    direction: DOWN
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/etKeyword"
    index: 0
    text: "test-company"
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/btnAddKeyword"
      index: 0
    direction: UP
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/btnAddKeyword"
    index: 0
# 未確認: 行の追加は、2 行目の入力欄（etKeyword の index 1）の表示で確認する
- takeScreenshot: 2.2-04-add-keyword-row-02
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/etKeyword"
    index: 1
- takeScreenshot: 2.2-04-add-keyword-row-03

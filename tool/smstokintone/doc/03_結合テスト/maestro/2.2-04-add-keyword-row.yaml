# 2.2 送信先の設定: 振り分けの行を追加する（テスト仕様書の 2.2 の 4 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "送信先の設定"
- takeScreenshot: 2.2-04-add-keyword-row-01
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "設定を追加"
- runFlow:
    file: common/scroll-down-and-assert-field-text.yaml
    env:
      ID: etKeyword
      INDEX: 0
      TEXT: "test-company"
- runFlow:
    file: common/scroll-up-to-id.yaml
    env:
      ID: btnAddKeyword
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: btnAddKeyword
      INDEX: 0
# 未確認: 行の追加は、2 行目の入力欄（etKeyword の index 1）の表示で確認する
- takeScreenshot: 2.2-04-add-keyword-row-02
- runFlow:
    file: common/assert-id-visible.yaml
    env:
      ID: etKeyword
      INDEX: 1
- takeScreenshot: 2.2-04-add-keyword-row-03

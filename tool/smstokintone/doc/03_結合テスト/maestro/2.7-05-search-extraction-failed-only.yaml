# 2.7 SMSの検索: 抽出状況の異常だけで検索すると、抽出が異常の SMS だけが表示される（テスト仕様書の 2.7 の 5 に対応）
# 前提: setup（clearState と JSON 投入）から開始する。端末に抽出が異常の SMS と、正常の SMS がある（外部条件。SMS の読み取りを許可しておく）
# 確認: 一覧の行の抽出状況は、異常の印 🆖（strings.xml の icon_extraction_failed）で確認する。凡例にも 🆖 があるため、行の本文（${SEARCH_ABNORMAL_ROW_TEXT}）と組み合わせて確認する。正常の印 🆗 の行の本文（${SEARCH_NORMAL_ROW_TEXT}）は表示されないことを確認する
# 外部条件: ${SEARCH_ABNORMAL_ROW_TEXT} は抽出が異常の SMS（本文 1 行だけ）の本文に含まれる文字、${SEARCH_NORMAL_ROW_TEXT} は抽出が正常の SMS の本文に含まれる文字（vars）。実施日に端末の SMS に合わせて書き換える
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "SMSの検索"
- assertVisible: "検索条件"
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/cbSmsSearchSendNoneOnly"
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/cbSmsSearchSendNoneOnly"
    checked: false
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/cbSmsSearchExtractionFailedOnly"
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/cbSmsSearchExtractionFailedOnly"
    checked: true
- tapOn: "検索"
- assertVisible: '.*件見つかりました.*'
- assertVisible: '(?s).*🆖.*${SEARCH_ABNORMAL_ROW_TEXT}.*'
- assertNotVisible: '(?s).*${SEARCH_NORMAL_ROW_TEXT}.*'
- takeScreenshot: 2.7-05-search-extraction-failed-only-01

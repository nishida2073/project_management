# 2.7 SMSの検索: 抽出状況の異常だけで検索すると、抽出が異常の SMS だけが表示される（テスト仕様書の 2.7 の 5 に対応）
# 前提: setup（clearState と JSON 投入）から開始する。端末に抽出が異常の SMS と、正常の SMS がある（外部条件。SMS の読み取りを許可しておく）
# 未確認: 一覧に抽出が異常の SMS だけが表示されることは、スクリーンショットで確認する（一覧の項目の文字は未特定）
appId: com.ssfrontier.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "SMSの検索"
- assertVisible: "検索条件"
- tapOn:
    id: "com.ssfrontier.smstokintone:id/cbSmsSearchSendNoneOnly"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/cbSmsSearchSendNoneOnly"
    checked: false
- tapOn:
    id: "com.ssfrontier.smstokintone:id/cbSmsSearchExtractionFailedOnly"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/cbSmsSearchExtractionFailedOnly"
    checked: true
- tapOn: "検索"
- assertVisible: '.*件見つかりました.*'
- takeScreenshot: 2.7-05-search-extraction-failed-only-01

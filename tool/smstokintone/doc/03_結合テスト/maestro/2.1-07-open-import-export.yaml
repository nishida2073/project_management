# 2.1 トップ: 設定のインポート・エクスポートの画面に移動できることを確認する（テスト仕様書の 2.1 の 7 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- runFlow:
    file: common/scroll-down-and-tap-by-id.yaml
    env:
      ID: btnTopOpenSettingsImportExport
      INDEX: 0
- takeScreenshot: 2.1-07-open-import-export-01
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "設定のインポート・エクスポート"
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "ファイルを選択"
- pressKey: Back
- takeScreenshot: 2.1-07-open-import-export-02

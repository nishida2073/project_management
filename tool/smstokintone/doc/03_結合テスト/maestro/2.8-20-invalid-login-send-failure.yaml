# 2.8 自動処理: 送信先の接続情報が無効なとき、SMSの送信が失敗する（テスト仕様書の 2.8 の 20 に対応）
# 前提（フローで設定）: test-send-target-1 のログイン名を無効な値（${INVALID_LOGIN_NAME}）にして、「設定を保存」を押す（2.2 の 21 と同じ）
# 外部条件: 別端末から SMS を送る。送信元 0312345801、本文は 1 行目「test-company」、2 行目「test-taro」、3 行目「body-test」。待ち時間（下の extendedWaitUntil）に送る
# 未確認: kintone の応答内容は kintone 側の応答文に依存するため、ここでは「SMSの送信に失敗しました」だけを確認する
# 注: 認証の失敗は、再試行の対象外（KintoneApi の isRetryable は 5xx と 429 だけ）のため、後から 2 件目が出ない想定
# 未確認: 「後から 2 件目が出ないこと」は、時間を置いて確認する方法がない（固定の待ちは使わない）。ここでは、失敗の行が出た時点の件数だけを確認する
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "送信先の設定"
- runFlow:
    file: common/scroll-down-and-assert-text-by-id.yaml
    env:
      ID: etSendTargetName
      INDEX: 0
      TEXT: "test-send-target-1"
- runFlow:
    file: common/scroll-down-by-id.yaml
    env:
      ID: etLoginName
- runFlow:
    file: common/input-text-by-id.yaml
    env:
      ID: etLoginName
      INDEX: 0
      VALUE: "${INVALID_LOGIN_NAME}"
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "${INVALID_LOGIN_NAME}"
- tapOn: "設定を保存"
- takeScreenshot: 2.8-20-invalid-login-send-failure-01
- runFlow:
    file: common/scroll-down-and-tap-by-id.yaml
    env:
      ID: btnTopOpenLog
      INDEX: 0
- takeScreenshot: 2.8-20-invalid-login-send-failure-02
- extendedWaitUntil:
    visible: "(?s).*SMSを受信しました.*"
    timeout: 180000
- extendedWaitUntil:
    visible: '(?s)\[失敗\].*SMSの送信に失敗しました.*'
    timeout: 180000
- assertVisible:
    text: '(?s)\[失敗\].*SMSの送信に失敗しました.*'
    index: 0
- assertNotVisible:
    text: '(?s)\[失敗\].*SMSの送信に失敗しました.*'
    index: 1
- takeScreenshot: 2.8-20-invalid-login-send-failure-03

# 2.3 アプリの設定: 引継ぎ内容の氏名表示を切り替える（テスト仕様書の 2.3 の 28 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（フローで設定）: 引継ぎ内容の氏名表示をオフにする（JSON では有効）
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- takeScreenshot: 2.3-28-continuation-show-user-name-off-01
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/swContinuationEnabled"
    direction: DOWN
    visibilityPercentage: 100
- takeScreenshot: 2.3-28-continuation-show-user-name-off-02
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/swContinuationEnabled"
    checked: true
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/swContinuationShowUserNameEnabled"
    direction: DOWN
    visibilityPercentage: 100
- takeScreenshot: 2.3-28-continuation-show-user-name-off-03
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/swContinuationShowUserNameEnabled"
    checked: true
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/swContinuationShowUserNameEnabled"
    index: 0
- takeScreenshot: 2.3-28-continuation-show-user-name-off-04
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/swContinuationShowUserNameEnabled"
    checked: false
- pressKey: Back
- takeScreenshot: 2.3-28-continuation-show-user-name-off-05
- tapOn: "アプリの設定"
- takeScreenshot: 2.3-28-continuation-show-user-name-off-06
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/swContinuationShowUserNameEnabled"
    direction: DOWN
    visibilityPercentage: 100
- takeScreenshot: 2.3-28-continuation-show-user-name-off-07
- assertVisible: # 開き直した後も無効のまま保存されていること
    id: "jp.co.nttdata_univ.smstokintone:id/swContinuationShowUserNameEnabled"
    checked: false
- takeScreenshot: 2.3-28-continuation-show-user-name-off-08

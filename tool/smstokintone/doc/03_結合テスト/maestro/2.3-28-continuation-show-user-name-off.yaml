# 2.3 アプリの設定: 引継ぎ内容の氏名表示を切り替える（テスト仕様書の 2.3 の 28 に対応）
appId: com.ssfrontier.smstokintone
---
# 前提: 引継ぎ内容の氏名表示が有効（2.3 の 1 の状態）。引継ぎは有効。
- launchApp
- tapOn: "アプリの設定"
- scrollUntilVisible: # 未確認
    element:
      id: "com.ssfrontier.smstokintone:id/swContinuationShowUserNameEnabled"
    direction: DOWN
- tapOn:
    id: "com.ssfrontier.smstokintone:id/swContinuationShowUserNameEnabled"
    index: 0
- assertVisible: # 未確認: スイッチの選択状態の確認
    id: "com.ssfrontier.smstokintone:id/swContinuationShowUserNameEnabled"
    checked: false
- takeScreenshot: 2.3-28-switched-off
- pressKey: Back
- tapOn: "アプリの設定"
- scrollUntilVisible: # 未確認
    element:
      id: "com.ssfrontier.smstokintone:id/swContinuationShowUserNameEnabled"
    direction: DOWN
- assertVisible: # 未確認: 開き直した後も無効のまま保存されていること
    id: "com.ssfrontier.smstokintone:id/swContinuationShowUserNameEnabled"
    checked: false
- takeScreenshot: 2.3-28-reopened

# 2.3 アプリの設定: 引継ぎ内容の氏名表示を切り替える（テスト仕様書の 2.3 の 28 に対応）
appId: com.ssfrontier.smstokintone
---
# 前提: JSON（env_ok.json）の状態から開始する（引継ぎ：あり、引継ぎ内容の氏名表示：あり（JSON の continuationShowUserNameEnabled）、表示テーマ：ライト）。このフローで引継ぎ内容の氏名表示をオフにする。
- launchApp
- tapOn: "アプリの設定"
- takeScreenshot: 2.3-28-continuation-show-user-name-off-01
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/swContinuationEnabled"
    direction: DOWN
    visibilityPercentage: 100
- takeScreenshot: 2.3-28-continuation-show-user-name-off-02
- assertVisible: # 前提の確認（引継ぎが有効）
    id: "com.ssfrontier.smstokintone:id/swContinuationEnabled"
    checked: true
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/swContinuationShowUserNameEnabled"
    direction: DOWN
    visibilityPercentage: 100
- takeScreenshot: 2.3-28-continuation-show-user-name-off-03
- assertVisible: # 前提の確認（氏名表示が有効）
    id: "com.ssfrontier.smstokintone:id/swContinuationShowUserNameEnabled"
    checked: true
- tapOn:
    id: "com.ssfrontier.smstokintone:id/swContinuationShowUserNameEnabled"
    index: 0
- takeScreenshot: 2.3-28-continuation-show-user-name-off-04
- assertVisible: # スイッチの選択状態の確認
    id: "com.ssfrontier.smstokintone:id/swContinuationShowUserNameEnabled"
    checked: false
- pressKey: Back
- takeScreenshot: 2.3-28-continuation-show-user-name-off-05
- tapOn: "アプリの設定"
- takeScreenshot: 2.3-28-continuation-show-user-name-off-06
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/swContinuationShowUserNameEnabled"
    direction: DOWN
    visibilityPercentage: 100
- takeScreenshot: 2.3-28-continuation-show-user-name-off-07
- assertVisible: # 開き直した後も無効のまま保存されていること
    id: "com.ssfrontier.smstokintone:id/swContinuationShowUserNameEnabled"
    checked: false
- takeScreenshot: 2.3-28-continuation-show-user-name-off-08

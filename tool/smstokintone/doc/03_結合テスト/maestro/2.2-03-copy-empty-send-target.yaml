# 2.2 送信先の設定: 送信先が空の設定をコピーする（テスト仕様書の 2.2 の 3 に対応）
# 前提: 仕様書 2.2 の前提条件（test-send-target-1 が保存済み）。このフローの中で空の設定を追加し、それをコピーする
appId: com.ssfrontier.smstokintone
---
- launchApp
- tapOn: "送信先の設定"
- assertVisible: "設定を追加"
# 前提確認: 保存済みの送信先は 1 件（test-send-target-1）
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/etSendTargetName"
    index: 0
    text: "test-send-target-1"
- tapOn: "設定を追加"
- assertVisible: "設定 2"
- scrollUntilVisible:
    element:
      text: "設定 2"
    direction: DOWN
# 未確認: 空の設定（設定 2）のコピーは、見えている位置（index 0）のコピー欄で押す
- tapOn:
    id: "com.ssfrontier.smstokintone:id/btnCopySendTarget"
    index: 0
- assertVisible: "設定 3"
- assertNotVisible: ".*のコピー"
- scrollUntilVisible:
    element:
      text: "設定 3"
    direction: DOWN
- assertVisible: "設定 3"

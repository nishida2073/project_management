# 2.2 送信先の設定: 送信先が空の設定をコピーする（テスト仕様書の 2.2 の 3 に対応）
appId: com.ssfrontier.smstokintone
---
# 前提: 仕様書 2.2 の前提条件（test-send-target-1 と test-send-target-2 が保存済み）
# 注: このフローの中で空の設定を追加する
- launchApp
- tapOn: "送信先の設定"
- assertVisible: "設定を追加"
# 前提確認: 保存済みの送信先が 2 件
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/etSendTargetName"
    index: 0
    text: "test-send-target-1"
- scrollUntilVisible:
    element:
      text: "test-send-target-2"
    direction: DOWN
- assertVisible: "test-send-target-2"
- tapOn: "設定を追加"
- assertVisible: "設定 3"
# 未確認: 空の設定を選ぶため、「設定 3」まで送ってから見えている位置（index 0）でコピーを押す
- scrollUntilVisible:
    element:
      text: "設定 3"
    direction: DOWN
- tapOn:
    id: "com.ssfrontier.smstokintone:id/btnCopySendTarget"
    index: 0
- assertVisible: "設定 4"
- assertNotVisible: ".*のコピー"
- takeScreenshot: 2.2-03-after-copy-empty

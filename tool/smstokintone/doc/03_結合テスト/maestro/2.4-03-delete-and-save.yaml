# 2.4 引継ぎ内容の設定: 送信元を削除して設定を保存する（テスト仕様書の 2.4 の 3 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# この flow は送信元 A（test-sender-a）を削除して保存する。次の flow には引き継がない（次の flow は setup で投入し直す）。
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- takeScreenshot: 2.4-03-delete-and-save-01
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: btnEditContinuationInfo
      INDEX: 0
- takeScreenshot: 2.4-03-delete-and-save-02
- runFlow:
    file: common/assert-id-visible.yaml
    env:
      ID: etContinuationSearch
      INDEX: 0
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "${SENDER_A}"
- scrollUntilVisible:
    element:
      text: "${SENDER_B}"
    direction: DOWN
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "${SENDER_B}"
- runFlow:
    file: common/assert-id-checked.yaml
    env:
      ID: rbContinuationSortAscending
      INDEX: 0
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "${SENDER_A}"
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: btnDeleteContinuationInfo
      INDEX: 0
- takeScreenshot: 2.4-03-delete-and-save-03
- assertNotVisible: "${SENDER_A}"
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "${SENDER_B}"
- tapOn: "設定を保存"
- takeScreenshot: 2.4-03-delete-and-save-04
- runFlow:
    file: common/assert-id-not-visible.yaml
    env:
      ID: etContinuationSearch
      INDEX: 0
- takeScreenshot: 2.4-03-delete-and-save-05

# 2.4 引継ぎ内容の設定: 送信元を削除して設定を保存する（テスト仕様書の 2.4 の 3 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# この flow は送信元 A（test-sender-a）を削除して保存する。次の flow には引き継がない（次の flow は setup で投入し直す）。
# 未確認: 古い順のとき、一覧の先頭（index 0）が SENDER_A。削除ボタンに確認ダイアログは出ない想定。
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- takeScreenshot: 2.4-03-delete-and-save-01
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: btnEditContinuationInfo
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/btnEditContinuationInfo"
- takeScreenshot: 2.4-03-delete-and-save-02
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/etContinuationSearch"
- assertVisible: "${SENDER_A}"
- scrollUntilVisible:
    element:
      text: "${SENDER_B}"
    direction: DOWN
- assertVisible: "${SENDER_B}"
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/rbContinuationSortAscending"
    checked: true
- assertVisible: "${SENDER_A}"
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/btnDeleteContinuationInfo"
    index: 0
- takeScreenshot: 2.4-03-delete-and-save-03
- assertNotVisible: "${SENDER_A}"
- assertVisible: "${SENDER_B}"
- tapOn: "設定を保存"
- takeScreenshot: 2.4-03-delete-and-save-04
- assertNotVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/etContinuationSearch"
- takeScreenshot: 2.4-03-delete-and-save-05

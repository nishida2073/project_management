# 2.2 送信先の設定: フィールドコードを保存する（テスト仕様書の 2.2 の 14 に対応）
appId: com.ssfrontier.smstokintone
---
# 前提: 仕様書 2.2 の前提条件（test-send-target-1 が保存済み。このフローで上書きする）
# 未確認: fieldType などの保存値は画面に表示されないため、保存値は確認していない（内部値）
- launchApp
- tapOn: "送信先の設定"
- takeScreenshot: 2.2-14-save-field-mapping-01
- assertVisible: "設定を追加"
# 前提確認: test-send-target-1 が 1 件目に保存済み
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/etSendTargetName"
    index: 0
    text: "test-send-target-1"
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/etFieldType"
    direction: DOWN
    direction: DOWN
- tapOn:
    id: "com.ssfrontier.smstokintone:id/etFieldType"
    index: 0
    point: "95%, 50%"
- takeScreenshot: 2.2-14-save-field-mapping-02
- eraseText: 50  # 未確認
- inputText: "${SAVED_FIELD_TYPE}"
- takeScreenshot: 2.2-14-save-field-mapping-03
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/etFieldDatetime"
    direction: DOWN
- tapOn:
    id: "com.ssfrontier.smstokintone:id/etFieldDatetime"
    index: 0
    point: "95%, 50%"
- takeScreenshot: 2.2-14-save-field-mapping-04
- eraseText: 50  # 未確認
- inputText: "${SAVED_FIELD_DATETIME}"
- takeScreenshot: 2.2-14-save-field-mapping-05
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/etFieldSender"
    direction: DOWN
- tapOn:
    id: "com.ssfrontier.smstokintone:id/etFieldSender"
    index: 0
    point: "95%, 50%"
- takeScreenshot: 2.2-14-save-field-mapping-06
- eraseText: 50  # 未確認
- inputText: "${SAVED_FIELD_SENDER}"
- takeScreenshot: 2.2-14-save-field-mapping-07
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/etFieldCompanyName"
    direction: DOWN
- tapOn:
    id: "com.ssfrontier.smstokintone:id/etFieldCompanyName"
    index: 0
    point: "95%, 50%"
- takeScreenshot: 2.2-14-save-field-mapping-08
- eraseText: 50  # 未確認
- inputText: "${SAVED_FIELD_COMPANY}"
- takeScreenshot: 2.2-14-save-field-mapping-09
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/etFieldUserName"
    direction: DOWN
- tapOn:
    id: "com.ssfrontier.smstokintone:id/etFieldUserName"
    index: 0
    point: "95%, 50%"
- takeScreenshot: 2.2-14-save-field-mapping-10
- eraseText: 50  # 未確認
- inputText: "${SAVED_FIELD_USER}"
- takeScreenshot: 2.2-14-save-field-mapping-11
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/etFieldBody"
    direction: DOWN
- tapOn:
    id: "com.ssfrontier.smstokintone:id/etFieldBody"
    index: 0
    point: "95%, 50%"
- takeScreenshot: 2.2-14-save-field-mapping-12

# 2.3 アプリの設定: 引継ぎがオフのとき「引継ぎ内容の設定」は押せない（テスト仕様書の 2.3 の 30 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（フローで設定）: 引継ぎをオフにする（JSON では有効）
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- runFlow:
    file: common/scroll-up-to-setting.yaml
    env:
      ELEMENT_ID: rbThemeLight
- takeScreenshot: 2.3-30-continuation-edit-disabled-01
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: swContinuationEnabled
- takeScreenshot: 2.3-30-continuation-edit-disabled-02
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/swContinuationEnabled"
    checked: true
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: swContinuationEnabled
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/swContinuationEnabled"
    index: 0
- takeScreenshot: 2.3-30-continuation-edit-disabled-03
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: swContinuationEnabled
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/swContinuationEnabled"
    checked: false
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: btnEditContinuationInfo
- takeScreenshot: 2.3-30-continuation-edit-disabled-04
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/btnEditContinuationInfo"
    enabled: false
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: btnEditContinuationInfo
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/btnEditContinuationInfo"
    index: 0
- takeScreenshot: 2.3-30-continuation-edit-disabled-05
- assertVisible: "アプリの設定" # 設定画面のまま（引継ぎ内容の設定画面に移っていないこと）
- takeScreenshot: 2.3-30-continuation-edit-disabled-06

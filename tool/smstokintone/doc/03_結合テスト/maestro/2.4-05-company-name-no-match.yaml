# 2.4 引継ぎ内容の設定: 一致しない会社名では送信先が表示されない（テスト仕様書の 2.4 の 5 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- takeScreenshot: 2.4-05-company-name-no-match-01
- runFlow:
    file: common/scroll-down-and-tap-by-id.yaml
    env:
      ID: btnEditContinuationInfo
      INDEX: 0
- takeScreenshot: 2.4-05-company-name-no-match-02
- runFlow:
    file: common/assert-visible-by-id.yaml
    env:
      ID: etContinuationSearch
      INDEX: 0
- runFlow:
    file: common/assert-checked-by-id.yaml
    env:
      ID: rbContinuationSortAscending
      INDEX: 0
- runFlow:
    file: common/scroll-down-by-id.yaml
    env:
      ID: etContinuationCompanyName
- runFlow:
    file: common/input-text-by-id.yaml
    env:
      ID: etContinuationCompanyName
      INDEX: 1
      VALUE: "${COMPANY_NAME_NO_MATCH}"
- takeScreenshot: 2.4-05-company-name-no-match-03
# 注: 34 行で入力したのは SENDER_B（index 1）。その欄に送信先が表示されないことを確認する
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/tvContinuationSendTargetName"
    index: 1
    text: "なし"
- assertNotVisible: "${SEND_TARGET_NAME}"
- takeScreenshot: 2.4-05-company-name-no-match-04

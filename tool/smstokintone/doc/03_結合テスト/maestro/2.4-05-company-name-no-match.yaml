# 2.4 引継ぎ内容の設定: 一致しない会社名では送信先が表示されない（テスト仕様書の 2.4 の 5 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 未確認: 会社名欄の既存値は eraseText で消す（カーソル位置に依存する）。
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- takeScreenshot: 2.4-05-company-name-no-match-01
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/btnEditContinuationInfo"
    direction: DOWN
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/btnEditContinuationInfo"
- takeScreenshot: 2.4-05-company-name-no-match-02
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/etContinuationSearch"
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/rbContinuationSortAscending"
    checked: true
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/etContinuationCompanyName"
      index: 1
    direction: DOWN
    visibilityPercentage: 100
- runFlow:
    file: common/input-second-text-field.yaml
    env:
      FIELD_ID: etContinuationCompanyName
      INPUT_VALUE: "${COMPANY_NAME_NO_MATCH}"
- takeScreenshot: 2.4-05-company-name-no-match-03
# 未確認: SENDER_A に送信先が無いことを前提にしている。
- assertVisible: "なし"  # 未確認
- assertNotVisible: "${SEND_TARGET_NAME}"
- takeScreenshot: 2.4-05-company-name-no-match-04

# 2.4 引継ぎ内容の設定: 一致しない会社名では送信先が表示されない（テスト仕様書の 2.4 の 5 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 未確認: 会社名欄の既存値は eraseText で消す（カーソル位置に依存する）。
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- takeScreenshot: 2.4-05-company-name-no-match-01
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: btnEditContinuationInfo
      INDEX: 0
- takeScreenshot: 2.4-05-company-name-no-match-02
- runFlow:
    file: common/assert-id-visible.yaml
    env:
      ID: etContinuationSearch
      INDEX: 0
- runFlow:
    file: common/assert-id-checked.yaml
    env:
      ID: rbContinuationSortAscending
      INDEX: 0
- runFlow:
    file: common/scroll-down-to-id.yaml
    env:
      ID: etContinuationCompanyName
- runFlow:
    file: common/input-text-field.yaml
    env:
      ID: etContinuationCompanyName
      INDEX: 1
      VALUE: "${COMPANY_NAME_NO_MATCH}"
- takeScreenshot: 2.4-05-company-name-no-match-03
# 未確認: SENDER_A に送信先が無いことを前提にしている。
- assertVisible: "なし"  # 未確認
- assertNotVisible: "${SEND_TARGET_NAME}"
- takeScreenshot: 2.4-05-company-name-no-match-04

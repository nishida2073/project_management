# 2.8 自動処理: 送信先がないとき、SMSの送信開始が失敗し、送信完了のログは残らない（テスト仕様書の 2.8 の 24 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（フローで設定）: 送信先の設定で test-send-target-1 を削除して、「設定を保存」を押す
# 外部条件: 別端末から SMS を送る。送信元 test-phone-a、本文は 1 行目「test-company」、2 行目「test-taro」。待ち時間（下の extendedWaitUntil）に送る
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "送信先の設定"
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/etSendTargetName"
    index: 0
    text: "test-send-target-1"
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/btnDeleteSendTarget"
    index: 0
- assertNotVisible: "test-send-target-1"
- tapOn: "設定を保存"
- takeScreenshot: 2.8-24-no-send-target-01
- pressKey: Back
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/btnTopOpenLog"
- takeScreenshot: 2.8-24-no-send-target-02
- extendedWaitUntil:
    visible: "(?s).*SMSを受信しました.*"
    timeout: 180000
- assertVisible: "(?s).*SMSの送信先が存在しません.*"
- assertNotVisible: "(?s).*SMSの登録に成功しました.*"
- takeScreenshot: 2.8-24-no-send-target-03

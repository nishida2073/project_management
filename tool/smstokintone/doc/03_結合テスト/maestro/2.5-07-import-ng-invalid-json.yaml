# 2.5 設定のインポート・エクスポート: JSONとして読めないファイルを選ぶ（テスト仕様書の 2.5 の 7 に対応）
appId: com.ssfrontier.smstokintone
---
# 前提（JSON）: 会社名の抽出: あり（JSON の値）。
# 前提（この flow で設定）: 最初に setup/setup-import-environment.yaml で JSON を投入し直す。
# 未確認: launchApp が前の画面を閉じて起動し直すか
# 前提（画面で確認不可）: ${IMPORT_FILE} を端末の選択先に置く（ファイルの置き場所は未確認）。
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "設定のインポート・エクスポート"
- takeScreenshot: 2.5-07-import-ng-invalid-json-01
- assertVisible: "設定のインポート・エクスポート"
- assertVisible: "ファイルを選択"
- assertVisible: "ファイルが選択されていません"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/btnImportSettings"
    enabled: false
- tapOn: "ファイルを選択"
# 未確認: 文書選択ダイアログ（Documents UI）の操作は公式ドキュメントで確認できなかった
- takeScreenshot: 2.5-07-import-ng-invalid-json-02
- runFlow:
    file: common/select-download-file.yaml
    env:
      FILE_PATTERN: ${IMPORT_FILE}
- takeScreenshot: 2.5-07-import-ng-invalid-json-03
- assertVisible: "インポートエラー"
- assertVisible: "(?s).*ファイルの形式が正しくありません.*JSONとして読み込めません.*"   # 未確認: メッセージ文言
- tapOn: "OK"   # 未確認: エラーダイアログの OK ボタンの文字
- takeScreenshot: 2.5-07-import-ng-invalid-json-04
- assertVisible: "ファイルが選択されていません"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/btnImportSettings"
    enabled: false
- takeScreenshot: 2.5-07-import-ng-invalid-json-05

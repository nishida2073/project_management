# 2.8 自動処理: 送信先がないとき、SMSの送信開始が失敗し、送信完了のログは残らない（テスト仕様書の 2.8 の 21 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（フローで設定）: 送信先の設定で test-send-target-1 を削除して、「設定を保存」を押す
# 外部条件: 別端末から SMS を送る。送信元 0312345801、本文は 1 行目「test-company」、2 行目「test-taro」。待ち時間（下の extendedWaitUntil）に送る
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "送信先の設定"
- runFlow:
    file: common/scroll-down-and-assert-text-by-id.yaml
    env:
      ID: etSendTargetName
      INDEX: 0
      TEXT: "test-send-target-1"
- runFlow:
    file: common/scroll-down-and-tap-by-id.yaml
    env:
      ID: btnDeleteSendTarget
      INDEX: 0
- assertNotVisible: "test-send-target-1"
- tapOn: "設定を保存"
- takeScreenshot: 2.8-21-no-send-target-01
- runFlow:
    file: common/scroll-down-and-tap-by-id.yaml
    env:
      ID: btnTopOpenLog
      INDEX: 0
- takeScreenshot: 2.8-21-no-send-target-02
- extendedWaitUntil:
    visible: "(?s).*SMSを受信しました.*"
    timeout: 180000
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "(?s).*SMSの送信先が存在しません.*"
- assertNotVisible: "(?s).*SMSの(登録|更新)に成功しました.*"
- takeScreenshot: 2.8-21-no-send-target-03

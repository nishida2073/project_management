# 2.2 送信先の設定: 会社名の抽出が無効のときテスト送信する（テスト仕様書の 2.2 の 13 に対応）
appId: com.ssfrontier.smstokintone
---
# 前提: 2.2-11 の後の状態（会社名の抽出: 無効）。test-send-target-1（振り分け：test-company）が保存済み
# 外部条件: kintone 接続と SMS 受信が必要
# 未確認: テスト本文に日本語（sample-company、test-taro）を入れられないため、英数字の TEST_BODY で代用している（IME の制約）
- launchApp
- tapOn: "アプリの設定"
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/swCompanyNameExtractionEnabled"
    direction: DOWN
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/swCompanyNameExtractionEnabled"
    checked: false
- pressKey: Back
- tapOn: "送信先の設定"
- assertVisible: "設定を追加"
# 前提確認: test-send-target-1（振り分け：test-company）が保存済み
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/etSendTargetName"
    index: 0
    text: "test-send-target-1"
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/etKeyword"
      index: 0
    direction: DOWN
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/etKeyword"
    index: 0
    text: "test-company"
- scrollUntilVisible:
    element: "テスト送信"
    direction: DOWN
- tapOn: "テスト送信"
- assertVisible: "テスト本文"
# 未確認: テスト本文ダイアログの入力欄にフォーカスがあるか（ない場合は入力が失敗する）
- eraseText: 50  # 未確認: テスト本文の初期値（テンプレート）を消してから入力する
- inputText: "${TEST_BODY}"
- hideKeyboard
- tapOn: "送信"
# 未確認: 結果の表示を待つ確認がないため、assertNotVisible が結果表示の前に通る可能性がある
- assertNotVisible: ".*送信先エラー.*"
# 未確認: テスト登録（kintone 側）は kintone で確認する
- takeScreenshot: 2.2-13-test-send-company-name-off

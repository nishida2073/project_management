# 2.3 アプリの設定: SMSの検索の送信状況の初期値「未送信」を切り替える（テスト仕様書の 2.3 の 21 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（フローで設定）: 検索条件の送信状況「未送信」をオンにする（JSON に指定がなく、既定値はオフ）
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- runFlow:
    file: common/scroll-up-by-id.yaml
    env:
      ID: rbThemeLight
- takeScreenshot: 2.3-21-search-default-send-none-01
- runFlow:
    file: common/scroll-down-by-id.yaml
    env:
      ID: cbSearchSendNoneOnlyEnabled
- takeScreenshot: 2.3-21-search-default-send-none-02
- runFlow:
    file: common/scroll-down-and-tap-by-id.yaml
    env:
      ID: cbSearchSendNoneOnlyEnabled
      INDEX: 0
- takeScreenshot: 2.3-21-search-default-send-none-03
- runFlow:
    file: common/assert-checked-by-id.yaml
    env:
      ID: cbSearchSendNoneOnlyEnabled
      INDEX: 0
- pressKey: Back
- takeScreenshot: 2.3-21-search-default-send-none-04
- tapOn: "SMSの検索"
- takeScreenshot: 2.3-21-search-default-send-none-05
- runFlow:
    file: common/assert-checked-by-id.yaml
    env:
      ID: cbSmsSearchSendNoneOnly
      INDEX: 0
- takeScreenshot: 2.3-21-search-default-send-none-06

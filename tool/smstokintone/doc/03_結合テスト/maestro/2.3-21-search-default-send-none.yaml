# 2.3 アプリの設定: SMSの検索の送信状況の初期値「未送信」を切り替える（テスト仕様書の 2.3 の 21 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（フローで設定）: 検索条件の送信状況「未送信」をオンにする（JSON に指定がなく、既定値はオフ）
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- runFlow:
    file: common/scroll-up-to-setting.yaml
    env:
      ELEMENT_ID: rbThemeLight
- takeScreenshot: 2.3-21-search-default-send-none-01
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: cbSearchSendNoneOnlyEnabled
- takeScreenshot: 2.3-21-search-default-send-none-02
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/cbSearchSendNoneOnlyEnabled"
    index: 0
- takeScreenshot: 2.3-21-search-default-send-none-03
- assertVisible: # 未確認: チェックボックスの選択状態の確認
    id: "jp.co.nttdata_univ.smstokintone:id/cbSearchSendNoneOnlyEnabled"
    checked: true
- pressKey: Back
- takeScreenshot: 2.3-21-search-default-send-none-04
- tapOn: "SMSの検索"
- takeScreenshot: 2.3-21-search-default-send-none-05
- assertVisible: # 未確認: 検索画面の送信状況「未送信」の選択状態
    id: "jp.co.nttdata_univ.smstokintone:id/cbSmsSearchSendNoneOnly"
    checked: true
- takeScreenshot: 2.3-21-search-default-send-none-06

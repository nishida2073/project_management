# 2.3 アプリの設定: SMSの送信の権限を許可する（テスト仕様書の 2.3 の 16 に対応）
appId: com.ssfrontier.smstokintone
---
# 前提（JSON）: 表示テーマ：ライト、SMSの送信モード：自動、SMSの返信モード：手動、引継ぎ：あり
# 前提（フローで設定）: SMSの送信の権限を許可する
# 外部条件: SMSの送信の権限を許可していない状態で開始する必要があります（端末の権限設定で用意します。許可済みの場合は「許可する」ボタンが表示されません）
- launchApp
- tapOn: "アプリの設定"
- takeScreenshot: 2.3-16-permission-send-grant-01
- assertVisible: "端末の許可"
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/btnRequestSendPermission"
- tapOn:
    id: "com.ssfrontier.smstokintone:id/btnRequestSendPermission"
# 未確認: システムの許可ダイアログのボタン文言（端末の言語で変わります）
- takeScreenshot: 2.3-16-permission-send-grant-02
- tapOn: "許可"
- takeScreenshot: 2.3-16-permission-send-grant-03
- assertNotVisible:
    id: "com.ssfrontier.smstokintone:id/btnRequestSendPermission"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/tvSendPermissionStatus"
    text: "許可済み"
- takeScreenshot: 2.3-16-permission-send-grant-04

# 2.3 アプリの設定: 固定変換の「+」で行を追加し、変換前と変換後を入力して保存されることを確認する（テスト仕様書の 2.3 の 10 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（フローで設定）: 固定変換の「+」で 1 行追加し、変換前と変換後を入力する
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/rbThemeLight"
    direction: UP
    visibilityPercentage: 100
- takeScreenshot: 2.3-10-fixed-conversion-add-01
- assertVisible: "端末の許可"
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/swCompanyNameExtractionEnabled"
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/swCompanyNameExtractionEnabled"
    checked: true
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/btnAddFixedConversion"
    visibilityPercentage: 50
- assertNotVisible: "${FIXED_FROM_1}"
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/btnAddFixedConversion"
    direction: DOWN
    visibilityPercentage: 50
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/btnAddFixedConversion"
- takeScreenshot: 2.3-10-fixed-conversion-add-02
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/btnDeleteFixedConversion"
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/etFixConversionBefore"
    index: 0
- takeScreenshot: 2.3-10-fixed-conversion-add-03
- inputText: "${FIXED_FROM_1}"
- takeScreenshot: 2.3-10-fixed-conversion-add-04
- hideKeyboard
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/etFixConversionAfter"
    index: 0
- takeScreenshot: 2.3-10-fixed-conversion-add-05
- inputText: "${FIXED_TO_1}"
- takeScreenshot: 2.3-10-fixed-conversion-add-06
- hideKeyboard
- assertVisible: "${FIXED_FROM_1}"
- assertVisible: "${FIXED_TO_1}"
- pressKey: Back
- takeScreenshot: 2.3-10-fixed-conversion-add-07
- tapOn: "アプリの設定"
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/rbThemeLight"
    direction: UP
    visibilityPercentage: 100
- takeScreenshot: 2.3-10-fixed-conversion-add-08
- assertVisible: "端末の許可"
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/btnAddFixedConversion"
    visibilityPercentage: 50
- assertVisible: "${FIXED_FROM_1}"
- assertVisible: "${FIXED_TO_1}"
- takeScreenshot: 2.3-10-fixed-conversion-add-09

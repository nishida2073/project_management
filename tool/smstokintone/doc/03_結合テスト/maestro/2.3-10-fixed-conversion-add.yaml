# 2.3 アプリの設定: 固定変換の「+」で行を追加し、変換前と変換後を入力して保存されることを確認する（テスト仕様書の 2.3 の 10 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（フローで設定）: 固定変換の「+」で 1 行追加し、変換前と変換後を入力する
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- runFlow:
    file: common/scroll-up-by-id.yaml
    env:
      ID: rbThemeLight
- takeScreenshot: 2.3-10-fixed-conversion-add-01
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "端末の許可"
- runFlow:
    file: common/scroll-down-by-id.yaml
    env:
      ID: swCompanyNameExtractionEnabled
- runFlow:
    file: common/assert-checked-by-id.yaml
    env:
      ID: swCompanyNameExtractionEnabled
      INDEX: 0
- runFlow:
    file: common/scroll-down-by-id.yaml
    env:
      ID: btnAddFixedConversion
- assertNotVisible: "${FIXED_FROM_1}"
- runFlow:
    file: common/scroll-down-and-tap-by-id.yaml
    env:
      ID: btnAddFixedConversion
      INDEX: 0
- takeScreenshot: 2.3-10-fixed-conversion-add-02
- runFlow:
    file: common/assert-visible-by-id.yaml
    env:
      ID: btnDeleteFixedConversion
      INDEX: 0
- runFlow:
    file: common/scroll-down-and-tap-by-id.yaml
    env:
      ID: etFixConversionBefore
      INDEX: 0
- takeScreenshot: 2.3-10-fixed-conversion-add-03
- inputText: "${FIXED_FROM_1}"
- takeScreenshot: 2.3-10-fixed-conversion-add-04
- hideKeyboard
- runFlow:
    file: common/scroll-down-and-tap-by-id.yaml
    env:
      ID: etFixConversionAfter
      INDEX: 0
- takeScreenshot: 2.3-10-fixed-conversion-add-05
- inputText: "${FIXED_TO_1}"
- takeScreenshot: 2.3-10-fixed-conversion-add-06
- hideKeyboard
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "${FIXED_FROM_1}"
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "${FIXED_TO_1}"
- pressKey: Back
- takeScreenshot: 2.3-10-fixed-conversion-add-07
- tapOn: "アプリの設定"
- runFlow:
    file: common/scroll-up-by-id.yaml
    env:
      ID: rbThemeLight
- takeScreenshot: 2.3-10-fixed-conversion-add-08
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "端末の許可"
- runFlow:
    file: common/scroll-down-by-id.yaml
    env:
      ID: btnAddFixedConversion
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "${FIXED_FROM_1}"
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "${FIXED_TO_1}"
- takeScreenshot: 2.3-10-fixed-conversion-add-09

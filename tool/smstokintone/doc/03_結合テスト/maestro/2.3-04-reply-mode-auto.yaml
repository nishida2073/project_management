# 2.3 アプリの設定: SMSの返信モードを自動に切り替える（テスト仕様書の 2.3 の 4 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（フローで設定）: SMSの返信モードを自動に切り替える
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- runFlow:
    file: common/scroll-up-by-id.yaml
    env:
      ID: rbThemeLight
- takeScreenshot: 2.3-04-reply-mode-auto-01
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "端末の許可"
- runFlow:
    file: common/scroll-down-by-id.yaml
    env:
      ID: rbThemeLight
- runFlow:
    file: common/assert-checked-by-id.yaml
    env:
      ID: rbThemeLight
      INDEX: 0
- runFlow:
    file: common/scroll-down-and-tap-by-id.yaml
    env:
      ID: rbSmsReplyModeAuto
      INDEX: 0
- takeScreenshot: 2.3-04-reply-mode-auto-02
- runFlow:
    file: common/scroll-down-by-id.yaml
    env:
      ID: rbSmsReplyModeAuto
- runFlow:
    file: common/assert-checked-by-id.yaml
    env:
      ID: rbSmsReplyModeAuto
      INDEX: 0
- pressKey: Back
- takeScreenshot: 2.3-04-reply-mode-auto-03
- runFlow:
    file: common/scroll-down-and-assert-text-by-id.yaml
    env:
      ID: tvTopReplyStatus
      INDEX: 0
      TEXT: "自動"
- takeScreenshot: 2.3-04-reply-mode-auto-04

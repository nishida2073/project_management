# 2.3 アプリの設定: SMSの返信モードを自動に切り替える（テスト仕様書の 2.3 の 4 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（フローで設定）: SMSの返信モードを自動に切り替える
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- takeScreenshot: 2.3-04-reply-mode-auto-01
- assertVisible: "端末の許可"
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/rbThemeLight"
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/rbThemeLight"
    checked: true
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/rbSmsReplyModeAuto"
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/rbSmsReplyModeAuto"
- takeScreenshot: 2.3-04-reply-mode-auto-02
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/rbSmsReplyModeAuto"
    checked: true
- pressKey: Back
- takeScreenshot: 2.3-04-reply-mode-auto-03
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/tvTopReplyStatus"
    text: "自動"
- takeScreenshot: 2.3-04-reply-mode-auto-04

# 2.3 アプリの設定: SMSの返信モードを自動に切り替える（テスト仕様書の 2.3 の 4 に対応）
appId: com.ssfrontier.smstokintone
---
# 前提（JSON）: 表示テーマ：ライト、SMSの送信モード：自動、SMSの返信モード：手動
# 前提（フローで設定）: 2.3 の 3 の後の状態に合わせ、SMSの送信モードを手動にする。SMSの返信モードを自動に切り替える
- launchApp
- tapOn: "アプリの設定"
- takeScreenshot: 2.3-04-reply-mode-auto-01
- assertVisible: "端末の許可"
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/rbThemeLight"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/rbThemeLight"
    checked: true
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/rbSendManual"
- tapOn:
    id: "com.ssfrontier.smstokintone:id/rbSendManual"
- takeScreenshot: 2.3-04-reply-mode-auto-02
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/rbSendManual"
    checked: true
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/rbSmsReplyModeAuto"
- tapOn:
    id: "com.ssfrontier.smstokintone:id/rbSmsReplyModeAuto"
- takeScreenshot: 2.3-04-reply-mode-auto-03
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/rbSmsReplyModeAuto"
    checked: true
- pressKey: Back
- takeScreenshot: 2.3-04-reply-mode-auto-04
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/tvTopReplyStatus"
    text: "自動"
- takeScreenshot: 2.3-04-reply-mode-auto-05

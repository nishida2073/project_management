# 2.3 アプリの設定: SMSの返信モードを自動に切り替える（テスト仕様書の 2.3 の 4 に対応）
appId: com.ssfrontier.smstokintone
---
# 前提: 表示テーマ：ライト（2.3 の 3 の後の状態）。送信モードと返信モードは、このフローで自動にします
- launchApp
- tapOn: "アプリの設定"
- assertVisible: "端末の許可"
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/rbThemeLight"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/rbThemeLight"
    checked: true
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/rbSendAuto"
- tapOn:
    id: "com.ssfrontier.smstokintone:id/rbSendAuto"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/rbSendAuto"
    checked: true
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/rbSmsReplyModeAuto"
- tapOn:
    id: "com.ssfrontier.smstokintone:id/rbSmsReplyModeAuto"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/rbSmsReplyModeAuto"
    checked: true
- pressKey: Back
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/tvTopReplyStatus"
    text: "自動"
- takeScreenshot: 2.3-04-after-reply-mode-auto

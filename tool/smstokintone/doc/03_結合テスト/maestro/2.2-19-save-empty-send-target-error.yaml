# 2.2 送信先の設定: 必須項目が空のとき保存でエラーになる（テスト仕様書の 2.2 の 19 に対応）
appId: com.ssfrontier.smstokintone
---
# 前提: 仕様書 2.2 の前提条件（2.2-11〜13 の後で会社名の抽出が無効）。このフローで有効に戻す
# 未確認: 追加した設定の番号（設定 N）は、保存済みの件数に依存する
- launchApp
- tapOn: "アプリの設定"
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/swCompanyNameExtractionEnabled"
    direction: DOWN
# 前提確認: 会社名の抽出が無効（下の checked: false）
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/swCompanyNameExtractionEnabled"
    checked: false
- tapOn:
    id: "com.ssfrontier.smstokintone:id/swCompanyNameExtractionEnabled"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/swCompanyNameExtractionEnabled"
    checked: true
- pressKey: Back
- tapOn: "送信先の設定"
- assertVisible: "設定を追加"
- tapOn: "設定を追加"
- tapOn: "設定を保存"
- assertVisible: "入力エラー"
- assertVisible: ".*設定 [0-9]+.*"  # 未確認
- assertVisible: ".*送信先名・サブドメイン・認証情報・アプリID・フィールドコードは必須です.*"  # 未確認
- assertNotVisible: "設定を保存しました"
- takeScreenshot: 2.2-19-validation-error

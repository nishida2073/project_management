# 2.7 SMSの検索: 未送信のみで検索すると、送信ログのない SMS だけが表示される（テスト仕様書の 2.7 の 3 に対応）
# 前提: setup（clearState と JSON 投入）から開始する。端末に未送信の SMS が 1 件以上ある（外部条件。SMS の読み取りを許可しておく）
# 注: 送信ログは setup で消えているため、端末の SMS はすべて未送信
# 未確認: 一覧の各項目の送信状況の表示文字は、スクリーンショットで確認する
appId: com.ssfrontier.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "SMSの検索"
- assertVisible: "検索条件"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/cbSmsSearchSendNoneOnly"
    checked: true
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/cbSmsSearchSentAutoOnly"
    checked: false
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/cbSmsSearchSentManualOnly"
    checked: false
- tapOn: "検索"
- assertVisible: '.*件見つかりました.*'
- assertVisible: "送信状況"
- takeScreenshot: 2.7-03-search-unsent-only-01

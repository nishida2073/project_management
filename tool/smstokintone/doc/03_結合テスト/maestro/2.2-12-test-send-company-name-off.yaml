# 2.2 送信先の設定: 会社名の抽出が無効のときテスト送信する（テスト仕様書の 2.2 の 12 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提: JSON 読み込み後の状態（test-send-target-1 の振り分けは test-company）。この flow の中で会社名の抽出を無効にしてからテスト送信する
# 外部条件: kintone 接続と SMS 受信が必要
# 未確認: テスト本文に日本語（sample-company、test-taro）を入れられないため、英数字の TEST_BODY で代用している（IME の制約）
# 未確認: テスト本文のダイアログの入力欄にフォーカスがある前提で、既存の値を eraseText で消す（フォーカスが無い場合は入力が失敗する）
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- takeScreenshot: 2.2-12-test-send-company-name-off-01
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/swCompanyNameExtractionEnabled"
    direction: DOWN
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/swCompanyNameExtractionEnabled"
    checked: true
- tapOn:
    id: "com.ssfrontier.smstokintone:id/swCompanyNameExtractionEnabled"
- takeScreenshot: 2.2-12-test-send-company-name-off-02
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/swCompanyNameExtractionEnabled"
    checked: false
- pressKey: Back
- takeScreenshot: 2.2-12-test-send-company-name-off-03
- tapOn: "送信先の設定"
- takeScreenshot: 2.2-12-test-send-company-name-off-04
- assertVisible: "設定を追加"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/etSendTargetName"
    index: 0
    text: "test-send-target-1"
- scrollUntilVisible:
    element:
      text: "^テスト送信$"
    direction: DOWN
- tapOn:
    text: "^テスト送信$"
    index: 0
- takeScreenshot: 2.2-12-test-send-company-name-off-05
- assertVisible: "テスト本文"
- eraseText: 50
- inputText: "${TEST_BODY}"
- takeScreenshot: 2.2-12-test-send-company-name-off-06
- hideKeyboard
- tapOn: "送信"
- takeScreenshot: 2.2-12-test-send-company-name-off-07
- extendedWaitUntil:
    visible: ".*テスト結果.*"
    timeout: 30000
- assertNotVisible: ".*送信先エラー.*"
- takeScreenshot: 2.2-12-test-send-company-name-off-08

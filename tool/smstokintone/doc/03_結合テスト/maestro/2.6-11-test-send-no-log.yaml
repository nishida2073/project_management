# 2.6 ログ: テスト送信はログに記録されない（テスト仕様書の 2.6 の 11 に対応）
# 未確認: テスト結果ダイアログを閉じる操作（id android:id/button1）と、トップ画面へ戻る操作（Back 1 回）
# 未確認: テスト送信の後にログが増えないことは、ログが空のままであることで確認する
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "送信先の設定"
- scrollUntilVisible:
    element: "テスト送信"
    direction: DOWN
- tapOn: "テスト送信"
- assertVisible: "テスト本文"
- tapOn: "送信"
- assertVisible: ".*テスト結果.*"
- tapOn:
    id: "android:id/button1"
- pressKey: Back
- tapOn: "ログの確認"
- assertVisible: "ログの一覧"
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/btnRefreshLog"
- assertVisible: "ログがありません"
- takeScreenshot: 2.6-11-test-send-no-log-01

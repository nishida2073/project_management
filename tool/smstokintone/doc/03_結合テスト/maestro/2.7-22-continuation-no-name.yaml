# 2.7 SMSの検索: 引継ぎの SMS の送信元に、氏名を表示しない設定では電話番号だけが表示される（テスト仕様書の 2.7 の 22 に対応）
# 前提（フローで設定）: このフローで引継ぎ内容の氏名表示をオフにする
# 外部条件: 引継ぎ内容の送信元（test-sender-a）から届いた SMS が、端末にある
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/swContinuationShowUserNameEnabled"
    direction: DOWN
    visibilityPercentage: 100
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/swContinuationShowUserNameEnabled"
    index: 0
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/swContinuationShowUserNameEnabled"
    checked: false
- pressKey: Back
- tapOn: "SMSの検索"
- assertVisible: "検索条件"
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/cbSmsSearchSendNoneOnly"
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/cbSmsSearchSendNoneOnly"
    checked: false
- tapOn: "検索"
- assertVisible: '(?s).*${CONTINUATION_SENDER}.*'
- assertNotVisible: "${CONTINUATION_USER_NAME}"
- takeScreenshot: 2.7-22-continuation-no-name-01

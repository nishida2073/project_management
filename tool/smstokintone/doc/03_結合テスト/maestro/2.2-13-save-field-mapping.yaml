# 2.2 送信先の設定: フィールドコードを保存する（テスト仕様書の 2.2 の 13 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 注: フィールドコードの保存値は 2.2-14 で開き直して確認する（SendTargetSettingsActivity.kt:88-94, SettingsStore.kt:513-549）。
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "送信先の設定"
- takeScreenshot: 2.2-13-save-field-mapping-01
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "設定を追加"
- runFlow:
    file: common/scroll-down-and-assert-field-text.yaml
    env:
      ID: etSendTargetName
      INDEX: 0
      TEXT: "test-send-target-1"
- runFlow:
    file: common/scroll-down-to-id.yaml
    env:
      ID: etFieldType
- runFlow:
    file: common/input-text-field.yaml
    env:
      ID: etFieldType
      INDEX: 0
      VALUE: "${SAVED_FIELD_TYPE}"
- runFlow:
    file: common/scroll-down-to-id.yaml
    env:
      ID: etFieldDatetime
- runFlow:
    file: common/input-text-field.yaml
    env:
      ID: etFieldDatetime
      INDEX: 0
      VALUE: "${SAVED_FIELD_DATETIME}"
- runFlow:
    file: common/scroll-down-to-id.yaml
    env:
      ID: etFieldSender
- runFlow:
    file: common/input-text-field.yaml
    env:
      ID: etFieldSender
      INDEX: 0
      VALUE: "${SAVED_FIELD_SENDER}"
- runFlow:
    file: common/scroll-down-to-id.yaml
    env:
      ID: etFieldCompanyName
- runFlow:
    file: common/input-text-field.yaml
    env:
      ID: etFieldCompanyName
      INDEX: 0
      VALUE: "${SAVED_FIELD_COMPANY}"
- runFlow:
    file: common/scroll-down-to-id.yaml
    env:
      ID: etFieldUserName
- runFlow:
    file: common/input-text-field.yaml
    env:
      ID: etFieldUserName
      INDEX: 0
      VALUE: "${SAVED_FIELD_USER}"
- runFlow:
    file: common/scroll-down-to-id.yaml
    env:
      ID: etFieldBody
- runFlow:
    file: common/input-text-field.yaml
    env:
      ID: etFieldBody
      INDEX: 0
      VALUE: "${SAVED_FIELD_BODY}"
- runFlow:
    file: common/scroll-down-to-id.yaml
    env:
      ID: etFieldHistory
- runFlow:
    file: common/input-text-field.yaml
    env:
      ID: etFieldHistory
      INDEX: 0
      VALUE: "${SAVED_FIELD_HISTORY}"
- tapOn: "設定を保存"
- takeScreenshot: 2.2-13-save-field-mapping-02
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "SMSの送信モード"
- assertNotVisible: "設定を追加"
- takeScreenshot: 2.2-13-save-field-mapping-03

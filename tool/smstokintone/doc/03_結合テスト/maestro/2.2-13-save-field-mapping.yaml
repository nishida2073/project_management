# 2.2 送信先の設定: フィールドコードを保存する（テスト仕様書の 2.2 の 13 に対応）
appId: com.ssfrontier.smstokintone
---
# 前提: 仕様書 2.2 の前提条件（test-send-target-1 が保存済み。このフローで上書きする）
# 未確認: fieldType などの保存値は画面に表示されないため、保存値は確認していない（内部値）
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "送信先の設定"
- takeScreenshot: 2.2-13-save-field-mapping-01
- assertVisible: "設定を追加"
# 前提確認: test-send-target-1 が 1 件目に保存済み
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/etSendTargetName"
    index: 0
    text: "test-send-target-1"
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/etFieldType"
    direction: DOWN
- runFlow:
    file: common/input-text-field.yaml
    env:
      FIELD_ID: etFieldType
      INPUT_VALUE: "${SAVED_FIELD_TYPE}"
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/etFieldDatetime"
    direction: DOWN
- runFlow:
    file: common/input-text-field.yaml
    env:
      FIELD_ID: etFieldDatetime
      INPUT_VALUE: "${SAVED_FIELD_DATETIME}"
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/etFieldSender"
    direction: DOWN
- runFlow:
    file: common/input-text-field.yaml
    env:
      FIELD_ID: etFieldSender
      INPUT_VALUE: "${SAVED_FIELD_SENDER}"
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/etFieldCompanyName"
    direction: DOWN
- runFlow:
    file: common/input-text-field.yaml
    env:
      FIELD_ID: etFieldCompanyName
      INPUT_VALUE: "${SAVED_FIELD_COMPANY}"
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/etFieldUserName"
    direction: DOWN
- runFlow:
    file: common/input-text-field.yaml
    env:
      FIELD_ID: etFieldUserName
      INPUT_VALUE: "${SAVED_FIELD_USER}"
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/etFieldBody"
    direction: DOWN
- runFlow:
    file: common/input-text-field.yaml
    env:
      FIELD_ID: etFieldBody
      INPUT_VALUE: "${SAVED_FIELD_BODY}"
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/etFieldHistory"
    direction: DOWN
- runFlow:
    file: common/input-text-field.yaml
    env:
      FIELD_ID: etFieldHistory
      INPUT_VALUE: "${SAVED_FIELD_HISTORY}"
- tapOn: "設定を保存"
- takeScreenshot: 2.2-13-save-field-mapping-02
- assertVisible: "設定を保存しました"
- assertVisible: "SMSの送信モード"
- assertNotVisible: "設定を追加"
- takeScreenshot: 2.2-13-save-field-mapping-03

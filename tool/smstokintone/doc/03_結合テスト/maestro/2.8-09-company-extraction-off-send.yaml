# 2.8 自動処理: 会社名の抽出を無効にすると、本文から会社名を抽出せず、送信先のすべてを対象にする（テスト仕様書の 2.8 の 9 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（JSON）: 既定値（2.8 の 1 と同じ）
# 前提（フローで設定）: 会社名の抽出を無効にする（会社名の自動変換は既定の有効のまま）
# 外部条件（事前に別端末から SMS を送る）: 送信元は既定（test-phone-a）、本文は 1 行目「test-taro」（会社名を含まない）。待ち時間（下の extendedWaitUntil）に送る
# 注: 会社名の抽出が無効のとき、送信先はすべて（この JSON では 1 件）を対象にする（SettingsStore.resolveSendTargets）
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/swCompanyNameExtractionEnabled"
    direction: DOWN
    visibilityPercentage: 100
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/swCompanyNameExtractionEnabled"
    checked: true
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/swCompanyNameExtractionEnabled"
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/swCompanyNameExtractionEnabled"
    checked: false
- pressKey: Back
- runFlow: common/enable-log-auto-refresh.yaml
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/btnTopOpenLog"
- takeScreenshot: 2.8-09-company-extraction-off-send-01
- extendedWaitUntil:
    visible: "(?s).*SMSを受信しました.*"
    timeout: 180000
- assertVisible: "(?s).*SMSの登録に成功しました.*"
- takeScreenshot: 2.8-09-company-extraction-off-send-02

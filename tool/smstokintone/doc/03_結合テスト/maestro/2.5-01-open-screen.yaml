# 2.5 設定のインポート・エクスポート: 画面を開いた初期状態を確認する（テスト仕様書の 2.5 の 1 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 未確認: launchApp が前の画面を閉じて起動し直すか
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "設定のインポート・エクスポート"
- takeScreenshot: 2.5-01-open-screen-01
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "設定のインポート・エクスポート"
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "ファイルを選択"
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "ファイルが選択されていません"
- runFlow:
    file: common/assert-id-visible.yaml
    env:
      ID: btnImportSettings
      INDEX: 0
    enabled: false
- takeScreenshot: 2.5-01-open-screen-02

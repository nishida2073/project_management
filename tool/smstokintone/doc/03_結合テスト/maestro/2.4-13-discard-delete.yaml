# 2.4 引継ぎ内容の設定: 削除を保存せずに画面を閉じると削除は反映されない（テスト仕様書の 2.4 の 13 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# この flow は送信元 B（一覧の index 1）を削除し、保存せずに閉じる。次の flow には引き継がない。
# 未確認: 保存せずに Back で閉じたときに、確認ダイアログが出ない想定。
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- takeScreenshot: 2.4-13-discard-delete-01
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: btnEditContinuationInfo
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/btnEditContinuationInfo"
- takeScreenshot: 2.4-13-discard-delete-02
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/etContinuationSearch"
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/rbContinuationSortAscending"
    checked: true
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: btnDeleteContinuationInfo
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/btnDeleteContinuationInfo"
    index: 1
- takeScreenshot: 2.4-13-discard-delete-03
- assertNotVisible: "${SENDER_B}"
- pressKey: Back
- takeScreenshot: 2.4-13-discard-delete-04
- assertNotVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/etContinuationSearch"
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: btnEditContinuationInfo
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/btnEditContinuationInfo"
- takeScreenshot: 2.4-13-discard-delete-05
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/etContinuationSearch"
- assertVisible: "${SENDER_B}"
- takeScreenshot: 2.4-13-discard-delete-06

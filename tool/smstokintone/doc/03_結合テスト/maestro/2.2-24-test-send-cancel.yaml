appId: com.ssfrontier.smstokintone
---
# 前提: 2.2 の前提条件（test-send-target-1（振り分け：test-company）が保存済み）
- launchApp
- tapOn: "送信先の設定"
- assertVisible: "設定を追加"
- scrollUntilVisible:
    element: "テスト送信"
    direction: DOWN
- tapOn: "テスト送信"
- assertVisible: "テスト本文"
- tapOn: "キャンセル"
- assertNotVisible: "テスト本文"
- assertNotVisible: "テスト結果"
- takeScreenshot: 2.2-24-test-send-cancel

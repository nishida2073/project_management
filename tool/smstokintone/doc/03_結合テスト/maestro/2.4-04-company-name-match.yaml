# 2.4 引継ぎ内容の設定: 会社名を入力すると送信先が表示される（テスト仕様書の 2.4 の 4 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 未確認: 会社名欄の既存値は eraseText で消す（カーソル位置に依存する）。
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- takeScreenshot: 2.4-04-company-name-match-01
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/btnEditContinuationInfo"
    direction: DOWN
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/btnEditContinuationInfo"
- takeScreenshot: 2.4-04-company-name-match-02
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/etContinuationSearch"
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/rbContinuationSortAscending"
    checked: true
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/etContinuationCompanyName"
      index: 1
    direction: DOWN
    visibilityPercentage: 100
- runFlow:
    file: common/input-second-text-field.yaml
    env:
      FIELD_ID: etContinuationCompanyName
      INPUT_VALUE: "${COMPANY_NAME_MATCH}"
- takeScreenshot: 2.4-04-company-name-match-03
- assertVisible: "${SEND_TARGET_NAME}"
- takeScreenshot: 2.4-04-company-name-match-04

# 2.4 引継ぎ内容の設定: 会社名を入力すると送信先が表示される（テスト仕様書の 2.4 の 4 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- takeScreenshot: 2.4-04-company-name-match-01
- runFlow:
    file: common/scroll-down-and-tap-by-id.yaml
    env:
      ID: btnEditContinuationInfo
      INDEX: 0
- takeScreenshot: 2.4-04-company-name-match-02
- runFlow:
    file: common/assert-visible-by-id.yaml
    env:
      ID: etContinuationSearch
      INDEX: 0
- runFlow:
    file: common/assert-checked-by-id.yaml
    env:
      ID: rbContinuationSortAscending
      INDEX: 0
- runFlow:
    file: common/scroll-down-by-id.yaml
    env:
      ID: etContinuationCompanyName
- runFlow:
    file: common/input-text-by-id.yaml
    env:
      ID: etContinuationCompanyName
      INDEX: 1
      VALUE: "${COMPANY_NAME_MATCH}"
- takeScreenshot: 2.4-04-company-name-match-03
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "${SEND_TARGET_NAME}"
- takeScreenshot: 2.4-04-company-name-match-04

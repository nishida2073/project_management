# 2.4 引継ぎ内容の設定: 会社名を入力すると送信先が表示される（テスト仕様書の 2.4 の 4 に対応）
appId: com.ssfrontier.smstokintone
---
# 前提（JSON）: test-data/setup/env_ok.json を投入した直後の状態。送信元 test-sender-a（古い）と test-sender-b（新しい）、送信先 test-send-target-1（振り分け: test-company）と test-send-target-2、会社名の抽出: あり、引継ぎ内容の氏名表示: あり。
# 前提（この flow で設定）: 最初に setup/setup-import-environment.yaml で JSON を投入し直し、前の flow の変更（削除など）を戻す。表示順序は投入後の既定（古い順）。
# 前提（この flow）: 送信元 B（test-sender-b、一覧の index 1）の会社名を入力する。振り分けが一致すると送信先が表示される。
# 前提（JSON の値）: 送信先 test-send-target-1 は振り分け test-company を持つ。
# 未確認: 会社名欄の既存値は eraseText で消す（カーソル位置に依存する）。
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- takeScreenshot: 2.4-04-company-name-match-01
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/btnEditContinuationInfo"
    direction: DOWN
- tapOn:
    id: "com.ssfrontier.smstokintone:id/btnEditContinuationInfo"
- takeScreenshot: 2.4-04-company-name-match-02
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/etContinuationSearch"
# 前提確認（表示のみ、操作しない）
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/rbContinuationSortAscending"
    checked: true
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/etContinuationCompanyName"
      index: 1
    direction: DOWN
    visibilityPercentage: 100
- runFlow:
    file: common/input-second-text-field.yaml
    env:
      FIELD_ID: etContinuationCompanyName
      INPUT_VALUE: "${COMPANY_NAME_MATCH}"
- takeScreenshot: 2.4-04-company-name-match-03
- assertVisible: "${SEND_TARGET_NAME}"
- takeScreenshot: 2.4-04-company-name-match-04

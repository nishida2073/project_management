# 2.4 引継ぎ内容の設定: 引継ぎ内容の氏名表示をオンにすると氏名が表示される（テスト仕様書の 2.4 の 9 に対応）
appId: com.ssfrontier.smstokintone
---
# 前提: 表示順序は古い順（既定）、引継ぎ内容の氏名表示はオフ（08 の後の状態、この flow でオンにする）。送信元は 2.4-03/04 の後の状態に依存し、2 件とは限らない（テスト仕様書の 2.4 前提条件）。
# 未確認: 氏名の欄の hint「氏名」を、氏名が表示される状態の目印にする。
# 要判断: 画面設計 3.4 の「氏名が表示される」は、ContinuationInfoSettingsActivity が swContinuationShowUserNameEnabled を参照しておらず、氏名欄は常に表示されるため、この確認の意味が画面設計と一致しない可能性がある。
- launchApp
- tapOn: "アプリの設定"
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/swContinuationShowUserNameEnabled"
    direction: DOWN
# 前提確認（表示のみ、操作しない）
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/swContinuationShowUserNameEnabled"
    checked: false
- tapOn:
    id: "com.ssfrontier.smstokintone:id/swContinuationShowUserNameEnabled"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/swContinuationShowUserNameEnabled"
    checked: true
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/btnEditContinuationInfo"
    direction: DOWN
- tapOn:
    id: "com.ssfrontier.smstokintone:id/btnEditContinuationInfo"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/etContinuationSearch"
# 前提確認（表示のみ、操作しない）
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/rbContinuationSortAscending"
    checked: true
- assertVisible: "氏名"
- takeScreenshot: 2.4-09-user-name-on

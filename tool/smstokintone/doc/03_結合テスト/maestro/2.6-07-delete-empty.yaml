# 2.6 ログ: ログが空のとき、削除と更新を行うと「ログがありません」が表示される（テスト仕様書の 2.6 の 7 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "ログの確認"
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "ログの一覧"
- runFlow:
    file: common/scroll-down-and-tap-by-id.yaml
    env:
      ID: btnDeleteLog
      INDEX: 0
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "ログを削除しますか？"
- runFlow:
    file: common/tap-android-by-id.yaml
    env:
      ID: button1
- runFlow:
    file: common/scroll-down-and-tap-by-id.yaml
    env:
      ID: btnRefreshLog
      INDEX: 0
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "ログがありません"
- takeScreenshot: 2.6-07-delete-empty-01

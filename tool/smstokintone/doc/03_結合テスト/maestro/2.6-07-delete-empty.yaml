# 2.6 ログ: ログが空のとき、削除と更新を行うと「ログがありません」が表示される（テスト仕様書の 2.6 の 7 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "ログの確認"
- assertVisible: "ログの一覧"
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/btnDeleteLog"
- assertVisible: "ログを削除しますか？"
- tapOn:
    id: "android:id/button1"
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/btnRefreshLog"
- assertVisible: "ログがありません"
- takeScreenshot: 2.6-07-delete-empty-01

# 2.6 ログ: ログが空のとき、削除と更新を行うと「ログがありません」が表示される（テスト仕様書の 2.6 の 7 に対応）
# 前提: setup（clearState と JSON 投入）から開始する。ログは空の状態から始まる（setup の clearState による）
appId: com.ssfrontier.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "ログの確認"
- assertVisible: "ログの一覧"
- tapOn:
    id: "com.ssfrontier.smstokintone:id/btnDeleteLog"
- assertVisible: "ログを削除しますか？"
- tapOn:
    id: "android:id/button1"
- tapOn:
    id: "com.ssfrontier.smstokintone:id/btnRefreshLog"
- assertVisible: "ログがありません"
- takeScreenshot: 2.6-07-delete-empty-01

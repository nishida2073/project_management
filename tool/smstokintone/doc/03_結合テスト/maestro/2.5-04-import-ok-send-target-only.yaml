# 2.5 設定のインポート・エクスポート: 送信先の設定だけを含むファイルをインポートする（テスト仕様書の 2.5 の 4 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 未確認: launchApp が前の画面を閉じて起動し直すか
# 外部条件: ${IMPORT_FILE} を端末の選択先に置く（ファイルの置き場所は未確認）。
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "設定のインポート・エクスポート"
- takeScreenshot: 2.5-04-import-ok-send-target-only-01
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "設定のインポート・エクスポート"
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "ファイルを選択"
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "ファイルが選択されていません"
- runFlow:
    file: common/assert-disabled-by-id.yaml
    env:
      ID: btnImportSettings
      INDEX: 0
- tapOn: "ファイルを選択"
# 未確認: 文書選択ダイアログ（Documents UI）の操作は公式ドキュメントで確認できなかった
- takeScreenshot: 2.5-04-import-ok-send-target-only-02
- runFlow:
    file: common/select-download-file-by-text.yaml
    env:
      TEXT: ${IMPORT_FILE}
- takeScreenshot: 2.5-04-import-ok-send-target-only-03
- assertVisible: "(?s).*${IMPORT_FILE}.*"
- assertVisible: "(?s).*アプリの設定: 変更なし.*"
- assertVisible: "(?s).*送信先の設定: 統合（1件）.*"
- assertVisible: "(?s).*引継ぎ内容: 変更なし.*"
- runFlow:
    file: common/scroll-down-and-tap-by-id.yaml
    env:
      ID: btnImportSettings
      INDEX: 0
- takeScreenshot: 2.5-04-import-ok-send-target-only-04
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "設定をインポートしますか？"
- runFlow:
    file: common/tap-android-by-id.yaml
    env:
      ID: button1
- takeScreenshot: 2.5-04-import-ok-send-target-only-05
- assertNotVisible: "ファイルを選択"
- takeScreenshot: 2.5-04-import-ok-send-target-only-06

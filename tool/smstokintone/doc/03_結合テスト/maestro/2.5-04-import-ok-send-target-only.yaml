# 2.5 設定のインポート・エクスポート: 送信先の設定だけを含むファイルをインポートする（テスト仕様書の 2.5 の 4 に対応）
appId: com.ssfrontier.smstokintone
---
# 前提（JSON）: 会社名の抽出: あり（JSON の値）。
# 前提（この flow で設定）: 最初に setup/setup-import-environment.yaml で JSON を投入し直す。
# 未確認: launchApp が前の画面を閉じて起動し直すか
# 前提（画面で確認不可）: ${IMPORT_FILE} を端末の選択先に置く（ファイルの置き場所は未確認）。
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "設定のインポート・エクスポート"
- takeScreenshot: 2.5-04-import-ok-send-target-only-01
- assertVisible: "設定のインポート・エクスポート"
- assertVisible: "ファイルを選択"
- assertVisible: "ファイルが選択されていません"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/btnImportSettings"
    enabled: false
- tapOn: "ファイルを選択"
# 未確認: 文書選択ダイアログ（Documents UI）の操作は公式ドキュメントで確認できなかった
- takeScreenshot: 2.5-04-import-ok-send-target-only-02
- runFlow:
    file: setup/select-download-file.yaml
    env:
      FILE_PATTERN: ${IMPORT_FILE}
- takeScreenshot: 2.5-04-import-ok-send-target-only-03
- assertVisible: "(?s).*${IMPORT_FILE}.*"   # 未確認: 正規表現と複数行の表示
- assertVisible: "(?s).*アプリの設定: 変更なし.*"   # 未確認: 複数行の表示
- assertVisible: "(?s).*送信先の設定: 統合（1件）.*"   # 未確認: 複数行の表示
- assertVisible: "(?s).*引継ぎ内容: 変更なし.*"   # 未確認: 複数行の表示
- tapOn:
    id: "com.ssfrontier.smstokintone:id/btnImportSettings"
- takeScreenshot: 2.5-04-import-ok-send-target-only-04
- assertVisible: "設定をインポートしますか？"
- tapOn:
    id: "android:id/button1"   # 未確認: 確認ダイアログの「インポート」ボタンの id
- takeScreenshot: 2.5-04-import-ok-send-target-only-05
- assertVisible: "設定をインポートしました"   # 未確認: トーストの表示
- assertNotVisible:
    id: "com.ssfrontier.smstokintone:id/btnImportSettings"
- takeScreenshot: 2.5-04-import-ok-send-target-only-06

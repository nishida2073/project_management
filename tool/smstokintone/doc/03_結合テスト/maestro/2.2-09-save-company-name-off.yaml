# 2.2 送信先の設定: 会社名の抽出を無効にして設定を保存する（テスト仕様書の 2.2 の 9 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 注: 会社名の抽出が無効のときは会社名欄が表示される（SendTargetSettingsActivity.kt:76-78）。切替は即時保存される。
# 注: 保存値の画面での確認は 2.2-11 で行う（SendTargetSettingsActivity.kt:75）。
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- takeScreenshot: 2.2-09-save-company-name-off-01
- runFlow:
    file: common/scroll-down-to-id.yaml
    env:
      ID: swCompanyNameExtractionEnabled
- runFlow:
    file: common/assert-id-checked.yaml
    env:
      ID: swCompanyNameExtractionEnabled
      INDEX: 0
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: swCompanyNameExtractionEnabled
      INDEX: 0
- takeScreenshot: 2.2-09-save-company-name-off-02
- runFlow:
    file: common/assert-id-unchecked.yaml
    env:
      ID: swCompanyNameExtractionEnabled
      INDEX: 0
- pressKey: Back
- takeScreenshot: 2.2-09-save-company-name-off-03
- tapOn: "送信先の設定"
- takeScreenshot: 2.2-09-save-company-name-off-04
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "設定を追加"
- runFlow:
    file: common/scroll-down-and-assert-field-text.yaml
    env:
      ID: etSendTargetName
      INDEX: 0
      TEXT: "test-send-target-1"
- runFlow:
    file: common/scroll-down-to-id.yaml
    env:
      ID: etCompanyName
- runFlow:
    file: common/input-text-field.yaml
    env:
      ID: etCompanyName
      INDEX: 0
      VALUE: "${COMPANY_NAME}"
- tapOn: "設定を保存"
- takeScreenshot: 2.2-09-save-company-name-off-05
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "SMSの送信モード"
- assertNotVisible: "設定を追加"
- takeScreenshot: 2.2-09-save-company-name-off-06

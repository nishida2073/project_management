# 2.7 SMSの検索: 通信できない状態で送信すると失敗し、通信を戻して送信し直すと成功する（テスト仕様書の 2.7 の 15 に対応）
# 前提（フローで設定）: 端末に SMS が 1 件以上ある。kintone の接続が有効（テスト環境）
# 外部条件: 手動。機内モードは、この flow の途中で切り替える。1 回目の送信の前に機内モードを有効にし、「送信失敗」の確認の後に解除する
# 注: 機内モードの切り替えは Maestro で行えないため、この flow は手動で区切って実行する（未確認）
# 未確認: 2 回目の送信の結果（kintone の登録）は、kintone 側で確認する
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "SMSの検索"
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "検索条件"
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: cbSmsSearchSendNoneOnly
      INDEX: 0
- runFlow:
    file: common/assert-id-checked.yaml
    env:
      ID: cbSmsSearchSendNoneOnly
      INDEX: 0
- tapOn: "検索"
- tapOn: "全選択"
- tapOn: "選択したSMSを送信"
- takeScreenshot: 2.7-15-send-airplane-mode-01
# 外部条件: 手動。ここで機内モードを解除する
- tapOn: "検索"
- tapOn: "全選択"
- tapOn: "選択したSMSを送信"
- pressKey: Back
- tapOn: "ログの確認"
- extendedWaitUntil:
    visible: '(?s).*\[(送信完了|失敗)\].*'
    timeout: 180000
- pressKey: Back
- tapOn: "SMSの検索"
- takeScreenshot: 2.7-15-send-airplane-mode-02

# 2.2 送信先の設定: 振り分けの行を削除する（テスト仕様書の 2.2 の 5 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（フローで設定）: この flow の中で sample-company（KEYWORD_SAMPLE）の行を追加してから削除する
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "送信先の設定"
- takeScreenshot: 2.2-05-remove-keyword-row-01
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "設定を追加"
- runFlow:
    file: common/scroll-down-and-assert-field-text.yaml
    env:
      ID: etKeyword
      INDEX: 0
      TEXT: "${KEYWORD_TEST}"
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: btnAddKeyword
      INDEX: 0
- takeScreenshot: 2.2-05-remove-keyword-row-02
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: etKeyword
      INDEX: 1
- takeScreenshot: 2.2-05-remove-keyword-row-03
- inputText: "${KEYWORD_SAMPLE}"
- takeScreenshot: 2.2-05-remove-keyword-row-04
- hideKeyboard
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "${KEYWORD_SAMPLE}"
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: btnDeleteKeyword
      INDEX: 1
- takeScreenshot: 2.2-05-remove-keyword-row-05
- assertNotVisible: "${KEYWORD_SAMPLE}"
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "${KEYWORD_TEST}"
- takeScreenshot: 2.2-05-remove-keyword-row-06

# 2.2 送信先の設定: 振り分けの行を削除する（テスト仕様書の 2.2 の 5 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（フローで設定）: この flow の中で sample-company（KEYWORD_SAMPLE）の行を追加してから削除する
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "送信先の設定"
- takeScreenshot: 2.2-05-remove-keyword-row-01
- assertVisible: "設定を追加"
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/etKeyword"
    index: 0
    text: "${KEYWORD_TEST}"
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/btnAddKeyword"
      index: 0
    direction: DOWN
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/btnAddKeyword"
    index: 0
- takeScreenshot: 2.2-05-remove-keyword-row-02
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/etKeyword"
      index: 1
    direction: DOWN
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/etKeyword"
    index: 1
- takeScreenshot: 2.2-05-remove-keyword-row-03
- inputText: "${KEYWORD_SAMPLE}"
- takeScreenshot: 2.2-05-remove-keyword-row-04
- hideKeyboard
- assertVisible: "${KEYWORD_SAMPLE}"
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/btnDeleteKeyword"
    index: 1
- takeScreenshot: 2.2-05-remove-keyword-row-05
- assertNotVisible: "${KEYWORD_SAMPLE}"
- assertVisible: "${KEYWORD_TEST}"
- takeScreenshot: 2.2-05-remove-keyword-row-06

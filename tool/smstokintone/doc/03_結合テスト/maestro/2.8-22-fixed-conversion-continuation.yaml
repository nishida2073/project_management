# 2.8 自動処理: 引継ぎの会社名は、固定変換で二重に変換されない（テスト仕様書の 2.8 の 22 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（フローで設定）: 会社名の自動変換を無効にする。固定変換に「${FIXED_FROM}」→「${FIXED_TO}」を 1 行追加する
# 外部条件: 別端末から SMS を送る。1 通目は送信元 0312345801、本文は 1 行目「test-company」、2 行目「test-taro」、3 行目「body-test-7」。2 通目は同じ送信元、本文は 1 行だけ（会社名の記載なし）
# 前提（フローで設定）: （この行の中で行う）: 1 通目を受信してから、2 通目を受信する
# 注: 引継ぎの会社名は保存時に変換済みのため、2 通目では再変換しない（SettingsStore.resolveSendTargets）
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- runFlow:
    file: common/scroll-down-and-tap-by-id.yaml
    env:
      ID: swCompanyNameAutoConversionEnabled
      INDEX: 0
- runFlow:
    file: common/assert-unchecked-by-id.yaml
    env:
      ID: swCompanyNameAutoConversionEnabled
      INDEX: 0
- runFlow:
    file: common/scroll-down-and-tap-by-id.yaml
    env:
      ID: btnAddFixedConversion
      INDEX: 0
- runFlow:
    file: common/scroll-down-and-tap-by-id.yaml
    env:
      ID: etFixConversionBefore
      INDEX: 0
- inputText: "${FIXED_FROM}"
- hideKeyboard
- runFlow:
    file: common/scroll-down-and-tap-by-id.yaml
    env:
      ID: etFixConversionAfter
      INDEX: 0
- inputText: "${FIXED_TO}"
- hideKeyboard
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "${FIXED_TO}"
- pressKey: Back
- runFlow:
    file: common/scroll-down-and-tap-by-id.yaml
    env:
      ID: btnTopOpenLog
      INDEX: 0
- takeScreenshot: 2.8-22-fixed-conversion-continuation-01
- extendedWaitUntil:
    visible: "(?s).*SMSの(登録|更新)に成功しました.*"
    timeout: 180000
- extendedWaitUntil:
    visible: "(?s).*SMSの更新に成功しました.*"
    timeout: 180000
- longPressOn: "(?s).*SMSの更新に成功しました.*"
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "(?s).*test-company-converted.*"
- assertNotVisible: "(?s).*test-company-converted-converted.*"
- takeScreenshot: 2.8-22-fixed-conversion-continuation-02

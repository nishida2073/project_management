# 2.7 SMSの検索: 選んだ SMS を送信すると、送信キューに追加されて送信が完了する（テスト仕様書の 2.7 の 9 に対応）
# 前提（フローで設定）: 端末に SMS が 1 件以上ある。kintone の接続が有効（テスト環境）
# 未確認: 送信完了のトーストの件数（成功N件 / 失敗M件）は、端末の SMS と通信の結果による
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "SMSの検索"
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "検索条件"
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: cbSmsSearchSendNoneOnly
      INDEX: 0
- runFlow:
    file: common/assert-id-checked.yaml
    env:
      ID: cbSmsSearchSendNoneOnly
      INDEX: 0
- tapOn: "検索"
- tapOn: "全選択"
- tapOn: "選択したSMSを送信"
- tapOn: "ログの確認"
- extendedWaitUntil:
    visible: '(?s).*\[(送信完了|失敗)\].*'
    timeout: 180000
- pressKey: Back
- takeScreenshot: 2.7-09-send-selected-01
- assertNotVisible:
    className: "android.widget.CheckBox"
    checked: true
- takeScreenshot: 2.7-09-send-selected-02

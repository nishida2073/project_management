# 2.8 自動処理: 送信先の接続情報が無効なとき、SMSの送信が失敗する（テスト仕様書の 2.8 の 21 に対応）
# 前提（JSON）: 既定値（2.8 の 1 と同じ）。送信先 test-send-target-1 の接続情報は JSON の値
# 前提（フローで設定）: test-send-target-1 のログイン名を無効な値（${INVALID_LOGIN_NAME}）にして、「設定を保存」を押す（2.2 の 21 と同じ）
# 外部条件（事前に別端末から SMS を送る）: 送信元 test-phone-a、本文は 1 行目「test-company」、2 行目「test-taro」、3 行目「body-test」。待ち時間（下の extendedWaitUntil）に送る
# 未確認: kintone の応答内容は kintone 側の応答文に依存するため、ここでは「SMSの送信に失敗しました」だけを確認する
# 確認: 失敗のログは 1 件だけ。送信完了のログ（[失敗]）の行が 2 件目（index 1）に出ないことを、件数の確認で見る。認証の失敗は、再試行の対象外（KintoneApi の isRetryable は 5xx と 429 だけ）のため、後から 2 件目が出ない想定
# 未確認: 「後から 2 件目が出ないこと」は、時間を置いて確認する方法がない（固定の待ちは使わない）。ここでは、失敗の行が出た時点の件数だけを確認する
# 注: 各行は JSON から始まるため、この行で変えたログイン名は、次の行の前に戻る
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "送信先の設定"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/etSendTargetName"
    index: 0
    text: "test-send-target-1"
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/etLoginName"
    direction: DOWN
- runFlow:
    file: common/input-text-field.yaml
    env:
      FIELD_ID: etLoginName
      INPUT_VALUE: "${INVALID_LOGIN_NAME}"
- assertVisible: "${INVALID_LOGIN_NAME}"
- tapOn: "設定を保存"
- takeScreenshot: 2.8-21-invalid-login-send-failure-01
- pressKey: Back
- runFlow: common/enable-log-auto-refresh.yaml
- tapOn:
    id: "com.ssfrontier.smstokintone:id/btnTopOpenLog"
- takeScreenshot: 2.8-21-invalid-login-send-failure-02
- extendedWaitUntil:
    visible: "(?s).*SMSを受信しました.*"
    timeout: 180000
- extendedWaitUntil:
    visible: '(?s)\[失敗\].*SMSの送信に失敗しました.*'
    timeout: 180000
- assertVisible:
    text: '(?s)\[失敗\].*SMSの送信に失敗しました.*'
    index: 0
- assertNotVisible:
    text: '(?s)\[失敗\].*SMSの送信に失敗しました.*'
    index: 1
- takeScreenshot: 2.8-21-invalid-login-send-failure-03

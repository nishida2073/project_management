# 2.7 SMSの検索: 全選択で、選べる SMS のすべてにチェックが入る（テスト仕様書の 2.7 の 7 に対応）
# 前提（フローで設定）: 端末に SMS が 1 件以上ある
# 未確認: 全部のチェックボックスを className と checked で確認する（行ごとに同じ id のため、index を使わない。この Maestro で className が使えるか）
# 未確認: 選べない SMS（抽出が異常で、SMS選択の対象がオフのもの）にチェックが入らないことは、端末の SMS の内容による
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "SMSの検索"
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "検索条件"
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: cbSmsSearchSendNoneOnly
      INDEX: 0
- runFlow:
    file: common/assert-id-unchecked.yaml
    env:
      ID: cbSmsSearchSendNoneOnly
      INDEX: 0
- tapOn: "検索"
- tapOn: "全選択"
- assertVisible:
    className: "android.widget.CheckBox"
    checked: true
- takeScreenshot: 2.7-07-select-all-01

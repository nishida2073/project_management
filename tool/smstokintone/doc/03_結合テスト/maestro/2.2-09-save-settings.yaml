# 2.2 送信先の設定: 設定を保存する（テスト仕様書の 2.2 の 9 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "送信先の設定"
- takeScreenshot: 2.2-09-save-settings-01
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "設定を追加"
- runFlow:
    file: common/scroll-down-and-assert-field-text.yaml
    env:
      ID: etSendTargetName
      INDEX: 0
      TEXT: "test-send-target-1"
- runFlow:
    file: common/scroll-down-to-id.yaml
    env:
      ID: etSendTargetName
- runFlow:
    file: common/input-text-field.yaml
    env:
      ID: etSendTargetName
      INDEX: 0
      VALUE: "${SAVED_SEND_TARGET_NAME}"
- takeScreenshot: 2.2-09-save-settings-02
- runFlow:
    file: common/scroll-down-to-id.yaml
    env:
      ID: etKeyword
- runFlow:
    file: common/input-text-field.yaml
    env:
      ID: etKeyword
      INDEX: 0
      VALUE: "${SAVED_KEYWORD}"
- takeScreenshot: 2.2-09-save-settings-03
- runFlow:
    file: common/scroll-down-to-id.yaml
    env:
      ID: etSubdomain
- runFlow:
    file: common/input-text-field.yaml
    env:
      ID: etSubdomain
      INDEX: 0
      VALUE: "${SUBDOMAIN}"
- takeScreenshot: 2.2-09-save-settings-04
- runFlow:
    file: common/scroll-down-to-id.yaml
    env:
      ID: etLoginName
- runFlow:
    file: common/input-text-field.yaml
    env:
      ID: etLoginName
      INDEX: 0
      VALUE: "${LOGIN_NAME}"
- takeScreenshot: 2.2-09-save-settings-05
- runFlow:
    file: common/scroll-down-to-id.yaml
    env:
      ID: etLoginPassword
- runFlow:
    file: common/input-password-field.yaml
    env:
      ID: etLoginPassword
      VALUE: "${LOGIN_PASSWORD}"
- takeScreenshot: 2.2-09-save-settings-06
# 確認: パスワードは伏せ字で表示される（スクリーンショット 06 で目視）。欄の値は Maestro からも読めるため、文字での否定の確認はしない
- runFlow:
    file: common/scroll-down-to-id.yaml
    env:
      ID: etAppId
- runFlow:
    file: common/input-text-field.yaml
    env:
      ID: etAppId
      INDEX: 0
      VALUE: "${APP_ID}"
- takeScreenshot: 2.2-09-save-settings-07
- tapOn: "設定を保存"
- takeScreenshot: 2.2-09-save-settings-08
# Google パスワード マネージャーの保存の確認が出たときだけ「後で」を押す
- tapOn:
    text: "後で"
    optional: true
# 確認: 保存後にトップ画面に戻る（「設定を保存しました」のトーストは短時間で消えるため、確認しない）
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "SMSの送信モード"
- assertNotVisible: "設定を追加"
- takeScreenshot: 2.2-09-save-settings-09

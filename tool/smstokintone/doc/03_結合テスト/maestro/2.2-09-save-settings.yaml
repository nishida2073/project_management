# 2.2 送信先の設定: 設定を保存する（テスト仕様書の 2.2 の 9 に対応）
appId: com.ssfrontier.smstokintone
---
# 前提: 仕様書 2.2 の前提条件（test-send-target-1 が保存済み。このフローで上書きする）
# 未確認: パスワードは伏せ字のため、入力の有無だけを撮影で確かめる
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "送信先の設定"
- takeScreenshot: 2.2-09-save-settings-01
- assertVisible: "設定を追加"
# 前提確認: test-send-target-1 が 1 件目に保存済み
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/etSendTargetName"
    index: 0
    text: "test-send-target-1"
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/etSendTargetName"
    direction: DOWN
    visibilityPercentage: 100
- runFlow:
    file: common/input-text-field.yaml
    env:
      FIELD_ID: etSendTargetName
      INPUT_VALUE: "${SAVED_SEND_TARGET_NAME}"
- takeScreenshot: 2.2-09-save-settings-02
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/etKeyword"
    direction: DOWN
    visibilityPercentage: 100
- runFlow:
    file: common/input-text-field.yaml
    env:
      FIELD_ID: etKeyword
      INPUT_VALUE: "${SAVED_KEYWORD}"
- takeScreenshot: 2.2-09-save-settings-03
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/etSubdomain"
    direction: DOWN
    visibilityPercentage: 100
- runFlow:
    file: common/input-text-field.yaml
    env:
      FIELD_ID: etSubdomain
      INPUT_VALUE: "${SUBDOMAIN}"
- takeScreenshot: 2.2-09-save-settings-04
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/etLoginName"
    direction: DOWN
    visibilityPercentage: 100
- runFlow:
    file: common/input-text-field.yaml
    env:
      FIELD_ID: etLoginName
      INPUT_VALUE: "${LOGIN_NAME}"
- takeScreenshot: 2.2-09-save-settings-05
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/etLoginPassword"
    direction: DOWN
    visibilityPercentage: 100
- runFlow:
    file: common/input-password-field.yaml
    env:
      FIELD_ID: etLoginPassword
      INPUT_VALUE: "${LOGIN_PASSWORD}"
- takeScreenshot: 2.2-09-save-settings-06
# 未確認: パスワードは伏せ字で表示されるため、入力した文字列が画面の文字として読めないこと（伏せ字の確認）
- assertNotVisible: "${LOGIN_PASSWORD}"
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/etAppId"
    direction: DOWN
    visibilityPercentage: 100
- runFlow:
    file: common/input-text-field.yaml
    env:
      FIELD_ID: etAppId
      INPUT_VALUE: "${APP_ID}"
- takeScreenshot: 2.2-09-save-settings-07
- tapOn: "設定を保存"
- takeScreenshot: 2.2-09-save-settings-08
- assertVisible: "設定を保存しました"
- assertVisible: "送信先の設定"
- assertNotVisible: "設定を追加"
- takeScreenshot: 2.2-09-save-settings-09

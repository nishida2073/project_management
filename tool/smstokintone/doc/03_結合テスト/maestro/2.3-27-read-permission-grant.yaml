# 2.3 アプリの設定: SMSの読み取りの「許可する（SMSの読み取り）」を押すと、SMSの読み取りが許可済みになる（テスト仕様書の 2.3 の 27 に対応）
# 前提（フローで設定）: 起動時にSMSの読み取りを許可しない（この flow だけ、launchApp の permissions で拒否する）
# 外部条件: エミュレーターでは、「許可する（SMSの読み取り）」を押すと、ダイアログを出さずに許可される。実機でダイアログが出る場合は、許可ボタンを押す手順が必要（未確認）
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp:
    permissions:
      all: allow
      android.permission.READ_SMS: deny
- tapOn: "アプリの設定"
- runFlow:
    file: common/scroll-down-to-id.yaml
    env:
      ID: btnRequestReadPermission
- runFlow:
    file: common/assert-id-visible.yaml
    env:
      ID: btnRequestReadPermission
      INDEX: 0
- takeScreenshot: 2.3-27-read-permission-grant-01
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: btnRequestReadPermission
      INDEX: 0
- runFlow:
    file: common/scroll-down-and-assert-field-text.yaml
    env:
      ID: tvReadPermissionStatus
      INDEX: 0
      TEXT: "許可済み"
- takeScreenshot: 2.3-27-read-permission-grant-02

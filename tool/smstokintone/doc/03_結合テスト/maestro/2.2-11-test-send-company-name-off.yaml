# 2.2 送信先の設定: 会社名の抽出が無効のときテスト送信する（テスト仕様書の 2.2 の 11 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（フローで設定）: この flow の中で会社名の抽出を無効にしてからテスト送信する
# 外部条件: kintone 接続と SMS 受信が必要
# 未確認: 日本語の入力は Maestro の IME の制約で行えないため、英数字の TEST_BODY で代用している。
# 注: テスト本文の入力欄は、直前のタップでフォーカスされてから eraseText で消す（SendTargetSettingsActivity.kt:228-235）。
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- takeScreenshot: 2.2-11-test-send-company-name-off-01
- runFlow:
    file: common/scroll-down-to-id.yaml
    env:
      ID: swCompanyNameExtractionEnabled
- runFlow:
    file: common/assert-id-checked.yaml
    env:
      ID: swCompanyNameExtractionEnabled
      INDEX: 0
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: swCompanyNameExtractionEnabled
      INDEX: 0
- takeScreenshot: 2.2-11-test-send-company-name-off-02
- runFlow:
    file: common/assert-id-unchecked.yaml
    env:
      ID: swCompanyNameExtractionEnabled
      INDEX: 0
- pressKey: Back
- takeScreenshot: 2.2-11-test-send-company-name-off-03
- tapOn: "送信先の設定"
- takeScreenshot: 2.2-11-test-send-company-name-off-04
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "設定を追加"
- runFlow:
    file: common/scroll-down-and-assert-field-text.yaml
    env:
      ID: etSendTargetName
      INDEX: 0
      TEXT: "test-send-target-1"
- scrollUntilVisible:
    element:
      text: "^テスト送信$"
    direction: DOWN
- runFlow:
    file: common/tap-text.yaml
    env:
      TEXT: "^テスト送信$"
      INDEX: 0
- takeScreenshot: 2.2-11-test-send-company-name-off-05
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "テスト本文"
- runFlow:
    file: common/tap-text-at-point.yaml
    env:
      TEXT: "(?s).*テスト太郎.*"
      POINT: "95%, 95%"
- eraseText: 200
- inputText: "${TEST_BODY}"
- takeScreenshot: 2.2-11-test-send-company-name-off-06
- hideKeyboard
- tapOn: "送信"
- takeScreenshot: 2.2-11-test-send-company-name-off-07
- extendedWaitUntil:
    visible: ".*テスト結果.*"
    timeout: 30000
- assertNotVisible: ".*送信先エラー.*"
- takeScreenshot: 2.2-11-test-send-company-name-off-08

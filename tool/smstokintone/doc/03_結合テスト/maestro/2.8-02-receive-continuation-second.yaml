# 2.8 自動処理: 同じ送信元の 2 通目は、1 通目の引継ぎ内容で振り分けられる（テスト仕様書の 2.8 の 2 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 外部条件: 別端末から SMS を送る。1 通目は送信元 0312345801、本文は 1 行目「test-company」、2 行目「test-taro」、3 行目「body-test-1」。2 通目は同じ送信元、本文は 1 行目「test-company」、2 行目「test-taro」、3 行目「body-test-2」
# 前提（フローで設定）: （この行の中で行う）: 1 通目を受信してから、2 通目を受信する。各受信の結果は、ログの画面で待つ
- runFlow: setup/setup-import-environment.yaml
- launchApp
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: btnTopOpenLog
      INDEX: 0
- takeScreenshot: 2.8-02-receive-continuation-second-01
- extendedWaitUntil:
    visible: "(?s).*SMSの(登録|更新)に成功しました.*"
    timeout: 180000
- takeScreenshot: 2.8-02-receive-continuation-second-02
- extendedWaitUntil:
    visible: "(?s).*SMSの更新に成功しました.*"
    timeout: 180000
- extendedWaitUntil:
    visible: "(?s).*SMSの更新に成功しました.*"
    timeout: 180000
- takeScreenshot: 2.8-02-receive-continuation-second-03

# 2.2 送信先の設定: 統合範囲の入力欄を有効にする（テスト仕様書の 2.2 の 6 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 注: 統合範囲（時間）の初期値は 5（SettingsStore.kt:275, AppDefaults.kt:79）。空欄のまま保存すると 5 になるため、空の判定は行わない。
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "送信先の設定"
- takeScreenshot: 2.2-06-enable-tolerance-hours-01
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "設定を追加"
- runFlow:
    file: common/scroll-down-by-id.yaml
    env:
      ID: rbUpdateToleranceModeSameDate
- runFlow:
    file: common/assert-checked-by-id.yaml
    env:
      ID: rbUpdateToleranceModeSameDate
      INDEX: 0
- runFlow:
    file: common/scroll-down-and-tap-by-id.yaml
    env:
      ID: rbUpdateToleranceModeHours
      INDEX: 0
- takeScreenshot: 2.2-06-enable-tolerance-hours-02
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/etUpdateToleranceHours"
    index: 0
    enabled: true
- runFlow:
    file: common/scroll-down-by-id.yaml
    env:
      ID: etUpdateToleranceHours
- runFlow:
    file: common/input-text-by-id.yaml
    env:
      ID: etUpdateToleranceHours
      INDEX: 0
      VALUE: "${TOLERANCE_HOURS_INPUT}"
- takeScreenshot: 2.2-06-enable-tolerance-hours-03

# 2.2 送信先の設定: 統合範囲の入力欄を有効にする（テスト仕様書の 2.2 の 6 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 未確認: 統合範囲が空であることは確認していない（空の判定が未確認）
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "送信先の設定"
- takeScreenshot: 2.2-06-enable-tolerance-hours-01
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "設定を追加"
- runFlow:
    file: common/scroll-down-to-id.yaml
    env:
      ID: rbUpdateToleranceModeSameDate
- runFlow:
    file: common/assert-id-checked.yaml
    env:
      ID: rbUpdateToleranceModeSameDate
      INDEX: 0
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: rbUpdateToleranceModeHours
      INDEX: 0
- takeScreenshot: 2.2-06-enable-tolerance-hours-02
- runFlow:
    file: common/assert-id-visible.yaml
    env:
      ID: etUpdateToleranceHours
      INDEX: 0
    enabled: true
- runFlow:
    file: common/scroll-down-to-id.yaml
    env:
      ID: etUpdateToleranceHours
- runFlow:
    file: common/input-text-field.yaml
    env:
      ID: etUpdateToleranceHours
      INDEX: 0
      VALUE: "${TOLERANCE_HOURS_INPUT}"
- takeScreenshot: 2.2-06-enable-tolerance-hours-03

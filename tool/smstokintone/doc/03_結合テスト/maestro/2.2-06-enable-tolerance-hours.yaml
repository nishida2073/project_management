# 2.2 送信先の設定: 統合範囲の入力欄を有効にする（テスト仕様書の 2.2 の 6 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 未確認: 統合範囲が空であることは確認していない（空の判定が未確認）
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "送信先の設定"
- takeScreenshot: 2.2-06-enable-tolerance-hours-01
- assertVisible: "設定を追加"
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: rbUpdateToleranceModeSameDate
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/rbUpdateToleranceModeSameDate"
    index: 0
    checked: true
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: rbUpdateToleranceModeHours
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/rbUpdateToleranceModeHours"
- takeScreenshot: 2.2-06-enable-tolerance-hours-02
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/etUpdateToleranceHours"
    enabled: true
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: etUpdateToleranceHours
- runFlow:
    file: common/input-number-field.yaml
    env:
      FIELD_ID: etUpdateToleranceHours
      INPUT_VALUE: "${TOLERANCE_HOURS_INPUT}"
- takeScreenshot: 2.2-06-enable-tolerance-hours-03

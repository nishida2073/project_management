# 2.3 アプリの設定: 本文の表示文字数を入力する（テスト仕様書の 2.3 の 18 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- runFlow:
    file: common/scroll-up-by-id.yaml
    env:
      ID: rbThemeLight
- takeScreenshot: 2.3-18-log-body-excerpt-save-01
- runFlow:
    file: common/scroll-down-by-id.yaml
    env:
      ID: etLogBodyExcerptLength
- takeScreenshot: 2.3-18-log-body-excerpt-save-02
- runFlow:
    file: common/input-text-by-id.yaml
    env:
      ID: etLogBodyExcerptLength
      INDEX: 0
      VALUE: "${LOG_BODY_EXCERPT_LENGTH}"
- takeScreenshot: 2.3-18-log-body-excerpt-save-03
- runFlow:
    file: common/scroll-down-and-assert-text-by-id.yaml
    env:
      ID: etLogBodyExcerptLength
      INDEX: 0
      TEXT: "${LOG_BODY_EXCERPT_LENGTH}"
- takeScreenshot: 2.3-18-log-body-excerpt-save-04

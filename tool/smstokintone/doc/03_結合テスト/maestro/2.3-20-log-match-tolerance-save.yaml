# 2.3 アプリの設定: 統合範囲（秒）を入力する（テスト仕様書の 2.3 の 20 に対応）
appId: com.ssfrontier.smstokintone
---
# 前提: JSON（env_ok.json）の状態から開始する（統合範囲（秒）：15（JSON の logMatchToleranceSeconds）、表示テーマ：ライト、SMSの送信モード：自動）。このフローで統合範囲（秒）を入力する。
- launchApp
- tapOn: "アプリの設定"
- takeScreenshot: 2.3-20-log-match-tolerance-save-01
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/etLogMatchToleranceSeconds"
    direction: DOWN
    visibilityPercentage: 100
- takeScreenshot: 2.3-20-log-match-tolerance-save-02
- tapOn:
    id: "com.ssfrontier.smstokintone:id/etLogMatchToleranceSeconds"
    index: 0
    point: "95%, 50%"
- takeScreenshot: 2.3-20-log-match-tolerance-save-03
- eraseText: 50
- takeScreenshot: 2.3-20-log-match-tolerance-save-04
- inputText: "${LOG_MATCH_TOLERANCE_SECONDS}"
- takeScreenshot: 2.3-20-log-match-tolerance-save-05
- hideKeyboard
- assertVisible: "${LOG_MATCH_TOLERANCE_SECONDS}" # 未確認: 数字は他の表示と一致する可能性がある
- takeScreenshot: 2.3-20-log-match-tolerance-save-06

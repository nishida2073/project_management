# 2.8 自動処理: 全角の会社名も表記ゆれとして、キーワードに一致する（テスト仕様書の 2.8 の 10 に対応）
appId: com.ssfrontier.smstokintone
---
# 前提（JSON）: 既定値（2.8 の 1 と同じ）
# 前提（フローで設定）: 会社名の自動変換を無効にする（全角の会社名をそのまま判定する）
# 外部条件（事前に別端末から SMS を送る）: 送信元 test-phone-a、本文は 1 行目「ＴＥＳＴ－ＣＯＭＰＡＮＹ」（全角）、2 行目「test-taro」、3 行目「body-test」。待ち時間（下の extendedWaitUntil）に送る
# 注: 全角の会社名（ＴＥＳＴ－ＣＯＭＰＡＮＹ）は、表記ゆれの正規化で test-company と一致する（TextNormalization）
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/swCompanyNameAutoConversionEnabled"
    direction: DOWN
    visibilityPercentage: 100
- tapOn:
    id: "com.ssfrontier.smstokintone:id/swCompanyNameAutoConversionEnabled"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/swCompanyNameAutoConversionEnabled"
    checked: false
- pressKey: Back
- runFlow: common/enable-log-auto-refresh.yaml
- tapOn:
    id: "com.ssfrontier.smstokintone:id/btnTopOpenLog"
- takeScreenshot: 2.8-10-fullwidth-company-match-01
- extendedWaitUntil:
    visible: "(?s).*SMSを受信しました.*"
    timeout: 180000
- assertVisible: "(?s).*SMSの登録に成功しました.*"
- takeScreenshot: 2.8-10-fullwidth-company-match-02

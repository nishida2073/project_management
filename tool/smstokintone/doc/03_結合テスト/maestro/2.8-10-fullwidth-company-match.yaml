# 2.8 自動処理: 全角の会社名も表記ゆれとして、キーワードに一致する（テスト仕様書の 2.8 の 10 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（フローで設定）: 会社名の自動変換を無効にする（全角の会社名をそのまま判定する）
# 外部条件: 別端末から SMS を送る。送信元 test-phone-a、本文は 1 行目「ＴＥＳＴ－ＣＯＭＰＡＮＹ」（全角）、2 行目「test-taro」、3 行目「body-test」。待ち時間（下の extendedWaitUntil）に送る
# 注: 全角の会社名（ＴＥＳＴ－ＣＯＭＰＡＮＹ）は、表記ゆれの正規化で test-company と一致する（TextNormalization）
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: swCompanyNameAutoConversionEnabled
      INDEX: 0
- runFlow:
    file: common/assert-id-unchecked.yaml
    env:
      ID: swCompanyNameAutoConversionEnabled
      INDEX: 0
- pressKey: Back
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: btnTopOpenLog
      INDEX: 0
- takeScreenshot: 2.8-10-fullwidth-company-match-01
- extendedWaitUntil:
    visible: "(?s).*SMSを受信しました.*"
    timeout: 180000
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "(?s).*SMSの登録に成功しました.*"
- takeScreenshot: 2.8-10-fullwidth-company-match-02

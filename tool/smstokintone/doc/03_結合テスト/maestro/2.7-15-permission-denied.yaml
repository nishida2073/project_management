# 2.7 SMSの検索: SMSの読み取りが許可されていないと、検索の欄は表示されない（テスト仕様書の 2.7 の 15 に対応）
# 前提（フローで設定）: SMS の読み取りは許可しない
# 前提（フローで設定）: 起動時に SMSの読み取りを許可しない（launchApp の permissions で拒否する）
# 注: 検索の欄（layoutSearchForm）は、許可がないとき非表示になる（SmsSearchActivity の実装）
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp:
    permissions:
      all: allow
      android.permission.READ_SMS: deny
- tapOn: "SMSの検索"
- runFlow:
    file: common/assert-id-not-visible.yaml
    env:
      ID: layoutSearchForm
      INDEX: 0
- takeScreenshot: 2.7-15-permission-denied-01

# 2.3 アプリの設定: 会社名の抽出を有効にすると注意ダイアログが出ることを確認する（テスト仕様書の 2.3 の 9 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 注: ok-continuation-no-company.json は、会社名の抽出が有効だと会社名がない引継ぎ内容があるためインポートの検証で止まる。そのため会社名の抽出を無効にした状態で投入する（JSON の値）
# 前提（フロー）: setup の SETUP_FILE_PATTERN で、この JSON だけを投入する（setup は clearState で前の設定を消してから投入する）
# 外部条件: ${COMPANY_MISSING_COUNT} 件（ok-continuation-no-company.json の件数と一致させる）
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- runFlow:
    file: common/scroll-up-to-setting.yaml
    env:
      ELEMENT_ID: rbThemeLight
- takeScreenshot: 2.3-09-company-name-extraction-on-warning-01
- assertVisible: "端末の許可"
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: swCompanyNameExtractionEnabled
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/swCompanyNameExtractionEnabled"
    checked: false
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: swCompanyNameExtractionEnabled
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/swCompanyNameExtractionEnabled"
- assertVisible: "注意"
- assertVisible: "引継ぎ内容に会社名がない件が ${COMPANY_MISSING_COUNT} 件あります。必要に応じて会社名を追加してください。"
- takeScreenshot: 2.3-09-company-name-extraction-on-warning-02
- tapOn: "OK" # 未確認: OK ボタンの文言（端末の言語で変わる場合あり）
- takeScreenshot: 2.3-09-company-name-extraction-on-warning-03
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: swCompanyNameExtractionEnabled
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/swCompanyNameExtractionEnabled"
    checked: true
- takeScreenshot: 2.3-09-company-name-extraction-on-warning-04

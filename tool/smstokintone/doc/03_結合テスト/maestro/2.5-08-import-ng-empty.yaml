# 2.5 設定のインポート・エクスポート: 空のファイルを選ぶ（テスト仕様書の 2.5 の 8 に対応）
appId: com.ssfrontier.smstokintone
---
# 前提: ${IMPORT_FILE} を端末の選択先に置く（ファイルの置き場所は未確認）。clearState は使わない。
# 未確認: launchApp が前の画面を閉じて起動し直すか
- launchApp
- tapOn: "設定のインポート・エクスポート"
- tapOn: "ファイルを選択"
# 未確認: 文書選択ダイアログ（Documents UI）の操作は公式ドキュメントで確認できなかった
- tapOn: "${IMPORT_FILE}"
- assertVisible: "インポートエラー"
- assertVisible: "ファイルを読み込めませんでした"
- tapOn: "OK"   # 未確認: エラーダイアログの OK ボタンの文字
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/btnImportSettings"
    enabled: false
- takeScreenshot: 2.5-08-after-error

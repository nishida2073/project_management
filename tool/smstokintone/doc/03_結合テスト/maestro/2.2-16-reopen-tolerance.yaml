# 2.2 送信先の設定: 統合条件と統合範囲を開き直して確認する（テスト仕様書の 2.2 の 16 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（フローで設定）: この flow の中で、統合条件を時間、統合範囲を 6 にして保存してから、開き直して確認する
# 注: 別の flow を runFlow で呼ぶと、その中の setup（clearState）で保存値が消えるため、入力は common の手順を直接呼ぶ
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "送信先の設定"
- takeScreenshot: 2.2-16-reopen-tolerance-01
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "設定を追加"
- runFlow:
    file: common/scroll-down-to-id.yaml
    env:
      ID: rbUpdateToleranceModeHours
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: rbUpdateToleranceModeHours
      INDEX: 0
- runFlow:
    file: common/assert-id-visible.yaml
    env:
      ID: etUpdateToleranceHours
      INDEX: 0
    enabled: true
- runFlow:
    file: common/scroll-down-to-id.yaml
    env:
      ID: etUpdateToleranceHours
- runFlow:
    file: common/input-text-field.yaml
    env:
      ID: etUpdateToleranceHours
      INDEX: 0
      VALUE: "${TOLERANCE_HOURS_SAVED}"
- tapOn: "設定を保存"
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "SMSの送信モード"
- takeScreenshot: 2.2-16-reopen-tolerance-02
- tapOn: "送信先の設定"
- takeScreenshot: 2.2-16-reopen-tolerance-03
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "設定を追加"
- runFlow:
    file: common/scroll-down-to-id.yaml
    env:
      ID: rbUpdateToleranceModeHours
- runFlow:
    file: common/assert-id-checked.yaml
    env:
      ID: rbUpdateToleranceModeHours
      INDEX: 0
- runFlow:
    file: common/scroll-down-and-assert-field-text.yaml
    env:
      ID: etUpdateToleranceHours
      INDEX: 0
      TEXT: "${TOLERANCE_HOURS_SAVED}"
- takeScreenshot: 2.2-16-reopen-tolerance-04

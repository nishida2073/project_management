# 2.4 引継ぎ内容の設定: 会社名が空で保存すると入力エラーになる（テスト仕様書の 2.4 の 9 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（JSON）: test-data/setup/env_ok.json を投入した直後の状態。送信元 test-sender-a（古い）と test-sender-b（新しい）、送信先 test-send-target-1（振り分け: test-company）、会社名の抽出: あり、引継ぎ内容の氏名表示: あり。
# 前提（この flow で設定）: 最初に setup/setup-import-environment.yaml で JSON を投入し直し、前の flow の変更（削除など）を戻す。表示順序は投入後の既定（古い順）。
# 前提（画面で確認不可）: 会社名の抽出は有効（JSON の値）。
# 未確認: 送信元 A（一覧の index 0）の会社名欄の既存値は eraseText で消す（カーソル位置に依存する）。
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- takeScreenshot: 2.4-09-save-error-company-empty-01
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/btnEditContinuationInfo"
    direction: DOWN
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/btnEditContinuationInfo"
- takeScreenshot: 2.4-09-save-error-company-empty-02
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/etContinuationSearch"
# 前提確認（表示のみ、操作しない）
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/rbContinuationSortAscending"
    checked: true
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/etContinuationCompanyName"
    index: 0
    point: "95%, 50%"
- takeScreenshot: 2.4-09-save-error-company-empty-03
- eraseText: 50  # 未確認
- hideKeyboard
- tapOn: "設定を保存"
- takeScreenshot: 2.4-09-save-error-company-empty-04
- assertVisible: "入力エラー"
# 未確認: ダイアログのメッセージ（会社名・氏名は必須です）。regex は未確認。
- assertVisible: "(?s).*引継ぎ内容: ${SENDER_A}.*会社名・氏名は必須です.*"
- pressKey: Back
- takeScreenshot: 2.4-09-save-error-company-empty-05
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/etContinuationSearch"
- takeScreenshot: 2.4-09-save-error-company-empty-06

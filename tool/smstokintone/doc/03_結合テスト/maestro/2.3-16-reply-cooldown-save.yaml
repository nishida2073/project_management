# 2.3 アプリの設定: 自動返信の間隔を入力する（テスト仕様書の 2.3 の 16 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/rbThemeLight"
    direction: UP
    visibilityPercentage: 100
    timeout: 60000
- takeScreenshot: 2.3-16-reply-cooldown-save-01
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: rbSmsReplyModeAuto
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/rbSmsReplyModeAuto"
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/rbSmsReplyModeAuto"
    checked: true
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: etReplyCooldownSeconds
- takeScreenshot: 2.3-16-reply-cooldown-save-02
- runFlow:
    file: common/input-number-field.yaml
    env:
      FIELD_ID: etReplyCooldownSeconds
      INPUT_VALUE: "${REPLY_COOLDOWN_SECONDS}"
- takeScreenshot: 2.3-16-reply-cooldown-save-03
- assertVisible: "${REPLY_COOLDOWN_SECONDS}" # 未確認: 数字は他の表示と一致する可能性がある
- takeScreenshot: 2.3-16-reply-cooldown-save-04

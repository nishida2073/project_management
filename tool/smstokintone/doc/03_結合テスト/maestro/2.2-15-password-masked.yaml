# 2.2 送信先の設定: パスワードを伏せて表示する（テスト仕様書の 2.2 の 15 に対応）
appId: com.ssfrontier.smstokintone
---
# 前提: 仕様書 2.2 の前提条件（test-send-target-1 が保存済み）
- launchApp
- tapOn: "送信先の設定"
- takeScreenshot: 2.2-15-password-masked-01
- assertVisible: "設定を追加"
# 前提確認: test-send-target-1 が 1 件目に保存済み
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/etSendTargetName"
    index: 0
    text: "test-send-target-1"
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/etLoginPassword"
    direction: DOWN
- runFlow:
    file: common/input-password-field.yaml
    env:
      FIELD_ID: etLoginPassword
      INPUT_VALUE: "${LOGIN_PASSWORD}"
- assertNotVisible: "${LOGIN_PASSWORD}"
# 未確認: 伏せ字の判定（平文が画面に出ないこと）は、マスクの表示方法によっては判定できない
- takeScreenshot: 2.2-15-password-masked-02

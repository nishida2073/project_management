# 2.3 アプリの設定: 表示内容の確認（テスト仕様書の 2.3 の 1 に対応）
appId: com.ssfrontier.smstokintone
---
# 前提（JSON）: 表示テーマ：ライト、SMSの送信モード：自動、SMSの返信モード：手動、自動送信の対象（抽出状況が異常）：なし、会社名の抽出：あり、会社名の自動変換：あり、AIによる抽出：なし、引継ぎ：あり、引継ぎの範囲：制限なし、引継ぎ内容の氏名表示：あり、自動返信の間隔：10 秒、統合範囲（秒）：15
# 前提（フローで設定）: なし（表示の確認だけを行う）。JSON にない項目（検索条件の表示など）は、アプリの既定値とする
- runFlow: setup/setup-import-environment.yaml
- launchApp
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/tvTopSendStatus"
    text: "自動"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/tvTopReplyStatus"
    text: "手動"
- tapOn: "アプリの設定"
- takeScreenshot: 2.3-01-app-settings-display-01
- assertVisible: "端末の許可"
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/rbThemeLight"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/rbThemeLight"
    checked: true
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/rbSendAuto"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/rbSendAuto"
    checked: true
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/rbSmsReplyModeManual"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/rbSmsReplyModeManual"
    checked: true
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/etReplyCooldownSeconds"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/etReplyCooldownSeconds"
    text: "${REPLY_COOLDOWN_SECONDS}"
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/etSmsSearchDateRangeDays"
    direction: UP
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/etSmsSearchDateRangeDays"
    text: "${SEARCH_DATE_RANGE_DAYS}"
# 送信先が 1 件のとき、検索の送信先の選択欄は表示されない（実装どおり）
- assertNotVisible:
    id: "com.ssfrontier.smstokintone:id/llDefaultSendTargetFilter"
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/rbSearchFiltersVisible"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/rbSearchFiltersVisible"
    checked: true
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/cbSearchSendNoneOnlyEnabled"
    direction: UP
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/cbSearchSendNoneOnlyEnabled"
    checked: false
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/cbSearchSentAutoOnlyEnabled"
    checked: false
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/cbSearchSentManualOnlyEnabled"
    checked: false
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/cbSearchExtractionSucceededOnlyEnabled"
    checked: false
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/cbSearchExtractionFailedOnlyEnabled"
    checked: false
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/swSearchExtractionFailedEnabled"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/swSearchExtractionFailedEnabled"
    checked: false
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/swSendExtractionFailedEnabled"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/swSendExtractionFailedEnabled"
    checked: false
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/swCompanyNameExtractionEnabled"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/swCompanyNameExtractionEnabled"
    checked: true
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/swCompanyNameAutoConversionEnabled"
    checked: true
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/swAiExtractionEnabled"
    checked: false
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/swContinuationEnabled"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/swContinuationEnabled"
    checked: true
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/rbContinuationScopeUnlimited"
    checked: true
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/swContinuationShowUserNameEnabled"
    checked: true
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/swLogRefreshEnabled"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/swLogRefreshEnabled"
    checked: true
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/etLogRefreshInterval"
    text: "${LOG_REFRESH_INTERVAL}"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/etLogMatchToleranceSeconds"
    text: "${LOG_MATCH_TOLERANCE_SECONDS}"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/etLogBodyExcerptLength"
    text: "${LOG_BODY_EXCERPT_LENGTH}"
- takeScreenshot: 2.3-01-app-settings-display-02

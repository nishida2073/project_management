# 2.3 アプリの設定: アプリの設定の画面の表示内容を確認する（テスト仕様書の 2.3 の 1 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# JSON にない項目（検索条件の表示など）は、アプリの既定値とする
- runFlow: setup/setup-import-environment.yaml
- launchApp
- runFlow:
    file: common/scroll-down-and-assert-field-text.yaml
    env:
      ID: tvTopSendStatus
      INDEX: 0
      TEXT: "自動"
- runFlow:
    file: common/scroll-down-and-assert-field-text.yaml
    env:
      ID: tvTopReplyStatus
      INDEX: 0
      TEXT: "手動"
- tapOn: "アプリの設定"
- runFlow:
    file: common/scroll-up-to-id.yaml
    env:
      ID: rbThemeLight
- takeScreenshot: 2.3-01-app-settings-display-01
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "端末の許可"
- runFlow:
    file: common/scroll-down-to-id.yaml
    env:
      ID: rbThemeLight
- runFlow:
    file: common/assert-id-checked.yaml
    env:
      ID: rbThemeLight
      INDEX: 0
- runFlow:
    file: common/scroll-down-and-assert-field-text.yaml
    env:
      ID: etSmsSearchDateRangeDays
      INDEX: 0
      TEXT: "${SEARCH_DATE_RANGE_DAYS}"
# 送信先が 1 件のとき、検索の送信先の選択欄は表示されない（実装どおり）
- runFlow:
    file: common/assert-id-not-visible.yaml
    env:
      ID: llDefaultSendTargetFilter
      INDEX: 0
- runFlow:

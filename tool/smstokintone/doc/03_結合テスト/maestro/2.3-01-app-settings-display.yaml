# 2.3 アプリの設定: 表示内容の確認（テスト仕様書の 2.3 の 1 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# JSON にない項目（検索条件の表示など）は、アプリの既定値とする
- runFlow: setup/setup-import-environment.yaml
- launchApp
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: tvTopSendStatus
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/tvTopSendStatus"
    text: "自動"
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: tvTopReplyStatus
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/tvTopReplyStatus"
    text: "手動"
- tapOn: "アプリの設定"
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/rbThemeLight"
    direction: UP
    visibilityPercentage: 100
    timeout: 60000
- takeScreenshot: 2.3-01-app-settings-display-01
- assertVisible: "端末の許可"
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/rbThemeLight"
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/rbThemeLight"
    checked: true
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: etSmsSearchDateRangeDays
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/etSmsSearchDateRangeDays"
    text: "${SEARCH_DATE_RANGE_DAYS}"
# 送信先が 1 件のとき、検索の送信先の選択欄は表示されない（実装どおり）
- assertNotVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/llDefaultSendTargetFilter"
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: cbSearchSendNoneOnlyEnabled
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/cbSearchSendNoneOnlyEnabled"
    checked: false
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: cbSearchSentAutoOnlyEnabled
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/cbSearchSentAutoOnlyEnabled"
    checked: false
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: cbSearchSentManualOnlyEnabled
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/cbSearchSentManualOnlyEnabled"
    checked: false
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: cbSearchExtractionSucceededOnlyEnabled
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/cbSearchExtractionSucceededOnlyEnabled"
    checked: false
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: cbSearchExtractionFailedOnlyEnabled
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/cbSearchExtractionFailedOnlyEnabled"
    checked: false
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: rbSearchFiltersVisible
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/rbSearchFiltersVisible"
    checked: true
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: swSearchExtractionFailedEnabled
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/swSearchExtractionFailedEnabled"
    checked: false
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: rbSendAuto
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/rbSendAuto"
    checked: true
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: swSendExtractionFailedEnabled
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/swSendExtractionFailedEnabled"
    checked: false
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: rbSmsReplyModeManual
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/rbSmsReplyModeManual"
    checked: true
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: etReplyCooldownSeconds
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/etReplyCooldownSeconds"
    text: "${REPLY_COOLDOWN_SECONDS}"
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: swCompanyNameExtractionEnabled
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/swCompanyNameExtractionEnabled"
    checked: true
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: swCompanyNameAutoConversionEnabled
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/swCompanyNameAutoConversionEnabled"
    checked: true
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: swAiExtractionEnabled
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/swAiExtractionEnabled"
    checked: false
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: swContinuationEnabled
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/swContinuationEnabled"
    checked: true
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: rbContinuationScopeUnlimited
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/rbContinuationScopeUnlimited"
    checked: true
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: swContinuationShowUserNameEnabled
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/swContinuationShowUserNameEnabled"
    checked: true
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: swLogRefreshEnabled
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/swLogRefreshEnabled"
    checked: true
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: etLogRefreshInterval
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/etLogRefreshInterval"
    text: "${LOG_REFRESH_INTERVAL}"
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: etLogMatchToleranceSeconds
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/etLogMatchToleranceSeconds"
    text: "${LOG_MATCH_TOLERANCE_SECONDS}"
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: etLogBodyExcerptLength
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/etLogBodyExcerptLength"
    text: "${LOG_BODY_EXCERPT_LENGTH}"
- takeScreenshot: 2.3-01-app-settings-display-02

# 2.5 設定のインポート・エクスポート: 引継ぎ内容の1件目に送信元がないファイルを選ぶ（テスト仕様書の 2.5 の 10 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 未確認: launchApp が前の画面を閉じて起動し直すか
# 外部条件: ${IMPORT_FILE} を端末の選択先に置く（ファイルの置き場所は未確認）。
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "設定のインポート・エクスポート"
- takeScreenshot: 2.5-10-import-ng-continuation-sender-missing-01
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "設定のインポート・エクスポート"
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "ファイルを選択"
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "ファイルが選択されていません"
- runFlow:
    file: common/assert-id-visible.yaml
    env:
      ID: btnImportSettings
      INDEX: 0
    enabled: false
- tapOn: "ファイルを選択"
# 未確認: 文書選択ダイアログ（Documents UI）の操作は公式ドキュメントで確認できなかった
- takeScreenshot: 2.5-10-import-ng-continuation-sender-missing-02
- runFlow:
    file: common/select-download-file.yaml
    env:
      TEXT: ${IMPORT_FILE}
- takeScreenshot: 2.5-10-import-ng-continuation-sender-missing-03
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "インポートエラー"
- assertVisible: "(?s).*引継ぎ内容の1件目に送信元がありません.*"
- runFlow:
    file: common/tap-android-id.yaml
    env:
      ID: button1
- takeScreenshot: 2.5-10-import-ng-continuation-sender-missing-04
- runFlow:
    file: common/assert-id-visible.yaml
    env:
      ID: btnImportSettings
      INDEX: 0
    enabled: false
- takeScreenshot: 2.5-10-import-ng-continuation-sender-missing-05

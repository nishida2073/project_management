# 2.3 アプリの設定: 返信メッセージを入力する（テスト仕様書の 2.3 の 18 に対応）
appId: com.ssfrontier.smstokintone
---
# 前提: JSON（env_ok.json）の状態から開始する（表示テーマ：ライト、SMSの返信モード：手動、会社名の抽出：あり、引継ぎ：あり など）。返信メッセージ（正常・異常）は JSON に指定がなく、アプリの既定値のため、このフローで入力する（入力すると自動で保存される）。
- launchApp
- tapOn: "アプリの設定"
- takeScreenshot: 2.3-18-reply-message-save-01
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/etReplySuccessBody"
    direction: DOWN
    visibilityPercentage: 100
- takeScreenshot: 2.3-18-reply-message-save-02
- tapOn:
    id: "com.ssfrontier.smstokintone:id/etReplySuccessBody"
    index: 0
    point: "95%, 50%"
- takeScreenshot: 2.3-18-reply-message-save-03
- eraseText: 50
- takeScreenshot: 2.3-18-reply-message-save-04
- inputText: "${REPLY_SUCCESS_BODY}"
- takeScreenshot: 2.3-18-reply-message-save-05
- hideKeyboard
- assertVisible: "${REPLY_SUCCESS_BODY}" # 未確認: 複数行欄の表示確認（入力の一部を見る）
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/etReplyFailedBody"
    direction: DOWN
    visibilityPercentage: 100
- takeScreenshot: 2.3-18-reply-message-save-06
- tapOn:
    id: "com.ssfrontier.smstokintone:id/etReplyFailedBody"
    index: 0
    point: "95%, 50%"
- takeScreenshot: 2.3-18-reply-message-save-07
- eraseText: 50
- takeScreenshot: 2.3-18-reply-message-save-08
- inputText: "${REPLY_FAILED_BODY}"
- takeScreenshot: 2.3-18-reply-message-save-09
- hideKeyboard
- assertVisible: "${REPLY_FAILED_BODY}" # 未確認: 複数行欄の表示確認（入力の一部を見る）
- takeScreenshot: 2.3-18-reply-message-save-10

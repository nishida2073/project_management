# 2.8 自動処理: SMSの送信モードが手動のとき、受信しても送信は行われない（テスト仕様書の 2.8 の 15 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（フローで設定）: SMSの送信モードを手動に切り替える
# 外部条件: 別端末から SMS を送る。送信元 0312345801、本文は 1 行目「test-company」、2 行目「test-taro」、3 行目「body-test」。待ち時間（下の extendedWaitUntil）に送る
# 未確認: 送信開始・送信完了のログが残らないことは、受信の直後の assertNotVisible で確認する。待ち時間がないため、その後に残らないことは目視で確認する
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: rbSendManual
      INDEX: 0
- runFlow:
    file: common/assert-id-checked.yaml
    env:
      ID: rbSendManual
      INDEX: 0
- pressKey: Back
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: btnTopOpenLog
      INDEX: 0
- takeScreenshot: 2.8-15-manual-send-mode-01
- extendedWaitUntil:
    visible: "(?s).*SMSを受信しました.*"
    timeout: 180000
- assertNotVisible: "(?s).*SMSの送信を開始しました.*"
- assertNotVisible: "(?s).*SMSの(登録|更新)に成功しました.*"
- takeScreenshot: 2.8-15-manual-send-mode-02

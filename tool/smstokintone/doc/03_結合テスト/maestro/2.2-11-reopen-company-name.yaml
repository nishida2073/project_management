# 2.2 送信先の設定: 会社名の保存値を開き直して確認する（テスト仕様書の 2.2 の 11 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（フローで設定）: この flow の中で、会社名の抽出を無効にし、会社名を入力して保存してから開き直す
# 未確認: 会社名の抽出が無効のとき、会社名の入力欄が表示される
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- takeScreenshot: 2.2-11-reopen-company-name-01
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: swCompanyNameExtractionEnabled
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/swCompanyNameExtractionEnabled"
    checked: true
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/swCompanyNameExtractionEnabled"
- takeScreenshot: 2.2-11-reopen-company-name-02
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/swCompanyNameExtractionEnabled"
    checked: false
- pressKey: Back
- takeScreenshot: 2.2-11-reopen-company-name-03
- tapOn: "送信先の設定"
- takeScreenshot: 2.2-11-reopen-company-name-04
- assertVisible: "設定を追加"
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/etSendTargetName"
    index: 0
    text: "test-send-target-1"
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: etCompanyName
- runFlow:
    file: common/input-text-field.yaml
    env:
      FIELD_ID: etCompanyName
      INPUT_VALUE: "${COMPANY_NAME}"
- scrollUntilVisible:
    element:
      text: "設定を保存"
    direction: DOWN
- tapOn: "設定を保存"
- takeScreenshot: 2.2-11-reopen-company-name-05
- tapOn: "送信先の設定"
- takeScreenshot: 2.2-11-reopen-company-name-06
- assertVisible: "設定を追加"
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: etCompanyName
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/etCompanyName"
    text: "${COMPANY_NAME}"
- takeScreenshot: 2.2-11-reopen-company-name-07

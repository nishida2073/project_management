# 2.4 引継ぎ内容の設定: すべて削除して設定を保存する（テスト仕様書の 2.4 の 4 に対応）
appId: com.ssfrontier.smstokintone
---
# 前提: 引継ぎ内容が 2 件（SENDER_A は古い、SENDER_B は新しい）、表示順序は古い順（既定）（テスト仕様書の 2.4 前提条件）。
# 前提（順序）: 2.4-03 の後に実行すると SENDER_A は削除済みのため、2 件とはならない（未解決）。
# 未確認: 確認ダイアログの「削除」ボタンは android:id/button1 として扱う。
- launchApp
- tapOn: "アプリの設定"
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/btnEditContinuationInfo"
    direction: DOWN
- tapOn:
    id: "com.ssfrontier.smstokintone:id/btnEditContinuationInfo"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/etContinuationSearch"
# 前提確認（表示のみ、操作しない）
- assertVisible: "${SENDER_A}"
# 未確認: 送信元 B は画面の下にあるとき、スクロールしてから確認する。
- scrollUntilVisible:
    element:
      text: "${SENDER_B}"
    direction: DOWN
- assertVisible: "${SENDER_B}"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/rbContinuationSortAscending"
    checked: true
# 要判断: 「すべて削除」ボタン（btnDeleteAllContinuationInfo）は layout で gone のままで、コードでも表示しないため、表示されない可能性がある。
- assertVisible: "${SENDER_A}"
- assertVisible: "${SENDER_B}"
- tapOn: "すべて削除"
- assertVisible: "すべての引継ぎ内容を削除しますか？"
- tapOn:
    id: "android:id/button1"
- assertVisible: "引継ぎ内容がありません"
- assertNotVisible: "${SENDER_A}"
- assertNotVisible: "${SENDER_B}"
- tapOn: "設定を保存"
- assertVisible: "設定を保存しました"
- assertNotVisible:
    id: "com.ssfrontier.smstokintone:id/etContinuationSearch"
- takeScreenshot: 2.4-04-after-delete-all-and-save

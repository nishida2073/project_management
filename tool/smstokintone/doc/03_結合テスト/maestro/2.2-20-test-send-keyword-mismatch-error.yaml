# 2.2 送信先の設定: 振り分けが合わないときテスト送信でエラーになる（テスト仕様書の 2.2 の 20 に対応）
appId: com.ssfrontier.smstokintone
---
# 前提: 仕様書 2.2 の前提条件（test-send-target-1（振り分け：test-company）が保存済み、会社名の抽出が有効）
# 外部条件: kintone 接続と SMS 受信が必要
# 未確認: テスト本文の「sample-company」「test-taro」を英数字の TEST_BODY で代用している（IME の制約）。その場合の送信先エラーの出方は未確認
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- takeScreenshot: 2.2-20-test-send-keyword-mismatch-error-01
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/swCompanyNameExtractionEnabled"
    direction: DOWN
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/swCompanyNameExtractionEnabled"
    checked: true
- pressKey: Back
- takeScreenshot: 2.2-20-test-send-keyword-mismatch-error-02
- tapOn: "送信先の設定"
- takeScreenshot: 2.2-20-test-send-keyword-mismatch-error-03
- assertVisible: "設定を追加"
# 前提確認: test-send-target-1（振り分け：test-company）
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/etSendTargetName"
    index: 0
    text: "test-send-target-1"
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/etKeyword"
      index: 0
    direction: DOWN
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/etKeyword"
    index: 0
    text: "test-company"
- scrollUntilVisible:
    element: "テスト送信"
    direction: DOWN
- tapOn: "テスト送信"
- takeScreenshot: 2.2-20-test-send-keyword-mismatch-error-04
- assertVisible: "テスト本文"
- eraseText: 50  # 未確認: テスト本文の初期値（テンプレート）を消してから入力する
- inputText: "${TEST_BODY}"
- takeScreenshot: 2.2-20-test-send-keyword-mismatch-error-05
- hideKeyboard
- tapOn: "送信"
- takeScreenshot: 2.2-20-test-send-keyword-mismatch-error-06
- assertVisible: ".*送信先エラー.*"
- assertVisible: ".*${EXPECTED_COMPANY_NAME}.*"  # 未確認
- takeScreenshot: 2.2-20-test-send-keyword-mismatch-error-07

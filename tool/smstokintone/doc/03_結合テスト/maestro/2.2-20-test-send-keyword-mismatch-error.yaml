# 2.2 送信先の設定: 振り分けが合わないときテスト送信でエラーになる（テスト仕様書の 2.2 の 20 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 外部条件: kintone 接続と SMS 受信が必要
# 注: テスト本文の「sample-company」「test-taro」は英数字（TEST_BODY_LINE1、TEST_BODY_LINE2）で代用する（IME の制約）。会社名の抽出は 3 行未満では行われないため、改行（Enter）で 3 行にする
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- takeScreenshot: 2.2-20-test-send-keyword-mismatch-error-01
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: swCompanyNameExtractionEnabled
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/swCompanyNameExtractionEnabled"
    checked: true
- pressKey: Back
- takeScreenshot: 2.2-20-test-send-keyword-mismatch-error-02
- tapOn: "送信先の設定"
- takeScreenshot: 2.2-20-test-send-keyword-mismatch-error-03
- assertVisible: "設定を追加"
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/etSendTargetName"
    index: 0
    text: "test-send-target-1"
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: etKeyword
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/etKeyword"
    index: 0
    text: "test-company"
- scrollUntilVisible:
    element: "テスト送信"
    direction: DOWN
- tapOn: "テスト送信"
- takeScreenshot: 2.2-20-test-send-keyword-mismatch-error-04
- assertVisible: "テスト本文"
# 未確認: テスト本文の初期値（テンプレート）は、欄をタップして末尾にカーソルを置いてから消す
- tapOn:
    text: "(?s).*テスト太郎.*"
    point: "95%, 95%"
- eraseText: 200
- inputText: "${TEST_BODY_LINE1}"
- pressKey: Enter
- inputText: "${TEST_BODY_LINE2}"
- pressKey: Enter
- inputText: "${TEST_BODY_LINE3}"
- takeScreenshot: 2.2-20-test-send-keyword-mismatch-error-05
- hideKeyboard
- tapOn: "送信"
- takeScreenshot: 2.2-20-test-send-keyword-mismatch-error-06
- assertVisible: "(?s).*送信先エラー.*"
- assertVisible: "(?s).*${EXPECTED_COMPANY_NAME}.*"  # 未確認
- takeScreenshot: 2.2-20-test-send-keyword-mismatch-error-07

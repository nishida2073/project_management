# 2.8 自動処理: SMSの送信の許可がないと、自動返信は行われない（テスト仕様書の 2.8 の 22 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（フローで設定）: SMSの返信モードを自動に切り替える
# 外部条件: 手動。端末の設定で SMS の送信の許可を取り消してから、このフローを実行する（許可の取り消しは Maestro で行わない）。終わったら許可を戻す
# 外部条件: 別端末から SMS を送る。送信元 test-phone-b、本文は 1 行だけの抽出できない本文。待ち時間（下の extendedWaitUntil）に送る
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: rbSmsReplyModeAuto
      INDEX: 0
- runFlow:
    file: common/assert-id-checked.yaml
    env:
      ID: rbSmsReplyModeAuto
      INDEX: 0
- runFlow:
    file: common/scroll-down-to-id.yaml
    env:
      ID: tvSendPermissionStatus
- runFlow:
    file: common/assert-field-text-not-visible.yaml
    env:
      ID: tvSendPermissionStatus
      INDEX: 0
      TEXT: "許可済み"
- pressKey: Back
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: btnTopOpenLog
      INDEX: 0
- takeScreenshot: 2.8-22-send-permission-denied-01
- extendedWaitUntil:
    visible: "(?s).*SMSを受信しました.*"
    timeout: 180000
- takeScreenshot: 2.8-22-send-permission-denied-02
# 未確認: 返信が送られないことは、画面に出ないことでしか確認できないため、ここでは「返信完了」が表示されないことを目視で確認する
- assertNotVisible: "(?s).*抽出状況が異常なため、SMSを返信しました.*"
- takeScreenshot: 2.8-22-send-permission-denied-03

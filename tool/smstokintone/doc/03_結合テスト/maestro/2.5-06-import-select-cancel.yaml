# 2.5 設定のインポート・エクスポート: ファイルを選ばずに選択画面を閉じる（テスト仕様書の 2.5 の 6 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 未確認: launchApp が前の画面を閉じて起動し直すか
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "設定のインポート・エクスポート"
- takeScreenshot: 2.5-06-import-select-cancel-01
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "設定のインポート・エクスポート"
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "ファイルを選択"
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "ファイルが選択されていません"
- runFlow:
    file: common/assert-disabled-by-id.yaml
    env:
      ID: btnImportSettings
      INDEX: 0
- tapOn: "ファイルを選択"
# 未確認: 文書選択ダイアログ（Documents UI）を戻る操作で閉じられるかは公式ドキュメントで確認できなかった
- takeScreenshot: 2.5-06-import-select-cancel-02
- back
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "ファイルが選択されていません"
- runFlow:
    file: common/assert-disabled-by-id.yaml
    env:
      ID: btnImportSettings
      INDEX: 0
- takeScreenshot: 2.5-06-import-select-cancel-03

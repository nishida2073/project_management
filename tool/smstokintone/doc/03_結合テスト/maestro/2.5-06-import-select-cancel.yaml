# 2.5 設定のインポート・エクスポート: ファイルを選ばずに選択画面を閉じる（テスト仕様書の 2.5 の 6 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（JSON）: 会社名の抽出: あり（JSON の値）。
# 前提（この flow で設定）: 最初に setup/setup-import-environment.yaml で JSON を投入し直す。
# 未確認: launchApp が前の画面を閉じて起動し直すか
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "設定のインポート・エクスポート"
- takeScreenshot: 2.5-06-import-select-cancel-01
- assertVisible: "設定のインポート・エクスポート"
- assertVisible: "ファイルを選択"
- assertVisible: "ファイルが選択されていません"
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/btnImportSettings"
    enabled: false
- tapOn: "ファイルを選択"
# 未確認: 文書選択ダイアログ（Documents UI）を戻る操作で閉じられるかは公式ドキュメントで確認できなかった
- takeScreenshot: 2.5-06-import-select-cancel-02
- back
- assertVisible: "ファイルが選択されていません"
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/btnImportSettings"
    enabled: false
- takeScreenshot: 2.5-06-import-select-cancel-03

# 2.3 アプリの設定: 会社名の自動変換を切り替える（テスト仕様書の 2.3 の 23 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（フローで設定）: 会社名の自動変換をオフにする
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/rbThemeLight"
    direction: UP
    visibilityPercentage: 100
    timeout: 60000
- takeScreenshot: 2.3-23-company-name-auto-conversion-off-01
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/swCompanyNameExtractionEnabled"
    direction: DOWN
    visibilityPercentage: 100
- takeScreenshot: 2.3-23-company-name-auto-conversion-off-02
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/swCompanyNameExtractionEnabled"
    direction: DOWN
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/swCompanyNameExtractionEnabled"
    checked: true
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/swCompanyNameAutoConversionEnabled"
    direction: DOWN
    visibilityPercentage: 100
- takeScreenshot: 2.3-23-company-name-auto-conversion-off-03
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/swCompanyNameAutoConversionEnabled"
    direction: DOWN
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/swCompanyNameAutoConversionEnabled"
    checked: true
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/swCompanyNameAutoConversionEnabled"
    direction: DOWN
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/swCompanyNameAutoConversionEnabled"
    index: 0
- takeScreenshot: 2.3-23-company-name-auto-conversion-off-04
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/swCompanyNameAutoConversionEnabled"
    direction: DOWN
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/swCompanyNameAutoConversionEnabled"
    checked: false
- pressKey: Back
- takeScreenshot: 2.3-23-company-name-auto-conversion-off-05
- tapOn: "アプリの設定"
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/rbThemeLight"
    direction: UP
    visibilityPercentage: 100
    timeout: 60000
- takeScreenshot: 2.3-23-company-name-auto-conversion-off-06
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/swCompanyNameAutoConversionEnabled"
    direction: DOWN
    visibilityPercentage: 100
- takeScreenshot: 2.3-23-company-name-auto-conversion-off-07
- assertVisible: # 開き直した後も無効のまま保存されていること
    id: "jp.co.nttdata_univ.smstokintone:id/swCompanyNameAutoConversionEnabled"
    checked: false
- takeScreenshot: 2.3-23-company-name-auto-conversion-off-08

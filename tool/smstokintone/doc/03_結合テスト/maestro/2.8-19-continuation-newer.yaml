# 2.8 自動処理: 受信日時が新しい同じ送信元の 2 通目は、kintone の本文が更新される（テスト仕様書の 2.8 の 19 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（JSON）: 既定値（2.8 の 1 と同じ）
# 前提（フローで設定）: なし
# 外部条件（事前に別端末から SMS を送る）: 1 通目は送信元 test-phone-a、本文は 1 行目「test-company」、2 行目「test-taro」、3 行目「body-test-1」。2 通目は同じ送信元、本文は「body-test-5」（1 通目より後に受信）
# 前提の操作（この行の中で行う）: 1 通目を受信してから、2 通目を受信する
# 未確認: kintone の本文が更新されたかは kintone 側で確認する
- runFlow: setup/setup-import-environment.yaml
- launchApp
- runFlow: common/enable-log-auto-refresh.yaml
- tapOn:
    id: "com.ssfrontier.smstokintone:id/btnTopOpenLog"
- takeScreenshot: 2.8-19-continuation-newer-01
- extendedWaitUntil:
    visible: "(?s).*SMSの登録に成功しました.*"
    timeout: 180000
- extendedWaitUntil:
    visible: "(?s).*SMSの更新に成功しました.*"
    timeout: 180000
- assertVisible: "(?s).*SMSの更新に成功しました.*"
- takeScreenshot: 2.8-19-continuation-newer-02

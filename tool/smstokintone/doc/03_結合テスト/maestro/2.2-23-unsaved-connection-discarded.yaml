# 2.2 送信先の設定: 保存していない接続先は破棄される（テスト仕様書の 2.2 の 23 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（フローで設定）: この flow の中で接続先を未保存の値に変えてから画面を閉じる
# 確認: 未保存の接続先（UNSAVED_SUBDOMAIN）は、開き直したときに残らない。保存されている接続先の値は確認しない（値をリポジトリに書かない）
# 注: 送信先の設定の画面には、未保存の変更を確認するダイアログの処理が無い（画面を閉じると破棄される）
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "送信先の設定"
- takeScreenshot: 2.2-23-unsaved-connection-discarded-01
- assertVisible: "設定を追加"
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/etSendTargetName"
    index: 0
    text: "test-send-target-1"
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: etSubdomain
- runFlow:
    file: common/input-text-field.yaml
    env:
      FIELD_ID: etSubdomain
      INPUT_VALUE: "${UNSAVED_SUBDOMAIN}"
- takeScreenshot: 2.2-23-unsaved-connection-discarded-02
- pressKey: Back
- takeScreenshot: 2.2-23-unsaved-connection-discarded-03
- tapOn: "送信先の設定"
- takeScreenshot: 2.2-23-unsaved-connection-discarded-04
- assertVisible: "設定を追加"
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: etSubdomain
- assertNotVisible: "${UNSAVED_SUBDOMAIN}"
- takeScreenshot: 2.2-23-unsaved-connection-discarded-05

# 2.2 送信先の設定: パスワードを伏せて表示する（テスト仕様書の 2.2 の 16 に対応）
appId: com.ssfrontier.smstokintone
---
# 前提: 2.2 の前提条件（test-send-target-1 が保存済み）
- launchApp
- tapOn: "送信先の設定"
- assertVisible: "設定を追加"
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/etLoginPassword"
    direction: DOWN
- tapOn:
    id: "com.ssfrontier.smstokintone:id/etLoginPassword"
- eraseText: 50  # 未確認
- inputText: "${LOGIN_PASSWORD}"
- hideKeyboard
- assertNotVisible: "${LOGIN_PASSWORD}"
# 未確認: 伏せ字の判定（平文が画面に出ないこと）は、マスクの表示方法によっては判定できない
- takeScreenshot: 2.2-16-password-masked

# 2.7 SMSの検索: SMSの検索を開くと、受信日の範囲に今日が入る（テスト仕様書の 2.7 の 1 に対応）
# 外部条件: 端末に SMS が 1 件以上ある
# 注: 未送信の既定はオフ（SettingsStore の DEFAULT_CONFIG。env_base.json には設定がない）。この flow は既定がオフであることを確認する
# 未確認: 日付の文字（yyyy/MM/dd）が今日の日付と一致することは、スクリーンショットで確認する
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "SMSの検索"
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "検索条件"
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "受信日の範囲"
- runFlow:
    file: common/scroll-down-and-assert-field-text.yaml
    env:
      ID: etDateFrom
      INDEX: 0
      TEXT: '\d{4}/\d{2}/\d{2}'
- runFlow:
    file: common/scroll-down-and-assert-field-text.yaml
    env:
      ID: etDateTo
      INDEX: 0
      TEXT: '\d{4}/\d{2}/\d{2}'
- takeScreenshot: 2.7-01-open-search-default-01
- runFlow:
    file: common/assert-id-unchecked.yaml
    env:
      ID: cbSmsSearchSendNoneOnly
      INDEX: 0
- takeScreenshot: 2.7-01-open-search-default-02

# 2.2 送信先の設定: 接続先が空のときテスト送信でエラーになる（テスト仕様書の 2.2 の 19 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（フローで設定）: このフローで接続先を空にする（保存しない）
# テスト送信は画面の未保存の入力値を使う（接続先を空にした状態で判定される）
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "送信先の設定"
- takeScreenshot: 2.2-19-test-send-no-connection-error-01
- assertVisible: "設定を追加"
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/etSendTargetName"
    index: 0
    text: "test-send-target-1"
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/etSubdomain"
    direction: DOWN
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/etSubdomain"
    index: 0
    point: "95%, 50%"
- takeScreenshot: 2.2-19-test-send-no-connection-error-02
- eraseText: 50  # 未確認
- hideKeyboard
- scrollUntilVisible:
    element: "テスト送信"
    direction: DOWN
- tapOn: "テスト送信"
- takeScreenshot: 2.2-19-test-send-no-connection-error-03
- assertVisible: "入力エラー"
- assertNotVisible: "テスト本文"
# 未確認: テスト登録（kintone 側）は確認しない
- takeScreenshot: 2.2-19-test-send-no-connection-error-04

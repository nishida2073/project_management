# 2.2 送信先の設定: テスト送信が成功する（テスト仕様書の 2.2 の 7 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 外部条件: kintone 接続（接続先・認証情報が有効）と SMS 受信が必要
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "送信先の設定"
- takeScreenshot: 2.2-07-test-send-success-01
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "設定を追加"
- runFlow:
    file: common/scroll-down-and-assert-text-by-id.yaml
    env:
      ID: etSendTargetName
      INDEX: 0
      TEXT: "test-send-target-1"
- runFlow:
    file: common/scroll-down-and-assert-text-by-id.yaml
    env:
      ID: etKeyword
      INDEX: 0
      TEXT: "test-company"
- scrollUntilVisible:
    element: "テスト送信"
    direction: DOWN
- tapOn: "テスト送信"
- takeScreenshot: 2.2-07-test-send-success-02
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "テスト本文"
# 注: テスト本文の初期値は keywords と「テスト太郎」を含む（SendTargetSettingsActivity.kt:220-226, strings.xml:97）。改行をまたぐため (?s) を付けて一致させる。
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "(?s).*(?=.*${EXPECTED_COMPANY_NAME})(?=.*${EXPECTED_USER_NAME}).*"
- tapOn: "送信"
- takeScreenshot: 2.2-07-test-send-success-03
- assertVisible: "(?s).*テスト結果.*"  # 成功時はタイトルに抽出アイコンが付くため、部分一致で確認する
- assertVisible: '(?s).*${EXPECTED_RESULT_COMPANY_LINE}.*'
- assertVisible: '(?s).*${EXPECTED_RESULT_USER_LINE}.*'
- assertVisible: "(?s).*SMSの(登録|更新)に成功しました.*"
# 未確認: テスト登録が kintone に入ったかは kintone 側の画面で確認が必要（送信内容は KintoneApi.kt:247-283 で決まる）
- takeScreenshot: 2.2-07-test-send-success-04

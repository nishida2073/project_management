# 2.2 送信先の設定: テスト送信が成功する（テスト仕様書の 2.2 の 7 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 外部条件: kintone 接続（接続先・認証情報が有効）と SMS 受信が必要
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "送信先の設定"
- takeScreenshot: 2.2-07-test-send-success-01
- assertVisible: "設定を追加"
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/etSendTargetName"
    index: 0
    text: "test-send-target-1"
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: etKeyword
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/etKeyword"
    index: 0
    text: "test-company"
- scrollUntilVisible:
    element: "テスト送信"
    direction: DOWN
- tapOn: "テスト送信"
- takeScreenshot: 2.2-07-test-send-success-02
- assertVisible: "テスト本文"
# 未確認: テスト本文の初期表示に会社名・氏名が含まれること（改行をはさむと正規表現が一致しないことがある）
- assertVisible: "(?s).*${EXPECTED_COMPANY_NAME}.*"
- assertVisible: "(?s).*${EXPECTED_USER_NAME}.*"
- tapOn: "送信"
- takeScreenshot: 2.2-07-test-send-success-03
- assertVisible: "(?s).*テスト結果.*"  # 成功時はタイトルに抽出アイコンが付くため、部分一致で確認する
- assertVisible: '(?s).*${EXPECTED_RESULT_COMPANY_LINE}.*'
- assertVisible: '(?s).*${EXPECTED_RESULT_USER_LINE}.*'
- assertVisible: "(?s).*SMSの(登録|更新)に成功しました.*"  # 未確認
# 未確認: テスト登録（会社名・氏名・テスト登録）は kintone 側で確認する
- takeScreenshot: 2.2-07-test-send-success-04

# 2.8 自動処理: 抽出が成功したSMSには、SMSの返信モードが自動でも返信しない（テスト仕様書の 2.8 の 18 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（JSON）: 既定値（2.8 の 1 と同じ）
# 前提（フローで設定）: SMSの返信モードを自動に切り替える
# 外部条件（事前に別端末から SMS を送る）: 送信元 test-phone-c（未使用の送信元）、本文は 1 行目「test-company」、2 行目「test-taro」、3 行目「body-test」（抽出成功）。待ち時間（下の extendedWaitUntil）に送る
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/rbSmsReplyModeAuto"
- tapOn:
    id: "com.ssfrontier.smstokintone:id/rbSmsReplyModeAuto"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/rbSmsReplyModeAuto"
    checked: true
- pressKey: Back
- runFlow: common/enable-log-auto-refresh.yaml
- tapOn:
    id: "com.ssfrontier.smstokintone:id/btnTopOpenLog"
- takeScreenshot: 2.8-18-auto-reply-extraction-success-01
- extendedWaitUntil:
    visible: "(?s).*SMSを受信しました.*"
    timeout: 180000
- assertVisible: "(?s).*SMSの登録に成功しました.*"
- assertNotVisible: "(?s).*抽出状況が異常なため、SMSを返信しました.*"
- takeScreenshot: 2.8-18-auto-reply-extraction-success-02

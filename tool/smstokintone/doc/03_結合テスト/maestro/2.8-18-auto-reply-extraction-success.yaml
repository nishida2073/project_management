# 2.8 自動処理: 抽出が成功したSMSには、SMSの返信モードが自動でも返信しない（テスト仕様書の 2.8 の 18 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 外部条件: 別端末から SMS を送る。送信元 0312345803（未使用の送信元）、本文は 1 行目「test-company」、2 行目「test-taro」、3 行目「body-test」（抽出成功）。待ち時間（下の extendedWaitUntil）に送る
- runFlow: setup/setup-import-environment.yaml
- launchApp
- runFlow:
    file: common/scroll-down-and-tap-by-id.yaml
    env:
      ID: btnTopOpenLog
      INDEX: 0
- takeScreenshot: 2.8-18-auto-reply-extraction-success-01
- extendedWaitUntil:
    visible: "(?s).*SMSを受信しました.*"
    timeout: 180000
- extendedWaitUntil:
    visible: "(?s).*SMSの(登録|更新)に成功しました.*"
    timeout: 180000
- runFlow:
    file: common/wait-seconds.yaml
    env:
      WAIT_SECONDS: 15
- assertNotVisible: "(?s).*抽出状況が異常なため、SMSを返信しました.*"
- takeScreenshot: 2.8-18-auto-reply-extraction-success-02

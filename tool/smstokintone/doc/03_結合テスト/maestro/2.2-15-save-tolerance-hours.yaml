# 2.2 送信先の設定: 統合範囲を保存する（テスト仕様書の 2.2 の 15 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（フローで設定）: このフローで統合条件を時間に切り替え、統合範囲（時間）に 6 を入力して保存する
# 注: updateToleranceMode=HOURS、updateToleranceHours=6 は画面に表示されないため、保存値は確認していない（内部値）
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "送信先の設定"
- takeScreenshot: 2.2-15-save-tolerance-hours-01
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "設定を追加"
- runFlow:
    file: common/scroll-down-and-assert-field-text.yaml
    env:
      ID: etSendTargetName
      INDEX: 0
      TEXT: "test-send-target-1"
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: rbUpdateToleranceModeHours
      INDEX: 0
- takeScreenshot: 2.2-15-save-tolerance-hours-02
- runFlow:
    file: common/assert-id-visible.yaml
    env:
      ID: etUpdateToleranceHours
      INDEX: 0
    enabled: true
- runFlow:
    file: common/scroll-down-to-id.yaml
    env:
      ID: etUpdateToleranceHours
- runFlow:
    file: common/input-text-field.yaml
    env:
      ID: etUpdateToleranceHours
      INDEX: 0
      VALUE: "${TOLERANCE_HOURS_SAVED}"
- tapOn: "設定を保存"
- takeScreenshot: 2.2-15-save-tolerance-hours-03
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "SMSの送信モード"
- assertNotVisible: "設定を追加"
- takeScreenshot: 2.2-15-save-tolerance-hours-04

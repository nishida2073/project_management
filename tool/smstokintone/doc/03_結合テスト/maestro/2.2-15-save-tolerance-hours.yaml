# 2.2 送信先の設定: 統合範囲を保存する（テスト仕様書の 2.2 の 15 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（フローで設定）: このフローで統合条件を時間に切り替え、統合範囲（時間）に 6 を入力して保存する
# 注: updateToleranceMode=HOURS、updateToleranceHours=6 は画面に表示されないため、保存値は確認していない（内部値）
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "送信先の設定"
- takeScreenshot: 2.2-15-save-tolerance-hours-01
- assertVisible: "設定を追加"
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/etSendTargetName"
    index: 0
    text: "test-send-target-1"
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/rbUpdateToleranceModeHours"
    direction: DOWN
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/rbUpdateToleranceModeHours"
- takeScreenshot: 2.2-15-save-tolerance-hours-02
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/etUpdateToleranceHours"
    enabled: true
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/etUpdateToleranceHours"
    direction: DOWN
- runFlow:
    file: common/input-number-field.yaml
    env:
      FIELD_ID: etUpdateToleranceHours
      INPUT_VALUE: "${TOLERANCE_HOURS_SAVED}"
- tapOn: "設定を保存"
- takeScreenshot: 2.2-15-save-tolerance-hours-03
- assertVisible: "SMSの送信モード"
- assertNotVisible: "設定を追加"
- takeScreenshot: 2.2-15-save-tolerance-hours-04

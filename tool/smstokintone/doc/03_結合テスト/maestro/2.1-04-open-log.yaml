# 2.1 トップ: ログの確認の画面に移動できることを確認する（テスト仕様書の 2.1 の 4 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- runFlow:
    file: common/scroll-down-and-tap-by-id.yaml
    env:
      ID: btnTopOpenLog
      INDEX: 0
- takeScreenshot: 2.1-04-open-log-01
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "ログの一覧"
- pressKey: Back
- takeScreenshot: 2.1-04-open-log-02

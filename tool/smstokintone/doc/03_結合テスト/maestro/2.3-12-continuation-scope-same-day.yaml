# 2.3 アプリの設定: 引継ぎの範囲を同一日のみに切り替える（テスト仕様書の 2.3 の 12 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（フローで設定）: 引継ぎの範囲を同一日のみに切り替える
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- runFlow:
    file: common/scroll-up-by-id.yaml
    env:
      ID: rbThemeLight
- takeScreenshot: 2.3-12-continuation-scope-same-day-01
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "端末の許可"
- runFlow:
    file: common/scroll-down-by-id.yaml
    env:
      ID: swContinuationEnabled
- runFlow:
    file: common/assert-checked-by-id.yaml
    env:
      ID: swContinuationEnabled
      INDEX: 0
- runFlow:
    file: common/scroll-down-by-id.yaml
    env:
      ID: rbContinuationScopeUnlimited
- runFlow:
    file: common/assert-checked-by-id.yaml
    env:
      ID: rbContinuationScopeUnlimited
      INDEX: 0
- runFlow:
    file: common/scroll-down-and-tap-by-id.yaml
    env:
      ID: rbContinuationScopeSameDay
      INDEX: 0
- takeScreenshot: 2.3-12-continuation-scope-same-day-02
- runFlow:
    file: common/scroll-down-by-id.yaml
    env:
      ID: rbContinuationScopeSameDay
- runFlow:
    file: common/assert-checked-by-id.yaml
    env:
      ID: rbContinuationScopeSameDay
      INDEX: 0
- pressKey: Back
- takeScreenshot: 2.3-12-continuation-scope-same-day-03
- tapOn: "アプリの設定"
- runFlow:
    file: common/scroll-up-by-id.yaml
    env:
      ID: rbThemeLight
- takeScreenshot: 2.3-12-continuation-scope-same-day-04
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "端末の許可"
- runFlow:
    file: common/scroll-down-by-id.yaml
    env:
      ID: rbContinuationScopeSameDay
- runFlow:
    file: common/assert-checked-by-id.yaml
    env:
      ID: rbContinuationScopeSameDay
      INDEX: 0
- takeScreenshot: 2.3-12-continuation-scope-same-day-05

# 2.3 アプリの設定: 引継ぎの範囲を同一日のみに切り替える（テスト仕様書の 2.3 の 12 に対応）
appId: com.ssfrontier.smstokintone
---
# 前提（JSON）: 表示テーマ：ライト、SMSの送信モード：自動、SMSの返信モード：手動、引継ぎ：あり、引継ぎの範囲：制限なし
# 前提（フローで設定）: 引継ぎの範囲を同一日のみに切り替える
- launchApp
- tapOn: "アプリの設定"
- takeScreenshot: 2.3-12-continuation-scope-same-day-01
- assertVisible: "端末の許可"
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/swContinuationEnabled"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/swContinuationEnabled"
    checked: true
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/rbContinuationScopeUnlimited"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/rbContinuationScopeUnlimited"
    checked: true
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/rbContinuationScopeSameDay"
- tapOn:
    id: "com.ssfrontier.smstokintone:id/rbContinuationScopeSameDay"
- takeScreenshot: 2.3-12-continuation-scope-same-day-02
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/rbContinuationScopeSameDay"
    checked: true
- pressKey: Back
- takeScreenshot: 2.3-12-continuation-scope-same-day-03
- tapOn: "アプリの設定"
- takeScreenshot: 2.3-12-continuation-scope-same-day-04
- assertVisible: "端末の許可"
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/rbContinuationScopeSameDay"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/rbContinuationScopeSameDay"
    checked: true
- takeScreenshot: 2.3-12-continuation-scope-same-day-05

# 2.3 アプリの設定: 引継ぎの範囲を同一日のみに切り替える（テスト仕様書の 2.3 の 12 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（フローで設定）: 引継ぎの範囲を同一日のみに切り替える
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- runFlow:
    file: common/scroll-up-to-setting.yaml
    env:
      ELEMENT_ID: rbThemeLight
- takeScreenshot: 2.3-12-continuation-scope-same-day-01
- assertVisible: "端末の許可"
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: swContinuationEnabled
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/swContinuationEnabled"
    checked: true
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: rbContinuationScopeUnlimited
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/rbContinuationScopeUnlimited"
    checked: true
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: rbContinuationScopeSameDay
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/rbContinuationScopeSameDay"
- takeScreenshot: 2.3-12-continuation-scope-same-day-02
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: rbContinuationScopeSameDay
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/rbContinuationScopeSameDay"
    checked: true
- pressKey: Back
- takeScreenshot: 2.3-12-continuation-scope-same-day-03
- tapOn: "アプリの設定"
- runFlow:
    file: common/scroll-up-to-setting.yaml
    env:
      ELEMENT_ID: rbThemeLight
- takeScreenshot: 2.3-12-continuation-scope-same-day-04
- assertVisible: "端末の許可"
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: rbContinuationScopeSameDay
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/rbContinuationScopeSameDay"
    checked: true
- takeScreenshot: 2.3-12-continuation-scope-same-day-05

# 2.3 アプリの設定: SMSの受信の許可を拒否すると案内が出る（テスト仕様書の 2.3 の 28 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 外部条件: SMSの受信の権限の付与・未付与は端末の設定でしか切り替えられないため、このフローでは作らない（端末で未付与にしておく）
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/rbThemeLight"
    direction: UP
    visibilityPercentage: 100
    timeout: 60000
- takeScreenshot: 2.3-28-receive-permission-denied-01
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: btnRequestPermission
- takeScreenshot: 2.3-28-receive-permission-denied-02
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/btnRequestPermission"
- assertNotVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/tvPermissionStatus"
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: btnRequestPermission
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/btnRequestPermission"
    index: 0
- takeScreenshot: 2.3-28-receive-permission-denied-03
- tapOn: "許可しない" # 未確認: 端末の権限ダイアログの拒否ボタンの文字（Android の版・言語で異なる）
- takeScreenshot: 2.3-28-receive-permission-denied-04
- assertVisible: "SMSの受信の許可がない場合、SMSの自動送信・自動返信ができません" # トースト（Toast.LENGTH_LONG で表示される）
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: btnRequestPermission
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/btnRequestPermission"
- takeScreenshot: 2.3-28-receive-permission-denied-05

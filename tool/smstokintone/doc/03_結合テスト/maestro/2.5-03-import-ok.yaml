# 2.5 設定のインポート・エクスポート: 設定ファイルを統合してインポートする（テスト仕様書の 2.5 の 3 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 未確認: launchApp が前の画面を閉じて起動し直すか
# 外部条件: ${IMPORT_FILE} を端末の選択先に置く（ファイルの置き場所は未確認）。
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "設定のインポート・エクスポート"
- takeScreenshot: 2.5-03-import-ok-01
- assertVisible: "設定のインポート・エクスポート"
- assertVisible: "ファイルを選択"
- assertVisible: "ファイルが選択されていません"
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/btnImportSettings"
    enabled: false
- tapOn: "ファイルを選択"
# 未確認: 文書選択ダイアログ（Documents UI）の操作は公式ドキュメントで確認できなかった
- takeScreenshot: 2.5-03-import-ok-02
- runFlow:
    file: common/select-download-file.yaml
    env:
      FILE_PATTERN: ${IMPORT_FILE}
- takeScreenshot: 2.5-03-import-ok-03
- assertVisible: "(?s).*${IMPORT_FILE}.*"   # 未確認: 正規表現と複数行の表示
- assertVisible: "(?s).*アプリの設定: 統合.*"   # 未確認: 複数行の表示
- assertVisible: "(?s).*送信先の設定: 統合（2件）.*"   # 未確認: 複数行の表示
- assertVisible: "(?s).*引継ぎ内容: 統合（1件）.*"   # 未確認: 複数行の表示
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/btnImportSettings"
- takeScreenshot: 2.5-03-import-ok-04
- assertVisible: "設定をインポートしますか？"
- tapOn:
    id: "android:id/button1"   # 未確認: 確認ダイアログの「インポート」ボタンの id
- takeScreenshot: 2.5-03-import-ok-05
- assertVisible: "ログの確認"
- assertNotVisible: "ファイルを選択"
- takeScreenshot: 2.5-03-import-ok-06

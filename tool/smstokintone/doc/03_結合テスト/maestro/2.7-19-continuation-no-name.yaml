# 2.7 SMSの検索: 引継ぎの SMS の送信元に、氏名を表示しない設定では電話番号だけが表示される（テスト仕様書の 2.7 の 19 に対応）
# 前提（フローで設定）: このフローで引継ぎ内容の氏名表示をオフにする
# 外部条件: 引継ぎ内容の送信元（test-sender-a）から届いた SMS が、端末にある
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: swContinuationShowUserNameEnabled
      INDEX: 0
- runFlow:
    file: common/assert-id-unchecked.yaml
    env:
      ID: swContinuationShowUserNameEnabled
      INDEX: 0
- pressKey: Back
- tapOn: "SMSの検索"
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "検索条件"
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: cbSmsSearchSendNoneOnly
      INDEX: 0
- runFlow:
    file: common/assert-id-checked.yaml
    env:
      ID: cbSmsSearchSendNoneOnly
      INDEX: 0
- tapOn: "検索"
- assertVisible: '(?s).*${CONTINUATION_SENDER}.*'
- assertNotVisible: "${CONTINUATION_USER_NAME}"
- takeScreenshot: 2.7-19-continuation-no-name-01

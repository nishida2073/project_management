# 2.7 SMSの検索: 済（自動）のみで検索すると、自動で登録済みの SMS だけが表示される（テスト仕様書の 2.7 の 4 に対応）
# 前提（フローで設定）: 端末に SMS が 1 件以上ある
# 外部条件: テストデータの SMS（遅延して届く）が自動送信され、送信完了のログになるまで待つ（ログの確認で [送信完了] を待つ）
# 注: 一覧の行の送信状況は、自動送信済みの印 ✅（strings.xml の icon_send_auto。行の文字は「✅」だけで「済（自動）」の文字は出ない）で確認する。凡例にも ✅ があるため、行の本文（${SEARCH_AUTO_SENT_ROW_TEXT}）と組み合わせて、行の中の ✅ を確認する
# 外部条件: ${SEARCH_AUTO_SENT_ROW_TEXT} は、自動送信が完了した SMS の本文に含まれる文字（vars）。実施日に端末の SMS に合わせて書き換える
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "ログの確認"
- extendedWaitUntil:
    visible: '(?s).*\[送信完了\].*'
    timeout: 180000
- pressKey: Back
- tapOn: "SMSの検索"
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "検索条件"
- runFlow:
    file: common/scroll-down-and-tap-by-id.yaml
    env:
      ID: cbSmsSearchSendNoneOnly
      INDEX: 0
- runFlow:
    file: common/assert-checked-by-id.yaml
    env:
      ID: cbSmsSearchSendNoneOnly
      INDEX: 0
- runFlow:
    file: common/scroll-down-and-tap-by-id.yaml
    env:
      ID: cbSmsSearchSentAutoOnly
      INDEX: 0
- runFlow:
    file: common/assert-checked-by-id.yaml
    env:
      ID: cbSmsSearchSentAutoOnly
      INDEX: 0
- tapOn: "検索"
- assertVisible: '(?s).*✅.*${SEARCH_AUTO_SENT_ROW_TEXT}.*'
- takeScreenshot: 2.7-04-search-sent-auto-only-01

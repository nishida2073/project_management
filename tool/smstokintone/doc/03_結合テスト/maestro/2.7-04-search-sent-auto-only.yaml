# 2.7 SMSの検索: 済（自動）のみで検索すると、自動で登録済みの SMS だけが表示される（テスト仕様書の 2.7 の 4 に対応）
# 前提: setup（clearState と JSON 投入）から開始する。端末に SMS が 1 件以上ある（SMS の読み取りを許可しておく）
# 外部条件: 自動送信が完了した SMS が 1 件以上ある状態が必要。setup の clearState で送信ログが消えるため、この flow だけでは作れない（未確認: 2.8 の 1 と同じ SMS の受信を、この flow の前に行う手順）
# 未確認: 一覧の表示文字（送信状況：済（自動））は、スクリーンショットで確認する
appId: com.ssfrontier.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "SMSの検索"
- assertVisible: "検索条件"
- tapOn:
    id: "com.ssfrontier.smstokintone:id/cbSmsSearchSendNoneOnly"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/cbSmsSearchSendNoneOnly"
    checked: false
- tapOn:
    id: "com.ssfrontier.smstokintone:id/cbSmsSearchSentAutoOnly"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/cbSmsSearchSentAutoOnly"
    checked: true
- tapOn: "検索"
- assertVisible: '.*件見つかりました.*'
- takeScreenshot: 2.7-04-search-sent-auto-only-01

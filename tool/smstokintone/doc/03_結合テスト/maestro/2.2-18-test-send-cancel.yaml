# 2.2 送信先の設定: テスト送信をキャンセルする（テスト仕様書の 2.2 の 18 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "送信先の設定"
- takeScreenshot: 2.2-18-test-send-cancel-01
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "設定を追加"
- runFlow:
    file: common/scroll-down-and-assert-text-by-id.yaml
    env:
      ID: etSendTargetName
      INDEX: 0
      TEXT: "test-send-target-1"
- runFlow:
    file: common/scroll-down-and-assert-text-by-id.yaml
    env:
      ID: etKeyword
      INDEX: 0
      TEXT: "test-company"
- scrollUntilVisible:
    element: "テスト送信"
    direction: DOWN
- tapOn: "テスト送信"
- takeScreenshot: 2.2-18-test-send-cancel-02
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "テスト本文"
- tapOn: "キャンセル"
- takeScreenshot: 2.2-18-test-send-cancel-03
- assertNotVisible: "テスト本文"
- assertNotVisible: "テスト結果"
- takeScreenshot: 2.2-18-test-send-cancel-04

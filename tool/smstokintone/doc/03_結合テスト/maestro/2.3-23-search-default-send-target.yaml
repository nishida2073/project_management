# 2.3 アプリの設定: SMSの検索の送信先の初期値を選ぶ（テスト仕様書の 2.3 の 23 に対応）
appId: com.ssfrontier.smstokintone
---
# 前提: 送信先 "${SEND_TARGET_NAME}" が 1 件ある（2.2 は追加後に削除するため、手動で用意する）。検索条件の初期値の送信先：すべて。
- launchApp
- tapOn: "アプリの設定"
- scrollUntilVisible: # 未確認
    element:
      id: "com.ssfrontier.smstokintone:id/spDefaultSendTargetFilter"
    direction: DOWN
- tapOn:
    id: "com.ssfrontier.smstokintone:id/spDefaultSendTargetFilter"
    index: 0
- tapOn: "${SEND_TARGET_NAME}" # 未確認: スピナーの一覧に表示される項目の文字
- assertVisible: "${SEND_TARGET_NAME}"
- pressKey: Back
- tapOn: "SMSの検索"
- assertVisible: "${SEND_TARGET_NAME}" # 未確認: 検索画面のスピナーに選択内容が表示されること
- takeScreenshot: 2.3-23-search-target

# 2.2 送信先の設定: 送信先を削除する（テスト仕様書の 2.2 の 3 に対応）
# 前提: 仕様書 2.2 の前提条件（test-send-target-1 が保存済み）
# 未確認: 確認ダイアログが出ないことは、ダイアログの文言が未確認のため、画面に変化がないことで判定する
appId: com.ssfrontier.smstokintone
---
- launchApp
- tapOn: "送信先の設定"
- takeScreenshot: 2.2-03-delete-copy-send-target-01
- assertVisible: "設定を追加"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/etSendTargetName"
    index: 0
    text: "${SEND_TARGET_NAME}"
- tapOn:
    id: "com.ssfrontier.smstokintone:id/btnDeleteSendTarget"
    index: 0
- takeScreenshot: 2.2-03-delete-copy-send-target-02
- assertNotVisible: "${SEND_TARGET_NAME}"
- takeScreenshot: 2.2-03-delete-copy-send-target-03

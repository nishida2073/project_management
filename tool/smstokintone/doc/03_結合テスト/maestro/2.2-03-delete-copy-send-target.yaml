# 2.2 送信先の設定: 送信先を削除する（テスト仕様書の 2.2 の 3 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 注: 削除は確認ダイアログを出さない（コードに確認の処理が無い）。このフローは、カードが消えたことで削除を確認する
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "送信先の設定"
- takeScreenshot: 2.2-03-delete-copy-send-target-01
- assertVisible: "設定を追加"
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/etSendTargetName"
    index: 0
    text: "${SEND_TARGET_NAME}"
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/btnDeleteSendTarget"
    index: 0
- takeScreenshot: 2.2-03-delete-copy-send-target-02
- assertNotVisible: "${SEND_TARGET_NAME}"
- takeScreenshot: 2.2-03-delete-copy-send-target-03

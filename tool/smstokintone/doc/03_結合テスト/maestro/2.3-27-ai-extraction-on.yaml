# 2.3 アプリの設定: AIによる抽出を切り替える（テスト仕様書の 2.3 の 27 に対応）
appId: com.ssfrontier.smstokintone
---
# 前提: JSON（env_ok.json）の状態から開始する（AIによる抽出：なし（JSON の extractionAiEnabled）、会社名の抽出：あり、表示テーマ：ライト）。このフローで AIによる抽出をオンにする。
# 外部条件: 端末上のAI（抽出用モデル）が利用できる状態が必要か未確認
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- takeScreenshot: 2.3-27-ai-extraction-on-01
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/swCompanyNameExtractionEnabled"
    direction: DOWN
    visibilityPercentage: 100
- takeScreenshot: 2.3-27-ai-extraction-on-02
- assertVisible: # 前提の確認（会社名の抽出が有効）
    id: "com.ssfrontier.smstokintone:id/swCompanyNameExtractionEnabled"
    checked: true
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/swAiExtractionEnabled"
    direction: DOWN
    visibilityPercentage: 100
- takeScreenshot: 2.3-27-ai-extraction-on-03
- assertVisible: # 前提の確認（AIによる抽出が無効）
    id: "com.ssfrontier.smstokintone:id/swAiExtractionEnabled"
    checked: false
- tapOn:
    id: "com.ssfrontier.smstokintone:id/swAiExtractionEnabled"
    index: 0
- takeScreenshot: 2.3-27-ai-extraction-on-04
- assertVisible: # スイッチの選択状態の確認
    id: "com.ssfrontier.smstokintone:id/swAiExtractionEnabled"
    checked: true
- pressKey: Back
- takeScreenshot: 2.3-27-ai-extraction-on-05
- tapOn: "アプリの設定"
- takeScreenshot: 2.3-27-ai-extraction-on-06
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/swAiExtractionEnabled"
    direction: DOWN
    visibilityPercentage: 100
- takeScreenshot: 2.3-27-ai-extraction-on-07
- assertVisible: # 開き直した後も有効のまま保存されていること
    id: "com.ssfrontier.smstokintone:id/swAiExtractionEnabled"
    checked: true
- takeScreenshot: 2.3-27-ai-extraction-on-08

# 2.4 引継ぎ内容の設定: 会社名の抽出なしで氏名が空だと保存時に入力エラーになる（テスト仕様書の 2.4 の 10 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 未確認: 一覧の index 0 が SENDER_A。氏名欄の既存値は eraseText で消す（カーソル位置に依存する）。
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- takeScreenshot: 2.4-10-save-error-name-empty-01
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: swCompanyNameExtractionEnabled
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/swCompanyNameExtractionEnabled"
- takeScreenshot: 2.4-10-save-error-name-empty-02
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/swCompanyNameExtractionEnabled"
    checked: false
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: btnEditContinuationInfo
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/btnEditContinuationInfo"
- takeScreenshot: 2.4-10-save-error-name-empty-03
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/etContinuationSearch"
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/rbContinuationSortAscending"
    checked: true
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/etContinuationUserName"
    index: 0
    point: "95%, 50%"
- takeScreenshot: 2.4-10-save-error-name-empty-04
- eraseText: 50  # 未確認
- hideKeyboard
- tapOn: "設定を保存"
- takeScreenshot: 2.4-10-save-error-name-empty-05
- assertVisible: "入力エラー"
# 未確認: ダイアログのメッセージ（氏名は必須です）。regex は未確認。
- assertVisible: "(?s).*引継ぎ内容: ${SENDER_A}.*氏名は必須です.*"
- pressKey: Back
- takeScreenshot: 2.4-10-save-error-name-empty-06
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/etContinuationSearch"
- pressKey: Back
- takeScreenshot: 2.4-10-save-error-name-empty-07
- runFlow:
    file: common/scroll-up-to-setting.yaml
    env:
      ELEMENT_ID: swCompanyNameExtractionEnabled
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/swCompanyNameExtractionEnabled"
- takeScreenshot: 2.4-10-save-error-name-empty-08
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/swCompanyNameExtractionEnabled"
    checked: true
- takeScreenshot: 2.4-10-save-error-name-empty-09

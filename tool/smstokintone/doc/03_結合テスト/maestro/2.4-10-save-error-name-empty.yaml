# 2.4 引継ぎ内容の設定: 会社名の抽出なしで氏名が空だと保存時に入力エラーになる（テスト仕様書の 2.4 の 10 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 未確認: 一覧の index 0 が SENDER_A。氏名欄の既存値は eraseText で消す（カーソル位置に依存する）。
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- takeScreenshot: 2.4-10-save-error-name-empty-01
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: swCompanyNameExtractionEnabled
      INDEX: 0
- takeScreenshot: 2.4-10-save-error-name-empty-02
- runFlow:
    file: common/assert-id-unchecked.yaml
    env:
      ID: swCompanyNameExtractionEnabled
      INDEX: 0
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: btnEditContinuationInfo
      INDEX: 0
- takeScreenshot: 2.4-10-save-error-name-empty-03
- runFlow:
    file: common/assert-id-visible.yaml
    env:
      ID: etContinuationSearch
      INDEX: 0
- runFlow:
    file: common/assert-id-checked.yaml
    env:
      ID: rbContinuationSortAscending
      INDEX: 0
- runFlow:
    file: common/input-text-field.yaml
    env:
      ID: etContinuationUserName
      INDEX: 0
      VALUE: ""
- takeScreenshot: 2.4-10-save-error-name-empty-04
- tapOn: "設定を保存"
- takeScreenshot: 2.4-10-save-error-name-empty-05
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "入力エラー"
# 未確認: ダイアログのメッセージ（氏名は必須です）。regex は未確認。
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "(?s).*引継ぎ内容: ${SENDER_A}.*氏名は必須です.*"
- pressKey: Back
- takeScreenshot: 2.4-10-save-error-name-empty-06
- runFlow:
    file: common/assert-id-visible.yaml
    env:
      ID: etContinuationSearch
      INDEX: 0
- pressKey: Back
- takeScreenshot: 2.4-10-save-error-name-empty-07
- runFlow:
    file: common/scroll-up-to-id.yaml
    env:
      ID: swCompanyNameExtractionEnabled
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: swCompanyNameExtractionEnabled
      INDEX: 0
- takeScreenshot: 2.4-10-save-error-name-empty-08
- runFlow:
    file: common/assert-id-checked.yaml
    env:
      ID: swCompanyNameExtractionEnabled
      INDEX: 0
- takeScreenshot: 2.4-10-save-error-name-empty-09

# 2.8 自動処理: SMSの返信モードが自動のとき、抽出が異常なSMSに返信する（テスト仕様書の 2.8 の 13 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（フローで設定）: SMSの返信モードを自動に切り替える
# 外部条件: 別端末から SMS を送る。送信元 test-phone-b、本文は 1 行だけの抽出できない本文。待ち時間（下の extendedWaitUntil）に送る
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/rbSmsReplyModeAuto"
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/rbSmsReplyModeAuto"
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/rbSmsReplyModeAuto"
    checked: true
- pressKey: Back
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/btnTopOpenLog"
- takeScreenshot: 2.8-13-auto-reply-extraction-failed-01
- extendedWaitUntil:
    visible: "(?s).*SMSを受信しました.*"
    timeout: 180000
- extendedWaitUntil:
    visible: "(?s).*抽出状況が異常なため、SMSを返信しました.*"
    timeout: 180000
- takeScreenshot: 2.8-13-auto-reply-extraction-failed-02
- longPressOn: "(?s).*抽出状況が異常なため.*"
- assertVisible: "返信内容"
- takeScreenshot: 2.8-13-auto-reply-extraction-failed-03

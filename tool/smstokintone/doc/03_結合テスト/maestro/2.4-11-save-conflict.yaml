# 2.4 引継ぎ内容の設定: 画面を開いた後に SMS を受信して引継ぎ内容が更新されていると、保存に失敗する（テスト仕様書の 2.4 の 11 に対応）
# 注: 引継ぎ内容の更新は、テストデータの SMS の受信（test-data\sms\2.4-11-save-conflict.json）で行い、保存の前に届くように時間を合わせる
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- runFlow:
    file: common/scroll-down-and-tap-by-id.yaml
    env:
      ID: btnEditContinuationInfo
      INDEX: 0
- tapOn: "設定を保存"
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "保存に失敗しました"
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "SMSの受信などで内容が更新されたため、保存ができませんでした"

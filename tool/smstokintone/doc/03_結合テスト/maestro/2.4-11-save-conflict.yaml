# 2.4 引継ぎ内容の設定: 保存時に内容が更新されていると保存に失敗する（テスト仕様書の 2.4 の 11 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（JSON）: test-data/setup/env_ok.json を投入した直後の状態。送信元 test-sender-a（古い）と test-sender-b（新しい）、送信先 test-send-target-1（振り分け: test-company）、会社名の抽出: あり、引継ぎ内容の氏名表示: あり。
# 前提（この flow で設定）: 最初に setup/setup-import-environment.yaml で JSON を投入し直し、前の flow の変更（削除など）を戻す。表示順序は投入後の既定（古い順）。
# 外部条件: 画面を開いてから保存するまでの間に、SMSの受信などで送信元 B（test-sender-b）の内容が更新されている必要がある。この flow の操作だけでは作れないため、更新は手動で行う（未確認: 手順）。
# 未確認: 一覧の index 1 が SENDER_B。会社名欄の既存値は eraseText で消す（カーソル位置に依存する）。
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- takeScreenshot: 2.4-11-save-conflict-01
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/btnEditContinuationInfo"
    direction: DOWN
- tapOn:
    id: "com.ssfrontier.smstokintone:id/btnEditContinuationInfo"
- takeScreenshot: 2.4-11-save-conflict-02
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/etContinuationSearch"
# 前提確認（表示のみ、操作しない）
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/rbContinuationSortAscending"
    checked: true
# 外部条件: 送信元 B（test-sender-b）の内容は、この画面を開いた後に SMSの受信などで更新しておく（手順は未確認）。
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/etContinuationCompanyName"
      index: 1
    direction: DOWN
    visibilityPercentage: 100
- runFlow:
    file: common/input-second-text-field.yaml
    env:
      FIELD_ID: etContinuationCompanyName
      INPUT_VALUE: "${COMPANY_NAME_3}"
- takeScreenshot: 2.4-11-save-conflict-03
- tapOn: "設定を保存"
# 未確認: ダイアログのタイトルとメッセージ。
- takeScreenshot: 2.4-11-save-conflict-04
- assertVisible: "保存に失敗しました"
- assertVisible: "SMSの受信などで内容が更新されたため、保存ができませんでした"
- pressKey: Back
- takeScreenshot: 2.4-11-save-conflict-05
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/etContinuationSearch"
- takeScreenshot: 2.4-11-save-conflict-06

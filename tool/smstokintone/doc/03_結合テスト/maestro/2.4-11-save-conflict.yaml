# 2.4 引継ぎ内容の設定: 保存時に内容が更新されていると保存に失敗する（テスト仕様書の 2.4 の 11 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 外部条件: 画面を開いてから保存するまでの間に、SMSの受信などで送信元 B（test-sender-b）の内容が更新されている必要がある。この flow の操作だけでは作れないため、更新は手動で行う（未確認: 手順）。
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- takeScreenshot: 2.4-11-save-conflict-01
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: btnEditContinuationInfo
      INDEX: 0
- takeScreenshot: 2.4-11-save-conflict-02
- runFlow:
    file: common/assert-id-visible.yaml
    env:
      ID: etContinuationSearch
      INDEX: 0
- runFlow:
    file: common/assert-id-checked.yaml
    env:
      ID: rbContinuationSortAscending
      INDEX: 0
# 外部条件: 送信元 B（test-sender-b）の内容は、この画面を開いた後に SMSの受信などで更新しておく（手順は未確認）。
- runFlow:
    file: common/scroll-down-to-id.yaml
    env:
      ID: etContinuationCompanyName
- runFlow:
    file: common/input-text-field.yaml
    env:
      ID: etContinuationCompanyName
      INDEX: 1
      VALUE: "${COMPANY_NAME_3}"
- takeScreenshot: 2.4-11-save-conflict-03
- tapOn: "設定を保存"
- takeScreenshot: 2.4-11-save-conflict-04
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "保存に失敗しました"
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "SMSの受信などで内容が更新されたため、保存ができませんでした"
- pressKey: Back
- takeScreenshot: 2.4-11-save-conflict-05
- runFlow:
    file: common/assert-id-visible.yaml
    env:
      ID: etContinuationSearch
      INDEX: 0
- takeScreenshot: 2.4-11-save-conflict-06

# 2.8 自動処理: SMSの受信の許可がないと、SMSの受信が配信されず、ログが残らない（テスト仕様書の 2.8 の 23 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 外部条件: 手動。端末の設定で SMS の受信の許可を取り消してから、このフローを実行する。終わったら許可を戻す
# 外部条件: 別端末から SMS を送る。送信元は既定（test-phone-a）、本文は 1 行目「test-company」、2 行目「test-taro」、3 行目「body-test」。待ち時間（下の extendedWaitUntil の代わりに、目視で確認する）に送る
# 未確認: RECEIVE_SMS がないときに受信が配信されない想定。配信されない場合の確認は、ログの画面に何も出ないことを目視で判定する（待ち時間のない確認）
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- runFlow:
    file: common/scroll-down-to-id.yaml
    env:
      ID: tvPermissionStatus
- runFlow:
    file: common/assert-field-text-not-visible.yaml
    env:
      ID: tvPermissionStatus
      INDEX: 0
      TEXT: "許可済み"
- takeScreenshot: 2.8-23-receive-permission-denied-01
- pressKey: Back
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: btnTopOpenLog
      INDEX: 0
- takeScreenshot: 2.8-23-receive-permission-denied-02
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "ログがありません"
- takeScreenshot: 2.8-23-receive-permission-denied-03

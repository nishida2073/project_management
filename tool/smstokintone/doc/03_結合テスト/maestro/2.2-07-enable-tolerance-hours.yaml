# 2.2 送信先の設定: 統合範囲の入力欄を有効にする（テスト仕様書の 2.2 の 7 に対応）
appId: com.ssfrontier.smstokintone
---
# 前提: 仕様書 2.2 の前提条件（統合条件は既定の同一日付）
# 未確認: 統合範囲が空であることは確認していない（空の判定が未確認）
- launchApp
- tapOn: "送信先の設定"
- assertVisible: "設定を追加"
# 前提確認: 統合条件は同一日付（既定）
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/rbUpdateToleranceModeSameDate"
      index: 0
    direction: DOWN
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/rbUpdateToleranceModeSameDate"
    index: 0
    checked: true
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/rbUpdateToleranceModeHours"
    direction: DOWN
- tapOn:
    id: "com.ssfrontier.smstokintone:id/rbUpdateToleranceModeHours"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/etUpdateToleranceHours"
    enabled: true
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/etUpdateToleranceHours"
    direction: DOWN
- tapOn:
    id: "com.ssfrontier.smstokintone:id/etUpdateToleranceHours"
- eraseText: 50  # 未確認
- inputText: "${TOLERANCE_HOURS_INPUT}"
- hideKeyboard
- takeScreenshot: 2.2-07-tolerance-enabled

# 2.3 アプリの設定: 引継ぎ内容の氏名表示を切り替える（テスト仕様書の 2.3 の 25 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（フローで設定）: 引継ぎ内容の氏名表示をオフにする（JSON では有効）
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- runFlow:
    file: common/scroll-up-to-setting.yaml
    env:
      ELEMENT_ID: rbThemeLight
- takeScreenshot: 2.3-25-continuation-show-user-name-off-01
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: swContinuationEnabled
- takeScreenshot: 2.3-25-continuation-show-user-name-off-02
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/swContinuationEnabled"
    checked: true
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: swContinuationShowUserNameEnabled
- takeScreenshot: 2.3-25-continuation-show-user-name-off-03
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/swContinuationShowUserNameEnabled"
    checked: true
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: swContinuationShowUserNameEnabled
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/swContinuationShowUserNameEnabled"
    index: 0
- takeScreenshot: 2.3-25-continuation-show-user-name-off-04
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: swContinuationShowUserNameEnabled
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/swContinuationShowUserNameEnabled"
    checked: false
- pressKey: Back
- takeScreenshot: 2.3-25-continuation-show-user-name-off-05
- tapOn: "アプリの設定"
- runFlow:
    file: common/scroll-up-to-setting.yaml
    env:
      ELEMENT_ID: rbThemeLight
- takeScreenshot: 2.3-25-continuation-show-user-name-off-06
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: swContinuationShowUserNameEnabled
- takeScreenshot: 2.3-25-continuation-show-user-name-off-07
- assertVisible: # 開き直した後も無効のまま保存されていること
    id: "jp.co.nttdata_univ.smstokintone:id/swContinuationShowUserNameEnabled"
    checked: false
- takeScreenshot: 2.3-25-continuation-show-user-name-off-08

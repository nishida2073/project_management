# 2.6 ログ: 更新を押すと一覧と凡例が表示される（テスト仕様書の 2.6 の 1 に対応）
# 前提（フローで設定）: 送信ログは in-flow で作る（SMSの検索から手動で送信する）。送信開始（先）と送信完了（後）の 2 件が、この順に記録される
# 外部条件: 端末に未送信の SMS が 1 件以上ある
# 注: 並び順は未確認（仕様書どおり、この flow では確認しない）。送信完了と送信開始の 2 件が表示されることを確認する
# 注: 送信の 2 件だけがログにある前提。送信完了と送信開始は、それぞれ index 0 で表示されることを確認する
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "SMSの検索"
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "検索条件"
- tapOn: "検索"
- tapOn: "全選択"
- tapOn: "選択したSMSを送信"
- pressKey: Back
- tapOn: "ログの確認"
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "ログの一覧"
- takeScreenshot: 2.6-01-refresh-legend-01
- runFlow:
    file: common/scroll-down-and-tap-by-id.yaml
    env:
      ID: btnRefreshLog
      INDEX: 0
- extendedWaitUntil:
    visible: '(?s).*\[(送信完了|失敗)\].*'
    timeout: 180000
- assertVisible: '(?s).*抽出対象.*抽出状況.*送信状況.*返信状況.*送信先.*'
- assertVisible:
    text: '\[送信完了\].*'
    index: 0
- assertVisible:
    text: '\[送信開始\].*'
    index: 0
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "ログの一覧"
- takeScreenshot: 2.6-01-refresh-legend-02

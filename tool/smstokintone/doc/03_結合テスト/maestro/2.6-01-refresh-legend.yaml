# 2.6 ログ: 更新を押すと一覧と凡例が表示される（テスト仕様書の 2.6 の 1 に対応）
# 前提: setup（clearState と JSON 投入）から開始する。送信ログは in-flow で作る（SMSの検索から手動で送信する）。送信開始（先）と送信完了（後）の 2 件が、この順に記録される
# 外部条件: 端末に未送信の SMS が 1 件以上ある
# 確認: 新しい順は、後に記録された「送信完了」の行が、先に記録された「送信開始」の行より上に表示されることで確認する（ログは記録順に先頭へ追加される、LogActivity と SmsLogStore）
# 未確認: 相対指定（below）で行の上下を比べる方法は、端末で未確認
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- runFlow: common/create-log-by-manual-send.yaml
- tapOn: "ログの確認"
- assertVisible: "ログの一覧"
- takeScreenshot: 2.6-01-refresh-legend-01
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/btnRefreshLog"
- assertVisible: '(?s).*抽出対象.*抽出状況.*送信状況.*返信状況.*送信先.*'
- assertVisible:
    text: '\[送信完了\].*'
- assertVisible:
    text: '\[送信開始\].*'
    below:
      text: '\[送信完了\].*'
- assertVisible: "ログの一覧"
- takeScreenshot: 2.6-01-refresh-legend-02

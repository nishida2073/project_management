# 2.3 アプリの設定: SMSの検索の送信状況の初期値「未送信」を切り替える（テスト仕様書の 2.3 の 24 に対応）
appId: com.ssfrontier.smstokintone
---
# 前提: JSON（env_ok.json）の状態から開始する。検索条件の初期値の送信状況は JSON に指定がなく、アプリの既定値（すべてオフ）。このフローで「未送信」をオンにする。
- launchApp
- tapOn: "アプリの設定"
- takeScreenshot: 2.3-24-search-default-send-none-01
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/cbSearchSendNoneOnlyEnabled"
    direction: DOWN
    visibilityPercentage: 100
- takeScreenshot: 2.3-24-search-default-send-none-02
- tapOn:
    id: "com.ssfrontier.smstokintone:id/cbSearchSendNoneOnlyEnabled"
    index: 0
- takeScreenshot: 2.3-24-search-default-send-none-03
- assertVisible: # 未確認: チェックボックスの選択状態の確認
    id: "com.ssfrontier.smstokintone:id/cbSearchSendNoneOnlyEnabled"
    checked: true
- pressKey: Back
- takeScreenshot: 2.3-24-search-default-send-none-04
- tapOn: "SMSの検索"
- takeScreenshot: 2.3-24-search-default-send-none-05
- assertVisible: # 未確認: 検索画面の送信状況「未送信」の選択状態
    id: "com.ssfrontier.smstokintone:id/cbSmsSearchSendNoneOnly"
    checked: true
- takeScreenshot: 2.3-24-search-default-send-none-06

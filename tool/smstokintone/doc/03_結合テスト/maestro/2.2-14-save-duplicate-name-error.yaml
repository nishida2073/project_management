# 2.2 送信先の設定: 送信先名が重複するとき保存でエラーになる（テスト仕様書の 2.2 の 14 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（フローで設定）: このフローの中で 2 件目を追加し、同じ送信先名と、重複の判定までに必須となる項目（アプリID・ログイン名・パスワード）を入力する
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "送信先の設定"
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "設定を追加"
- runFlow:
    file: common/scroll-down-and-assert-text-by-id.yaml
    env:
      ID: etSendTargetName
      INDEX: 0
      TEXT: "${DUPLICATE_SEND_TARGET_NAME}"
- tapOn: "設定を追加"
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "設定 2"
- scrollUntilVisible:
    element:
      text: "設定 2"
    direction: DOWN
- runFlow:
    file: common/scroll-down-and-tap-by-id.yaml
    env:
      ID: etSendTargetName
      INDEX: 0
- inputText: "${DUPLICATE_SEND_TARGET_NAME}"
- hideKeyboard
- runFlow:
    file: common/scroll-down-and-assert-text-by-id.yaml
    env:
      ID: etSendTargetName
      INDEX: 0
      TEXT: "${DUPLICATE_SEND_TARGET_NAME}"
- runFlow:
    file: common/scroll-down-by-id.yaml
    env:
      ID: etLoginName
- runFlow:
    file: common/input-text-by-id.yaml
    env:
      ID: etLoginName
      INDEX: 0
      VALUE: "${DUP_LOGIN_NAME}"
- runFlow:
    file: common/scroll-down-by-id.yaml
    env:
      ID: etLoginPassword
- runFlow:
    file: common/input-password-by-id.yaml
    env:
      ID: etLoginPassword
      VALUE: "${DUP_LOGIN_PASSWORD}"
- runFlow:
    file: common/scroll-down-by-id.yaml
    env:
      ID: etAppId
- runFlow:
    file: common/input-text-by-id.yaml
    env:
      ID: etAppId
      INDEX: 0
      VALUE: "${DUP_APP_ID}"
- takeScreenshot: 2.2-14-save-duplicate-name-error-01
- tapOn: "設定を保存"
- takeScreenshot: 2.2-14-save-duplicate-name-error-02
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "入力エラー"
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "(?s).*送信先名が重複しています\n${DUPLICATE_SEND_TARGET_NAME}.*"
- takeScreenshot: 2.2-14-save-duplicate-name-error-03

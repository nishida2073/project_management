# 2.8 自動処理: SMSを受信すると、登録のログと引継ぎ内容が残る（テスト仕様書の 2.8 の 1 に対応）
# 外部条件: 別端末から SMS を送る。送信元 test-phone-a、本文は 1 行目「test-company」、2 行目「test-taro」、3 行目「body-test-1」。ログの画面で待つ間（下の extendedWaitUntil）に別端末から送る
# 未確認: ログの一覧に送信先名（test-send-target-1）が表示されるかは未確認。kintone の登録内容は kintone 側で確認する
# 未確認: 送信先の設定の接続先（サブドメイン）が JSON の値のまま変わらないことは、接続情報のため flow には書かない。手動で確認する。送信先名の確認は下の assertVisible で行う
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: btnTopOpenLog
      INDEX: 0
- takeScreenshot: 2.8-01-receive-auto-process-01
- extendedWaitUntil:
    visible: "(?s).*SMSを受信しました.*"
    timeout: 180000
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "(?s).*SMSの登録に成功しました.*"
- takeScreenshot: 2.8-01-receive-auto-process-02
- pressKey: Back
- tapOn: "送信先の設定"
- runFlow:
    file: common/scroll-down-and-assert-field-text.yaml
    env:
      ID: etSendTargetName
      INDEX: 0
      TEXT: "test-send-target-1"
- takeScreenshot: 2.8-01-receive-auto-process-03
- pressKey: Back
- tapOn: "アプリの設定"
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: btnEditContinuationInfo
      INDEX: 0
- runFlow:
    file: common/scroll-down-and-assert-field-text.yaml
    env:
      ID: tvSenderAddress
      INDEX: 0
      TEXT: "test-phone-a"
- runFlow:
    file: common/scroll-down-and-assert-field-text.yaml
    env:
      ID: etContinuationCompanyName
      INDEX: 0
      TEXT: "TEST－COMPANY"
- runFlow:
    file: common/scroll-down-and-assert-field-text.yaml
    env:
      ID: etContinuationUserName
      INDEX: 0
      TEXT: "test-taro"
- takeScreenshot: 2.8-01-receive-auto-process-04

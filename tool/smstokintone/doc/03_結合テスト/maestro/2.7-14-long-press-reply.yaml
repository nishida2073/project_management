# 2.7 SMSの検索: SMSの項目を長押しすると、標準の SMS アプリで返信が開く（テスト仕様書の 2.7 の 14 に対応）
# 前提（フローで設定）: 端末に SMS が 1 件以上ある
# 注: 長押しする項目は、変数 SMS_ITEM_TEXT（端末の SMS の本文の一部。端末ごとに書き換える）で指定する
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "SMSの検索"
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "検索条件"
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: cbSmsSearchSendNoneOnly
      INDEX: 0
- runFlow:
    file: common/assert-id-checked.yaml
    env:
      ID: cbSmsSearchSendNoneOnly
      INDEX: 0
- tapOn: "検索"
- extendedWaitUntil:
    visible: "(?s).*${SMS_ITEM_TEXT}.*"
    timeout: 60000
- longPressOn: "(?s).*${SMS_ITEM_TEXT}.*"
- takeScreenshot: 2.7-14-long-press-reply-01
- assertVisible: '(?s).*${REPLY_BODY_FRAGMENT}.*'
- takeScreenshot: 2.7-14-long-press-reply-02

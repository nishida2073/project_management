# 2.3 アプリの設定: SMSの読み取りの権限を許可する（テスト仕様書の 2.3 の 14 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（JSON）: 表示テーマ：ライト、SMSの送信モード：自動、SMSの返信モード：手動、引継ぎ：あり
# 前提（フローで設定）: SMSの読み取りの権限を許可する
# 外部条件: SMSの読み取りの権限を許可していない状態で開始する必要があります（端末の権限設定で用意します。許可済みの場合は「許可する」ボタンが表示されません）
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- takeScreenshot: 2.3-14-permission-read-grant-01
- assertVisible: "端末の許可"
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/btnRequestReadPermission"
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/btnRequestReadPermission"
# 未確認: システムの許可ダイアログのボタン文言（端末の言語で変わります）
- takeScreenshot: 2.3-14-permission-read-grant-02
- tapOn: "許可"
- takeScreenshot: 2.3-14-permission-read-grant-03
- assertNotVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/btnRequestReadPermission"
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/tvReadPermissionStatus"
    text: "許可済み"
- takeScreenshot: 2.3-14-permission-read-grant-04

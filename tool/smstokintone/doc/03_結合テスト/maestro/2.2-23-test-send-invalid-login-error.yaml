# 2.2 送信先の設定: ログイン名が不正なときテスト送信が失敗する（テスト仕様書の 2.2 の 23 に対応）
appId: com.ssfrontier.smstokintone
---
# 前提: 仕様書 2.2 の前提条件（test-send-target-1（振り分け：test-company）が保存済み）。このフローでログイン名を不正な値にする
# 外部条件: kintone 接続が必要（不正なログイン名の応答を得るため）
# テスト送信は画面の未保存の入力値（ログイン名）を使う
- launchApp
- tapOn: "送信先の設定"
- takeScreenshot: 2.2-23-test-send-invalid-login-error-01
- assertVisible: "設定を追加"
# 前提確認: test-send-target-1（振り分け：test-company）が保存済み
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/etSendTargetName"
    index: 0
    text: "test-send-target-1"
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/etKeyword"
      index: 0
    direction: DOWN
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/etKeyword"
    index: 0
    text: "test-company"
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/etLoginName"
    direction: DOWN
    direction: DOWN
- tapOn:
    id: "com.ssfrontier.smstokintone:id/etLoginName"
    index: 0
    point: "95%, 50%"
- takeScreenshot: 2.2-23-test-send-invalid-login-error-02
- eraseText: 50  # 未確認
- inputText: "${INVALID_LOGIN_NAME}"
- takeScreenshot: 2.2-23-test-send-invalid-login-error-03
- hideKeyboard
- scrollUntilVisible:
    element: "テスト送信"
    direction: DOWN
- tapOn: "テスト送信"
- takeScreenshot: 2.2-23-test-send-invalid-login-error-04
- assertVisible: "テスト本文"
- tapOn: "送信"
- takeScreenshot: 2.2-23-test-send-invalid-login-error-05
- assertVisible: ".*送信失敗.*"  # 未確認
# 未確認: kintone の応答内容は kintone 側の応答文に依存するため、ここでは確認しない
- takeScreenshot: 2.2-23-test-send-invalid-login-error-06

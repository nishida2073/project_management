# 2.8 自動処理: 2 通目の本文に会社名がなくても、引継ぎの会社名で振り分けられる（テスト仕様書の 2.8 の 3 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 外部条件: 別端末から SMS を送る。1 通目は送信元 test-phone-a、本文は 1 行目「test-company」、2 行目「test-taro」、3 行目「body-test-1」。2 通目は同じ送信元、本文は「body-test-3」（会社名と氏名を含まない）
# 前提（フローで設定）: （この行の中で行う）: 1 通目を受信してから、2 通目を受信する
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/btnTopOpenLog"
- takeScreenshot: 2.8-03-receive-continuation-by-company-01
- extendedWaitUntil:
    visible: "(?s).*SMSの登録に成功しました.*"
    timeout: 180000
- takeScreenshot: 2.8-03-receive-continuation-by-company-02
- extendedWaitUntil:
    visible: "(?s).*SMSの更新に成功しました.*"
    timeout: 180000
- assertVisible: "(?s).*SMSの更新に成功しました.*"
- takeScreenshot: 2.8-03-receive-continuation-by-company-03

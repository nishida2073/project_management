# 2.4 引継ぎ内容の設定: 氏名表示をオフにしても、引継ぎ内容の設定では氏名が表示される（テスト仕様書の 2.4 の 7 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（JSON）: test-data/setup/env_ok.json を投入した直後の状態。送信元 test-sender-a（古い）と test-sender-b（新しい）、送信先 test-send-target-1（振り分け: test-company）、会社名の抽出: あり、引継ぎ内容の氏名表示: あり。
# 前提（この flow で設定）: 最初に setup/setup-import-environment.yaml で JSON を投入し直し、前の flow の変更（削除など）を戻す。表示順序は投入後の既定（古い順）。
# 前提（JSON）: 引継ぎ内容の氏名表示は「あり」（JSON の値）。この flow で「なし」に切り替える。
# 氏名は、氏名表示の設定に関係なく引継ぎ内容の設定で表示される。sender B の氏名（CONTINUATION_USER_NAME_B）で確認する
# 実装: 引継ぎ内容の設定の画面は、swContinuationShowUserNameEnabled を参照せず、氏名欄を常に表示する。
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- takeScreenshot: 2.4-07-show-user-name-off-01
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/swContinuationShowUserNameEnabled"
    direction: DOWN
    visibilityPercentage: 100
# 前提確認（表示のみ、操作しない）
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/swContinuationShowUserNameEnabled"
    checked: true
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/swContinuationShowUserNameEnabled"
- takeScreenshot: 2.4-07-show-user-name-off-02
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/swContinuationShowUserNameEnabled"
    checked: false
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/btnEditContinuationInfo"
    direction: UP
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/btnEditContinuationInfo"
- takeScreenshot: 2.4-07-show-user-name-off-03
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/etContinuationSearch"
# 前提確認（表示のみ、操作しない）
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/rbContinuationSortAscending"
    checked: true
- assertVisible: "氏名"
- assertVisible: "${CONTINUATION_USER_NAME_B}"
- takeScreenshot: 2.4-07-show-user-name-off-04

# 2.4 引継ぎ内容の設定: 氏名表示をオフにしても、引継ぎ内容の設定では氏名が表示される（テスト仕様書の 2.4 の 7 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 氏名は、氏名表示の設定に関係なく引継ぎ内容の設定で表示される。sender B の氏名（CONTINUATION_USER_NAME_B）で確認する
# 実装: 引継ぎ内容の設定の画面は、swContinuationShowUserNameEnabled を参照せず、氏名欄を常に表示する。
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- takeScreenshot: 2.4-07-show-user-name-off-01
- runFlow:
    file: common/scroll-down-to-id.yaml
    env:
      ID: swContinuationShowUserNameEnabled
- runFlow:
    file: common/assert-id-checked.yaml
    env:
      ID: swContinuationShowUserNameEnabled
      INDEX: 0
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: swContinuationShowUserNameEnabled
      INDEX: 0
- takeScreenshot: 2.4-07-show-user-name-off-02
- runFlow:
    file: common/assert-id-unchecked.yaml
    env:
      ID: swContinuationShowUserNameEnabled
      INDEX: 0
- runFlow:
    file: common/scroll-up-to-id.yaml
    env:
      ID: btnEditContinuationInfo
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: btnEditContinuationInfo
      INDEX: 0
- takeScreenshot: 2.4-07-show-user-name-off-03
- runFlow:
    file: common/assert-id-visible.yaml
    env:
      ID: etContinuationSearch
      INDEX: 0
- runFlow:
    file: common/assert-id-checked.yaml
    env:
      ID: rbContinuationSortAscending
      INDEX: 0
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "氏名"
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "${CONTINUATION_USER_NAME_B}"
- takeScreenshot: 2.4-07-show-user-name-off-04

# 2.6 ログ: 本文の表示文字数を 50 にした後に記録されたログは、50 文字以内で表示される（テスト仕様書の 2.6 の 6 に対応）
# 前提（フローで設定）: このフローで本文の最大表示文字数を 50 にし、最後に JSON の値（100）へ戻す
# 外部条件: 別の端末から、次の本文の SMS を 1 通受信する（下の assert の待ち時間の間に受信させる）。本文は、1 行目「test-company」、2 行目「test-taro」（LF の改行、各 1 文字）、3 行目に「${LOG_BODY_EXCERPT_LAST_CHARS}」、続けて「TAILMARK-AFTER-50」（合計 67 文字。50 文字目は「${LOG_BODY_EXCERPT_LAST_CHARS}」の末尾の Q）
# 注: 本文抜粋は SmsLogStore.add で記録時の文字数（logBodyExcerptLength）に切り取られるため（body.take）、既存のログは 100 文字のまま（この flow では既存のログを作らない）。受信の前に、この flow で文字数を 50 にしておく必要がある
# 注: vars の LOG_BODY_EXCERPT_LAST_CHARS は、送る本文と合わせる。TAILMARK-AFTER-50 は固定の文字列で、vars には置かない。実施日に送る本文を変えたら、vars も書き換える
# 未確認: 「外部条件」の assert の timeout の指定が、この Maestro で使えるか
# 未確認: 端末が改行を CRLF で送る場合は文字数が 1 つずれるため、その場合は本文を組み直す
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/etLogBodyExcerptLength"
    direction: DOWN
    visibilityPercentage: 100
- runFlow:
    file: common/input-number-field.yaml
    env:
      FIELD_ID: etLogBodyExcerptLength
      INPUT_VALUE: "${LOG_BODY_EXCERPT_LENGTH}"
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/etLogBodyExcerptLength"
    text: "${LOG_BODY_EXCERPT_LENGTH}"
- takeScreenshot: 2.6-06-body-excerpt-50-01
- pressKey: Back
- tapOn: "ログの確認"
- assertVisible: "ログの一覧"
- assertVisible:
    text: '(?s).*\[受信完了\].*'
    timeout: 60000
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/btnRefreshLog"
- takeScreenshot: 2.6-06-body-excerpt-50-02
- assertVisible: '(?s).*test-company.*'
- assertVisible: '(?s).*${LOG_BODY_EXCERPT_LAST_CHARS}.*'
- assertNotVisible: '(?s).*TAILMARK-AFTER-50.*'
- pressKey: Back
- tapOn: "アプリの設定"
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/etLogBodyExcerptLength"
    direction: DOWN
    visibilityPercentage: 100
- runFlow:
    file: common/input-number-field.yaml
    env:
      FIELD_ID: etLogBodyExcerptLength
      INPUT_VALUE: "${LOG_BODY_EXCERPT_DEFAULT}"
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/etLogBodyExcerptLength"
    text: "${LOG_BODY_EXCERPT_DEFAULT}"
- takeScreenshot: 2.6-06-body-excerpt-50-03

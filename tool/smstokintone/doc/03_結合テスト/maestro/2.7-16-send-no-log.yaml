# 2.7 SMSの検索: 送信のログがない状態で送信しても、送信は完了し、一覧が再検索される（テスト仕様書の 2.7 の 16 に対応）
# 前提: setup（clearState と JSON 投入）から開始する。送信のログは空（setup の clearState による）。端末に SMS が 1 件以上ある（SMS の読み取りを許可しておく）
# 未確認: 仕様書の「送信のログがない場合の条件」は、この flow の前提（ログが空）と同じとみなす
appId: com.ssfrontier.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "SMSの検索"
- assertVisible: "検索条件"
- tapOn:
    id: "com.ssfrontier.smstokintone:id/cbSmsSearchSendNoneOnly"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/cbSmsSearchSendNoneOnly"
    checked: false
- tapOn: "検索"
- assertVisible: '.*件見つかりました.*'
- tapOn: "全選択"
- tapOn: "選択したSMSを送信"
- assertVisible: '(?s).*SMSの送信が完了しました.*'
- assertVisible: '.*件見つかりました.*'
- takeScreenshot: 2.7-16-send-no-log-01

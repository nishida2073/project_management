# 2.7 SMSの検索: 送信のログがない状態で送信しても、送信は完了し、一覧が再検索される（テスト仕様書の 2.7 の 16 に対応）
# 前提（フローで設定）: 端末に SMS が 1 件以上ある
# 未確認: 仕様書の「送信のログがない場合の条件」は、setup の clearState で送信のログが空の状態と同じとみなす
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "SMSの検索"
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "検索条件"
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: cbSmsSearchSendNoneOnly
      INDEX: 0
- runFlow:
    file: common/assert-id-unchecked.yaml
    env:
      ID: cbSmsSearchSendNoneOnly
      INDEX: 0
- tapOn: "検索"
- tapOn: "全選択"
- tapOn: "選択したSMSを送信"
- tapOn: "ログの確認"
- extendedWaitUntil:
    visible: '(?s).*\[(送信完了|失敗)\].*'
    timeout: 180000
- pressKey: Back
- takeScreenshot: 2.7-16-send-no-log-01

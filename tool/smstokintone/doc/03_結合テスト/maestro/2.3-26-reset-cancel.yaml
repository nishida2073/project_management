# 2.3 アプリの設定: 初期化の確認ダイアログで「キャンセル」を押す（テスト仕様書の 2.3 の 26 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（フローで設定）: 表示テーマをダークに切り替え、初期化の確認ダイアログで「キャンセル」を押したあとも、ダークのまま残ることを確認する
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- runFlow:
    file: common/scroll-up-by-id.yaml
    env:
      ID: rbThemeLight
- takeScreenshot: 2.3-26-reset-cancel-01
- runFlow:
    file: common/scroll-down-by-id.yaml
    env:
      ID: rbThemeDark
- takeScreenshot: 2.3-26-reset-cancel-02
- runFlow:
    file: common/scroll-down-and-tap-by-id.yaml
    env:
      ID: rbThemeDark
      INDEX: 0
- takeScreenshot: 2.3-26-reset-cancel-03
- runFlow:
    file: common/scroll-down-by-id.yaml
    env:
      ID: rbThemeDark
- runFlow:
    file: common/assert-checked-by-id.yaml
    env:
      ID: rbThemeDark
      INDEX: 0
- runFlow:
    file: common/scroll-up-by-id.yaml
    env:
      ID: btnResetSettings
- takeScreenshot: 2.3-26-reset-cancel-04
- runFlow:
    file: common/scroll-down-and-tap-by-id.yaml
    env:
      ID: btnResetSettings
      INDEX: 0
- takeScreenshot: 2.3-26-reset-cancel-05
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "設定を初期化しますか？"
- assertVisible: "この操作は取り消せません" # 確認ダイアログの本文（仕様書の期待値に従う、未確認）
- tapOn: "キャンセル"
- takeScreenshot: 2.3-26-reset-cancel-06
- assertNotVisible: "設定を初期化しますか？"
- runFlow:
    file: common/scroll-down-by-id.yaml
    env:
      ID: rbThemeDark
- takeScreenshot: 2.3-26-reset-cancel-07
- runFlow:
    file: common/assert-checked-by-id.yaml
    env:
      ID: rbThemeDark
      INDEX: 0
- takeScreenshot: 2.3-26-reset-cancel-08

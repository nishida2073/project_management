# 2.6 ログ: 削除の確認で「キャンセル」を押すと、ダイアログが閉じてログが残る（テスト仕様書の 2.6 の 8 に対応）
# 前提（フローで設定）: ログは in-flow で作る（SMSの検索から手動で送信する）
# 外部条件: 端末に未送信の SMS が 1 件以上ある
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "SMSの検索"
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "検索条件"
- tapOn: "検索"
- tapOn: "全選択"
- tapOn: "選択したSMSを送信"
- pressKey: Back
- tapOn: "ログの確認"
- extendedWaitUntil:
    visible: '(?s).*\[(送信完了|失敗)\].*'
    timeout: 180000
- assertNotVisible: "ログがありません"
- assertVisible: '(?s).*\[送信完了\].*'
- runFlow:
    file: common/scroll-down-and-tap-by-id.yaml
    env:
      ID: btnDeleteLog
      INDEX: 0
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "ログを削除しますか？"
- takeScreenshot: 2.6-08-delete-cancel-01
- runFlow:
    file: common/tap-android-by-id.yaml
    env:
      ID: button2
- assertNotVisible: "ログを削除しますか？"
- assertNotVisible: "ログがありません"
- assertVisible: '(?s).*\[送信完了\].*'
- takeScreenshot: 2.6-08-delete-cancel-02

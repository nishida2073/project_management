# 2.5 設定のインポート・エクスポート: 読み取れないファイルを選ぶ（テスト仕様書の 2.5 の 17 に対応）
appId: com.ssfrontier.smstokintone
# 外部条件: ${IMPORT_FILE} は UTF-8 として読めないバイト列（test-data/import/ng-unreadable.json、printf で作成）。端末のダウンロードに置く。
# 外部条件: ${IMPORT_FILE} は UTF-8 として読めないバイト列（test-dataimport
g-unreadable.json、printf で作成）。端末のダウンロードに置く。
# 前提（JSON）: 会社名の抽出: あり（JSON の値）。
# 前提（この flow で設定）: 最初に setup/setup-import-environment.yaml で JSON を投入し直す。
# 未確認: launchApp が前の画面を閉じて起動し直すか
# 前提（画面で確認不可）: ${IMPORT_FILE} を端末の選択先に置く（ファイルの置き場所は未確認）。
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "設定のインポート・エクスポート"
- takeScreenshot: 2.5-17-import-ng-unreadable-01
- assertVisible: "設定のインポート・エクスポート"
- assertVisible: "ファイルを選択"
- assertVisible: "ファイルが選択されていません"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/btnImportSettings"
    enabled: false
- tapOn: "ファイルを選択"
# 未確認: 文書選択ダイアログ（Documents UI）の操作は公式ドキュメントで確認できなかった
- takeScreenshot: 2.5-17-import-ng-unreadable-02
- runFlow:
    file: common/select-download-file.yaml
    env:
      FILE_PATTERN: ${IMPORT_FILE}
- takeScreenshot: 2.5-17-import-ng-unreadable-03
- assertVisible: "インポートエラー"
- assertVisible: "(?s).*ファイルの形式が正しくありません.*"   # 未確認: 不正なバイトは UTF-8 の読み込みで置き換えられ、JSON の解析で失敗する（読み込み失敗の文言にはならない）
- tapOn: "OK"   # 未確認: エラーダイアログの OK ボタンの文字
- takeScreenshot: 2.5-17-import-ng-unreadable-04
- assertVisible: "ファイルが選択されていません"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/btnImportSettings"
    enabled: false
- takeScreenshot: 2.5-17-import-ng-unreadable-05

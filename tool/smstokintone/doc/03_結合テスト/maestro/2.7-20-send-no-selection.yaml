# 2.7 SMSの検索: 何も選ばずに送信を押すと、「送信するSMSを選択してください」が表示される（テスト仕様書の 2.7 の 20 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "SMSの検索"
- assertVisible: "検索条件"
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/cbSmsSearchSendNoneOnly"
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/cbSmsSearchSendNoneOnly"
    checked: false
- tapOn: "選択したSMSを送信"
- assertVisible: "送信するSMSを選択してください"
- takeScreenshot: 2.7-20-send-no-selection-01

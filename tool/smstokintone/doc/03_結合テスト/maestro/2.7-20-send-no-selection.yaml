# 2.7 SMSの検索: 何も選ばずに送信を押すと、「送信するSMSを選択してください」が表示される（テスト仕様書の 2.7 の 20 に対応）
# 前提: setup（clearState と JSON 投入）から開始する。検索は行わず、チェックは 1 件も入れない
appId: com.ssfrontier.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "SMSの検索"
- assertVisible: "検索条件"
- tapOn:
    id: "com.ssfrontier.smstokintone:id/cbSmsSearchSendNoneOnly"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/cbSmsSearchSendNoneOnly"
    checked: false
- tapOn: "選択したSMSを送信"
- assertVisible: "送信するSMSを選択してください"
- takeScreenshot: 2.7-20-send-no-selection-01

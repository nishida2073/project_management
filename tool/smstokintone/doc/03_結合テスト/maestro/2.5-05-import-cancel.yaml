# 2.5 設定のインポート・エクスポート: 確認ダイアログでインポートをキャンセルする（テスト仕様書の 2.5 の 5 に対応）
appId: com.ssfrontier.smstokintone
---
# 前提: 会社名の抽出は有効（2.5 の前提条件）。clearState は使わない。
# 前提: ${IMPORT_FILE} を端末の選択先に置く（ファイルの置き場所は未確認）。
# 未確認: launchApp が前の画面を閉じて起動し直すか
- launchApp
- tapOn: "設定のインポート・エクスポート"
- tapOn: "ファイルを選択"
# 未確認: 文書選択ダイアログ（Documents UI）の操作は公式ドキュメントで確認できなかった
- tapOn: "${IMPORT_FILE}"
- assertVisible: "(?s).*${IMPORT_FILE}.*"   # 未確認: 正規表現と複数行の表示
- tapOn:
    id: "com.ssfrontier.smstokintone:id/btnImportSettings"
- assertVisible: "設定をインポートしますか？"
- tapOn: "キャンセル"
- assertNotVisible: "設定をインポートしますか？"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/btnImportSettings"
    enabled: true
- takeScreenshot: 2.5-05-after-cancel

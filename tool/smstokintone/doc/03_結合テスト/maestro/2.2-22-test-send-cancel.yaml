# 2.2 送信先の設定: テスト送信をキャンセルする（テスト仕様書の 2.2 の 22 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提: 仕様書 2.2 の前提条件（test-send-target-1（振り分け：test-company）が保存済み）
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "送信先の設定"
- takeScreenshot: 2.2-22-test-send-cancel-01
- assertVisible: "設定を追加"
# 前提確認: test-send-target-1（振り分け：test-company）
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/etSendTargetName"
    index: 0
    text: "test-send-target-1"
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/etKeyword"
      index: 0
    direction: DOWN
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/etKeyword"
    index: 0
    text: "test-company"
- scrollUntilVisible:
    element: "テスト送信"
    direction: DOWN
- tapOn: "テスト送信"
- takeScreenshot: 2.2-22-test-send-cancel-02
- assertVisible: "テスト本文"
- tapOn: "キャンセル"
- takeScreenshot: 2.2-22-test-send-cancel-03
- assertNotVisible: "テスト本文"
- assertNotVisible: "テスト結果"
- takeScreenshot: 2.2-22-test-send-cancel-04

# 2.7 SMSの検索: SMSの読み取りが許可されていないと、検索の欄は表示されず、許可を促す文が表示される（テスト仕様書の 2.7 の 17 に対応）
# 前提: setup（clearState と JSON 投入）から開始する。SMS の読み取りは許可しない
# 外部条件（手動）: 端末の SMS の読み取りの許可を外してから flow を実行する（未確認: setup の clearState で許可が戻るか）
# 注: 検索の欄（layoutSearchForm）は、許可がないとき非表示になる（SmsSearchActivity の実装）
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "SMSの検索"
- assertVisible: "アプリ設定画面の「端末の許可」の「SMSの読み取り」を許可してください"
- assertNotVisible:
    id: "com.ssfrontier.smstokintone:id/layoutSearchForm"
- takeScreenshot: 2.7-17-permission-denied-01

# 2.4 引継ぎ内容の設定: 表示順序を新しい順に切り替える（テスト仕様書の 2.4 の 1 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- takeScreenshot: 2.4-01-sort-descending-01
- runFlow:
    file: common/scroll-down-and-tap-by-id.yaml
    env:
      ID: btnEditContinuationInfo
      INDEX: 0
- takeScreenshot: 2.4-01-sort-descending-02
- runFlow:
    file: common/assert-visible-by-id.yaml
    env:
      ID: etContinuationSearch
      INDEX: 0
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "${SENDER_A}"
- scrollUntilVisible:
    element:
      text: "${SENDER_B}"
    direction: DOWN
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "${SENDER_B}"
- runFlow:
    file: common/assert-checked-by-id.yaml
    env:
      ID: rbContinuationSortAscending
      INDEX: 0
- assertVisible:
    text: "${SENDER_B}"
    below:
      text: "${SENDER_A}"
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "${SENDER_A}"
- tapOn: "新しい順"
- takeScreenshot: 2.4-01-sort-descending-03
- runFlow:
    file: common/assert-checked-by-id.yaml
    env:
      ID: rbContinuationSortDescending
      INDEX: 0
- assertVisible:
    text: "${SENDER_A}"
    below:
      text: "${SENDER_B}"
- takeScreenshot: 2.4-01-sort-descending-04

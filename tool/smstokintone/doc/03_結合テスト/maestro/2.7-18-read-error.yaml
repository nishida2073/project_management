# 2.7 SMSの検索: SMSの読み取りでエラーが起きると、エラーのトーストが出て、一覧は空になる（テスト仕様書の 2.7 の 18 に対応）
# 未確認: 読み取りの失敗を再現する方法が未確認のため、この flow は実行できない状態（端末の SMS の読み取りを失敗させる手順が必要）
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "SMSの検索"
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "検索条件"
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: cbSmsSearchSendNoneOnly
      INDEX: 0
- runFlow:
    file: common/assert-id-unchecked.yaml
    env:
      ID: cbSmsSearchSendNoneOnly
      INDEX: 0
- tapOn: "検索"
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "該当するSMSがありません"
- takeScreenshot: 2.7-18-read-error-01

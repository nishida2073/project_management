appId: jp.co.nttdata_univ.smstokintone
---
# 送信ログを作る（共通の手順）: トップ画面から SMSの検索で未送信の SMS を全選択して送信し、送信開始・送信完了のログを作る
# 外部条件: 端末に未送信の SMS が 1 件以上ある。検索条件は既定（受信日の範囲：今日、未送信のみ）
# 注: 撮影は呼び出し元で行う。送信完了のトーストは通信の結果で変わる（未確認）
- tapOn: "SMSの検索"
- assertVisible: "検索条件"
- tapOn: "検索"
- assertVisible: ".*件見つかりました.*"
- tapOn: "全選択"
- tapOn: "選択したSMSを送信"
- assertVisible: ".*件を送信キューに追加しました.*"
- assertVisible: '(?s).*SMSの送信が完了しました.*'
- pressKey: Back

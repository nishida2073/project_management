appId: jp.co.nttdata_univ.smstokintone
---
# 送信先の設定の欄に、保存する値を入力する（共通の手順。保存と撮影は呼び出し元で行う）
# 入力（呼び出し元の env）: SAVED_SEND_TARGET_NAME、SAVED_KEYWORD、SUBDOMAIN、LOGIN_NAME、LOGIN_PASSWORD、APP_ID
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/etSendTargetName"
    direction: DOWN
    visibilityPercentage: 100
- runFlow:
    file: input-text-field.yaml
    env:
      FIELD_ID: etSendTargetName
      INPUT_VALUE: "${SAVED_SEND_TARGET_NAME}"
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/etKeyword"
    direction: DOWN
    visibilityPercentage: 100
- runFlow:
    file: input-text-field.yaml
    env:
      FIELD_ID: etKeyword
      INPUT_VALUE: "${SAVED_KEYWORD}"
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/etSubdomain"
    direction: DOWN
    visibilityPercentage: 100
- runFlow:
    file: input-text-field.yaml
    env:
      FIELD_ID: etSubdomain
      INPUT_VALUE: "${SUBDOMAIN}"
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/etLoginName"
    direction: DOWN
    visibilityPercentage: 100
- runFlow:
    file: input-text-field.yaml
    env:
      FIELD_ID: etLoginName
      INPUT_VALUE: "${LOGIN_NAME}"
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/etLoginPassword"
    direction: DOWN
    visibilityPercentage: 100
- runFlow:
    file: input-password-field.yaml
    env:
      FIELD_ID: etLoginPassword
      INPUT_VALUE: "${LOGIN_PASSWORD}"
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/etAppId"
    direction: DOWN
    visibilityPercentage: 100
- runFlow:
    file: input-text-field.yaml
    env:
      FIELD_ID: etAppId
      INPUT_VALUE: "${APP_ID}"

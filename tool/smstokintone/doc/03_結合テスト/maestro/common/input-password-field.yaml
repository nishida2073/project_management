appId: jp.co.nttdata_univ.smstokintone
---
# 注: 欄の中の 70% の位置を押す。右端に表示切り替えのアイコンがあるパスワード欄用（テキスト欄は input-text-field.yaml）
# 注: 既存の値は eraseText で末尾まで消してから入力する。欄までのスクロールと撮影は呼び出し元で行う
# 注: 引数は ID（欄の id の末尾）、VALUE（入力する値）
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/${ID}"
    index: 0
    point: "70%, 50%"
- eraseText: 50
- inputText: "${VALUE}"
- hideKeyboard

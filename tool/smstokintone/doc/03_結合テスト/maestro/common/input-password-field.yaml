appId: jp.co.nttdata_univ.smstokintone
---
# パスワード欄用。右端の目のアイコンを避けて、欄の中で押す位置は 70%
# 既存の値がある入力欄に、値を入れ直す（共通の手順）。スクロールと撮影は呼び出し元で行う
# キーボードを閉じるため、画面の左の空いた場所（3%, 50%）を押す（数字の欄は Enter で閉じないため）
# 入力: FIELD_ID（欄の id の末尾）、INPUT_VALUE（入力する値）
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/${FIELD_ID}"
    index: 0
    point: "70%, 50%"
- eraseText: 50
- inputText: "${INPUT_VALUE}"
- tapOn:
    point: "3%, 50%"

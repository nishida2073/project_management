# 2.8 自動処理: 抽出できないSMSは、受信のログだけが残り、送信先がないため送信開始が失敗する（テスト仕様書の 2.8 の 12 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 外部条件: 別端末から SMS を送る。送信元は既定（0312345801）、本文は 1 行だけの抽出できない本文。待ち時間（下の extendedWaitUntil）に送る
- runFlow: setup/setup-import-environment.yaml
- launchApp
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: btnTopOpenLog
      INDEX: 0
- takeScreenshot: 2.8-12-extraction-failed-no-send-01
- extendedWaitUntil:
    visible: "(?s).*SMSを受信しました.*"
    timeout: 180000
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "(?s).*SMSの送信先が存在しません.*"
- assertNotVisible: "(?s).*SMSの(登録|更新)に成功しました.*"
- takeScreenshot: 2.8-12-extraction-failed-no-send-02

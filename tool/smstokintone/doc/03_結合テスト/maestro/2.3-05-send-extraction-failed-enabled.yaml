# 2.3 アプリの設定: 自動送信の対象（抽出状況が異常）を有効にし、保存されることを確認する（テスト仕様書の 2.3 の 5 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（フローで設定）: 自動送信の対象（抽出状況が異常）を有効にする
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- runFlow:
    file: common/scroll-up-to-setting.yaml
    env:
      ELEMENT_ID: rbThemeLight
- takeScreenshot: 2.3-05-send-extraction-failed-enabled-01
- assertVisible: "端末の許可"
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: swSendExtractionFailedEnabled
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/swSendExtractionFailedEnabled"
    checked: false
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: swSendExtractionFailedEnabled
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/swSendExtractionFailedEnabled"
- takeScreenshot: 2.3-05-send-extraction-failed-enabled-02
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: swSendExtractionFailedEnabled
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/swSendExtractionFailedEnabled"
    checked: true
- pressKey: Back
- takeScreenshot: 2.3-05-send-extraction-failed-enabled-03
- tapOn: "アプリの設定"
- runFlow:
    file: common/scroll-up-to-setting.yaml
    env:
      ELEMENT_ID: rbThemeLight
- takeScreenshot: 2.3-05-send-extraction-failed-enabled-04
- assertVisible: "端末の許可"
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: swSendExtractionFailedEnabled
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/swSendExtractionFailedEnabled"
    checked: true
- takeScreenshot: 2.3-05-send-extraction-failed-enabled-05

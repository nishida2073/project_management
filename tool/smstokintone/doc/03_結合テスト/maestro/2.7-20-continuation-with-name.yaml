# 2.7 SMSの検索: 引継ぎの SMS の送信元に、引継いだ氏名が表示される（テスト仕様書の 2.7 の 20 に対応）
# 外部条件: 引継ぎ内容の送信元（test-sender-a）から届いた SMS が、端末にある
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "SMSの検索"
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "検索条件"
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: cbSmsSearchSendNoneOnly
      INDEX: 0
- runFlow:
    file: common/assert-id-checked.yaml
    env:
      ID: cbSmsSearchSendNoneOnly
      INDEX: 0
- tapOn: "検索"
- assertVisible: '(?s).*${CONTINUATION_USER_NAME}.*'
- takeScreenshot: 2.7-20-continuation-with-name-01

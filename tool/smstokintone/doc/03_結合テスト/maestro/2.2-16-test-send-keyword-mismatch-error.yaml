# 2.2 送信先の設定: 振り分けが合わないときテスト送信でエラーになる（テスト仕様書の 2.2 の 16 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 外部条件: kintone 接続と SMS 受信が必要
# 注: テスト本文の「sample-company」「test-taro」は英数字（TEST_BODY_LINE1、TEST_BODY_LINE2）で代用する（IME の制約）。会社名の抽出は 3 行未満では行われないため、改行（Enter）で 3 行にする
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- takeScreenshot: 2.2-16-test-send-keyword-mismatch-error-01
- runFlow:
    file: common/scroll-down-by-id.yaml
    env:
      ID: swCompanyNameExtractionEnabled
- runFlow:
    file: common/assert-checked-by-id.yaml
    env:
      ID: swCompanyNameExtractionEnabled
      INDEX: 0
- pressKey: Back
- takeScreenshot: 2.2-16-test-send-keyword-mismatch-error-02
- tapOn: "送信先の設定"
- takeScreenshot: 2.2-16-test-send-keyword-mismatch-error-03
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "設定を追加"
- runFlow:
    file: common/scroll-down-and-assert-text-by-id.yaml
    env:
      ID: etSendTargetName
      INDEX: 0
      TEXT: "test-send-target-1"
- runFlow:
    file: common/scroll-down-and-assert-text-by-id.yaml
    env:
      ID: etKeyword
      INDEX: 0
      TEXT: "test-company"
- scrollUntilVisible:
    element: "テスト送信"
    direction: DOWN
- tapOn: "テスト送信"
- takeScreenshot: 2.2-16-test-send-keyword-mismatch-error-04
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "テスト本文"
# 注: テスト本文の初期値（テンプレート）は、欄をタップして末尾にカーソルがある状態で eraseText で消す（SendTargetSettingsActivity.kt:230）。
- runFlow:
    file: common/input-text-by-text.yaml
    env:
      TEXT: "(?s).*テスト太郎.*"
      INDEX: 0
      VALUE: "${TEST_BODY_LINE1}"
- pressKey: Enter
- inputText: "${TEST_BODY_LINE2}"
- pressKey: Enter
- inputText: "${TEST_BODY_LINE3}"
- takeScreenshot: 2.2-16-test-send-keyword-mismatch-error-05
- hideKeyboard
- tapOn: "送信"
- takeScreenshot: 2.2-16-test-send-keyword-mismatch-error-06
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "(?s).*送信先エラー.*"
# 注: 振り分けエラーには登録済みの振り分けキーワードが表示される（SendTargetSettingsActivity.kt:268-270）。抽出された会社名は表示されない。
- assertVisible: "(?s).*送信先エラー.*振り分け設定（会社名）:${EXPECTED_COMPANY_NAME}.*"
- takeScreenshot: 2.2-16-test-send-keyword-mismatch-error-07

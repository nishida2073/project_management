# 2.5 設定のインポート・エクスポート: 保存先を選んで設定をエクスポートする（テスト仕様書の 2.5 の 2 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 未確認: launchApp が前の画面を閉じて起動し直すか
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "設定のインポート・エクスポート"
- takeScreenshot: 2.5-02-export-ok-01
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "設定のインポート・エクスポート"
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: btnExportSettings
      INDEX: 0
# 未確認: 保存ダイアログ（Documents UI）の操作は公式ドキュメントで確認できなかった
- takeScreenshot: 2.5-02-export-ok-02
- assertVisible: "(?s).*s2k_settings_\\d{8}_\\d{6}\\.json.*"   # 未確認: 提案されるファイル名の表示
- tapOn: "保存"   # 未確認: 保存ボタンの文字
- takeScreenshot: 2.5-02-export-ok-03
- assertVisible: "設定をエクスポートしました"
- takeScreenshot: 2.5-02-export-ok-04

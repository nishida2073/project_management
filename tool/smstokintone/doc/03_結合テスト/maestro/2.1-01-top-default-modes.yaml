# 2.1 トップ: 起動直後の送信モードと返信モードの既定値を確認する（テスト仕様書の 2.1 の 1 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- assertVisible: "SMSの送信モード"
- assertVisible: "SMSの返信モード"
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/tvTopSendStatus"
    text: "自動"
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/tvTopReplyStatus"
    text: "手動"
- takeScreenshot: 2.1-01-top-default-modes-01

# 2.1 トップ: 起動直後の送信モードと返信モードの既定値を確認する（テスト仕様書の 2.1 の 1 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "SMSの送信モード"
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "SMSの返信モード"
- runFlow:
    file: common/scroll-down-and-assert-text-by-id.yaml
    env:
      ID: tvTopSendStatus
      INDEX: 0
      TEXT: "自動"
- runFlow:
    file: common/scroll-down-and-assert-text-by-id.yaml
    env:
      ID: tvTopReplyStatus
      INDEX: 0
      TEXT: "手動"
- takeScreenshot: 2.1-01-top-default-modes-01

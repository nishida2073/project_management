# 2.5 設定のインポート・エクスポート: 反映する項目がないファイルを選ぶ（テスト仕様書の 2.5 の 14 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 未確認: launchApp が前の画面を閉じて起動し直すか
# 外部条件: ${IMPORT_FILE} を端末の選択先に置く（ファイルの置き場所は未確認）。
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "設定のインポート・エクスポート"
- takeScreenshot: 2.5-14-import-ng-no-section-01
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "設定のインポート・エクスポート"
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "ファイルを選択"
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "ファイルが選択されていません"
- runFlow:
    file: common/assert-visible-by-id.yaml
    env:
      ID: btnImportSettings
      INDEX: 0
    enabled: false
- tapOn: "ファイルを選択"
# 未確認: 文書選択ダイアログ（Documents UI）の操作は公式ドキュメントで確認できなかった
- takeScreenshot: 2.5-14-import-ng-no-section-02
- runFlow:
    file: common/select-download-file-by-text.yaml
    env:
      TEXT: ${IMPORT_FILE}
- takeScreenshot: 2.5-14-import-ng-no-section-03
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "インポートエラー"
- assertVisible: "(?s).*反映する内容がありません.*"
- runFlow:
    file: common/tap-android-by-id.yaml
    env:
      ID: button1
- takeScreenshot: 2.5-14-import-ng-no-section-04
- runFlow:
    file: common/assert-visible-by-id.yaml
    env:
      ID: btnImportSettings
      INDEX: 0
    enabled: false
- takeScreenshot: 2.5-14-import-ng-no-section-05

# 2.3 アプリの設定: 固定変換の 1 行目を削除する（テスト仕様書の 2.3 の 11 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（JSON）: 表示テーマ：ライト、SMSの送信モード：自動、SMSの返信モード：手動、会社名の抽出：あり、会社名の自動変換：あり、固定変換：なし
# 前提（フローで設定）: 固定変換の 1 行目（FIXED_FROM_1 → FIXED_TO_1）と 2 行目（FIXED_FROM_2 → FIXED_TO_2）を入力し、1 行目を削除する
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- takeScreenshot: 2.3-11-fixed-conversion-delete-01
- assertVisible: "端末の許可"
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/btnAddFixedConversion"
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/btnAddFixedConversion"
- takeScreenshot: 2.3-11-fixed-conversion-delete-02
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/etFixConversionBefore"
    index: 0
- takeScreenshot: 2.3-11-fixed-conversion-delete-03
- inputText: "${FIXED_FROM_1}"
- takeScreenshot: 2.3-11-fixed-conversion-delete-04
- hideKeyboard
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/etFixConversionAfter"
    index: 0
- takeScreenshot: 2.3-11-fixed-conversion-delete-05
- inputText: "${FIXED_TO_1}"
- takeScreenshot: 2.3-11-fixed-conversion-delete-06
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/btnAddFixedConversion"
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/btnAddFixedConversion"
- takeScreenshot: 2.3-11-fixed-conversion-delete-07
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/etFixConversionBefore"
    index: 1
- takeScreenshot: 2.3-11-fixed-conversion-delete-08
- inputText: "${FIXED_FROM_2}"
- takeScreenshot: 2.3-11-fixed-conversion-delete-09
- hideKeyboard
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/etFixConversionAfter"
    index: 1
- takeScreenshot: 2.3-11-fixed-conversion-delete-10
- inputText: "${FIXED_TO_2}"
- takeScreenshot: 2.3-11-fixed-conversion-delete-11
- hideKeyboard
- assertVisible: "${FIXED_FROM_1}"
- assertVisible: "${FIXED_TO_1}"
- assertVisible: "${FIXED_FROM_2}"
- assertVisible: "${FIXED_TO_2}"
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/btnDeleteFixedConversion"
    index: 0 # 未確認: id と index の組み合わせは公式ドキュメントで確認できていない
- takeScreenshot: 2.3-11-fixed-conversion-delete-12
- assertNotVisible: "${FIXED_FROM_1}"
- assertNotVisible: "${FIXED_TO_1}"
- assertVisible: "${FIXED_FROM_2}"
- assertVisible: "${FIXED_TO_2}"
- pressKey: Back
- takeScreenshot: 2.3-11-fixed-conversion-delete-13
- tapOn: "アプリの設定"
- takeScreenshot: 2.3-11-fixed-conversion-delete-14
- assertVisible: "端末の許可"
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/btnAddFixedConversion"
- assertNotVisible: "${FIXED_FROM_1}"
- assertVisible: "${FIXED_FROM_2}"
- assertVisible: "${FIXED_TO_2}"
- takeScreenshot: 2.3-11-fixed-conversion-delete-15

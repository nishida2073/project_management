# 2.7 SMSの検索: 受信日の範囲を複数日にして検索すると、期間内の SMS が表示される（テスト仕様書の 2.7 の 2 に対応）
# 外部条件: 端末に期間内の SMS が 1 件以上ある
# 注: 受信日の範囲は、アプリの設定で 3 日に変更してから検索する（今日より前の日を開始日にするため）。日付ピッカーは使わない
# 注: 本文に含む文字列の欄は画面に表示されないため使わない
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- runFlow:
    file: common/scroll-down-to-id.yaml
    env:
      ID: etSmsSearchDateRangeDays
- runFlow:
    file: common/input-text-field.yaml
    env:
      ID: etSmsSearchDateRangeDays
      INDEX: 0
      VALUE: "${SEARCH_DATE_RANGE_DAYS}"
- runFlow:
    file: common/scroll-down-and-assert-field-text.yaml
    env:
      ID: etSmsSearchDateRangeDays
      INDEX: 0
      TEXT: "${SEARCH_DATE_RANGE_DAYS}"
- pressKey: Back
- tapOn: "SMSの検索"
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "検索条件"
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: cbSmsSearchSendNoneOnly
      INDEX: 0
- runFlow:
    file: common/assert-id-unchecked.yaml
    env:
      ID: cbSmsSearchSendNoneOnly
      INDEX: 0
- runFlow:
    file: common/scroll-down-and-assert-field-text.yaml
    env:
      ID: etDateFrom
      INDEX: 0
      TEXT: '\d{4}/\d{2}/\d{2}'
- takeScreenshot: 2.7-02-search-date-range-01
- tapOn: "検索"
- takeScreenshot: 2.7-02-search-date-range-02

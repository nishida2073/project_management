# 2.8 自動処理: 会社名がキーワードを部分一致で含むと、振り分けられる（テスト仕様書の 2.8 の 11 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 外部条件: 別端末から SMS を送る。送信元 0312345807、本文は 1 行目「sub-test-company-ltd」、2 行目「test-taro」、3 行目「body-test」。待ち時間（下の extendedWaitUntil）に送る
- runFlow: setup/setup-import-environment.yaml
- launchApp
- runFlow:
    file: common/scroll-down-and-tap-by-id.yaml
    env:
      ID: btnTopOpenLog
      INDEX: 0
- takeScreenshot: 2.8-11-partial-match-send-01
- extendedWaitUntil:
    visible: "(?s).*SMSを受信しました.*"
    timeout: 180000
- extendedWaitUntil:
    visible: "(?s).*SMSの(登録|更新)に成功しました.*"
    timeout: 180000
- assertVisible: "(?s).*test-send-target-1.*"
- takeScreenshot: 2.8-11-partial-match-send-02

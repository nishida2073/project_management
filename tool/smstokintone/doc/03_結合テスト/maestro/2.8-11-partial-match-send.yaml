# 2.8 自動処理: 会社名がキーワードを部分一致で含むと、振り分けられる（テスト仕様書の 2.8 の 11 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（JSON）: 既定値（2.8 の 1 と同じ）
# 前提（フローで設定）: なし
# 外部条件（事前に別端末から SMS を送る）: 送信元 test-phone-g、本文は 1 行目「sub-test-company-ltd」、2 行目「test-taro」、3 行目「body-test」。待ち時間（下の extendedWaitUntil）に送る
- runFlow: setup/setup-import-environment.yaml
- launchApp
- runFlow: common/enable-log-auto-refresh.yaml
- tapOn:
    id: "com.ssfrontier.smstokintone:id/btnTopOpenLog"
- takeScreenshot: 2.8-11-partial-match-send-01
- extendedWaitUntil:
    visible: "(?s).*SMSを受信しました.*"
    timeout: 180000
- assertVisible: "(?s).*SMSの登録に成功しました.*"
- takeScreenshot: 2.8-11-partial-match-send-02

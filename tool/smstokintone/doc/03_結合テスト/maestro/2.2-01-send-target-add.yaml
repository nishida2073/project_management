# 2.2 送信先の設定: 送信先を追加する（テスト仕様書の 2.2 の 1 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "送信先の設定"
- takeScreenshot: 2.2-01-send-target-add-01
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "設定を追加"
- tapOn: "設定を追加"
- takeScreenshot: 2.2-01-send-target-add-02
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "設定 2"
# 注: 追加した設定（設定 2）は一覧の末尾に入る。scrollUntilVisible で「設定 2」を表示すると、その送信先名の入力欄は index 0 で指せる
- runFlow:
    file: common/scroll-down-by-text.yaml
    env:
      TEXT: "設定 2"
- runFlow:
    file: common/scroll-down-and-tap-by-id.yaml
    env:
      ID: etSendTargetName
      INDEX: 0
- takeScreenshot: 2.2-01-send-target-add-03
- inputText: "${SEND_TARGET_NAME}"
- takeScreenshot: 2.2-01-send-target-add-04
- hideKeyboard
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "${SEND_TARGET_NAME}"
- runFlow:
    file: common/scroll-down-and-assert-text-by-id.yaml
    env:
      ID: etSubdomain
      INDEX: 0
      TEXT: 'univ-kyousai-\{X\}'
- runFlow:
    file: common/scroll-down-and-assert-text-by-id.yaml
    env:
      ID: etFieldType
      INDEX: 0
      TEXT: "registration_type"
- runFlow:
    file: common/scroll-down-and-assert-text-by-id.yaml
    env:
      ID: etFieldDatetime
      INDEX: 0
      TEXT: "receive_datetime"
- runFlow:
    file: common/scroll-down-and-assert-text-by-id.yaml
    env:
      ID: etFieldSender
      INDEX: 0
      TEXT: "sender"
- runFlow:
    file: common/scroll-down-and-assert-text-by-id.yaml
    env:
      ID: etFieldCompanyName
      INDEX: 0
      TEXT: "company_name"
- runFlow:
    file: common/scroll-down-and-assert-text-by-id.yaml
    env:
      ID: etFieldUserName
      INDEX: 0
      TEXT: "user_name"
- runFlow:
    file: common/scroll-down-and-assert-text-by-id.yaml
    env:
      ID: etFieldBody
      INDEX: 0
      TEXT: "body"
- runFlow:
    file: common/scroll-down-and-assert-text-by-id.yaml
    env:
      ID: etFieldHistory
      INDEX: 0
      TEXT: "history"
- runFlow:
    file: common/scroll-down-by-id.yaml
    env:
      ID: rbUpdateToleranceModeSameDate
- runFlow:
    file: common/assert-checked-by-id.yaml
    env:
      ID: rbUpdateToleranceModeSameDate
      INDEX: 0
- runFlow:
    file: common/scroll-down-and-assert-text-by-id.yaml
    env:
      ID: etUpdateToleranceHours
      INDEX: 0
      TEXT: "5"
- takeScreenshot: 2.2-01-send-target-add-05

# 2.2 送信先の設定: 送信先を追加する（テスト仕様書の 2.2 の 1 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提: setup の環境（test-send-target-1 が保存済み）。追加した送信先は 2 件目
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "送信先の設定"
- takeScreenshot: 2.2-01-send-target-add-01
- assertVisible: "設定を追加"
- tapOn: "設定を追加"
- takeScreenshot: 2.2-01-send-target-add-02
- assertVisible: "設定 2"
# 未確認: 追加した設定（設定 2）は、「設定 2」まで送った後に見えている 1 件として確認する（index 0）
- scrollUntilVisible:
    element:
      text: "設定 2"
    direction: DOWN
- tapOn:
    id: "com.ssfrontier.smstokintone:id/etSendTargetName"
    index: 0
- takeScreenshot: 2.2-01-send-target-add-03
- inputText: "${SEND_TARGET_NAME}"
- takeScreenshot: 2.2-01-send-target-add-04
- hideKeyboard
- assertVisible: "${SEND_TARGET_NAME}"
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/etSubdomain"
      index: 0
    direction: DOWN
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/etSubdomain"
    index: 0
    text: 'univ-kyousai-\{X\}'
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/etFieldSender"
      index: 0
    direction: DOWN
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/etFieldSender"
    index: 0
    text: "sender"
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/etFieldDatetime"
      index: 0
    direction: DOWN
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/etFieldDatetime"
    index: 0
    text: "receive_datetime"
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/etFieldType"
      index: 0
    direction: DOWN
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/etFieldType"
    index: 0
    text: "registration_type"
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/etFieldCompanyName"
      index: 0
    direction: DOWN
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/etFieldCompanyName"
    index: 0
    text: "company_name"
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/etFieldUserName"
      index: 0
    direction: DOWN
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/etFieldUserName"
    index: 0
    text: "user_name"
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/etFieldBody"
      index: 0
    direction: DOWN
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/etFieldBody"
    index: 0
    text: "body"
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/etFieldHistory"
      index: 0
    direction: DOWN
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/etFieldHistory"
    index: 0
    text: "history"
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/rbUpdateToleranceModeSameDate"
      index: 0
    direction: DOWN
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/rbUpdateToleranceModeSameDate"
    index: 0
    checked: true
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/etUpdateToleranceHours"
      index: 0
    direction: DOWN
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/etUpdateToleranceHours"
    index: 0
    text: "5"
- takeScreenshot: 2.2-01-send-target-add-05

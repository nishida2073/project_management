# 2.2 送信先の設定: 送信先を追加する（テスト仕様書の 2.2 の 1 に対応）
appId: com.ssfrontier.smstokintone
---
# 前提: setup の環境（test-send-target-1 と test-send-target-2 が保存済み）。追加した送信先は 3 件目（index 2）
- launchApp
- tapOn: "送信先の設定"
- assertVisible: "設定を追加"
- tapOn: "設定を追加"
- assertVisible: "設定 3"
# 未確認: 追加した設定（設定 3）は一覧の 3 件目（index 2）として確認する
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/etSendTargetName"
      index: 2
    direction: DOWN
- tapOn:
    id: "com.ssfrontier.smstokintone:id/etSendTargetName"
    index: 2
- inputText: "${SEND_TARGET_NAME}"
- hideKeyboard
- assertVisible: "${SEND_TARGET_NAME}"
- takeScreenshot: 2.2-01-after-add
# 新規追加の初期値（送信先の設定 1 件目と同じ項目）の確認。接続先は {X} を正規表現で escape している（未確認）
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/etSubdomain"
      index: 2
    direction: DOWN
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/etSubdomain"
    index: 2
    text: "univ-kyousai-\{X\}"
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/etFieldSender"
      index: 2
    direction: DOWN
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/etFieldSender"
    index: 2
    text: "sender"
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/etFieldDatetime"
      index: 2
    direction: DOWN
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/etFieldDatetime"
    index: 2
    text: "receive_datetime"
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/etFieldType"
      index: 2
    direction: DOWN
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/etFieldType"
    index: 2
    text: "registration_type"
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/etFieldCompanyName"
      index: 2
    direction: DOWN
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/etFieldCompanyName"
    index: 2
    text: "company_name"
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/etFieldUserName"
      index: 2
    direction: DOWN
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/etFieldUserName"
    index: 2
    text: "user_name"
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/etFieldBody"
      index: 2
    direction: DOWN
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/etFieldBody"
    index: 2
    text: "body"
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/etFieldHistory"
      index: 2
    direction: DOWN
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/etFieldHistory"
    index: 2
    text: "history"
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/rbUpdateToleranceModeSameDate"
      index: 2
    direction: DOWN
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/rbUpdateToleranceModeSameDate"
    index: 2
    checked: true
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/etUpdateToleranceHours"
      index: 2
    direction: DOWN
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/etUpdateToleranceHours"
    index: 2
    text: "5"

# 2.6 ログ: 削除の確認で「削除」を押すと、ログがなくなる（テスト仕様書の 2.6 の 2 に対応）
# 前提（フローで設定）: ログは in-flow で作る（SMSの検索から手動で送信する）
# 外部条件: 端末に未送信の SMS が 1 件以上ある
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "SMSの検索"
- assertVisible: "検索条件"
- tapOn: "検索"
- tapOn: "全選択"
- tapOn: "選択したSMSを送信"
- assertVisible: "(?s).*件を送信キューに追加しました.*"
- assertVisible: '(?s).*SMSの送信が完了しました.*'
- pressKey: Back
- tapOn: "ログの確認"
- assertVisible: "ログの一覧"
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/btnDeleteLog"
- assertVisible: "ログを削除しますか？"
- assertVisible: "この操作は取り消せません"
- takeScreenshot: 2.6-02-delete-confirm-01
- tapOn:
    id: "android:id/button1"
- assertVisible: "ログがありません"
- takeScreenshot: 2.6-02-delete-confirm-02

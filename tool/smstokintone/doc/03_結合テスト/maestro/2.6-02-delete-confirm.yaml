# 2.6 ログ: 削除の確認で「削除」を押すと、ログがなくなる（テスト仕様書の 2.6 の 2 に対応）
# 前提（フローで設定）: ログは in-flow で作る（SMSの検索から手動で送信する）
# 外部条件: 端末に未送信の SMS が 1 件以上ある
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "SMSの検索"
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "検索条件"
- tapOn: "検索"
- tapOn: "全選択"
- tapOn: "選択したSMSを送信"
- pressKey: Back
- tapOn: "ログの確認"
- extendedWaitUntil:
    visible: '(?s).*\[(送信完了|失敗)\].*'
    timeout: 180000
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "ログの一覧"
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: btnDeleteLog
      INDEX: 0
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "ログを削除しますか？"
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "この操作は取り消せません"
- takeScreenshot: 2.6-02-delete-confirm-01
- runFlow:
    file: common/tap-android-id.yaml
    env:
      ID: button1
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "ログがありません"
- takeScreenshot: 2.6-02-delete-confirm-02

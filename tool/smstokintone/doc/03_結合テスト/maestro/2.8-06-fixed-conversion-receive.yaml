# 2.8 自動処理: 会社名の自動変換を無効にし、固定変換で変換したうえで振り分けられる（テスト仕様書の 2.8 の 6 に対応）
# 前提（JSON）: 既定値（2.8 の 1 と同じ）
# 前提（フローで設定）: 会社名の自動変換を無効にする。固定変換に「${FIXED_FROM}」→「${FIXED_TO}」を 1 行追加する
# 外部条件（事前に別端末から SMS を送る）: 送信元 test-phone-a、本文は 1 行目「test-company」、2 行目「test-taro」、3 行目「body-test」。待ち時間（下の extendedWaitUntil）に送る
# 確認: 抽出結果のダイアログのタイトルに、変換の印 🔄（strings.xml の icon_company_name_converted）が出て、会社名が固定変換後の「${FIXED_TO}」であることで確認する（LogActivity の showExtractionResultDialog）
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/swCompanyNameAutoConversionEnabled"
    direction: DOWN
    visibilityPercentage: 100
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/swCompanyNameAutoConversionEnabled"
    checked: true
- tapOn:
    id: "com.ssfrontier.smstokintone:id/swCompanyNameAutoConversionEnabled"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/swCompanyNameAutoConversionEnabled"
    checked: false
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/btnAddFixedConversion"
    direction: DOWN
- tapOn:
    id: "com.ssfrontier.smstokintone:id/btnAddFixedConversion"
- tapOn:
    id: "com.ssfrontier.smstokintone:id/etFixConversionBefore"
    index: 0
- inputText: "${FIXED_FROM}"
- hideKeyboard
- tapOn:
    id: "com.ssfrontier.smstokintone:id/etFixConversionAfter"
    index: 0
- inputText: "${FIXED_TO}"
- hideKeyboard
- assertVisible: "${FIXED_FROM}"
- assertVisible: "${FIXED_TO}"
- takeScreenshot: 2.8-06-fixed-conversion-receive-01
- pressKey: Back
- runFlow: common/enable-log-auto-refresh.yaml
- tapOn:
    id: "com.ssfrontier.smstokintone:id/btnTopOpenLog"
- takeScreenshot: 2.8-06-fixed-conversion-receive-02
- extendedWaitUntil:
    visible: "(?s).*SMSを受信しました.*"
    timeout: 180000
- assertVisible: "(?s).*SMSの登録に成功しました.*"
- longPressOn: "(?s).*SMSを受信しました.*"
- assertVisible: "抽出結果 ⚙.*🔄.*"
- assertVisible: "(?s).*会社名：${FIXED_TO}.*"
- takeScreenshot: 2.8-06-fixed-conversion-receive-03

# 2.8 自動処理: 会社名の自動変換を無効にし、固定変換で変換したうえで振り分けられる（テスト仕様書の 2.8 の 6 に対応）
# 前提（フローで設定）: 会社名の自動変換を無効にする。固定変換に「${FIXED_FROM}」→「${FIXED_TO}」を 1 行追加する
# 外部条件: 別端末から SMS を送る。送信元 test-phone-a、本文は 1 行目「test-company」、2 行目「test-taro」、3 行目「body-test」。待ち時間（下の extendedWaitUntil）に送る
# 注: 抽出結果のダイアログのタイトルに、変換の印 🔄（strings.xml の icon_company_name_converted）が出て、会社名が固定変換後の「${FIXED_TO}」であることで確認する（LogActivity の showExtractionResultDialog）
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- runFlow:
    file: common/scroll-down-to-id.yaml
    env:
      ID: swCompanyNameAutoConversionEnabled
- runFlow:
    file: common/assert-id-checked.yaml
    env:
      ID: swCompanyNameAutoConversionEnabled
      INDEX: 0
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: swCompanyNameAutoConversionEnabled
      INDEX: 0
- runFlow:
    file: common/assert-id-unchecked.yaml
    env:
      ID: swCompanyNameAutoConversionEnabled
      INDEX: 0
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: btnAddFixedConversion
      INDEX: 0
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: etFixConversionBefore
      INDEX: 0
- inputText: "${FIXED_FROM}"
- hideKeyboard
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: etFixConversionAfter
      INDEX: 0
- inputText: "${FIXED_TO}"
- hideKeyboard
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "${FIXED_FROM}"
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "${FIXED_TO}"
- takeScreenshot: 2.8-06-fixed-conversion-receive-01
- pressKey: Back
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: btnTopOpenLog
      INDEX: 0
- takeScreenshot: 2.8-06-fixed-conversion-receive-02
- extendedWaitUntil:
    visible: "(?s).*SMSを受信しました.*"
    timeout: 180000
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "(?s).*SMSの登録に成功しました.*"
- longPressOn: "(?s).*SMSを受信しました.*"
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "抽出結果 ⚙.*🔄.*"
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "(?s).*会社名：${FIXED_TO}.*"
- takeScreenshot: 2.8-06-fixed-conversion-receive-03

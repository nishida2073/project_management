# 2.4 引継ぎ内容の設定: 一致しないキーワードでは該当がないと表示される（テスト仕様書の 2.4 の 12 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 未確認: 「一致する引継ぎ内容がありません」の文言は strings.xml の値で、実機の表示は未確認。
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- takeScreenshot: 2.4-12-keyword-no-match-01
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: btnEditContinuationInfo
      INDEX: 0
- takeScreenshot: 2.4-12-keyword-no-match-02
- runFlow:
    file: common/assert-id-visible.yaml
    env:
      ID: etContinuationSearch
      INDEX: 0
- runFlow:
    file: common/assert-id-checked.yaml
    env:
      ID: rbContinuationSortAscending
      INDEX: 0
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: etContinuationSearch
      INDEX: 0
- takeScreenshot: 2.4-12-keyword-no-match-03
- inputText: "${SEARCH_NO_MATCH}"
- takeScreenshot: 2.4-12-keyword-no-match-04
- hideKeyboard
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "一致する引継ぎ内容がありません"
- assertNotVisible: "${SENDER_A}"
- assertNotVisible: "${SENDER_B}"
- takeScreenshot: 2.4-12-keyword-no-match-05

# 2.3 アプリの設定: SMSの送信の許可を拒否すると案内が出る（テスト仕様書の 2.3 の 29 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 外部条件: SMSの送信の権限の付与・未付与は端末の設定でしか切り替えられないため、このフローでは作らない（端末で未付与にしておく）
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- runFlow:
    file: common/scroll-to-top-setting.yaml
- takeScreenshot: 2.3-29-send-permission-denied-01
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: btnRequestSendPermission
- takeScreenshot: 2.3-29-send-permission-denied-02
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/btnRequestSendPermission"
- assertNotVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/tvSendPermissionStatus"
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: btnRequestSendPermission
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/btnRequestSendPermission"
    index: 0
- takeScreenshot: 2.3-29-send-permission-denied-03
- tapOn: "許可しない" # 未確認: 端末の権限ダイアログの拒否ボタンの文字（Android の版・言語で異なる）
- takeScreenshot: 2.3-29-send-permission-denied-04
- assertVisible: "SMSの送信の許可がない場合、自動返信はできません" # トースト（Toast.LENGTH_LONG で表示される）
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: btnRequestSendPermission
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/btnRequestSendPermission"
- takeScreenshot: 2.3-29-send-permission-denied-05

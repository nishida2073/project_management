# 2.7 SMSの検索: 選択解除で、すべてのチェックが外れる（テスト仕様書の 2.7 の 8 に対応）
# 前提（フローで設定）: 端末に SMS が 1 件以上ある
# 未確認: 全部のチェックボックスを className と checked で確認する（行ごとに同じ id のため、index を使わない。この Maestro で className が使えるか）
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "SMSの検索"
- assertVisible: "検索条件"
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/cbSmsSearchSendNoneOnly"
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/cbSmsSearchSendNoneOnly"
    checked: false
- tapOn: "検索"
- assertVisible: '.*件見つかりました.*'
- tapOn: "全選択"
- assertVisible:
    className: "android.widget.CheckBox"
    checked: true
- tapOn: "選択解除"
- assertNotVisible:
    className: "android.widget.CheckBox"
    checked: true
- takeScreenshot: 2.7-08-deselect-all-01

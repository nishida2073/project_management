# 2.7 SMSの検索: 選択解除で、すべてのチェックが外れる（テスト仕様書の 2.7 の 8 に対応）
# 前提（フローで設定）: 端末に SMS が 1 件以上ある
# 未確認: 全部のチェックボックスを className と checked で確認する（行ごとに同じ id のため、index を使わない。この Maestro で className が使えるか）
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "SMSの検索"
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "検索条件"
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: cbSmsSearchSendNoneOnly
      INDEX: 0
- runFlow:
    file: common/assert-id-checked.yaml
    env:
      ID: cbSmsSearchSendNoneOnly
      INDEX: 0
- tapOn: "検索"
- tapOn: "全選択"
- runFlow:
    file: common/assert-id-checked.yaml
    env:
      ID: cbSmsItemSelect
      INDEX: 0
- tapOn: "▲ 隠す"
- runFlow:
    file: common/assert-id-checked.yaml
    env:
      ID: cbSmsItemSelect
      INDEX: 1
- tapOn: "選択解除"
- runFlow:
    file: common/assert-id-unchecked.yaml
    env:
      ID: cbSmsItemSelect
      INDEX: 0
- runFlow:
    file: common/assert-id-unchecked.yaml
    env:
      ID: cbSmsItemSelect
      INDEX: 1
- takeScreenshot: 2.7-08-deselect-all-01

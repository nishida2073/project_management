# 2.7 SMSの検索: 選択解除で、すべてのチェックが外れる（テスト仕様書の 2.7 の 8 に対応）
# 前提: setup（clearState と JSON 投入）から開始する。端末に SMS が 1 件以上ある（SMS の読み取りを許可しておく）
# 前提の操作（2.7 の 7 と 2.7 の 8 の前提）: 「検索」と「全選択」を順に実行してから「選択解除」を押す
# 未確認: チェックボックスに id がないため、className と checked で確認する（この Maestro で className が使えるか）
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "SMSの検索"
- assertVisible: "検索条件"
- tapOn:
    id: "com.ssfrontier.smstokintone:id/cbSmsSearchSendNoneOnly"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/cbSmsSearchSendNoneOnly"
    checked: false
- tapOn: "検索"
- assertVisible: '.*件見つかりました.*'
- tapOn: "全選択"
- assertVisible:
    className: "android.widget.CheckBox"
    checked: true
- tapOn: "選択解除"
- assertNotVisible:
    className: "android.widget.CheckBox"
    checked: true
- takeScreenshot: 2.7-08-deselect-all-01

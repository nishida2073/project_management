# 2.3 アプリの設定: 初期化を実行し、既定値に戻ることを確認する（テスト仕様書の 2.3 の 17 に対応）
appId: com.ssfrontier.smstokintone
---
# 前提: 返信モード：手動、会社名の抽出：あり（2.3 の 16 の後の状態）。表示テーマと送信モードは、このフローで設定します
# 注意: 送信先・ログ・引継ぎ内容が残ることは、このフローでは確認しません（未確認）
- launchApp
- tapOn: "アプリの設定"
- assertVisible: "端末の許可"
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/rbSmsReplyModeManual"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/rbSmsReplyModeManual"
    checked: true
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/swCompanyNameExtractionEnabled"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/swCompanyNameExtractionEnabled"
    checked: true
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/rbThemeDark"
- tapOn:
    id: "com.ssfrontier.smstokintone:id/rbThemeDark"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/rbThemeDark"
    checked: true
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/rbSendManual"
- tapOn:
    id: "com.ssfrontier.smstokintone:id/rbSendManual"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/rbSendManual"
    checked: true
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/btnResetSettings"
- tapOn:
    id: "com.ssfrontier.smstokintone:id/btnResetSettings"
- assertVisible: "設定を初期化しますか？"
- tapOn: "初期化" # 未確認: 画面の後ろの初期化ボタンと同じ文字のため、ダイアログのボタンが選ばれるか確認する
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/rbThemeLight"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/rbThemeLight"
    checked: true
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/rbSendAuto"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/rbSendAuto"
    checked: true
- takeScreenshot: 2.3-17-after-reset-settings

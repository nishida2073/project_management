# 2.2 送信先の設定: 保存していない接続先は破棄される（テスト仕様書の 2.2 の 25 に対応）
appId: com.ssfrontier.smstokintone
---
# 前提: 仕様書 2.2 の前提条件（test-send-target-1 の接続先が保存済み）
# 未確認: 未保存の変更を確認するダイアログの有無（出る場合は後続の操作が失敗する）
- launchApp
- tapOn: "送信先の設定"
- assertVisible: "設定を追加"
# 前提確認: test-send-target-1 が保存済み
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/etSendTargetName"
    index: 0
    text: "test-send-target-1"
# 前提確認: test-send-target-1 の接続先が保存済み
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/etSubdomain"
    direction: DOWN
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/etSubdomain"
    index: 0
    text: "${SUBDOMAIN}"
- tapOn:
    id: "com.ssfrontier.smstokintone:id/etSubdomain"
- inputText: "${UNSAVED_SUBDOMAIN}"
- hideKeyboard
- pressKey: Back
- tapOn: "送信先の設定"
- assertVisible: "設定を追加"
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/etSubdomain"
    direction: DOWN
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/etSubdomain"
    text: "${SUBDOMAIN}"
- assertNotVisible: "${UNSAVED_SUBDOMAIN}"
- takeScreenshot: 2.2-25-unsaved-discarded

# 2.6 ログ: 抽出が異常の SMS の受信完了のログを長押しすると、抽出の失敗が表示される（テスト仕様書の 2.6 の 9 に対応）
# 前提: setup（clearState と JSON 投入）から開始する
# 外部条件: 会社名・氏名を抽出できない SMS を 1 通受信する（下の assert の待ち時間（60 秒）の間に受信させる）
# 未確認: 「外部条件」の assert の timeout の指定が、この Maestro で使えるか
# 未確認: 抽出が異常のログが複数あるとき、先頭のログが対象になるか
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "ログの確認"
- assertVisible: "ログの一覧"
- assertVisible:
    text: '(?s).*\[受信完了\].*'
    timeout: 60000
- takeScreenshot: 2.6-09-extraction-failed-detail-01
- longPressOn:
    text: '(?s).*\[受信完了\].*'
    index: 0
- assertVisible: '.*抽出結果.*'
- assertVisible: "会社名・氏名の抽出に失敗しています"
- takeScreenshot: 2.6-09-extraction-failed-detail-02

# 2.2 送信先の設定: ログイン名が不正なときテスト送信が失敗する（テスト仕様書の 2.2 の 17 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（フローで設定）: このフローでログイン名を不正な値にする
# 外部条件: kintone 接続が必要（不正なログイン名の応答を得るため）
# テスト送信は画面の未保存の入力値（ログイン名）を使う
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "送信先の設定"
- takeScreenshot: 2.2-17-test-send-invalid-login-error-01
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "設定を追加"
- runFlow:
    file: common/scroll-down-and-assert-text-by-id.yaml
    env:
      ID: etSendTargetName
      INDEX: 0
      TEXT: "test-send-target-1"
- runFlow:
    file: common/scroll-down-and-assert-text-by-id.yaml
    env:
      ID: etKeyword
      INDEX: 0
      TEXT: "test-company"
- runFlow:
    file: common/scroll-down-by-id.yaml
    env:
      ID: etLoginName
- runFlow:
    file: common/input-text-by-id.yaml
    env:
      ID: etLoginName
      INDEX: 0
      VALUE: "${INVALID_LOGIN_NAME}"
- scrollUntilVisible:
    element: "テスト送信"
    direction: DOWN
- tapOn: "テスト送信"
- takeScreenshot: 2.2-17-test-send-invalid-login-error-02
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "テスト本文"
- tapOn: "送信"
- takeScreenshot: 2.2-17-test-send-invalid-login-error-03
- assertVisible: "(?s).*送信失敗.*"
# 未確認: 応答本文の中身は kintone 側の応答に依存するため、ここでは文字で確認しない（表示の有無は確認する）
- takeScreenshot: 2.2-17-test-send-invalid-login-error-04

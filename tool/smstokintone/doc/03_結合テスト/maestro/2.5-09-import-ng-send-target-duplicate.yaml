# 2.5 設定のインポート・エクスポート: 送信先名が重複したファイルを選ぶ（テスト仕様書の 2.5 の 9 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 未確認: launchApp が前の画面を閉じて起動し直すか
# 外部条件: ${IMPORT_FILE} を端末の選択先に置く（ファイルの置き場所は未確認）。
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "設定のインポート・エクスポート"
- takeScreenshot: 2.5-09-import-ng-send-target-duplicate-01
- assertVisible: "設定のインポート・エクスポート"
- assertVisible: "ファイルを選択"
- assertVisible: "ファイルが選択されていません"
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/btnImportSettings"
    enabled: false
- tapOn: "ファイルを選択"
# 未確認: 文書選択ダイアログ（Documents UI）の操作は公式ドキュメントで確認できなかった
- takeScreenshot: 2.5-09-import-ng-send-target-duplicate-02
- runFlow:
    file: common/select-download-file.yaml
    env:
      FILE_PATTERN: ${IMPORT_FILE}
- takeScreenshot: 2.5-09-import-ng-send-target-duplicate-03
- assertVisible: "インポートエラー"
- assertVisible: "(?s).*送信先名がファイル内で重複しています.*test-send-target-1.*"   # 未確認: メッセージ文言
- tapOn: "OK"   # 未確認: エラーダイアログの OK ボタンの文字
- takeScreenshot: 2.5-09-import-ng-send-target-duplicate-04
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/btnImportSettings"
    enabled: false
- takeScreenshot: 2.5-09-import-ng-send-target-duplicate-05

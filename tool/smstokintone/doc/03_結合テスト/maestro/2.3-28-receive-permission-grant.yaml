# 2.3 アプリの設定: SMSの受信の「許可する（SMSの受信）」を押すと、SMSの受信が許可済みになる（テスト仕様書の 2.3 の 28 に対応）
# 前提（フローで設定）: 起動時にSMSの受信を許可しない（この flow だけ、launchApp の permissions で拒否する）
# 外部条件: エミュレーターでは、「許可する（SMSの受信）」を押すと、ダイアログを出さずに許可される。実機でダイアログが出る場合は、許可ボタンを押す手順が必要（未確認）
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp:
    permissions:
      all: allow
      android.permission.RECEIVE_SMS: deny
- tapOn: "アプリの設定"
- runFlow:
    file: common/scroll-down-by-id.yaml
    env:
      ID: btnRequestPermission
- runFlow:
    file: common/assert-visible-by-id.yaml
    env:
      ID: btnRequestPermission
      INDEX: 0
- takeScreenshot: 2.3-28-receive-permission-grant-01
- runFlow:
    file: common/scroll-down-and-tap-by-id.yaml
    env:
      ID: btnRequestPermission
      INDEX: 0
- runFlow:
    file: common/scroll-down-and-assert-text-by-id.yaml
    env:
      ID: tvPermissionStatus
      INDEX: 0
      TEXT: "許可済み"
- runFlow:
    file: common/assert-not-visible-by-id.yaml
    env:
      ID: btnRequestPermission
      INDEX: 0
- takeScreenshot: 2.3-28-receive-permission-grant-02

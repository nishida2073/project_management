# 2.3 アプリの設定: SMSの読み取りの許可を拒否すると案内が出る（テスト仕様書の 2.3 の 27 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 外部条件: SMSの読み取りの権限の付与・未付与は端末の設定でしか切り替えられないため、このフローでは作らない（端末で未付与にしておく）
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- runFlow:
    file: common/scroll-up-to-id.yaml
    env:
      ID: rbThemeLight
- takeScreenshot: 2.3-27-read-permission-denied-01
- runFlow:
    file: common/scroll-down-to-id.yaml
    env:
      ID: btnRequestReadPermission
- takeScreenshot: 2.3-27-read-permission-denied-02
- runFlow:
    file: common/assert-id-visible.yaml
    env:
      ID: btnRequestReadPermission
      INDEX: 0
- runFlow:
    file: common/assert-id-not-visible.yaml
    env:
      ID: tvReadPermissionStatus
      INDEX: 0
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: btnRequestReadPermission
      INDEX: 0
- takeScreenshot: 2.3-27-read-permission-denied-03
- tapOn: "許可しない" # 未確認: 端末の権限ダイアログの拒否ボタンの文字（Android の版・言語で異なる）
- takeScreenshot: 2.3-27-read-permission-denied-04
- assertVisible: "SMSの読み取りの許可がない場合、SMSの検索はできません" # トースト（Toast.LENGTH_LONG で表示される）
- runFlow:
    file: common/scroll-down-to-id.yaml
    env:
      ID: btnRequestReadPermission
- runFlow:
    file: common/assert-id-visible.yaml
    env:
      ID: btnRequestReadPermission
      INDEX: 0
- takeScreenshot: 2.3-27-read-permission-denied-05

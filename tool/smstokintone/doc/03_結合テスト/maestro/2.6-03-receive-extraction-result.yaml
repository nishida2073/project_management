# 2.6 ログ: 受信完了のログを長押しすると抽出結果が表示される（テスト仕様書の 2.6 の 3 に対応）
# 外部条件: テストデータの SMS を 1 通受信する（会社名 test-company を含む本文）。下の「外部条件」の assert の待ち時間（60 秒）の間に受信させる
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "ログの確認"
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "ログの一覧"
- takeScreenshot: 2.6-03-receive-extraction-result-01
- extendedWaitUntil:
    visible: '(?s).*\[受信完了\].*'
    timeout: 60000
- longPressOn:
    text: '(?s).*\[受信完了\].*'
    index: 0
- assertVisible: '(?s).*抽出結果.*⚙.*🔄.*'
- assertVisible: '(?s).*${EXPECTED_RESULT_COMPANY_LINE}.*'
- assertVisible: '(?s).*${EXPECTED_RESULT_USER_LINE}.*'
- takeScreenshot: 2.6-03-receive-extraction-result-02

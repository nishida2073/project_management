# 前提の環境を作る: 設定ファイルをインポートして、テストの前提（送信先 1 件、既定の設定、引継ぎ内容 2 件）を用意する
# 前提（手動）: test-data\setup\env_base.json を端末のダウンロードフォルダに置く（接続用の値が入ったファイル）
# 注: この flow は clearState を使い、端末のアプリの設定を消してから投入する。各テストの flow の先頭で runFlow により呼び出す
# 未確認: 文書選択ダイアログの操作（ダウンロードからファイルを選ぶ手順）は公式ドキュメントで確認できていない
appId: jp.co.nttdata_univ.smstokintone
---
- launchApp:
    clearState: true
- tapOn: "設定のインポート・エクスポート"
- assertVisible: "ファイルを選択"
- tapOn: "ファイルを選択"
- runFlow:
    file: ../common/select-download-file.yaml
    env:
      TEXT: ${SETUP_FILE_PATTERN}
- assertVisible: '(?s).*${SETUP_FILE_PATTERN}.*'   # 「ファイル名」と改行を含む 1 つの表示に一致させる（端末で確認済み）
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/btnImportSettings"
- assertVisible: "設定をインポートしますか？"
- runFlow:
    file: ../common/tap-android-id.yaml
    env:
      ID: button1
- assertVisible: "設定をインポートしました"   # 未確認: トーストの表示
- takeScreenshot: setup-import-environment

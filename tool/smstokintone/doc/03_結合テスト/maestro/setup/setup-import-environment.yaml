# 前提の環境を作る: 設定ファイルをインポートして、テストの前提（送信先 1 件、既定の設定、引継ぎ内容 2 件）を用意する
# 注: この flow は clearState を使い、端末のアプリの設定を消してから投入する。各テストの flow の先頭で runFlow により呼び出す
appId: jp.co.nttdata_univ.smstokintone
---
- launchApp:
    clearState: true
- tapOn: "設定のインポート・エクスポート"
- assertVisible: "ファイルを選択"
- tapOn: "ファイルを選択"
- runFlow:
    file: ../common/select-download-file-by-text.yaml
    env:
      TEXT: ${SETUP_FILE_PATTERN}
- assertVisible: '(?s).*${SETUP_FILE_PATTERN}.*'
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/btnImportSettings"
- assertVisible: "設定をインポートしますか？"
- runFlow:
    file: ../common/tap-android-by-id.yaml
    env:
      ID: button1
- assertVisible: "SMSの送信モード"
- takeScreenshot: setup-import-environment

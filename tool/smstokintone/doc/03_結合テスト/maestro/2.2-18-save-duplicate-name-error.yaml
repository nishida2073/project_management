# 2.2 送信先の設定: 送信先名が重複するとき保存でエラーになる（テスト仕様書の 2.2 の 18 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（フローで設定）: このフローの中で 2 件目を追加し、同じ送信先名と、重複の判定までに必須となる項目（アプリID・ログイン名・パスワード）を入力する
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "送信先の設定"
- assertVisible: "設定を追加"
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/etSendTargetName"
    index: 0
    text: "${DUPLICATE_SEND_TARGET_NAME}"
- tapOn: "設定を追加"
- assertVisible: "設定 2"
- scrollUntilVisible:
    element:
      text: "設定 2"
    direction: DOWN
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/etSendTargetName"
    index: 0
- inputText: "${DUPLICATE_SEND_TARGET_NAME}"
- hideKeyboard
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/etSendTargetName"
    index: 0
    text: "${DUPLICATE_SEND_TARGET_NAME}"
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: etLoginName
- runFlow:
    file: common/input-text-field.yaml
    env:
      FIELD_ID: etLoginName
      INPUT_VALUE: "${DUP_LOGIN_NAME}"
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: etLoginPassword
- runFlow:
    file: common/input-password-field.yaml
    env:
      FIELD_ID: etLoginPassword
      INPUT_VALUE: "${DUP_LOGIN_PASSWORD}"
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: etAppId
- runFlow:
    file: common/input-text-field.yaml
    env:
      FIELD_ID: etAppId
      INPUT_VALUE: "${DUP_APP_ID}"
- takeScreenshot: 2.2-18-save-duplicate-name-error-01
- tapOn: "設定を保存"
- takeScreenshot: 2.2-18-save-duplicate-name-error-02
- assertVisible: "入力エラー"
- assertVisible: "(?s).*送信先名が重複しています.*"
- assertVisible: "(?s).*${DUPLICATE_SEND_TARGET_NAME}.*"
- takeScreenshot: 2.2-18-save-duplicate-name-error-03

# 2.3 アプリの設定: 会社名の自動変換を切り替える（テスト仕様書の 2.3 の 26 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提: JSON（env_ok.json）の状態から開始する（会社名の抽出：あり、会社名の自動変換：あり、表示テーマ：ライト）。このフローで会社名の自動変換をオフにする。
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- takeScreenshot: 2.3-26-company-name-auto-conversion-off-01
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/swCompanyNameExtractionEnabled"
    direction: DOWN
    visibilityPercentage: 100
- takeScreenshot: 2.3-26-company-name-auto-conversion-off-02
- assertVisible: # 前提の確認（会社名の抽出が有効）
    id: "jp.co.nttdata_univ.smstokintone:id/swCompanyNameExtractionEnabled"
    checked: true
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/swCompanyNameAutoConversionEnabled"
    direction: DOWN
    visibilityPercentage: 100
- takeScreenshot: 2.3-26-company-name-auto-conversion-off-03
- assertVisible: # 前提の確認（会社名の自動変換が有効）
    id: "jp.co.nttdata_univ.smstokintone:id/swCompanyNameAutoConversionEnabled"
    checked: true
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/swCompanyNameAutoConversionEnabled"
    index: 0
- takeScreenshot: 2.3-26-company-name-auto-conversion-off-04
- assertVisible: # スイッチの選択状態の確認
    id: "jp.co.nttdata_univ.smstokintone:id/swCompanyNameAutoConversionEnabled"
    checked: false
- pressKey: Back
- takeScreenshot: 2.3-26-company-name-auto-conversion-off-05
- tapOn: "アプリの設定"
- takeScreenshot: 2.3-26-company-name-auto-conversion-off-06
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/swCompanyNameAutoConversionEnabled"
    direction: DOWN
    visibilityPercentage: 100
- takeScreenshot: 2.3-26-company-name-auto-conversion-off-07
- assertVisible: # 開き直した後も無効のまま保存されていること
    id: "jp.co.nttdata_univ.smstokintone:id/swCompanyNameAutoConversionEnabled"
    checked: false
- takeScreenshot: 2.3-26-company-name-auto-conversion-off-08

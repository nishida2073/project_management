# 2.7 SMSの検索: 同じ SMS を 2 回送信すると、2 回目は更新をスキップし、成功として扱われる（テスト仕様書の 2.7 の 12 に対応）
# 前提（フローで設定）: 送信モードを手動にしてから、遅延して届く SMS の受信を待つ。kintone の接続が有効（テスト環境）
# 外部条件: テストデータの SMS は遅延して届く（test-data\sms\2.7-12-send-twice-skip-duplicate.json の delayed）
# 注: 検索条件は未送信のみにすると 2 回目の対象がなくなるため、「未」を外して全件を対象にする
# 未確認: 2 回目のトーストの成功件数（N件）は、端末の SMS の件数による。失敗は 0 件として扱う
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: rbSendManual
      INDEX: 0
- runFlow:
    file: common/assert-id-checked.yaml
    env:
      ID: rbSendManual
      INDEX: 0
- pressKey: Back
- tapOn: "ログの確認"
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "ログの一覧"
- extendedWaitUntil:
    visible: '(?s).*\[受信完了\].*'
    timeout: 180000
- pressKey: Back
- tapOn: "SMSの検索"
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "検索条件"
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: cbSmsSearchSendNoneOnly
      INDEX: 0
- runFlow:
    file: common/assert-id-checked.yaml
    env:
      ID: cbSmsSearchSendNoneOnly
      INDEX: 0
- tapOn: "検索"
- tapOn: "全選択"
- tapOn: "選択したSMSを送信"
- takeScreenshot: 2.7-12-send-twice-skip-duplicate-01
- pressKey: Back
- tapOn: "ログの確認"
- extendedWaitUntil:
    visible: '(?s).*\[送信完了\].*'
    timeout: 180000
- pressKey: Back
- tapOn: "SMSの検索"
- tapOn: "検索"
- tapOn: "全選択"
- tapOn: "選択したSMSを送信"
- pressKey: Back
- tapOn: "ログの確認"
- extendedWaitUntil:
    visible: '(?s).*\[送信完了\].*'
    timeout: 180000
- assertVisible:
    text: '(?s).*スキップ.*'
    index: 0
- pressKey: Back
- tapOn: "SMSの検索"
- takeScreenshot: 2.7-12-send-twice-skip-duplicate-02

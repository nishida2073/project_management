# 2.3 アプリの設定: AIによる抽出を切り替える（テスト仕様書の 2.3 の 24 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（フローで設定）: AIによる抽出をオンにする（JSON では無効）
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- runFlow:
    file: common/scroll-to-top-setting.yaml
- takeScreenshot: 2.3-24-ai-extraction-on-01
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: swCompanyNameExtractionEnabled
- takeScreenshot: 2.3-24-ai-extraction-on-02
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/swCompanyNameExtractionEnabled"
    checked: true
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: swAiExtractionEnabled
- takeScreenshot: 2.3-24-ai-extraction-on-03
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/swAiExtractionEnabled"
    checked: false
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: swAiExtractionEnabled
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/swAiExtractionEnabled"
    index: 0
- takeScreenshot: 2.3-24-ai-extraction-on-04
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: swAiExtractionEnabled
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/swAiExtractionEnabled"
    checked: true
- pressKey: Back
- takeScreenshot: 2.3-24-ai-extraction-on-05
- tapOn: "アプリの設定"
- runFlow:
    file: common/scroll-to-top-setting.yaml
- takeScreenshot: 2.3-24-ai-extraction-on-06
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: swAiExtractionEnabled
- takeScreenshot: 2.3-24-ai-extraction-on-07
- assertVisible: # 開き直した後も有効のまま保存されていること
    id: "jp.co.nttdata_univ.smstokintone:id/swAiExtractionEnabled"
    checked: true
- takeScreenshot: 2.3-24-ai-extraction-on-08

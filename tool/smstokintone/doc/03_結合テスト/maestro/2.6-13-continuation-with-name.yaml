# 2.6 ログ: 引継ぎの SMS の送信元に、引継いだ氏名が表示される（テスト仕様書の 2.6 の 13 に対応）
# 外部条件: 引継ぎ内容の送信元（test-sender-a）から SMS を 1 通受信する（下の assert の待ち時間（60 秒）の間に受信させる）
# 未確認: 「外部条件」の assert の timeout の指定が、この Maestro で使えるか
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/swContinuationShowUserNameEnabled"
    direction: DOWN
    visibilityPercentage: 100
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/swContinuationShowUserNameEnabled"
    checked: true
- pressKey: Back
- tapOn: "ログの確認"
- assertVisible: "ログの一覧"
- assertVisible:
    text: '(?s).*${CONTINUATION_SENDER}.*'
    timeout: 60000
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/btnRefreshLog"
- assertVisible: '(?s).*${CONTINUATION_USER_NAME}.*'
- takeScreenshot: 2.6-13-continuation-with-name-01

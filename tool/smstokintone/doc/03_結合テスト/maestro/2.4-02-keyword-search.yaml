# 2.4 引継ぎ内容の設定: キーワードで一覧を絞り込む（テスト仕様書の 2.4 の 2 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（JSON）: test-data/setup/env_ok.json を投入した直後の状態。送信元 test-sender-a（古い）と test-sender-b（新しい）、送信先 test-send-target-1（振り分け: test-company）、会社名の抽出: あり、引継ぎ内容の氏名表示: あり。
# 前提（この flow で設定）: 最初に setup/setup-import-environment.yaml で JSON を投入し直し、前の flow の変更（削除など）を戻す。表示順序は投入後の既定（古い順）。
# 前提（JSON の値で判断）: SEARCH_KEYWORD（test-company）は送信元 B の会社名（test-company-new）に一致し、送信元 A の会社名（old-company）には一致しない。
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- takeScreenshot: 2.4-02-keyword-search-01
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/btnEditContinuationInfo"
    direction: DOWN
- tapOn:
    id: "com.ssfrontier.smstokintone:id/btnEditContinuationInfo"
- takeScreenshot: 2.4-02-keyword-search-02
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/etContinuationSearch"
# 前提確認（表示のみ、操作しない）
- assertVisible: "${SENDER_A}"
# 未確認: 送信元 B は画面の下にあるとき、スクロールしてから確認する。
- scrollUntilVisible:
    element:
      text: "${SENDER_B}"
    direction: DOWN
- assertVisible: "${SENDER_B}"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/rbContinuationSortAscending"
    checked: true
- tapOn:
    id: "com.ssfrontier.smstokintone:id/etContinuationSearch"
- takeScreenshot: 2.4-02-keyword-search-03
- inputText: "${SEARCH_KEYWORD}"
- takeScreenshot: 2.4-02-keyword-search-04
- hideKeyboard
- assertVisible: "${SENDER_B}"
# 未確認: SENDER_A が一覧から消えることは、データの内容に依存する。
- assertNotVisible: "${SENDER_A}"
- takeScreenshot: 2.4-02-keyword-search-05

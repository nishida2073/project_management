# 2.1 トップ: 送信先の設定の画面に移動できることを確認する（テスト仕様書の 2.1 の 5 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: btnTopOpenSendTargetSettings
      INDEX: 0
- takeScreenshot: 2.1-05-open-send-target-settings-01
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "送信先の設定"
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "設定を追加"
- pressKey: Back
- takeScreenshot: 2.1-05-open-send-target-settings-02

# 2.2 送信先の設定: 振り分けがないときのテスト送信（テスト仕様書の 2.2 の 8 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（フローで設定）: 振り分けは画面で行を削除して空にし、保存しない
# 外部条件: kintone 接続と SMS 受信が必要
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "送信先の設定"
- takeScreenshot: 2.2-08-test-send-success-no-keyword-01
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "設定を追加"
- scrollUntilVisible:
    element:
      text: "設定 1"
    direction: UP
- runFlow:
    file: common/scroll-down-and-assert-field-text.yaml
    env:
      ID: etSendTargetName
      INDEX: 0
      TEXT: "test-send-target-1"
- runFlow:
    file: common/scroll-down-and-assert-field-text.yaml
    env:
      ID: etKeyword
      INDEX: 0
      TEXT: "test-company"
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: btnDeleteKeyword
      INDEX: 0
- takeScreenshot: 2.2-08-test-send-success-no-keyword-02
- assertNotVisible: "test-company"
- scrollUntilVisible:
    element:
      text: "^テスト送信$"
    direction: DOWN
- runFlow:
    file: common/tap-text.yaml
    env:
      TEXT: "^テスト送信$"
      INDEX: 0
- takeScreenshot: 2.2-08-test-send-success-no-keyword-03
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "テスト本文"
- assertVisible: '(?s).*${EXPECTED_COMPANY_NAME_09}.*'
- assertVisible: '(?s).*${EXPECTED_USER_NAME}.*'
- tapOn: "送信"
- takeScreenshot: 2.2-08-test-send-success-no-keyword-04
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "(?s).*テスト結果.*"
- assertVisible: '(?s).*${EXPECTED_RESULT_COMPANY_LINE}.*'
- assertVisible: '(?s).*${EXPECTED_RESULT_USER_LINE}.*'
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "(?s).*SMSの(登録|更新)に成功しました.*"
# 未確認: テスト登録が kintone に入ったかは kintone 側の画面で確認が必要（送信内容は KintoneApi.kt:247-283 で決まる）
- takeScreenshot: 2.2-08-test-send-success-no-keyword-05

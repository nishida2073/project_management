# 2.5 設定のインポート・エクスポート: エクスポートで保存先を選ばずに閉じる（テスト仕様書の 2.5 の 15 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 未確認: launchApp が前の画面を閉じて起動し直すか
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "設定のインポート・エクスポート"
- takeScreenshot: 2.5-15-export-ng-cancel-save-01
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "設定のインポート・エクスポート"
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: btnExportSettings
      INDEX: 0
# 未確認: 保存ダイアログ（Documents UI）の操作は公式ドキュメントで確認できなかった
- takeScreenshot: 2.5-15-export-ng-cancel-save-02
- back   # 未確認: 保存ダイアログを戻る操作で閉じられるか
- assertNotVisible: "設定をエクスポートしました"
- assertNotVisible: "エクスポートエラー"
- runFlow:
    file: common/assert-id-visible.yaml
    env:
      ID: btnExportSettings
      INDEX: 0
- takeScreenshot: 2.5-15-export-ng-cancel-save-03

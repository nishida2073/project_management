# 2.8 自動処理: AIによる抽出が有効な端末で、SMSを AI で抽出する（テスト仕様書の 2.8 の 4 に対応）
appId: com.ssfrontier.smstokintone
---
# 前提（JSON）: 既定値（2.8 の 1 と同じ）
# 前提（フローで設定）: AIによる抽出を有効にする
# 外部条件: Gemini Nano に対応した端末でだけ確認できる（対応機種: （未確認））。別端末から SMS を送る（本文は 1 行目「test-company」、2 行目「test-taro」、3 行目「body-test」、送信元 test-phone-a）
# 外部条件（事前に別端末から SMS を送る）: 待ち時間（下の extendedWaitUntil）に送る
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/swAiExtractionEnabled"
    direction: DOWN
    visibilityPercentage: 100
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/swAiExtractionEnabled"
    checked: false
- tapOn:
    id: "com.ssfrontier.smstokintone:id/swAiExtractionEnabled"
    index: 0
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/swAiExtractionEnabled"
    checked: true
- pressKey: Back
- runFlow: common/enable-log-auto-refresh.yaml
- tapOn:
    id: "com.ssfrontier.smstokintone:id/btnTopOpenLog"
- takeScreenshot: 2.8-04-ai-extraction-supported-01
- extendedWaitUntil:
    visible: "(?s).*SMSを受信しました.*"
    timeout: 180000
- assertVisible: "(?s).*SMSの登録に成功しました.*"
- longPressOn: "(?s).*SMSを受信しました.*"
- assertVisible: "抽出結果"
- takeScreenshot: 2.8-04-ai-extraction-supported-02
# 未確認: AI 抽出の表示（🤖）の文字は、抽出結果のダイアログに出るか未確認。確認できない場合は画面の写真で判定する
- assertVisible: "(?s).*TEST－COMPANY.*"
- takeScreenshot: 2.8-04-ai-extraction-supported-03

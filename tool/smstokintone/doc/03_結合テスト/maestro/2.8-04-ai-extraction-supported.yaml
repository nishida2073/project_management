# 2.8 自動処理: AIによる抽出が有効な端末で、SMSを AI で抽出する（テスト仕様書の 2.8 の 4 に対応）
# 前提（フローで設定）: AIによる抽出を有効にする
# 外部条件: Gemini Nano に対応した端末でだけ確認できる（対応機種: （未確認））。待ち時間（下の extendedWaitUntil）に、別端末から SMS を送る（本文は 1 行目「test-company」、2 行目「test-taro」、3 行目「body-test」、送信元 0312345801）
# 注: 抽出結果のダイアログのタイトルに、AI の印 🤖（strings.xml の icon_extraction_ai。LogActivity の showExtractionResultDialog）が出ることで、AI で抽出したことを確認する
# 注: 仕様書の「抽出の方法」の文字は、アプリの表示にないため確認しない（strings.xml に該当の文字列はなく、表示は 🤖 の印だけ）
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- runFlow:
    file: common/scroll-down-by-id.yaml
    env:
      ID: swAiExtractionEnabled
- runFlow:
    file: common/assert-unchecked-by-id.yaml
    env:
      ID: swAiExtractionEnabled
      INDEX: 0
- runFlow:
    file: common/scroll-down-and-tap-by-id.yaml
    env:
      ID: swAiExtractionEnabled
      INDEX: 0
- runFlow:
    file: common/assert-checked-by-id.yaml
    env:
      ID: swAiExtractionEnabled
      INDEX: 0
- pressKey: Back
- runFlow:
    file: common/scroll-down-and-tap-by-id.yaml
    env:
      ID: btnTopOpenLog
      INDEX: 0
- takeScreenshot: 2.8-04-ai-extraction-supported-01
- runFlow:
    file: common/refresh-log-until-visible.yaml
    env:
      TEXT: "(?s).*SMSを受信しました.*"
- runFlow:
    file: common/refresh-log-until-visible.yaml
    env:
      TEXT: "(?s).*SMSの(登録|更新)に成功しました.*"
- longPressOn: "(?s).*SMSを受信しました.*"
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "抽出結果 🤖.*"
- takeScreenshot: 2.8-04-ai-extraction-supported-02
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "(?s).*会社名：TEST－COMPANY.*"
- takeScreenshot: 2.8-04-ai-extraction-supported-03

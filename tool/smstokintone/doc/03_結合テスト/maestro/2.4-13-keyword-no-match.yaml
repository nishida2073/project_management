# 2.4 引継ぎ内容の設定: 一致しないキーワードでは該当がないと表示される（テスト仕様書の 2.4 の 13 に対応）
appId: com.ssfrontier.smstokintone
---
# 前提: 引継ぎ内容が 2 件（SENDER_A、SENDER_B）。表示順序は古い順（既定）。
# 未確認: 「一致する引継ぎ内容がありません」の文言は strings.xml の値で、実機の表示は未確認。
- launchApp
- tapOn: "アプリの設定"
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/btnEditContinuationInfo"
    direction: DOWN
- tapOn:
    id: "com.ssfrontier.smstokintone:id/btnEditContinuationInfo"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/etContinuationSearch"
- tapOn:
    id: "com.ssfrontier.smstokintone:id/etContinuationSearch"
- inputText: "${SEARCH_NO_MATCH}"
- hideKeyboard
- assertVisible: "一致する引継ぎ内容がありません"
- assertNotVisible: "${SENDER_A}"
- assertNotVisible: "${SENDER_B}"
- takeScreenshot: 2.4-13-after-no-match

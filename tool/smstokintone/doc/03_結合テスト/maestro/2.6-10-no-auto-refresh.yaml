# 2.6 ログ: 自動更新をオフにすると、受信した SMS は「更新」を押すまで表示されない（テスト仕様書の 2.6 の 10 に対応）
# 前提（フローで設定）: このフローで自動更新をオフにする
# 外部条件: ログの画面を表示したまま、別の端末から SMS を 1 通受信する
# 未確認: 「表示されない」の確認は、受信から待たずに判定する。自動更新の間隔（5 秒）を過ぎても表示されないことは、確認していない
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: swLogRefreshEnabled
      INDEX: 0
- runFlow:
    file: common/assert-id-unchecked.yaml
    env:
      ID: swLogRefreshEnabled
      INDEX: 0
- pressKey: Back
- tapOn: "ログの確認"
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "ログの一覧"
- takeScreenshot: 2.6-10-no-auto-refresh-01
- assertNotVisible:
    text: '(?s).*\[受信完了\].*'
- takeScreenshot: 2.6-10-no-auto-refresh-02

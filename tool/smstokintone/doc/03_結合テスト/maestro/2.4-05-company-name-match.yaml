# 2.4 引継ぎ内容の設定: 会社名を入力すると送信先が表示される（テスト仕様書の 2.4 の 5 に対応）
appId: com.ssfrontier.smstokintone
---
# 前提: 表示順序は古い順（既定）。送信元は 2.4-03/04 の後の状態に依存し、2 件とは限らない（テスト仕様書の 2.4 前提条件）。
# 前提（画面で確認不可）: 送信先 test-send-target-1（振り分け：test-company）が設定済み。会社名の一致は入力後に確認する。
# 未確認: 一覧の index 1 が SENDER_B。会社名欄の既存値は eraseText で消す（カーソル位置に依存する）。
- launchApp
- tapOn: "アプリの設定"
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/btnEditContinuationInfo"
    direction: DOWN
- tapOn:
    id: "com.ssfrontier.smstokintone:id/btnEditContinuationInfo"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/etContinuationSearch"
# 前提確認（表示のみ、操作しない）
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/rbContinuationSortAscending"
    checked: true
- tapOn:
    id: "com.ssfrontier.smstokintone:id/etContinuationCompanyName"
    index: 1
- eraseText: 50  # 未確認
- inputText: "${COMPANY_NAME_MATCH}"
- hideKeyboard
- assertVisible: "${SEND_TARGET_NAME}"
- takeScreenshot: 2.4-05-after-company-match

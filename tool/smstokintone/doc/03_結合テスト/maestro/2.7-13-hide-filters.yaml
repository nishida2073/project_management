# 2.7 SMSの検索: 「▲ 隠す」で検索条件が隠れ、ボタンの文字が「▼ 表示」になる（テスト仕様書の 2.7 の 13 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "SMSの検索"
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "検索条件"
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: cbSmsSearchSendNoneOnly
      INDEX: 0
- runFlow:
    file: common/assert-id-unchecked.yaml
    env:
      ID: cbSmsSearchSendNoneOnly
      INDEX: 0
- tapOn: "▲ 隠す"
- runFlow:
    file: common/assert-id-not-visible.yaml
    env:
      ID: llSearchFilters
      INDEX: 0
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "▼ 表示"
- takeScreenshot: 2.7-13-hide-filters-01

# 2.3 アプリの設定: SMSの送信モードを手動に切り替える（テスト仕様書の 2.3 の 3 に対応）
appId: com.ssfrontier.smstokintone
---
# 前提: 送信モード：自動、返信モード：手動（2.3 の 2 の後の状態）。表示テーマは、このフローでライトにします
- launchApp
- tapOn: "アプリの設定"
- assertVisible: "端末の許可"
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/rbSendAuto"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/rbSendAuto"
    checked: true
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/rbSmsReplyModeManual"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/rbSmsReplyModeManual"
    checked: true
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/rbThemeLight"
- tapOn:
    id: "com.ssfrontier.smstokintone:id/rbThemeLight"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/rbThemeLight"
    checked: true
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/rbSendManual"
- tapOn:
    id: "com.ssfrontier.smstokintone:id/rbSendManual"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/rbSendManual"
    checked: true
- pressKey: Back
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/tvTopSendStatus"
    text: "手動"
- takeScreenshot: 2.3-03-after-send-mode-manual

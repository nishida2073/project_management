# 2.3 アプリの設定: SMSの送信モードを手動に切り替える（テスト仕様書の 2.3 の 3 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（フローで設定）: SMSの送信モードを手動に切り替える
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/rbThemeLight"
    direction: UP
    visibilityPercentage: 100
- takeScreenshot: 2.3-03-send-mode-manual-01
- assertVisible: "端末の許可"
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/rbSendAuto"
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/rbSendAuto"
    checked: true
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/rbSendManual"
    direction: UP
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/rbSendManual"
- takeScreenshot: 2.3-03-send-mode-manual-02
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/rbSendManual"
    direction: DOWN
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/rbSendManual"
    checked: true
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/rbSmsReplyModeManual"
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/rbSmsReplyModeManual"
    checked: true
- pressKey: Back
- takeScreenshot: 2.3-03-send-mode-manual-03
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/tvTopSendStatus"
    text: "手動"
- takeScreenshot: 2.3-03-send-mode-manual-04

# 2.3 アプリの設定: SMSの送信モードを手動に切り替える（テスト仕様書の 2.3 の 3 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（フローで設定）: SMSの送信モードを手動に切り替える
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- runFlow:
    file: common/scroll-up-by-id.yaml
    env:
      ID: rbThemeLight
- takeScreenshot: 2.3-03-send-mode-manual-01
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "端末の許可"
- runFlow:
    file: common/scroll-down-by-id.yaml
    env:
      ID: rbSendAuto
- runFlow:
    file: common/assert-checked-by-id.yaml
    env:
      ID: rbSendAuto
      INDEX: 0
- runFlow:
    file: common/scroll-up-by-id.yaml
    env:
      ID: rbSendManual
- runFlow:
    file: common/scroll-down-and-tap-by-id.yaml
    env:
      ID: rbSendManual
      INDEX: 0
- takeScreenshot: 2.3-03-send-mode-manual-02
- runFlow:
    file: common/scroll-down-by-id.yaml
    env:
      ID: rbSendManual
- runFlow:
    file: common/assert-checked-by-id.yaml
    env:
      ID: rbSendManual
      INDEX: 0
- runFlow:
    file: common/scroll-down-by-id.yaml
    env:
      ID: rbSmsReplyModeManual
- runFlow:
    file: common/assert-checked-by-id.yaml
    env:
      ID: rbSmsReplyModeManual
      INDEX: 0
- pressKey: Back
- takeScreenshot: 2.3-03-send-mode-manual-03
- runFlow:
    file: common/scroll-down-and-assert-text-by-id.yaml
    env:
      ID: tvTopSendStatus
      INDEX: 0
      TEXT: "手動"
- takeScreenshot: 2.3-03-send-mode-manual-04

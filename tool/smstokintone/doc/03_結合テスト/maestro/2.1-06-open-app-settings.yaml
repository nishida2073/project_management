# 2.1 トップ: アプリの設定の画面に移動できることを確認する（テスト仕様書の 2.1 の 6 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- runFlow:
    file: common/scroll-down-and-tap-by-id.yaml
    env:
      ID: btnTopOpenAppSettings
      INDEX: 0
- takeScreenshot: 2.1-06-open-app-settings-01
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "アプリの設定"
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "初期化"
- pressKey: Back
- takeScreenshot: 2.1-06-open-app-settings-02

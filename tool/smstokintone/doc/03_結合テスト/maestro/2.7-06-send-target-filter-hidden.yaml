# 2.7 SMSの検索: 送信先が 1 件のとき、送信先の選択欄は表示されない（テスト仕様書の 2.7 の 6 に対応）
# 注: 送信先の選択欄は、送信先が 2 件以上のときに表示される（JSON の送信先は 1 件のため、表示されない）
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "SMSの検索"
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "検索条件"
- runFlow:
    file: common/scroll-down-and-tap-by-id.yaml
    env:
      ID: cbSmsSearchSendNoneOnly
      INDEX: 0
- runFlow:
    file: common/assert-checked-by-id.yaml
    env:
      ID: cbSmsSearchSendNoneOnly
      INDEX: 0
- runFlow:
    file: common/assert-not-visible-by-id.yaml
    env:
      ID: tvSendTargetFilterLabel
      INDEX: 0
- runFlow:
    file: common/assert-not-visible-by-id.yaml
    env:
      ID: llSendTargetFilter
      INDEX: 0
- takeScreenshot: 2.7-06-send-target-filter-hidden-01

# 2.7 SMSの検索: 送信先が 1 件のとき、送信先の選択欄は表示されない（テスト仕様書の 2.7 の 6 に対応）
# 注: 送信先の選択欄は、送信先が 2 件以上のときに表示される（JSON の送信先は 1 件のため、表示されない）
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "SMSの検索"
- assertVisible: "検索条件"
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/cbSmsSearchSendNoneOnly"
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/cbSmsSearchSendNoneOnly"
    checked: false
- assertNotVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/tvSendTargetFilterLabel"
- assertNotVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/llSendTargetFilter"
- takeScreenshot: 2.7-06-send-target-filter-hidden-01

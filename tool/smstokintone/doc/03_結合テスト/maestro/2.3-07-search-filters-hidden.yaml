# 2.3 アプリの設定: 検索条件の表示を隠すにし、SMSの検索で確認する（テスト仕様書の 2.3 の 7 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（フローで設定）: 検索条件の表示が表示であることを確認してから、隠すに切り替える
# 外部条件: SMSの読み取りの権限が許可されている必要があります（SMSの検索を開くため）
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- runFlow:
    file: common/scroll-up-by-id.yaml
    env:
      ID: rbThemeLight
- takeScreenshot: 2.3-07-search-filters-hidden-01
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "端末の許可"
- runFlow:
    file: common/scroll-down-by-id.yaml
    env:
      ID: rbSearchFiltersVisible
- runFlow:
    file: common/assert-checked-by-id.yaml
    env:
      ID: rbSearchFiltersVisible
      INDEX: 0
- runFlow:
    file: common/scroll-down-and-tap-by-id.yaml
    env:
      ID: rbSearchFiltersHidden
      INDEX: 0
- takeScreenshot: 2.3-07-search-filters-hidden-02
- runFlow:
    file: common/scroll-down-by-id.yaml
    env:
      ID: rbSearchFiltersHidden
- runFlow:
    file: common/assert-checked-by-id.yaml
    env:
      ID: rbSearchFiltersHidden
      INDEX: 0
- pressKey: Back
- takeScreenshot: 2.3-07-search-filters-hidden-03
- tapOn: "SMSの検索"
- takeScreenshot: 2.3-07-search-filters-hidden-04
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "▼ 表示"
- runFlow:
    file: common/assert-not-visible-by-id.yaml
    env:
      ID: llSearchFilters
      INDEX: 0
- takeScreenshot: 2.3-07-search-filters-hidden-05

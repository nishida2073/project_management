# 2.3 アプリの設定: 検索条件の表示を隠すにし、SMSの検索で確認する（テスト仕様書の 2.3 の 7 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（JSON）: 表示テーマ：ライト、SMSの送信モード：自動、SMSの返信モード：手動、会社名の抽出：あり、引継ぎ：あり
# 前提（フローで設定）: 検索条件の表示が表示であることを確認してから、隠すに切り替える
# 外部条件: SMSの読み取りの権限が許可されている必要があります（SMSの検索を開くため）
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- takeScreenshot: 2.3-07-search-filters-hidden-01
- assertVisible: "端末の許可"
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/rbSearchFiltersVisible"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/rbSearchFiltersVisible"
    checked: true
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/rbSearchFiltersHidden"
- tapOn:
    id: "com.ssfrontier.smstokintone:id/rbSearchFiltersHidden"
- takeScreenshot: 2.3-07-search-filters-hidden-02
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/rbSearchFiltersHidden"
    checked: true
- pressKey: Back
- takeScreenshot: 2.3-07-search-filters-hidden-03
- tapOn: "SMSの検索"
- takeScreenshot: 2.3-07-search-filters-hidden-04
- assertVisible: "▼ 表示"
- assertNotVisible:
    id: "com.ssfrontier.smstokintone:id/llSearchFilters"
- takeScreenshot: 2.3-07-search-filters-hidden-05

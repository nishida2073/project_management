# 2.3 アプリの設定: 検索条件の表示を隠すにし、SMSの検索で確認する（テスト仕様書の 2.3 の 7 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（フローで設定）: 検索条件の表示が表示であることを確認してから、隠すに切り替える
# 外部条件: SMSの読み取りの権限が許可されている必要があります（SMSの検索を開くため）
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- runFlow:
    file: common/scroll-to-top-setting.yaml
- takeScreenshot: 2.3-07-search-filters-hidden-01
- assertVisible: "端末の許可"
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: rbSearchFiltersVisible
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/rbSearchFiltersVisible"
    checked: true
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: rbSearchFiltersHidden
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/rbSearchFiltersHidden"
- takeScreenshot: 2.3-07-search-filters-hidden-02
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: rbSearchFiltersHidden
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/rbSearchFiltersHidden"
    checked: true
- pressKey: Back
- takeScreenshot: 2.3-07-search-filters-hidden-03
- tapOn: "SMSの検索"
- takeScreenshot: 2.3-07-search-filters-hidden-04
- assertVisible: "▼ 表示"
- assertNotVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/llSearchFilters"
- takeScreenshot: 2.3-07-search-filters-hidden-05

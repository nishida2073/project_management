# 2.3 アプリの設定: 会社名の抽出がオフのとき固定変換の「+」は押せない（テスト仕様書の 2.3 の 31 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（フローで設定）: 会社名の抽出をオフにする（JSON では有効）
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- runFlow:
    file: common/scroll-up-to-id.yaml
    env:
      ID: rbThemeLight
- takeScreenshot: 2.3-31-fixed-conversion-add-disabled-01
- runFlow:
    file: common/scroll-down-to-id.yaml
    env:
      ID: swCompanyNameExtractionEnabled
- takeScreenshot: 2.3-31-fixed-conversion-add-disabled-02
- runFlow:
    file: common/assert-id-checked.yaml
    env:
      ID: swCompanyNameExtractionEnabled
      INDEX: 0
- runFlow:
    file: common/scroll-down-to-id.yaml
    env:
      ID: btnAddFixedConversion
- takeScreenshot: 2.3-31-fixed-conversion-add-disabled-03
- runFlow:
    file: common/assert-id-not-visible.yaml
    env:
      ID: etFixConversionBefore
      INDEX: 0
- runFlow:
    file: common/scroll-up-to-id.yaml
    env:
      ID: swCompanyNameExtractionEnabled
- takeScreenshot: 2.3-31-fixed-conversion-add-disabled-04
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: swCompanyNameExtractionEnabled
      INDEX: 0
    index: 0
- takeScreenshot: 2.3-31-fixed-conversion-add-disabled-05
- runFlow:
    file: common/scroll-down-to-id.yaml
    env:
      ID: swCompanyNameExtractionEnabled
- runFlow:
    file: common/assert-id-unchecked.yaml
    env:
      ID: swCompanyNameExtractionEnabled
      INDEX: 0
- runFlow:
    file: common/scroll-down-to-id.yaml
    env:
      ID: btnAddFixedConversion
- takeScreenshot: 2.3-31-fixed-conversion-add-disabled-06
- runFlow:
    file: common/assert-id-visible.yaml
    env:
      ID: btnAddFixedConversion
      INDEX: 0
    enabled: false
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: btnAddFixedConversion
      INDEX: 0
    index: 0
- takeScreenshot: 2.3-31-fixed-conversion-add-disabled-07
- runFlow:
    file: common/assert-id-not-visible.yaml
    env:
      ID: etFixConversionBefore
      INDEX: 0
- takeScreenshot: 2.3-31-fixed-conversion-add-disabled-08

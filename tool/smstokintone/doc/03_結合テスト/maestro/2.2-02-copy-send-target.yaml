# 2.2 送信先の設定: 送信先をコピーする（テスト仕様書の 2.2 の 2 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 未確認: test-send-target-1 の接続先・連絡用のアプリ・振り分けは、このフローでは画面で確認していない。ログイン名・パスワードは画面に表示されないため確認できない
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "送信先の設定"
- takeScreenshot: 2.2-02-copy-send-target-01
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "設定を追加"
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "${SEND_TARGET_NAME}"
- runFlow:
    file: common/scroll-down-and-assert-field-text.yaml
    env:
      ID: etSendTargetName
      INDEX: 0
      TEXT: "${SEND_TARGET_NAME}"
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: btnCopySendTarget
      INDEX: 0
- takeScreenshot: 2.2-02-copy-send-target-02
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "${COPY_SEND_TARGET_NAME}"
# 未確認: コピーの位置（元の直後）は、文字の確認では見ていない。画面で目視する
- takeScreenshot: 2.2-02-copy-send-target-03

# 2.2 送信先の設定: 送信先をコピーする（テスト仕様書の 2.2 の 2 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 注: コピーは元の送信先の全項目を引き継ぐ（SendTargetSettingsActivity.kt:107-112）。画面に表示されない認証情報は確認しない。
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "送信先の設定"
- takeScreenshot: 2.2-02-copy-send-target-01
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "設定を追加"
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "${SEND_TARGET_NAME}"
- runFlow:
    file: common/scroll-down-and-assert-text-by-id.yaml
    env:
      ID: etSendTargetName
      INDEX: 0
      TEXT: "${SEND_TARGET_NAME}"
- runFlow:
    file: common/scroll-down-and-tap-by-id.yaml
    env:
      ID: btnCopySendTarget
      INDEX: 0
- takeScreenshot: 2.2-02-copy-send-target-02
- runFlow:
    file: common/scroll-down-and-assert-text-by-id.yaml
    env:
      ID: etSendTargetName
      INDEX: 0
      TEXT: "${COPY_SEND_TARGET_NAME}"
- runFlow:
    file: common/scroll-down-and-assert-text-by-id.yaml
    env:
      ID: etKeyword
      INDEX: 0
      TEXT: "${COPY_KEYWORD}"
- runFlow:
    file: common/scroll-down-and-assert-text-by-id.yaml
    env:
      ID: etSubdomain
      INDEX: 0
      TEXT: "${COPY_SUBDOMAIN}"
- runFlow:
    file: common/scroll-down-and-assert-text-by-id.yaml
    env:
      ID: etLoginName
      INDEX: 0
      TEXT: "${COPY_LOGIN_NAME}"
- runFlow:
    file: common/scroll-down-and-assert-text-by-id.yaml
    env:
      ID: etAppId
      INDEX: 0
      TEXT: "${COPY_APP_ID}"
- runFlow:
    file: common/scroll-down-and-assert-text-by-id.yaml
    env:
      ID: etFieldType
      INDEX: 0
      TEXT: "${COPY_FIELD_TYPE}"
- runFlow:
    file: common/scroll-down-and-assert-text-by-id.yaml
    env:
      ID: etFieldDatetime
      INDEX: 0
      TEXT: "${COPY_FIELD_DATETIME}"
- runFlow:
    file: common/scroll-down-and-assert-text-by-id.yaml
    env:
      ID: etFieldSender
      INDEX: 0
      TEXT: "${COPY_FIELD_SENDER}"
- runFlow:
    file: common/scroll-down-and-assert-text-by-id.yaml
    env:
      ID: etFieldCompanyName
      INDEX: 0
      TEXT: "${COPY_FIELD_COMPANY_NAME}"
- runFlow:
    file: common/scroll-down-and-assert-text-by-id.yaml
    env:
      ID: etFieldUserName
      INDEX: 0
      TEXT: "${COPY_FIELD_USER_NAME}"
- runFlow:
    file: common/scroll-down-and-assert-text-by-id.yaml
    env:
      ID: etFieldBody
      INDEX: 0
      TEXT: "${COPY_FIELD_BODY}"
- runFlow:
    file: common/scroll-down-and-assert-text-by-id.yaml
    env:
      ID: etFieldHistory
      INDEX: 0
      TEXT: "${COPY_FIELD_HISTORY}"
- runFlow:
    file: common/assert-checked-by-id.yaml
    env:
      ID: rbUpdateToleranceModeSameDate
      INDEX: 0
- runFlow:
    file: common/scroll-down-and-assert-text-by-id.yaml
    env:
      ID: etUpdateToleranceHours
      INDEX: 0
      TEXT: "${COPY_TOLERANCE_HOURS}"
- takeScreenshot: 2.2-02-copy-send-target-03

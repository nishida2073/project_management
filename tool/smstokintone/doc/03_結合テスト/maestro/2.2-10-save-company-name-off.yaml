# 2.2 送信先の設定: 会社名の抽出を無効にして設定を保存する（テスト仕様書の 2.2 の 10 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提: 仕様書 2.2 の前提条件（test-send-target-1 が保存済み、会社名の抽出が有効）
# 未確認: 会社名の抽出が無効のときも会社名欄が表示される（表示されない場合は field の操作が失敗する）
# 未確認: companyName=saved-company-name は画面に表示されないため、保存値は確認していない（内部値）
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- takeScreenshot: 2.2-10-save-company-name-off-01
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/swCompanyNameExtractionEnabled"
    direction: DOWN
# 前提確認: 会社名の抽出が有効（下の checked: true）
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/swCompanyNameExtractionEnabled"
    checked: true
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/swCompanyNameExtractionEnabled"
- takeScreenshot: 2.2-10-save-company-name-off-02
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/swCompanyNameExtractionEnabled"
    checked: false
- pressKey: Back
- takeScreenshot: 2.2-10-save-company-name-off-03
- tapOn: "送信先の設定"
- takeScreenshot: 2.2-10-save-company-name-off-04
- assertVisible: "設定を追加"
# 前提確認: test-send-target-1 が保存済み
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/etSendTargetName"
    index: 0
    text: "test-send-target-1"
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/etCompanyName"
    direction: DOWN
- runFlow:
    file: common/input-text-field.yaml
    env:
      FIELD_ID: etCompanyName
      INPUT_VALUE: "${COMPANY_NAME}"
- tapOn: "設定を保存"
- takeScreenshot: 2.2-10-save-company-name-off-05
- assertVisible: "設定を保存しました"
- assertVisible: "SMSの送信モード"
- assertNotVisible: "設定を追加"
- takeScreenshot: 2.2-10-save-company-name-off-06

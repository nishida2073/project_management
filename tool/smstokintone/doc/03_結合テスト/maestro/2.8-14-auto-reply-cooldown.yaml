# 2.8 自動処理: 返信の間隔の中の 2 通目は、自動返信されない（テスト仕様書の 2.8 の 14 に対応）
appId: com.ssfrontier.smstokintone
---
# 前提（JSON）: 既定値（2.8 の 1 と同じ）。自動返信の間隔：10
# 前提（フローで設定）: SMSの返信モードを自動に切り替える
# 外部条件（事前に別端末から SMS を送る）: 送信元 test-phone-b、本文は 1 行だけの抽出できない本文。1 通目を受信して返信の完了を確認した後、同じ送信元から 2 通目（抽出できない本文）を 10 秒以内に送る
# 前提の操作（この行の中で行う）: 1 通目（2.8 の 13 と同じ）を受信し、返信の完了を確認する
# 未確認: 「返信完了のログが増えないこと」は、画面に出ないことでしか確認できない。ここでは 1 通目の返信完了だけを確認し、2 通目の後は画面の目視で確認する
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/rbSmsReplyModeAuto"
- tapOn:
    id: "com.ssfrontier.smstokintone:id/rbSmsReplyModeAuto"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/rbSmsReplyModeAuto"
    checked: true
- pressKey: Back
- runFlow: common/enable-log-auto-refresh.yaml
- tapOn:
    id: "com.ssfrontier.smstokintone:id/btnTopOpenLog"
- takeScreenshot: 2.8-14-auto-reply-cooldown-01
- extendedWaitUntil:
    visible: "(?s).*抽出状況が異常なため、SMSを返信しました.*"
    timeout: 180000
- takeScreenshot: 2.8-14-auto-reply-cooldown-02
- assertVisible: "(?s).*抽出状況が異常なため、SMSを返信しました.*"
- takeScreenshot: 2.8-14-auto-reply-cooldown-03

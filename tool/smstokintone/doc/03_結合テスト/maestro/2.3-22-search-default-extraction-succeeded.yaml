# 2.3 アプリの設定: SMSの検索の抽出状況の初期値「正常」を切り替える（テスト仕様書の 2.3 の 22 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（フローで設定）: 検索条件の抽出状況「正常」をオンにする（JSON に指定がなく、既定値はオフ）
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- runFlow:
    file: common/scroll-up-by-id.yaml
    env:
      ID: rbThemeLight
- takeScreenshot: 2.3-22-search-default-extraction-succeeded-01
- runFlow:
    file: common/scroll-down-by-id.yaml
    env:
      ID: cbSearchExtractionSucceededOnlyEnabled
- takeScreenshot: 2.3-22-search-default-extraction-succeeded-02
- runFlow:
    file: common/scroll-down-and-tap-by-id.yaml
    env:
      ID: cbSearchExtractionSucceededOnlyEnabled
      INDEX: 0
- takeScreenshot: 2.3-22-search-default-extraction-succeeded-03
- runFlow:
    file: common/assert-checked-by-id.yaml
    env:
      ID: cbSearchExtractionSucceededOnlyEnabled
      INDEX: 0
- pressKey: Back
- takeScreenshot: 2.3-22-search-default-extraction-succeeded-04
- tapOn: "SMSの検索"
- takeScreenshot: 2.3-22-search-default-extraction-succeeded-05
- runFlow:
    file: common/assert-checked-by-id.yaml
    env:
      ID: cbSmsSearchExtractionSucceededOnly
      INDEX: 0
- takeScreenshot: 2.3-22-search-default-extraction-succeeded-06

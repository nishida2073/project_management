# 2.1 トップ: SMSの検索の画面に移動できることを確認する（テスト仕様書の 2.1 の 3 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- runFlow:
    file: common/scroll-down-and-tap-by-id.yaml
    env:
      ID: btnTopOpenSmsSearch
      INDEX: 0
- takeScreenshot: 2.1-03-open-sms-search-01
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "SMSの検索"
- runFlow:
    file: common/assert-visible-by-id.yaml
    env:
      ID: btnSearchSms
      INDEX: 0
- pressKey: Back
- takeScreenshot: 2.1-03-open-sms-search-02

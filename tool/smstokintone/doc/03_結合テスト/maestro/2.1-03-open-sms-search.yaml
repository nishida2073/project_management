# 2.1 トップ: SMSの検索の画面に移動できることを確認する（テスト仕様書の 2.1 の 3 に対応）
appId: com.ssfrontier.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn:
    id: "com.ssfrontier.smstokintone:id/btnTopOpenSmsSearch"
- takeScreenshot: 2.1-03-open-sms-search-01
- assertVisible: "SMSの検索"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/btnSearchSms"
- pressKey: Back
- takeScreenshot: 2.1-03-open-sms-search-02

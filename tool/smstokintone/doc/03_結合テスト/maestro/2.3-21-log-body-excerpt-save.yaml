# 2.3 アプリの設定: 本文の表示文字数を入力する（テスト仕様書の 2.3 の 21 に対応）
appId: com.ssfrontier.smstokintone
---
# 前提: JSON（env_ok.json）の状態から開始する（本文の最大表示文字数：100（JSON の logBodyExcerptLength）、表示テーマ：ライト、SMSの送信モード：自動）。このフローで本文の表示文字数を入力する。
- launchApp
- tapOn: "アプリの設定"
- takeScreenshot: 2.3-21-log-body-excerpt-save-01
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/etLogBodyExcerptLength"
    direction: DOWN
    visibilityPercentage: 100
- takeScreenshot: 2.3-21-log-body-excerpt-save-02
- tapOn:
    id: "com.ssfrontier.smstokintone:id/etLogBodyExcerptLength"
    index: 0
    point: "95%, 50%"
- takeScreenshot: 2.3-21-log-body-excerpt-save-03
- eraseText: 50
- takeScreenshot: 2.3-21-log-body-excerpt-save-04
- inputText: "${LOG_BODY_EXCERPT_LENGTH}"
- takeScreenshot: 2.3-21-log-body-excerpt-save-05
- hideKeyboard
- assertVisible: "${LOG_BODY_EXCERPT_LENGTH}" # 未確認: 数字は他の表示と一致する可能性がある
- takeScreenshot: 2.3-21-log-body-excerpt-save-06

# 2.8 自動処理: 会社名の抽出が有効で、既定の設定のとき、SMSの送信（登録）が成功する（テスト仕様書の 2.8 の 7 に対応）
appId: com.ssfrontier.smstokintone
---
# 前提（JSON）: 既定値（2.8 の 1 と同じ）
# 前提（フローで設定）: なし
# 外部条件（事前に別端末から SMS を送る）: 送信元は 2.8 の 1 と同じ（test-phone-a）、本文は 1 行目「test-company」、2 行目「test-taro」、3 行目「body-test」。待ち時間（下の extendedWaitUntil）に送る
- runFlow: setup/setup-import-environment.yaml
- launchApp
- runFlow: common/enable-log-auto-refresh.yaml
- tapOn:
    id: "com.ssfrontier.smstokintone:id/btnTopOpenLog"
- takeScreenshot: 2.8-07-receive-send-success-01
- extendedWaitUntil:
    visible: "(?s).*SMSを受信しました.*"
    timeout: 180000
- assertVisible: "(?s).*SMSの送信を開始しました.*"
- assertVisible: "(?s).*SMSの登録に成功しました.*"
- takeScreenshot: 2.8-07-receive-send-success-02

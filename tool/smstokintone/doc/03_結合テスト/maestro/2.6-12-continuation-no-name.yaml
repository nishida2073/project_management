# 2.6 ログ: 引継ぎの SMS の送信元に、氏名を表示しない設定では電話番号だけが表示される（テスト仕様書の 2.6 の 12 に対応）
# 前提（フローで設定）: このフローで引継ぎ内容の氏名表示をオフにする
# 外部条件: 引継ぎ内容の送信元（test-sender-a）から SMS を 1 通受信する（下の assert の待ち時間（60 秒）の間に受信させる）
# 未確認: 「外部条件」の assert の timeout の指定が、この Maestro で使えるか
appId: jp.co.nttdata_univ.smstokintone
---
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: swContinuationShowUserNameEnabled
      INDEX: 0
    index: 0
- runFlow:
    file: common/assert-id-unchecked.yaml
    env:
      ID: swContinuationShowUserNameEnabled
      INDEX: 0
- pressKey: Back
- tapOn: "ログの確認"
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "ログの一覧"
- assertVisible:
    text: '(?s).*${CONTINUATION_SENDER}.*'
    timeout: 60000
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: btnRefreshLog
      INDEX: 0
- assertVisible: '(?s).*${CONTINUATION_SENDER}.*'
- assertNotVisible: "${CONTINUATION_USER_NAME}"
- takeScreenshot: 2.6-12-continuation-no-name-01

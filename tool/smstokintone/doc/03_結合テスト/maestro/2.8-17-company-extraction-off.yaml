# 2.8 自動処理: 会社名の抽出が無効のとき、本文から会社名を抽出せず、送信先の会社名（空）で送信する（テスト仕様書の 2.8 の 17 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（フローで設定）: 会社名の抽出を無効にする
# 外部条件: 別端末から SMS を送る。送信元 test-phone-c、本文は 1 行目「test-company」、2 行目「test-taro」、3 行目「body-test」。待ち時間（下の extendedWaitUntil）に送る
# 注: 会社名の抽出が無効のとき、送信先はすべて（この JSON では 1 件）を対象にする。仕様書の期待値は送信完了（SettingsStore.resolveSendTargets）
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/swCompanyNameExtractionEnabled"
    direction: DOWN
    visibilityPercentage: 100
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/swCompanyNameExtractionEnabled"
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/swCompanyNameExtractionEnabled"
    checked: false
- pressKey: Back
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/btnTopOpenLog"
- takeScreenshot: 2.8-17-company-extraction-off-01
- extendedWaitUntil:
    visible: "(?s).*SMSを受信しました.*"
    timeout: 180000
- assertVisible: "(?s).*SMSの登録に成功しました.*"
- takeScreenshot: 2.8-17-company-extraction-off-02

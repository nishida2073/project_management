# 2.3 アプリの設定: 表示テーマをダークに切り替える（テスト仕様書の 2.3 の 2 に対応）
appId: com.ssfrontier.smstokintone
---
# 前提（JSON）: 表示テーマ：ライト、SMSの送信モード：自動、SMSの返信モード：手動
# 前提（フローで設定）: 表示テーマをダークに切り替える
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- takeScreenshot: 2.3-02-theme-dark-01
- assertVisible: "端末の許可"
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/rbThemeLight"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/rbThemeLight"
    checked: true
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/rbSendAuto"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/rbSendAuto"
    checked: true
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/rbSmsReplyModeManual"
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/rbSmsReplyModeManual"
    checked: true
- scrollUntilVisible:
    element:
      id: "com.ssfrontier.smstokintone:id/rbThemeDark"
- tapOn:
    id: "com.ssfrontier.smstokintone:id/rbThemeDark"
- takeScreenshot: 2.3-02-theme-dark-02
- assertVisible:
    id: "com.ssfrontier.smstokintone:id/rbThemeDark"
    checked: true
# 未確認: ダークテーマの色は Maestro では検証しません。切り替わりはスクリーンショットで確認します
- takeScreenshot: 2.3-02-theme-dark-03

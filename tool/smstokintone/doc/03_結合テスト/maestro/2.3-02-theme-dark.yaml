# 2.3 アプリの設定: 表示テーマをダークに切り替える（テスト仕様書の 2.3 の 2 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（フローで設定）: 表示テーマをダークに切り替える
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/rbThemeLight"
    direction: UP
    visibilityPercentage: 100
    timeout: 60000
- takeScreenshot: 2.3-02-theme-dark-01
- assertVisible: "端末の許可"
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/rbThemeLight"
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/rbThemeLight"
    checked: true
- runFlow:
    file: common/scroll-up-to-setting.yaml
    env:
      ELEMENT_ID: rbThemeDark
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/rbThemeDark"
- takeScreenshot: 2.3-02-theme-dark-02
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: rbThemeDark
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/rbThemeDark"
    checked: true
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: rbSendAuto
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/rbSendAuto"
    checked: true
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: rbSmsReplyModeManual
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/rbSmsReplyModeManual"
    checked: true
- pressKey: Back
- tapOn: "アプリの設定"
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/rbThemeLight"
    direction: UP
    visibilityPercentage: 100
    timeout: 60000
- runFlow:
    file: common/scroll-down-to-setting.yaml
    env:
      ELEMENT_ID: rbThemeDark
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/rbThemeDark"
    checked: true
# 未確認: ダークテーマの色は Maestro では検証しません。切り替わりはスクリーンショットで確認します
- takeScreenshot: 2.3-02-theme-dark-03

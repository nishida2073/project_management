# 2.3 アプリの設定: 表示テーマをダークに切り替える（テスト仕様書の 2.3 の 2 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（フローで設定）: 表示テーマをダークに切り替える
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- runFlow:
    file: common/scroll-up-by-id.yaml
    env:
      ID: rbThemeLight
- takeScreenshot: 2.3-02-theme-dark-01
- runFlow:
    file: common/assert-visible-by-text.yaml
    env:
      TEXT: "端末の許可"
- runFlow:
    file: common/scroll-down-by-id.yaml
    env:
      ID: rbThemeLight
- runFlow:
    file: common/assert-checked-by-id.yaml
    env:
      ID: rbThemeLight
      INDEX: 0
- runFlow:
    file: common/scroll-up-by-id.yaml
    env:
      ID: rbThemeDark
- runFlow:
    file: common/scroll-down-and-tap-by-id.yaml
    env:
      ID: rbThemeDark
      INDEX: 0
- takeScreenshot: 2.3-02-theme-dark-02
- runFlow:
    file: common/scroll-down-by-id.yaml
    env:
      ID: rbThemeDark
- runFlow:
    file: common/assert-checked-by-id.yaml
    env:
      ID: rbThemeDark
      INDEX: 0
- runFlow:
    file: common/scroll-down-by-id.yaml
    env:
      ID: rbSendAuto
- runFlow:
    file: common/assert-checked-by-id.yaml
    env:
      ID: rbSendAuto
      INDEX: 0
- runFlow:
    file: common/scroll-down-by-id.yaml
    env:
      ID: rbSmsReplyModeManual
- runFlow:
    file: common/assert-checked-by-id.yaml
    env:
      ID: rbSmsReplyModeManual
      INDEX: 0
- pressKey: Back
- tapOn: "アプリの設定"
- runFlow:
    file: common/scroll-up-by-id.yaml
    env:
      ID: rbThemeLight
- runFlow:
    file: common/scroll-down-by-id.yaml
    env:
      ID: rbThemeDark
- runFlow:
    file: common/assert-checked-by-id.yaml
    env:
      ID: rbThemeDark
      INDEX: 0
# 未確認: ダークテーマの色は Maestro では検証しません。切り替わりはスクリーンショットで確認します
- takeScreenshot: 2.3-02-theme-dark-03

# 2.8 自動処理: 振り分けに一致する送信先がないSMSは、送信先が存在しないエラーになり、登録されない（テスト仕様書の 2.8 の 8 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 外部条件: 別端末から SMS を送る。送信元は既定（0312345801）、本文は 1 行目「other-company」、2 行目「test-taro」、3 行目「body-test」。待ち時間（下の extendedWaitUntil）に送る
- runFlow: setup/setup-import-environment.yaml
- launchApp
- runFlow:
    file: common/scroll-down-and-tap-id.yaml
    env:
      ID: btnTopOpenLog
      INDEX: 0
- takeScreenshot: 2.8-08-receive-no-matching-target-01
- extendedWaitUntil:
    visible: "(?s).*SMSを受信しました.*"
    timeout: 180000
- runFlow:
    file: common/assert-text-visible.yaml
    env:
      TEXT: "(?s).*SMSの送信先が存在しません.*"
- assertNotVisible: "(?s).*SMSの(登録|更新)に成功しました.*"
- takeScreenshot: 2.8-08-receive-no-matching-target-02

# 2.3 アプリの設定: SMSの送信の権限を許可する（テスト仕様書の 2.3 の 16 に対応）
appId: jp.co.nttdata_univ.smstokintone
---
# 前提（フローで設定）: SMSの送信の権限を許可する
# 外部条件: SMSの送信の権限を許可していない状態で開始する必要があります（端末の権限設定で用意します。許可済みの場合は「許可する」ボタンが表示されません）
- runFlow: setup/setup-import-environment.yaml
- launchApp
- tapOn: "アプリの設定"
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/rbThemeLight"
    direction: UP
    visibilityPercentage: 100
- takeScreenshot: 2.3-16-permission-send-grant-01
- assertVisible: "端末の許可"
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/btnRequestSendPermission"
- tapOn:
    id: "jp.co.nttdata_univ.smstokintone:id/btnRequestSendPermission"
# 未確認: システムの許可ダイアログのボタン文言（端末の言語で変わります）
- takeScreenshot: 2.3-16-permission-send-grant-02
- tapOn: "許可"
- takeScreenshot: 2.3-16-permission-send-grant-03
- assertNotVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/btnRequestSendPermission"
- scrollUntilVisible:
    element:
      id: "jp.co.nttdata_univ.smstokintone:id/tvSendPermissionStatus"
    direction: DOWN
- assertVisible:
    id: "jp.co.nttdata_univ.smstokintone:id/tvSendPermissionStatus"
    text: "許可済み"
- takeScreenshot: 2.3-16-permission-send-grant-04

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <div id="sidebar-slot" data-active="master" data-sub="staffVender"></div>
  <script src="js/message-dialog.js"></script>
<script src="js/access.js"></script>
<script src="js/sidebar.js"></script>
  <div class="main">
    <div id="topbar-slot" data-title="実施担当ベンダー一覧"></div>
    <script src="js/topbar.js"></script>

    <div class="content">
      
      <div class="filter-panel">
        <div class="field"><label>キーワード検索</label><input type="text" class="field-control-input" placeholder="実施担当ベンダーコード・会社名で検索"></div>
        <div class="field"><label>稼働状態</label><div class="control small js-select" data-status-options="all">すべて<span class="caret">▾</span></div></div>
        <div class="search-btn">検索</div>
        <div class="search-btn" id="resetFilter">リセット</div>
      </div>

      <div style="display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-bottom: 16px;">
        <a class="search-btn" href="staff_vender_regist.html">新規登録</a>
      </div>

      <div class="table-card">
        <div class="table-meta"><div class="count"><b id="staffVenderCount">0</b> 件</div></div>
        <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>実施担当ベンダーコード</th>
              <th>実施担当ベンダー名</th>
              <th>電話番号</th>
              <th>住所</th>
              <th>窓口担当者</th>
              <th>稼働状態</th>
              <th class="no-sort">備考</th>
              <th class="col-actions">操作</th>
            </tr>
          </thead>
          <tbody id="staffVenderBody"></tbody>
        </table>
        </div>
        <div class="pagination"></div>
      </div>
    </div>
  </div>
</div>
<script src="js/storage/operating-status/store/operating-status-store.js"></script>
<script src="js/html-util.js"></script>
<script src="js/storage/staff-vender/store/staff-vender-store.js"></script>
<script src="js/storage/staff-vender/screens/staff-vender-list.js"></script>
<script src="js/select.js" defer></script>
<script src="js/table-sort.js" defer></script>
<script src="js/column-resize.js" defer></script>
<script src="js/list-filter-auto.js"></script>
<script src="js/list-filter.js"></script>
<script src="js/pagination.js"></script>
<script src="js/filter-collapse.js"></script>
<script src="js/filter-memory.js"></script>
<script src="js/scroll-keep.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/style_regist.css">
</head>
<body>
<div class="app">
  <div id="sidebar-slot" data-active="master" data-sub="location"></div>
  <script src="js/access.js"></script>
<script src="js/sidebar.js"></script>
  <div class="overlay">
    <div class="modal">
      <div class="modal-resize"></div>
      <div class="modal-header">
        <div>
          <h2 class="modal-header-title">ロケーション登録</h2>
        </div>
        <a class="close-x" href="location_list.html">✕</a>
      </div>
      <div class="modal-body">
        <div class="form-field">
          <label>ロケーションコード</label>
          <div class="form-control readonly" id="locationCode"></div>
        </div>
        <div class="form-field"></div>
        <div class="form-field full">
          <label>ロケーション区分</label>
          <div class="radio-group" id="locationTypeGroup">
            <div class="master-radio" data-master-radio="LocationTypeStore" data-radio-name="locationType"></div>
          </div>
        </div>
        <div class="form-field full">
          <label>ロケーション名<span class="req">必須</span></label>
          <input type="text" class="form-control" id="locationName">
        </div>
        <div class="form-field full">
          <label>電話番号</label>
          <input type="tel" class="form-control" id="tel">
        </div>
        <div class="form-field full">
          <label>住所</label>
          <input type="text" class="form-control" id="address">
        </div>
        <div class="form-section">その他</div>
        <div class="form-field full">
          <label>備考</label>
          <textarea class="form-control textarea auto-grow" data-min="68" id="memo"></textarea>
        </div>
        <div class="form-field toggle-field">
          <label>稼働状態</label>
          <div class="toggle-row" id="statusRow"><div class="toggle" id="statusToggle"><div class="knob"></div></div><span id="statusLabel" data-status="ACTIVE"></span></div>
        </div>
      </div>
      <div class="modal-footer">
        <a class="nav-btn" href="location_list.html">キャンセル</a>
        <div id="saveBtn" class="btn primary">保存</div>
      </div>
    </div>
  </div>
</div>
<script src="js/storage/operating-status/store/operating-status-store.js"></script>
<script src="js/html-util.js"></script>
<script src="js/storage/location-type/store/location-type-store.js"></script>
<script src="js/storage/location/store/location-store.js"></script>
<script src="js/master-options.js"></script>
<script src="js/storage/location/screens/location-editor.js"></script>
<script src="js/storage/location/entry/location-regist.js"></script>
<script src="js/select.js" defer></script>
<script src="js/toggle.js" defer></script>
<script src="js/message-dialog.js"></script>
<script src="js/memo-area.js" defer></script>
<script src="js/modal-resize.js"></script>
</body>
</html>

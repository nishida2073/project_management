<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <div id="sidebar-slot" data-active="master" data-sub="course"></div>
  <script src="js/message-dialog.js"></script>
<script src="js/access.js"></script>
<script src="js/sidebar.js"></script>

  <div class="main">
    <div id="topbar-slot" data-title="コース一覧"></div>
    <script src="js/topbar.js"></script>

    <div class="content">
      
      <div class="filter-panel">
        <div class="field"><label>年度</label><div class="control small js-select" data-options="すべて,2024,2025,2026,2027">すべて<span class="caret">▾</span></div></div>
        <div class="field"><label>キーワード検索</label><input type="text" class="field-control-input" placeholder="コースコード・コース名で検索"></div>
        <div class="field"><label>科目区分</label><div class="control js-select" data-master-options="SubjectTypeStore" data-match-class="subject-type-tag">すべて<span class="caret">▾</span></div></div>
        <div class="field"><label>参加区分</label><div class="control small js-select" data-master-options="ParticipationTypeStore">すべて<span class="caret">▾</span></div></div>
        <div class="field"><label>稼働状態</label><div class="control small js-select" data-status-options="all">すべて<span class="caret">▾</span></div></div>
        <div class="nav-btn">検索</div>
        <div class="nav-btn" id="resetFilter">リセット</div>
      </div>

      <div style="display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-bottom: 16px;">
        <a class="nav-btn" href="course_regist.html">新規登録</a>
      </div>

      <div class="table-card">
        <div class="table-meta"><div class="count"><b id="courseCount">0</b> 件</div></div>
        <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th class="sticky">年度</th>
              <th class="sticky">コースコード</th>
              <th class="sticky">参加区分</th>
              <th class="sticky">コース名</th>
              <th class="sticky">科目区分</th>
              <th>日数</th>
              <th>実施時間</th>
              <th>実施形態</th>
              <th>最小人数</th>
              <th>最大人数</th>
              <th>講師数（メイン）</th>
              <th>講師数（サブ）</th>
              <th>講師数（特別）</th>
              <th>クラス数<br>（実施/予定）</th>
              <th>稼働状態</th>
              <th class="no-sort">備考</th>
              <th class="col-actions">操作</th>
            </tr>
          </thead>
          <tbody id="courseBody"></tbody>
        </table>
        </div>
        <div class="pagination"></div>
      </div>
    </div>
  </div>
</div>
<script src="js/storage/job-type/store/job-type-store.js"></script>
<script src="js/storage/staff-role/store/staff-role-store.js"></script>
<script src="js/master-options.js"></script>
<script src="js/storage/practice-status/store/practice-status-store.js"></script>
<script src="js/storage/operating-status/store/operating-status-store.js"></script>
<script src="js/html-util.js"></script>
<script src="js/select.js" defer></script>
<script src="js/table-sort.js" defer></script>
<script src="js/column-resize.js" defer></script>
${tags%
}
<script src="js/storage/course/store/course-store.js"></script>
<script src="js/storage/subject/store/subject-store.js"></script>
<script src="js/storage/subject-type/store/subject-type-store.js"></script>
<script src="js/storage/delivery-type/store/delivery-type-store.js"></script>
<script src="js/storage/participation-type/store/participation-type-store.js"></script>
<script src="js/storage/project/store/project-store.js"></script>
<script src="js/storage/location/store/location-store.js"></script>
<script src="js/storage/staff/store/staff-store.js"></script>
<script src="js/storage/location-type/store/location-type-store.js"></script>
<script src="js/storage/class/store/class-store.js"></script>
<script src="js/storage/course/screens/course-list.js"></script>
<script src="js/list-filter-auto.js"></script>
<script src="js/list-filter.js"></script><script src="js/pagination.js"></script>
<script src="js/filter-collapse.js"></script>
<script src="js/filter-memory.js"></script>
<script src="js/scroll-keep.js"></script>
</body>
</html>

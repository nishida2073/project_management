<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/style_list.css">
</head>
<body>
<div class="app">
  <iframe src="sidebar.html?active=master&sub=course" width="220" height="1040" style="border:0; flex-shrink:0; display:block;" title="サイドバー"></iframe>

  <div class="main">
    <div class="topbar">
      <div class="crumb-block">
        <div class="crumb">コース一覧</div>
      </div>
      <div class="user"><span>山田 太郎（BD事業部）</span><div class="avatar">山田</div></div>
    </div>

    <div class="content">
      
      <div class="filter-panel">
        <div class="field"><label>年度</label><div class="control small js-select" data-options="すべて,2024年度,2025年度,2026年度,2027年度">すべて<span class="caret">▾</span></div></div>
        <div class="field"><label>キーワード検索</label><input type="text" class="field-control-input" placeholder="コースコード・コース名で検索"></div>
        <div class="field"><label>参加区分</label><div class="control small js-select" data-options="すべて,公募,受託">すべて<span class="caret">▾</span></div></div>
        <div class="field"><label>稼働状況</label><div class="control small js-select" data-options="すべて,稼働中,停止中">すべて<span class="caret">▾</span></div></div>
        <div class="search-btn">検索</div>
      </div>

      <div style="display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-bottom: 16px;">
        <a class="search-btn" href="course_regist.html">新規登録</a>
      </div>

      <div class="table-card">
        <div class="table-meta"><div class="count">全 <b id="courseCount">0</b> 件</div></div>
        <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>年度</th>
              <th>コースコード</th>
              <th>参加区分</th>
              <th>コース名</th>
              <th>実施形態<br>（推奨）</th>
              <th>日数<br>（推奨）</th>
              <th>最小人数<br>（推奨）</th>
              <th>最大人数<br>（推奨）</th>
              <th>クラス数<br>（実施/予定）</th>
              <th>稼働状況</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="courseBody"></tbody>
        </table>
        </div>
        <div class="pagination">
          <div class="page-btn">‹</div><div class="page-btn active">1</div><div class="page-btn">›</div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="js/select.js" defer></script>
<script src="js/sidebar-toggle.js" defer></script>
<script src="js/column-resize.js" defer></script>
${tags%
}
<script src="js/storage/course/store/course-store.js"></script>
<script src="js/storage/delivery-type/store/delivery-type-store.js"></script>
<script src="js/storage/participation-type/store/participation-type-store.js"></script>
<script src="js/storage/project/store/project-store.js"></script>
<script src="js/storage/location/store/location-store.js"></script>
<script src="js/storage/staff/store/staff-store.js"></script>
<script src="js/storage/location-type/store/location-type-store.js"></script>
<script src="js/storage/class/store/class-store.js"></script>
<script src="js/storage/course/screens/course-list.js"></script>
<script src="js/list-filter.js"></script><script src="js/pagination.js"></script>
<script src="js/filter-collapse.js"></script>
</body>
</html>

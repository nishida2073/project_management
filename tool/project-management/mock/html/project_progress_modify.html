<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/style_progress.css">
<link rel="stylesheet" href="css/style_modify.css">
</head>
<body>
<div class="app">
  <div id="sidebar-slot" data-active="project-progress"></div>
  <script src="js/access.js"></script>
<script src="js/sidebar.js"></script>
  <div class="overlay">
    <div class="modal modal-wide">
      <div class="modal-resize"></div>
      <div class="modal-header">
        <div>
          <h2 class="modal-header-title">案件進捗更新</h2>
          <div class="sub" id="subLine"></div>
        </div>
        <a class="close-x" href="project_progress_list.html">✕</a>
      </div>
      <div class="modal-body modal-body-plain">
        <div class="table-scroll" style="overflow: visible; max-height: none;">
        <table class="step-table">
          <thead>
            <tr>
              <th class="sticky">作業順</th>
              <th class="sticky">タスク名</th>
              <th>実施</th>
              <th>予定日</th>
              <th>実施日</th>
              <th>実施担当者</th>
              <th>進捗</th>
              <th class="fill">備考</th>
            </tr>
          </thead>
          <tbody id="stepBody"></tbody>
        </table>
        </div>
      </div>
      <div class="modal-footer">
        <a class="nav-btn" href="project_progress_list.html">キャンセル</a>
        <div id="saveBtn" class="btn primary">保存</div>
      </div>
    </div>
  </div>
</div>
<script src="js/storage/job-type/store/job-type-store.js"></script>
<script src="js/storage/staff-role/store/staff-role-store.js"></script>
<script src="js/storage/step-status/store/step-status-store.js"></script>
<script src="js/storage/operating-status/store/operating-status-store.js"></script>
<script src="js/html-util.js"></script>
<script src="js/storage/customer/store/customer-store.js"></script>
<script src="js/storage/staff/store/staff-store.js"></script>
<script src="js/storage/project/store/project-store.js"></script>
<script src="js/storage/affiliation/store/affiliation-store.js"></script>
<script src="js/storage/project-progress/store/project-progress-store.js"></script>
<script src="js/storage/project-progress/screens/project-progress-editor.js"></script>
<script src="js/select.js" defer></script>
<script src="js/storage/holiday/store/holiday-store.js"></script>
<script src="js/datepicker.js" defer></script>
<script src="js/column-resize.js" defer></script>
<script src="js/message-dialog.js"></script>
<script src="js/memo-area.js" defer></script>
<script src="js/modal-resize.js"></script>
</body>
</html>

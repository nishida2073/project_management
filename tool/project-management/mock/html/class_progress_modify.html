<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/style_progress.css">
<link rel="stylesheet" href="css/style_modify.css">
</head>
<body>
<div class="app">
  <iframe src="sidebar.html?active=unei" width="220" height="1040" style="border:0; flex-shrink:0; display:block;" title="サイドバー"></iframe>
  <div class="main">
    <div class="topbar"></div>
    <div class="content"><div class="toolbar"><h1>クラス運営進捗一覧</h1></div><div class="table-card"></div></div>
  </div>

  <div class="overlay">
    <div class="modal modal-wide">
      <div class="modal-header">
        <div>
          <h2>クラス運営進捗の更新</h2>
          <div class="sub" id="subLine"></div>
        </div>
        <a class="close-x" href="class_progress_list.html">✕</a>
      </div>
      <div class="modal-body modal-body-plain">
        <div class="table-scroll" style="overflow: visible; max-height: none;">
        <table class="step-table">
          <thead>
            <tr>
              <th class="sticky" style="width:50px;">作業順</th>
              <th class="sticky" style="width:130px;">タスク名</th>
              <th class="sticky" style="width:84px;">実施対象</th>
              <th style="width:130px;">担当会社名</th>
              <th style="width:100px;">予定日</th>
              <th style="width:100px;">実施日</th>
              <th style="width:110px;">実施担当者</th>
              <th style="width:110px;">状態</th>
              <th>メモ</th>
            </tr>
          </thead>
          <tbody id="stepBody"></tbody>
        </table>
        </div>
      </div>
      <div class="modal-footer">
        <a class="search-btn" href="class_progress_list.html">キャンセル</a>
        <div id="saveBtn" class="btn primary">保存</div>
      </div>
    </div>
  </div>
</div>
<script src="js/storage/project/store/project-store.js"></script>
<script src="js/storage/staff/store/staff-store.js"></script>
<script src="js/storage/teacher-vender/store/teacher-vender-store.js"></script>
<script src="js/storage/course/store/course-store.js"></script>
<script src="js/storage/location/store/location-store.js"></script>
<script src="js/storage/class/store/class-store.js"></script>
<script src="js/storage/staff-vender/store/staff-vender-store.js"></script>
<script src="js/storage/task/store/task-store.js"></script>
<script src="js/storage/class-progress/store/progress-store.js"></script>
<script src="js/storage/class-progress/screens/class-progress-modify.js"></script>
<script src="js/select.js" defer></script>
<script src="js/datepicker.js" defer></script>
<script src="js/sidebar-toggle.js" defer></script>
<script src="js/column-resize.js" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/style_vender_assign.css">
</head>
<body>
<div class="app">
  <div id="sidebar-slot" data-active="assign"></div>
  <script src="js/access.js"></script>
<script src="js/sidebar.js"></script>
  <div class="overlay">
    <div class="modal modal-wide">
      <div class="modal-resize"></div>
      <div class="modal-header">
        <div>
          <h2 class="modal-header-title">登壇依頼</h2>
        </div>
        <a class="close-x" href="vender_assign_list.html">✕</a>
      </div>
      <div class="modal-body">
        <div class="field narrow">
          <label>講師ベンダー<span class="req">必須</span></label>
          <div class="control js-select" id="requestVendor">選択してください<span class="caret">▾</span></div>
        </div>
        <div class="filter-panel vender-assign-filter">
          <div class="field"><label>実施状況</label><div class="control small js-select" id="practiceFilter" data-practice-options-active data-practice-default="BEFORE"><span class="caret">▾</span></div></div>
          <div class="field"><label>キーワード検索（コース）</label><input type="text" class="field-control-input" id="keyword" placeholder="コースコード・コース名で検索"></div>
          <div class="field"><label>開始日</label><div class="control js-date" id="dateFrom"><span class="caret">▾</span></div></div>
          <div class="field"><label>終了日</label><div class="control js-date" id="dateTo"><span class="caret">▾</span></div></div>
          <div class="field"><label>依頼残</label><div class="control js-select" id="fitFilter" data-options="すべて,なし,あり" data-value="あり">あり<span class="caret">▾</span></div></div>
          <div class="search-btn">検索</div>
          <div class="search-btn" id="resetFilter">リセット</div>
        </div>
        <div class="table-card modal-fill-card">
          <div class="table-meta">
            <div class="vender-assign-meta-left">
              <div class="count"><b id="printCount">0</b> 件</div>
              <div class="filter-toggle-wrap">
                <span class="filter-toggle-label">依頼中</span>
                <div class="seg" id="pendSelSeg"><button type="button" class="seg-opt is-active" data-v="in">含める</button><button type="button" class="seg-opt" data-v="out">含めない</button></div>
              </div>
            </div>
          </div>
          <div class="scroll-outer modal-scroll-area" id="scrollArea">
          <table>
            <thead>
              <tr>
                <th class="sticky"><div class="toggle sel-toggle"><span class="knob"></span></div></th>
                <th class="sticky">年度</th>
                <th class="sticky fill">コース</th>
                <th class="sticky">レッスンNo</th>
                <th class="sticky">開始日</th>
                <th class="sticky">終了日</th>
                <th>予定講師数<br>（メイン）</th>
                                <th class="vender-assign-import-col-wide">講師<br>（メイン）</th>
                <th>予定講師数<br>（サブ）</th>
                                <th class="vender-assign-import-col-wide">講師<br>（サブ）</th>
                <th>予定講師数<br>（特別）</th>
                <th class="vender-assign-import-col-wide">講師<br>（特別）</th>
              </tr>
            </thead>
            <tbody id="printBody"></tbody>
          </table>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <a class="search-btn" href="vender_assign_list.html">キャンセル</a>
        <div class="btn primary" id="printBtn">依頼</div>
      </div>
    </div>
  </div>
</div>
<script src="js/storage/practice-status/store/practice-status-store.js"></script>
<script src="js/storage/operating-status/store/operating-status-store.js"></script>
<script src="js/html-util.js"></script>
<script src="js/storage/location/store/location-store.js"></script>
<script src="js/storage/teacher-vender/store/teacher-vender-store.js"></script>
<script src="js/storage/course/store/course-store.js"></script>
<script src="js/storage/project/store/project-store.js"></script>
<script src="js/storage/class/store/class-store.js"></script>
<script src="js/storage/slot-status/store/slot-status-store.js"></script>
<script src="js/storage/vender-assign/store/vender-assign-store.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script src="js/list-filter-auto.js"></script>
<script src="js/storage/vender-assign/screens/vender-assign-lines.js"></script>
<script src="js/storage/vender-assign/screens/vender-assign-export.js"></script>
<script src="js/filter-collapse.js"></script>
<script src="js/select.js" defer></script>
<script src="js/datepicker.js" defer></script>
<script src="js/column-resize.js" defer></script>
<script src="js/message-dialog.js"></script>
<script src="js/filter-memory.js"></script>
<script src="js/modal-resize.js"></script>
</body>
</html>

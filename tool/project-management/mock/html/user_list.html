<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <div id="sidebar-slot" data-active="master" data-sub="user"></div>
  <script src="js/message-dialog.js"></script>
<script src="js/access.js"></script>
<script src="js/sidebar.js"></script>

  <div class="main">
    <div id="topbar-slot" data-title="ユーザー一覧"></div>
    <script src="js/topbar.js"></script>

    <div class="content">
      
      <div class="filter-panel">
        <div class="field"><label>キーワード検索</label><input type="text" class="field-control-input" placeholder="ユーザーコード・ユーザー名・メールアドレスで検索"></div>
        <div class="field"><label>権限</label><div class="control small js-select" data-master-options="UserRoleStore">すべて<span class="caret">▾</span></div></div>
        <div class="field"><label>所属区分</label><div class="control small js-select" data-master-options="AffiliationStore" data-match-attr="data-affiliation">すべて<span class="caret">▾</span></div></div>
        <div class="field"><label>担当区分</label><div class="control small js-select" data-master-options="StaffRoleStore" data-match-attr="data-roles">すべて<span class="caret">▾</span></div></div>
        <div class="field"><label>業務区分</label><div class="control small js-select" data-master-options="JobTypeStore" data-match-attr="data-jobs">すべて<span class="caret">▾</span></div></div>
        <div class="field"><label>稼働状態</label><div class="control small js-select" data-status-options="all">すべて<span class="caret">▾</span></div></div>
        <div class="nav-btn">検索</div>
        <div class="nav-btn" id="resetFilter">リセット</div>
      </div>

      <div style="display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-bottom: 16px;">
        <a class="nav-btn" href="user_regist.html">新規登録</a>
      </div>

      <div class="table-card">
        <div class="table-meta"><div class="count"><b id="userCount">0</b> 件</div></div>
        <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>ユーザーコード</th>
              <th>ユーザー名</th>
              <th>メールアドレス</th>
              <th>権限</th>
              <th>実施担当連携</th>
              <th>所属区分</th>
              <th>実施担当ベンダー</th>
              <th>担当区分</th>
              <th>業務区分</th>
              <th>稼働状態</th>
              <th class="no-sort">備考</th>
              <th class="col-actions">操作</th>
            </tr>
          </thead>
          <tbody id="userBody"></tbody>
        </table>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="js/master-options.js"></script>
<script src="js/storage/operating-status/store/operating-status-store.js"></script>
<script src="js/html-util.js"></script>
<script src="js/storage/user-role/store/user-role-store.js"></script>
<script src="js/storage/user/store/user-store.js"></script>
<script src="js/storage/job-type/store/job-type-store.js"></script>
<script src="js/storage/position/store/position-store.js"></script>
<script src="js/storage/staff-role/store/staff-role-store.js"></script>
<script src="js/storage/staff/store/staff-store.js"></script>
<script src="js/storage/affiliation/store/affiliation-store.js"></script>
<script src="js/storage/staff-vender/store/staff-vender-store.js"></script>
<script src="js/storage/link-state/store/link-state-store.js"></script>
<script src="js/storage/user/screens/user-list.js"></script>
<script src="js/select.js" defer></script>
<script src="js/table-sort.js" defer></script>
<script src="js/column-resize.js" defer></script>
<script src="js/list-filter-auto.js"></script>
<script src="js/list-filter.js"></script><script src="js/filter-collapse.js"></script>
<script src="js/filter-memory.js"></script>
<script src="js/scroll-keep.js"></script>
</body>
</html>

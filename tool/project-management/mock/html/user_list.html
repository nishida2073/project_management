<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/user_list.css">
</head>
<body>
<div class="app">
  <iframe src="sidebar.html?active=master&sub=user" width="220" height="1040" style="border:0; flex-shrink:0; display:block;" title="サイドバー"></iframe>

  <div class="main">
    <div class="topbar">
      <div class="crumb-block">
        <div class="crumb">システム管理<span>／</span>ユーザー</div>
        <p class="crumb-sub">ユーザー情報を管理します</p>
      </div>
      <div class="user"><span>山田 太郎（BD事業部）</span><div class="avatar">山田</div></div>
    </div>

    <div class="content">
      <div class="toolbar">
        <div class="left">
          <h1>ユーザー一覧</h1>
        </div>
        <div class="btn-group">
          <a class="search-btn" href="user_regist.html">新規登録</a>
        </div>
      </div>

      <div class="filter-panel">
        <div class="field"><label>キーワード検索</label><input type="text" class="field-control-input" placeholder="ユーザーコード・ユーザー名・メールアドレスで検索"></div>
        <div class="field"><label>権限</label><div class="control small js-select" data-options="すべて,管理者,一般ユーザー">すべて<span class="caret">▾</span></div></div>
        <div class="field"><label>稼働状況</label><div class="control small js-select" data-options="すべて,稼働中,停止中">すべて<span class="caret">▾</span></div></div>
        <div class="search-btn">検索</div>
      </div>

      <div class="table-card">
        <div class="table-meta"><div class="count">全 <b id="userCount">0</b> 件</div></div>
        <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>ユーザーコード</th>
              <th>ユーザー名</th>
              <th>メールアドレス</th>
              <th>権限</th>
              <th>稼働状況</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="userBody"></tbody>
        </table>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="js/storage/user-role/store/user-role-store.js"></script>
<script src="js/storage/user/store/user-store.js"></script>
<script src="js/storage/user/screens/user-list.js"></script>
<script src="js/select.js" defer></script>
<script src="js/sidebar-toggle.js" defer></script>
<script src="js/column-resize.js" defer></script>
<script src="js/list-filter.js"></script></body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/style_tag.css">
<link rel="stylesheet" href="css/style_modify.css">
</head>
<body>
<div class="app">
  <div id="sidebar-slot" data-active="master" data-sub="customer"></div>
  <script src="js/sidebar.js"></script>
  <div class="overlay">
    <div class="modal">
      <div class="modal-resize"></div>
      <div class="modal-header">
        <div>
          <h2>顧客更新</h2>
          <div class="sub" id="subLine"></div>
        </div>
        <a class="close-x" href="customer_list.html">✕</a>
      </div>
      <div class="modal-body">
        <div class="form-field">
          <label>顧客コード</label>
          <div class="form-control readonly" id="customerId"></div>
        </div>
        <div class="form-field"></div>
        <div class="form-field full">
          <label>顧客名<span class="req">必須</span></label>
          <input type="text" class="form-control" id="customerName">
        </div>
        <div class="form-section">問い合わせ窓口</div>
        <div class="form-field">
          <label>窓口担当者名</label>
          <input type="text" class="form-control" id="staff">
        </div>
        <div class="form-field">
          <label>メールアドレス</label>
          <input type="email" class="form-control" id="email">
        </div>
        <div class="form-section">その他</div>
        <div class="form-field full">
          <label>備考</label>
          <textarea class="form-control textarea auto-grow" data-min="68" id="memo"></textarea>
        </div>
        <div class="form-field toggle-field">
          <label>稼働状態</label>
          <div class="toggle-row" id="statusRow"><div class="toggle" id="statusToggle"><div class="knob"></div></div><span id="statusLabel" data-status="ACTIVE"></span></div>
        </div>
      </div>
      <div class="modal-footer">
        <a class="search-btn" href="customer_list.html">キャンセル</a>
        <div id="saveBtn" class="btn primary">保存</div>
      </div>
    </div>
  </div>
</div>
<script src="js/storage/operating-status/store/operating-status-store.js"></script>
<script src="js/html-util.js"></script>
<script src="js/storage/customer/store/customer-store.js"></script>
<script src="js/storage/customer/screens/customer-editor.js"></script>
<script src="js/storage/customer/entry/customer-modify.js"></script>
<script src="js/select.js" defer></script>
<script src="js/toggle.js" defer></script>
<script src="js/message-dialog.js"></script>
<script src="js/memo-area.js" defer></script>
<script src="js/modal-resize.js"></script>
</body>
</html>

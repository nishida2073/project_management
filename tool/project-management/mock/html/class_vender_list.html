<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <iframe src="sidebar.html?active=assign" width="220" height="1040" style="border:0; flex-shrink:0; display:block;" title="サイドバー"></iframe>
  <div class="main">
    <div class="topbar">
      <div class="crumb-block">
        <div class="crumb">登壇管理一覧</div>
      </div>
      <div class="user">
        <span>山田 太郎（BD事業部）</span>
        <div class="avatar">山田</div>
      </div>
    </div>
    <div class="content">
            <div class="filter-panel">
        <div class="field"><label>実施状況</label><div class="control small js-select" data-options="すべて,実施前,実施中,実施後" data-match-col="0" data-value="実施前">実施前<span class="caret">▾</span></div></div>
        <div class="field"><label>年度</label><div class="control small js-select" data-options="すべて,2024年度,2025年度,2026年度,2027年度">すべて<span class="caret">▾</span></div></div>
        <div class="field"><label>キーワード検索（コース）</label><input type="text" class="field-control-input" placeholder="コースコード・コース名で検索"></div>
        <div class="field"><label>開始日</label><div class="control small js-date"><span class="caret">▾</span></div></div>
        <div class="tilde">〜</div>
        <div class="field"><label>終了日</label><div class="control small js-date"><span class="caret">▾</span></div></div>
        <div class="field"><label>講師ベンダー</label><div class="control wide js-select" id="vendorFilter" data-options="すべて">すべて<span class="caret">▾</span></div></div>
        <div class="search-btn">検索</div>
      </div>
      <div style="display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-bottom: 16px;">
        <a class="btn primary" href="class_vender_print.html">登壇依頼書の出力</a>
          <div class="btn primary" id="importBtn">登壇依頼書の取り込み</div>
          <input type="file" id="importFile" accept=".xlsx" style="display:none;">
      </div>

      <div class="table-card">
        <div class="table-meta">
          <div class="count"><b id="venderCount">0</b> 件</div>
        </div>
        <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>実施状況</th>
              <th>年度</th>
              <th>コース</th>
              <th>レッスンNo</th>
              <th>開始日</th>
              <th>終了日</th>
              <th>予定講師数<br>（メイン）</th>
              <th>予定講師数<br>（サブ）</th>
              <th>依頼残</th>
              <th>講師（メイン）</th>
              <th>講師（サブ）</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="venderBody"></tbody>
        </table>
        </div>
        <div class="pagination"></div>
      </div>
    </div>
  </div>
</div>
<script src="js/storage/location/store/location-store.js"></script>
<script src="js/storage/staff/store/staff-store.js"></script>
<script src="js/storage/teacher-vender/store/teacher-vender-store.js"></script>
<script src="js/storage/course/store/course-store.js"></script>
<script src="js/storage/project/store/project-store.js"></script>
<script src="js/storage/class/store/class-store.js"></script>
<script src="js/storage/vender-assign/store/vender-assign-store.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script src="js/message-dialog.js"></script>
<script src="js/storage/vender-assign/screens/vender-assign-list.js"></script>
<script src="js/storage/vender-assign/screens/vender-assign-import.js"></script>
<script src="js/select.js" defer></script>
<script src="js/storage/holiday/store/holiday-store.js"></script>
<script src="js/datepicker.js" defer></script>
<script src="js/sidebar-toggle.js" defer></script>
<script src="js/column-resize.js" defer></script>
<script src="js/list-filter.js"></script>
<script src="js/pagination.js"></script>
<script src="js/filter-collapse.js"></script>
<script src="js/table-sort.js" defer></script>
</body>
</html>

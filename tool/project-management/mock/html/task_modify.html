<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/style_modify.css">
</head>
<body>
<div class="app">
  <iframe src="sidebar.html?active=master&sub=task" width="220" height="1040" style="border:0; flex-shrink:0; display:block;" title="サイドバー"></iframe>
  <div class="main">
    <div class="topbar"></div>
    <div class="content"><div class="toolbar"><h1>タスク一覧</h1></div><div class="table-card"></div></div>
  </div>

  <div class="overlay">
    <div class="modal">
      <div class="modal-header">
        <div>
          <h2>タスク編集</h2>
          <div class="sub" id="subLine"></div>
        </div>
        <a class="close-x" href="task_list.html">✕</a>
      </div>
      <div class="modal-body">
        <div class="form-field">
          <label>タスクコード</label>
          <input type="text" id="taskId" class="form-control" readonly>
        </div>
        <div class="form-field full">
          <label>タスク名<span class="req">必須</span></label>
          <input type="text" id="taskName" class="form-control">
        </div>
        <div class="form-field full">
          <label>タスク区分<span class="req">必須</span></label>
          <div class="radio-group" id="kindGroup"></div>
        </div>
        <div class="form-field">
          <label>所属区分<span class="req">必須</span></label>
          <div class="radio-group" id="affiliationGroup">
            <label class="radio-option"><input type="radio" name="affiliation" value="社内"><span class="radio-dot"></span><span class="tag blue">社内</span></label>
            <label class="radio-option"><input type="radio" name="affiliation" value="パートナー"><span class="radio-dot"></span><span class="tag orange">パートナー</span></label>
          </div>
        </div>
        <div class="form-field" id="companyField" style="visibility: hidden;">
          <label>実施担当ベンダー<span class="req">必須</span></label>
          <div id="company" class="form-control js-select" data-options="社内,株式会社NEUトレーニング,NDUパートナーズ,ユニバ研修サービス,CECトラスト"><span class="caret">▾</span></div>
        </div>
        <div class="form-field">
          <label>作業順<span class="req">必須</span></label>
          <input type="number" id="order" class="form-control" min="1">
        </div>
        <div class="form-field"></div>
        <div class="form-field">
          <label>日数<span class="req">必須</span></label>
          <input type="number" id="days" class="form-control">
        </div>
        <div class="form-field full">
          <label>稼働状況</label>
          <div class="toggle-row" id="statusRow"><div class="toggle" id="statusToggle"><div class="knob"></div></div><span id="statusLabel">稼働中</span></div>
        </div>
      </div>
      <div class="modal-footer">
        <a class="search-btn" href="task_list.html">キャンセル</a>
        <div id="saveBtn" class="btn primary">保存</div>
      </div>
    </div>
  </div>
</div>
<script src="js/storage/task-type/store/task-type-store.js"></script>
<script src="js/storage/staff-vender/store/staff-vender-store.js"></script>
<script src="js/storage/task/store/task-store.js"></script>
<script src="js/select.js" defer></script>
<script src="js/chip-select.js" defer></script>
<script src="js/sidebar-toggle.js" defer></script>
<script src="js/toggle.js" defer></script>
<script src="js/storage/teacher-vender/store/teacher-vender-store.js"></script>
<script src="js/storage/task/screens/task-editor.js"></script>
<script src="js/storage/task/entry/task-modify.js"></script>
<script src="js/message-dialog.js"></script>
</body>
</html>

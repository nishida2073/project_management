<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/style_regist.css">
</head>
<body>
<div class="app">
  <div id="sidebar-slot" data-active="master" data-sub="subject"></div>
  <script src="js/sidebar.js"></script>
  <div class="overlay">
    <div class="modal">
      <div class="modal-resize"></div>
      <div class="modal-header">
        <div>
          <h2 class="modal-header-title">科目登録</h2>
        </div>
        <a class="close-x" href="subject_list.html">✕</a>
      </div>
      <div class="modal-body">
        <div class="form-field">
          <label>科目コード</label>
          <input type="text" class="form-control" id="subjectCode" placeholder="例）BC02">
        </div>
        <div class="form-field"></div>
        <div class="form-field full">
          <label>科目区分<span class="req">必須</span></label>
          <div class="radio-group" id="subjectTypeGroup"></div>
        </div>
        <div class="form-field full">
          <label>科目名<span class="req">必須</span></label>
          <input type="text" class="form-control" id="subjectName">
        </div>
        <div class="form-field full">
          <label>版<span class="req">必須</span></label>
          <div class="chip-box" id="subjectVersions"><span class="chip-add">追加</span></div>
        </div>
        <div class="form-section">その他</div>
        <div class="form-field full">
          <label>備考</label>
          <textarea class="form-control textarea auto-grow" data-min="68" id="memo"></textarea>
        </div>
        <div class="form-field toggle-field">
          <label>稼働状態</label>
          <div class="toggle-row" id="statusRow"><div class="toggle" id="statusToggle"><div class="knob"></div></div><span id="statusLabel" data-status="ACTIVE"></span></div>
        </div>
      </div>
      <div class="modal-footer">
        <a class="search-btn" href="subject_list.html">キャンセル</a>
        <div id="saveBtn" class="btn primary">保存</div>
      </div>
    </div>
  </div>
</div>
<script src="js/storage/operating-status/store/operating-status-store.js"></script>
<script src="js/html-util.js"></script>
<script src="js/storage/subject-type/store/subject-type-store.js"></script>
<script src="js/storage/subject/store/subject-store.js"></script>
<script src="js/master-options.js"></script>
<script src="js/storage/subject/screens/subject-editor.js"></script>
<script src="js/storage/subject/entry/subject-regist.js"></script>
<script src="js/select.js" defer></script>
<script src="js/toggle.js" defer></script>
<script src="js/input-dialog.js"></script>
<script src="js/message-dialog.js"></script>
<script src="js/memo-area.js" defer></script>
<script src="js/modal-resize.js"></script>
</body>
</html>

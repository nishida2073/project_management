<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/style_list.css">
</head>
<body>
<div class="app">
  <iframe src="sidebar.html?active=unei" width="220" height="1040" style="border:0; flex-shrink:0; display:block;" title="サイドバー"></iframe>

  <div class="main">
    <div class="topbar">
      <div class="crumb-block">
        <div class="crumb">クラス運営進捗一覧</div>
      </div>
      <div class="user">
        <span>山田 太郎（BD事業部）</span>
        <div class="avatar">山田</div>
      </div>
    </div>

    <div class="content">
      
      <div class="filter-panel">
        <div class="field"><label>実施状況</label><div class="control small js-select" data-options="すべて,実施前,実施中,実施後" data-match-col="0">すべて<span class="caret">▾</span></div></div>
        <div class="field"><label>年度</label><div class="control small js-select" data-options="すべて,2024年度,2025年度,2026年度,2027年度">すべて<span class="caret">▾</span></div></div>
        <div class="field"><label>キーワード検索</label><input type="text" class="field-control-input" placeholder="コースコード・コース名で検索"></div>
        <div class="field"><label>開始日</label><div class="control small js-date"><span class="caret">▾</span></div></div>
        <div class="tilde">〜</div>
        <div class="field"><label>終了日</label><div class="control small js-date"><span class="caret">▾</span></div></div>
        <div class="field"><label>管理担当者</label><div class="control js-select" id="managerFilter" data-options="すべて">すべて<span class="caret">▾</span></div></div>
        <div class="field"><label>全体進捗</label><div class="control small js-select" data-options="すべて,実施前,実施中,完了,遅延">すべて<span class="caret">▾</span></div></div>
        <div class="field" style="display:none;"><label>タスク区分</label><div class="control small js-select" data-options="すべて,データ,グループ">すべて<span class="caret">▾</span></div></div>
        <!-- <div class="field"><label>実施担当者</label><div class="control js-select" data-match-attr="data-owners" data-options="すべて">すべて<span class="caret">▾</span></div></div> -->
        <div class="search-btn">検索</div>
      </div>

      <div class="table-card">
        <div class="tab-row" id="taskTypeTabs" style="display:flex; gap:8px; padding:12px 20px 0;">
          <span class="year-tab active" data-tt="">すべて</span>
          <span class="year-tab" data-tt="データ">データ</span>
          <span class="year-tab" data-tt="グループ">グループ</span>
        </div>
        <div class="table-meta">
          <div class="count"><b id="progressCount">0</b> 件（遅延 <b id="delayCount" style="color:#d43c40">0</b> 件）</div>
        </div>
        <div class="scroll-outer" id="scrollArea">
          <table>
            <thead>
              <tr>
                <th class="sticky">実施状況</th>
                <th class="sticky">年度</th>
                <th class="sticky">コース</th>
                <th class="sticky">レッスンNo</th>
                <th class="sticky">開始日</th>
                <th class="sticky">終了日</th>
                <th class="sticky">実施担当者</th>
                <th class="sticky">管理担当者</th>
                <th class="sticky">タスク区分</th>
                <th class="sticky">全体進捗</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <div class="pagination"></div>
      </div>
    </div>
  </div>
</div>

<script src="js/storage/project/store/project-store.js"></script>
<script src="js/storage/staff/store/staff-store.js"></script>
<script src="js/storage/teacher-vender/store/teacher-vender-store.js"></script>
<script src="js/storage/course/store/course-store.js"></script>
<script src="js/storage/location/store/location-store.js"></script>
<script src="js/storage/class/store/class-store.js"></script>
<script src="js/storage/staff-vender/store/staff-vender-store.js"></script>
<script src="js/storage/task/store/task-store.js"></script>
<script src="js/storage/class-progress/store/progress-store.js"></script>
<script src="js/storage/task-type/store/task-type-store.js"></script>
<script src="js/storage/job-type/store/job-type-store.js"></script>
<script src="js/storage/staff-role/store/staff-role-store.js"></script>
<script src="js/storage/class-progress/screens/class-progress-list.js"></script>
<script src="js/select.js" defer></script>
<script src="js/storage/holiday/store/holiday-store.js"></script>
<script src="js/datepicker.js" defer></script>
<script src="js/sidebar-toggle.js" defer></script>
<script src="js/table-sort.js" defer></script>
<script src="js/column-resize.js" defer></script>
<script src="js/list-filter.js"></script><script src="js/pagination.js"></script>
<script>
document.querySelectorAll('#taskTypeTabs .year-tab').forEach(function (tab) {
  tab.addEventListener('click', function () {
    document.querySelectorAll('#taskTypeTabs .year-tab').forEach(function (x) { x.classList.remove('active'); });
    tab.classList.add('active');
    var value = tab.getAttribute('data-tt') || 'すべて';
    var kindRow = TaskTypeStore.load().filter(function (t) { return t.name === value; })[0];
    if (window.applyStepColumns) window.applyStepColumns(kindRow ? kindRow.code : '');
    var field = Array.prototype.filter.call(document.querySelectorAll('.filter-panel .field'), function (f) {
      var l = f.querySelector('label');
      return l && l.textContent === 'タスク区分';
    })[0];
    var ctl = field && field.querySelector('.js-select');
    if (ctl) {
      ctl.setAttribute('data-value', value);
      ctl.innerHTML = value + '<span class="caret">▾</span>';
    }
    document.querySelector('.filter-panel .search-btn').click();
  });
});
</script>
<script src="js/filter-collapse.js"></script>
</body>
</html>

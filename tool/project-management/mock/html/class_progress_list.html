<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/style_progress.css">
</head>
<body>
<div class="app">
  <div id="sidebar-slot" data-active="unei"></div>
  <script src="js/message-dialog.js"></script>
<script src="js/access.js"></script>
<script src="js/sidebar.js"></script>

  <div class="main">
    <div id="topbar-slot" data-title="クラス進捗一覧"></div>
    <script src="js/topbar.js"></script>

    <div class="content">
      
      <div class="filter-panel">
        <div style="display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;">
        <div class="field"><label>実施状況</label><div class="control small js-select" data-practice-options data-match-class="col-practice" data-hide-class="col-practice">すべて<span class="caret">▾</span></div></div>
        <div class="field narrow"><label>顧客</label><div class="control js-select" id="customerFilter" data-hide-class="col-customer" data-options="すべて" data-match-class="col-customer">すべて<span class="caret">▾</span></div></div>
        <div class="field"><label>年度</label><div class="control small js-select" data-options="すべて,2024,2025,2026,2027" data-hide-class="col-year">すべて<span class="caret">▾</span></div></div>
        <div class="field"><label>キーワード検索</label><input type="text" class="field-control-input" placeholder="コースコード・コース名で検索"></div>
        <div class="field"><label>開始日</label><div class="control small js-date"><span class="caret">▾</span></div></div>
        <div class="tilde">〜</div>
        <div class="field"><label>終了日</label><div class="control small js-date"><span class="caret">▾</span></div></div>
        </div>
        <div style="display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-top:12px;">
        <div class="field"><label>管理担当者</label><div class="control js-select" id="managerFilter" data-hide-class="col-manager" data-options="すべて">すべて<span class="caret">▾</span></div></div>
        <div class="field"><label>タスク区分</label><div class="control small js-select" data-master-options="TaskTypeStore">すべて<span class="caret">▾</span></div></div>
        <div class="field"><label>全体進捗</label><div class="control small js-select" data-task-progress-options data-hide-class="col-overall">すべて<span class="caret">▾</span></div></div>
        <div class="field"><label>実施担当ベンダー</label><div class="control wide js-select" id="companyFilter" data-column-only data-options="すべて">すべて<span class="caret">▾</span></div></div>
        <!-- <div class="field"><label>実施担当者</label><div class="control js-select" data-match-attr="data-owners" data-options="すべて">すべて<span class="caret">▾</span></div></div> -->
        <div class="nav-btn">検索</div>
        <div class="nav-btn" id="resetFilter">リセット</div>
        </div>
      </div>

      <div class="table-card">
        <div class="table-meta">
          <div style="display:flex; align-items:center; gap:16px;">
          <div class="count"><b id="progressCount">0</b> 件（<span data-task-progress-name="DELAY"></span> <b id="delayCount" style="color:#d43c40">0</b> 件）</div>
          <div class="field" style="flex-direction:row; align-items:center; gap:8px;"><label>表示形式</label><div class="seg" id="viewTabs"><button type="button" class="seg-opt is-active" data-view="table">表</button><button type="button" class="seg-opt" data-view="calendar">日ごと</button></div></div>
          </div>
        </div>
        <div class="scroll-outer progress-scroll">
          <table>
            <thead>
              <tr>
                <th class="sticky col-practice">実施状況</th>
                <th class="sticky col-customer">顧客</th>
                <th class="sticky col-year">年度</th>
                <th class="sticky">コース</th>
                <th class="sticky">レッスンNo</th>
                <th class="sticky">開始日</th>
                <th class="sticky">終了日</th>
                <th class="sticky col-manager">管理担当者</th>
                <th class="sticky">タスク区分</th>
                <th class="sticky col-overall">全体進捗</th>
                <th class="col-actions">操作</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <div id="calendarView" class="cal-view" style="display:none;"></div>
        <div class="pagination"></div>
      </div>
    </div>
  </div>
</div>

<script src="js/master-options.js"></script>
<script src="js/storage/step-status/store/step-status-store.js"></script>
<script src="js/storage/task-progress/store/task-progress-store.js"></script>
<script src="js/storage/practice-status/store/practice-status-store.js"></script>
<script src="js/storage/operating-status/store/operating-status-store.js"></script>
<script src="js/storage/affiliation/store/affiliation-store.js"></script>
<script src="js/html-util.js"></script>
<script src="js/storage/project/store/project-store.js"></script>
<script src="js/storage/staff/store/staff-store.js"></script>
<script src="js/storage/teacher-vender/store/teacher-vender-store.js"></script>
<script src="js/storage/course/store/course-store.js"></script>
<script src="js/storage/location/store/location-store.js"></script>
<script src="js/storage/class/store/class-store.js"></script>
<script src="js/storage/staff-vender/store/staff-vender-store.js"></script>
<script src="js/storage/task/store/task-store.js"></script>
<script src="js/storage/class-progress/store/progress-store.js"></script>
<script src="js/storage/task-type/store/task-type-store.js"></script>
<script src="js/storage/job-type/store/job-type-store.js"></script>
<script src="js/storage/work-type/store/work-type-store.js"></script>
<script src="js/storage/staff-role/store/staff-role-store.js"></script>
<script src="js/storage/customer/store/customer-store.js"></script>
<script src="js/list-filter-auto.js"></script>
<script src="js/storage/holiday/store/holiday-store.js"></script>
<script src="js/scroll-keep.js"></script>
<script src="js/day-table.js"></script>
<script src="js/storage/class-progress/screens/class-progress-list.js"></script>
<script src="js/select.js" defer></script>
<script src="js/datepicker.js" defer></script>
<script src="js/table-sort.js" defer></script>
<script src="js/column-resize.js" defer></script>
<script src="js/list-filter.js"></script><script src="js/pagination.js"></script>
<script src="js/filter-collapse.js"></script>
<script src="js/filter-memory.js"></script>
</body>
</html>

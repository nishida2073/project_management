<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/style_vender_assign.css">
</head>
<body>
<div class="app">
  <div id="sidebar-slot" data-active="assign"></div>
  <script src="js/sidebar.js"></script>
  <div class="overlay">
    <div class="modal modal-wide">
      <div class="modal-resize"></div>
      <div class="modal-header">
        <div>
          <h2>登壇依頼反映</h2>
        </div>
        <a class="close-x" href="vender_assign_list.html">✕</a>
      </div>
      <div class="modal-body">
        <div class="vender-assign-import-toolbar"><div class="search-btn" id="importLoad">取り込み</div><input type="file" id="importFile" class="is-hidden" accept=".xlsx"></div>
        <div class="sub vender-assign-import-vendor-line" id="vendorLine"></div>
        <div class="table-card modal-fill-card">
          
          <div class="table-meta"><div class="count"><b id="importTotal">0</b> 人</div></div>
          <div class="scroll-outer modal-scroll-area" id="scrollArea">
          <table>
            <thead>
              <tr>
                <th>年度</th>
                <th class="fill">コース</th>
                <th>レッスンNo</th>
                <th>開始日</th>
                <th>終了日</th>
                <th class="vender-assign-import-col-wide">講師（メイン）</th>
                <th class="vender-assign-import-col-wide">講師（サブ）</th>
              </tr>
            </thead>
            <tbody id="importBody"></tbody>
          </table>
          </div>
        </div>
        <div class="vender-assign-import-error" id="errorBox"></div>
      </div>
      <div class="modal-footer">
        <a class="search-btn" href="vender_assign_list.html">キャンセル</a>
        <div class="btn primary" id="importApply">反映</div>
      </div>
    </div>
  </div>
</div>
<script src="js/storage/practice-status/store/practice-status-store.js"></script>
<script src="js/storage/operating-status/store/operating-status-store.js"></script>
<script src="js/html-util.js"></script>
<script src="js/storage/location/store/location-store.js"></script>
<script src="js/storage/teacher-vender/store/teacher-vender-store.js"></script>
<script src="js/storage/course/store/course-store.js"></script>
<script src="js/storage/project/store/project-store.js"></script>
<script src="js/storage/class/store/class-store.js"></script>
<script src="js/storage/slot-status/store/slot-status-store.js"></script>
<script src="js/storage/vender-assign/store/vender-assign-store.js"></script>
<script src="js/message-dialog.js"></script>
<script src="js/select.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script src="js/storage/vender-assign/screens/vender-assign-import.js"></script>
<script src="js/select-dialog.js"></script>
<script src="js/storage/vender-assign/screens/vender-assign-import-preview.js"></script>
<script src="js/modal-resize.js"></script>
<script src="js/column-resize.js" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <iframe src="sidebar.html?active=project" width="220" height="1040" style="border:0; flex-shrink:0; display:block;" title="サイドバー"></iframe>

  <div class="main">
    <div class="topbar">
      <div class="crumb-block">
        <div class="crumb">案件一覧</div>
      </div>
      <div class="user">
        <span>山田 太郎（BD事業部）</span>
        <div class="avatar">山田</div>
      </div>
    </div>

    <div class="content">
      <div class="filter-panel">
        <div class="field">
          <label>年度</label>
          <div class="control small js-select" data-options="すべて,2024年度,2025年度,2026年度,2027年度">すべて<span class="caret">▾</span></div>
        </div>
        <div class="field">
          <label>キーワード検索</label>
          <input type="text" class="field-control-input" placeholder="案件コード・案件名で検索">
        </div>
        <div class="field">
          <label>販売区分</label>
          <div class="control small js-select" data-options="すべて,外販,内販">すべて<span class="caret">▾</span></div>
        </div>
        <div class="field">
          <label>参加区分</label>
          <div class="control small js-select" data-options="すべて,受託,公募">すべて<span class="caret">▾</span></div>
        </div>
        <div class="field">
          <label>管理担当者</label>
          <div class="control js-select" data-options="すべて,山口 直人,細野 恵美,田中 誠,木村 隆,高橋 健,中島 拓海,伊藤 美咲,小林 由美,渡辺 直樹,松本 健二,市村 拓也,佐藤 一郎,岡田 沙織">すべて<span class="caret">▾</span></div>
        </div>
        <div class="field">
          <label>実施開始月</label>
          <div class="control small js-month">2026/09<span class="caret">▾</span></div>
        </div>
        <div class="tilde">〜</div>
        <div class="field">
          <label> </label>
          <div class="control small js-month">2027/03<span class="caret">▾</span></div>
        </div>
        <div class="search-btn">検索</div>
      </div>

      <div style="display: flex; justify-content: flex-end; margin-bottom: 16px;">
        <a class="search-btn" href="project_regist.html">新規登録</a>
      </div>

      <div class="table-card">
        <div class="table-meta">
          <div class="count">全 <b id="projectCount">0</b> 件</div>
        </div>
        <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>年度</th>
              <th>案件コード</th>
              <th>販売区分</th>
              <th>参加区分</th>
              <th>案件名</th>
              <th style="min-width:200px;">顧客名</th>
              <th>管理担当者</th>
              <th>実施開始月</th>
              <th>稼働状況</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="projectBody"></tbody>
        </table>
        </div>
        <div class="pagination">
          <div class="page-btn">‹</div>
          <div class="page-btn active">1</div>
          <div class="page-btn">2</div>
          <div class="page-btn">3</div>
          <div class="page-btn">…</div>
          <div class="page-btn">3</div>
          <div class="page-btn">›</div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="js/select.js" defer></script>
<script src="js/storage/holiday/store/holiday-store.js"></script>
<script src="js/datepicker.js" defer></script>
<script src="js/sidebar-toggle.js" defer></script>
<script src="js/column-resize.js" defer></script>
${tags%
}
<script src="js/storage/staff/store/staff-store.js"></script>
<script src="js/storage/participation-type/store/participation-type-store.js"></script>
<script src="js/storage/sales-type/store/sales-type-store.js"></script>
<script src="js/storage/customer/store/customer-store.js"></script>
<script src="js/storage/project/store/project-store.js"></script>
<script src="js/storage/project/screens/project-list.js"></script>
<script src="js/list-filter.js"></script><script src="js/pagination.js"></script>
<script src="js/filter-collapse.js"></script>
</body>
</html>

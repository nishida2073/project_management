<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <iframe src="sidebar.html?active=master&sub=customer" width="220" height="1040" style="border:0; flex-shrink:0; display:block;" title="サイドバー"></iframe>

  <div class="main">
    <div class="topbar">
      <div class="crumb-block">
        <div class="crumb">顧客一覧</div>
      </div>
      <div class="user"><span>山田 太郎（BD事業部）</span><div class="avatar">山田</div></div>
    </div>

    <div class="content">
      
      <div class="filter-panel">
        <div class="field"><label>キーワード検索</label><input type="text" class="field-control-input" placeholder="顧客コード・顧客名で検索"></div>
        <div class="search-btn">検索</div>
      </div>
      <div style="display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-bottom: 16px;">
        <a class="search-btn" href="customer_regist.html">新規登録</a>
      </div>

      <div class="table-card">
        <div class="table-meta"><div class="count"><b id="customerCount">0</b> 件</div></div>
        <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>顧客コード</th>
              <th>顧客名</th>
              <th>担当者</th>
              <th>稼働状況</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="customerBody"></tbody>
        </table>
        </div>
        <div class="pagination"></div>
      </div>
    </div>
  </div>
</div>
<script src="js/storage/staff/store/staff-store.js"></script>
<script src="js/storage/customer/store/customer-store.js"></script>
<script src="js/storage/customer/screens/customer-list.js"></script>
<script src="js/sidebar-toggle.js" defer></script>
<script src="js/column-resize.js" defer></script>
<script src="js/list-filter.js"></script>
<script src="js/pagination.js"></script>
<script src="js/filter-collapse.js"></script>
</body>
</html>

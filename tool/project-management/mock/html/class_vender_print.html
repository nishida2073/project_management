<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/style_modify.css">
<style>
  .modal-body { display: flex; flex-direction: column; gap: 16px; }
  .print-area { display: none; }
  @media print {
    body * { visibility: hidden; }
    .print-area, .print-area * { visibility: visible; }
    .print-area { display: block; position: absolute; left: 0; top: 0; width: 100%; }
    .print-area table { width: 100%; border-collapse: collapse; font-size: 11px; }
    .print-area th, .print-area td { border: 1px solid #333; padding: 4px 6px; text-align: left; }
  }
</style>
</head>
<body>
<div class="app">
  <iframe src="sidebar.html?active=assign" width="220" height="1040" style="border:0; flex-shrink:0; display:block;" title="サイドバー"></iframe>
  <div class="main">
    <div class="topbar"></div>
    <div class="content"><div class="toolbar"><h1>登壇管理一覧</h1></div><div class="table-card"></div></div>
  </div>
  <div class="overlay">
    <div class="modal modal-wide">
      <div class="modal-header">
        <div>
          <h2>登壇依頼書出力</h2>
        </div>
        <a class="close-x" href="class_vender_list.html">✕</a>
      </div>
      <div class="modal-body">
        <div class="filter-panel" style="margin-bottom: 16px;">
          <div class="field"><label>キーワード検索（コース）</label><input type="text" class="field-control-input" id="keyword" placeholder="コースコード・コース名で検索"></div>
          <div class="field"><label>依頼残</label><div class="control js-select" id="fitFilter" data-options="すべて,なし,あり" data-class-map='{"なし":"is-green","あり":"is-orange"}'>すべて<span class="caret">▾</span></div></div>
          <div class="search-btn">検索</div>
        </div>
        <div class="form-field" style="width: 260px;">
          <label>講師ベンダー<span class="req">必須</span></label>
          <div class="form-control js-select" id="requestVendor">選択してください<span class="caret">▾</span></div>
        </div>
        <div class="table-card" style="height: auto; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column;">
          <div class="table-meta"><div class="count">全 <b id="printCount">0</b> 件</div></div>
          <div class="scroll-outer" id="scrollArea" style="overflow: auto; flex: 1 1 auto; min-height: 0;">
          <table>
            <thead>
              <tr>
                <th style="width:44px;"><input type="checkbox" id="checkAll" checked></th>
                <th>年度</th>
                <th>コース名 / コースコード</th>
                <th>レッスンNo</th>
                <th>開始日</th>
                <th>終了日</th>
                <th>予定講師数（メイン）</th>
                <th>予定講師数（サブ）</th>
                <th>依頼講師数（メイン）</th>
                <th>依頼講師数（サブ）</th>
                <th>依頼残</th>
              </tr>
            </thead>
            <tbody id="printBody"></tbody>
          </table>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <a class="search-btn" href="class_vender_list.html">キャンセル</a>
        <div class="btn primary" id="printBtn">登壇依頼書を出力</div>
      </div>
    </div>
  </div>
  <div class="print-area" id="printArea"></div>
</div>
<script src="js/storage/location/store/location-store.js"></script>
<script src="js/storage/staff/store/staff-store.js"></script>
<script src="js/storage/teacher-vender/store/teacher-vender-store.js"></script>
<script src="js/storage/course/store/course-store.js"></script>
<script src="js/storage/project/store/project-store.js"></script>
<script src="js/storage/class/store/class-store.js"></script>
<script src="js/storage/vender-assign/store/vender-assign-store.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script src="js/storage/vender-assign/screens/vender-assign-print.js"></script>
<script src="js/filter-collapse.js"></script>
<script src="js/select.js" defer></script>
<script src="js/sidebar-toggle.js" defer></script>
<script src="js/column-resize.js" defer></script>
<script src="js/message-dialog.js"></script>
</body>
</html>

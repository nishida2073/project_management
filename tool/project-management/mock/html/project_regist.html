<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/style_regist.css">
</head>
<body>
<div class="app">
  <iframe src="sidebar.html?active=project" width="220" height="1040" style="border:0; flex-shrink:0; display:block;" title="サイドバー"></iframe>
  <div class="overlay">
    <div class="modal">
      <div class="modal-header">
        <div>
          <h2>案件登録</h2>
        </div>
        <a class="close-x" href="project_list.html">✕</a>
      </div>
      <div class="modal-body">
        <div class="form-field">
          <label>年度<span class="req">必須</span></label>
          <div class="form-control js-select" id="projectYear" data-options="2024年度,2025年度,2026年度,2027年度"><span class="caret">▾</span></div>
        </div>
        <div class="form-field"></div>
        <div class="form-field">
          <label>案件コード</label>
          <div class="form-control readonly" id="projectCode"></div>
        </div>
        <div class="form-field"></div>
        <div class="form-field">
          <label>販売区分<span class="req">必須</span></label>
          <div class="radio-group">
            <label class="radio-option"><input type="radio" name="salesType" value="外販"><span class="radio-dot"></span><span class="tag teal">外販</span></label>
            <label class="radio-option"><input type="radio" name="salesType" value="内販"><span class="radio-dot"></span><span class="tag violet">内販</span></label>
          </div>
        </div>
        <div class="form-field"></div>
        <div class="form-field">
          <label>参加区分<span class="req">必須</span></label>
          <div class="radio-group">
            <label class="radio-option"><input type="radio" name="participationType" value="受託"><span class="radio-dot"></span><span class="tag blue">受託</span></label>
            <label class="radio-option"><input type="radio" name="participationType" value="公募"><span class="radio-dot"></span><span class="tag orange">公募</span></label>
          </div>
        </div>
        <div class="form-field full">
          <label>案件名<span class="req">必須</span></label>
          <input type="text" class="form-control" id="projectName">
        </div>
        <div class="form-field">
          <label>実施開始月<span class="req">必須</span></label>
          <div class="form-control js-month" id="startMonth"><span class="caret">▾</span></div>
        </div>
        <div class="form-field"></div>
        <div class="form-field full">
          <label>顧客名</label>
          <div class="form-control js-select" id="customer" data-options="NTTデータ金融,株式会社ABC商事,DEFホールディングス,CECトラスト,NTTデータUNIV,グループ各社,（公募）"><span class="caret">▾</span></div>
        </div>
        <div class="form-section">管理担当者</div>
        <div class="form-field">
          <label>PM<span class="req">必須</span></label>
          <div class="form-control js-select" id="pm" data-options="山口 直人,田中 誠,高橋 健,伊藤 美咲,渡辺 直樹,佐藤 一郎"><span class="caret">▾</span></div>
        </div>
        <div class="form-field"></div>
        <div class="form-field full">
          <label>PL（複数選択可）</label>
          <div class="chip-box js-chip-select" id="plBox" data-options="細野 恵美,木村 隆,中島 拓海,小林 由美,松本 健二,市村 拓也,岡田 沙織" data-chip-class="orange">
            <span class="chip-add">追加</span>
          </div>
        </div>
        <div class="form-section">その他</div>
        <div class="form-field full">
          <label>備考</label>
          <textarea class="form-control textarea auto-grow" data-min="68" id="memo" placeholder="例）先方都合により日程変更の可能性あり"></textarea>
        </div>
        <div class="form-field toggle-field">
          <label>稼働状況</label>
          <div class="toggle-row" id="statusRow"><div class="toggle" id="statusToggle"><div class="knob"></div></div><span id="statusLabel">稼働中</span></div>
        </div>
      </div>
      <div class="modal-footer">
        <a class="search-btn" href="project_list.html">キャンセル</a>
        <div id="saveBtn" class="btn primary">保存</div>
      </div>
    </div>
  </div>
</div>
${tags%
}
<script src="js/storage/staff/store/staff-store.js"></script>
<script src="js/storage/staff-role/store/staff-role-store.js"></script>
<script src="js/storage/job-type/store/job-type-store.js"></script>
<script src="js/storage/position/store/position-store.js"></script>
<script src="js/storage/participation-type/store/participation-type-store.js"></script>
<script src="js/storage/sales-type/store/sales-type-store.js"></script>
<script src="js/storage/customer/store/customer-store.js"></script>
<script src="js/storage/project/store/project-store.js"></script>
<script src="js/storage/project/screens/project-editor.js"></script>
<script src="js/storage/project/entry/project-regist.js"></script>
<script src="js/select.js" defer></script>
<script src="js/storage/holiday/store/holiday-store.js"></script>
<script src="js/datepicker.js" defer></script>
<script src="js/chip-select.js" defer></script>
<script src="js/sidebar-toggle.js" defer></script>
<script src="js/toggle.js" defer></script>
<script src="js/message-dialog.js"></script>
<script src="js/memo-area.js" defer></script>
</body>
</html>

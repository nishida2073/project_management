<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/style_regist.css">
</head>
<body>
<div class="app">
  <div id="sidebar-slot" data-active="project"></div>
  <script src="js/access.js"></script>
<script src="js/sidebar.js"></script>
  <div class="overlay">
    <div class="modal">
      <div class="modal-resize"></div>
      <div class="modal-header">
        <div>
          <h2 class="modal-header-title">案件登録</h2>
        </div>
        <a class="close-x" href="project_list.html">✕</a>
      </div>
      <div class="modal-body">
        <div class="form-field">
          <label>年度<span class="req">必須</span></label>
          <div class="form-control js-select" id="projectYear" data-options="2024,2025,2026,2027"><span class="caret">▾</span></div>
        </div>
        <div class="form-field"></div>
        <div class="form-field">
          <label>案件コード</label>
          <div class="form-control readonly" id="projectCode"></div>
        </div>
        <div class="form-field"></div>
        <div class="form-field">
          <label>販売区分<span class="req">必須</span></label>
          <div class="radio-group">
            <div class="master-radio" data-master-radio="SalesTypeStore" data-radio-name="salesType"></div>
          </div>
        </div>
        <div class="form-field"></div>
        <div class="form-field">
          <label>参加区分<span class="req">必須</span></label>
          <div class="radio-group">
            <div class="master-radio" data-master-radio="ParticipationTypeStore" data-radio-name="participationType"></div>
          </div>
        </div>
        <div class="form-field full">
          <label>案件名<span class="req">必須</span></label>
          <input type="text" class="form-control" id="projectName">
        </div>
        <div class="form-field">
          <label>実施開始月<span class="req">必須</span></label>
          <div class="form-control js-month" id="startMonth"><span class="caret">▾</span></div>
        </div>
        <div class="form-field"></div>
        <div class="form-field full">
          <label>顧客名<span class="req">必須</span></label>
          <div class="form-control js-select" id="customer" data-options=""><span class="caret">▾</span></div>
        </div>
        <div class="form-section">管理担当者</div>
        <div class="form-field">
          <label>PM<span class="req">必須</span></label>
          <div class="form-control js-select" id="pm" data-options=""><span class="caret">▾</span></div>
        </div>
        <div class="form-field"></div>
        <div class="form-field full">
          <label>PL（複数選択可）</label>
          <div class="chip-box js-chip-select" id="plBox" data-options="" data-chip-class="orange">
            <span class="chip-add">追加</span>
          </div>
        </div>
        <div class="form-section">その他</div>
        <div class="form-field full">
          <label>備考</label>
          <textarea class="form-control textarea auto-grow" data-min="68" id="memo" placeholder="例）先方都合により日程変更の可能性あり"></textarea>
        </div>
        <div class="form-field toggle-field">
          <label>稼働状態</label>
          <div class="toggle-row" id="statusRow"><div class="toggle" id="statusToggle"><div class="knob"></div></div><span id="statusLabel" data-status="ACTIVE"></span></div>
        </div>
      </div>
      <div class="modal-footer">
        <a class="nav-btn" href="project_list.html">キャンセル</a>
        <div id="saveBtn" class="btn primary">保存</div>
      </div>
    </div>
  </div>
</div>
<script src="js/storage/operating-status/store/operating-status-store.js"></script>
<script src="js/storage/staff-vender/store/staff-vender-store.js"></script>
<script src="js/html-util.js"></script>
<script src="js/storage/staff/store/staff-store.js"></script>
<script src="js/storage/staff-role/store/staff-role-store.js"></script>
<script src="js/storage/job-type/store/job-type-store.js"></script>
<script src="js/storage/position/store/position-store.js"></script>
<script src="js/storage/participation-type/store/participation-type-store.js"></script>
<script src="js/storage/sales-type/store/sales-type-store.js"></script>
<script src="js/storage/customer/store/customer-store.js"></script>
<script src="js/storage/project/store/project-store.js"></script>
<script src="js/master-options.js"></script>
<script src="js/storage/affiliation/store/affiliation-store.js"></script>
<script src="js/storage/project/screens/project-editor.js"></script>
<script src="js/storage/project/entry/project-regist.js"></script>
<script src="js/select.js" defer></script>
<script src="js/storage/closed-day/store/closed-day-store.js"></script>
<script src="js/datepicker.js" defer></script>
<script src="js/chip-select.js" defer></script>
<script src="js/toggle.js" defer></script>
<script src="js/message-dialog.js"></script>
<script src="js/memo-area.js" defer></script>
<script src="js/modal-resize.js"></script>
</body>
</html>

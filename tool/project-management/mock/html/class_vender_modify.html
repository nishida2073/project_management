<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/class_modify.css">
</head>
<body>
<div class="app">
  <iframe src="sidebar.html?active=assign" width="220" height="1040" style="border:0; flex-shrink:0; display:block;" title="サイドバー"></iframe>
  <div class="main">
    <div class="topbar"></div>
    <div class="content"><div class="toolbar"><h1>登壇管理一覧</h1></div><div class="table-card"></div></div>
  </div>
  <div class="overlay">
    <div class="modal">
      <div class="modal-header">
        <div>
          <h2>登壇管理編集</h2>
          <div class="sub" id="subLine">登壇管理を編集します</div>
        </div>
        <a class="close-x" href="class_vender_list.html">✕</a>
      </div>
      <div class="modal-body">
        <div class="form-section">メイン講師</div>
        <div class="form-field">
          <label>講師ベンダー名<span class="req">必須</span></label>
          <div class="form-control js-select" id="mainVendor">選択してください<span class="caret">▾</span></div>
        </div>
        <div class="form-field">
          <label>講師名<span class="req">必須</span></label>
          <div class="form-control js-select" id="mainStaff">選択してください<span class="caret">▾</span></div>
        </div>
        <div class="form-section">サブ講師</div>
        <div class="form-field full">
          <div class="sub-grid sub-row-header"><span>講師ベンダー名</span><span>講師名</span></div>
          <div class="sub-list" id="subList"></div>
          <div class="search-btn add-row" id="addSub">サブ講師を追加</div>
        </div>
        <div class="form-section">聴講</div>
        <div class="form-field">
          <label>聴講ベンダー名</label>
          <div class="form-control js-select" id="attendeeVendor">選択してください<span class="caret">▾</span></div>
        </div>
        <div class="form-field">
          <label>聴講者名</label>
          <div class="form-control js-select" id="attendee">選択してください<span class="caret">▾</span></div>
        </div>
        <div class="form-section">動機付け</div>
        <div class="form-field">
          <label>動機付け会社名</label>
          <div class="form-control js-select" id="motivationVendor">選択してください<span class="caret">▾</span></div>
        </div>
        <div class="form-field">
          <label>動機付け担当者名</label>
          <div class="form-control js-select" id="motivationStaff">選択してください<span class="caret">▾</span></div>
        </div>
      </div>
      <div class="modal-footer">
        <a class="search-btn" href="class_vender_list.html">キャンセル</a>
        <div id="saveBtn" class="btn primary">保存する</div>
      </div>
    </div>
  </div>
</div>
<script src="js/storage/location/store/location-store.js"></script>
<script src="js/storage/staff/store/staff-store.js"></script>
<script src="js/storage/teacher-vender/store/teacher-vender-store.js"></script>
<script src="js/storage/course/store/course-store.js"></script>
<script src="js/storage/project/store/project-store.js"></script>
<script src="js/storage/class/store/class-store.js"></script>
<script src="js/storage/vender-assign/store/vender-assign-store.js"></script>
<script src="js/storage/vender-assign/screens/vender-assign-editor.js"></script>
<script src="js/storage/vender-assign/entry/vender-assign-modify.js"></script>
<script src="js/select.js" defer></script>
<script src="js/sidebar-toggle.js" defer></script>
</body>
</html>

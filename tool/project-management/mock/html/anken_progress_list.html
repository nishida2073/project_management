<body>
<div class="app">

                <th style="min-width:120px;">①開発会議</th>

                <th style="min-width:120px;">⑤受注承認会議</th>
                <th style="min-width:120px;">⑥経営会議<br>(受注報告)</th>
                <th style="min-width:120px;">⑦取締役会議<br>(受注報告)</th>

          </table>
        </div>
        <div class="pagination">
          <div class="page-btn">‹</div><div class="page-btn active">1</div><div class="page-btn">2</div><div class="page-btn">3</div><div class="page-btn">…</div><div class="page-btn">3</div><div class="page-btn">›</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
function chip(status, plan, actual){
  if (status === 'na') return '<div class="status-chip"><span class="badge na">実施対象</span></div>';
  var delayed = /-delay$/.test(status);
  var baseStatus = status.replace('-delay', '');
  var cls = {wait:'wait', progress:'progress', done:'done'}[baseStatus];
  var label = {wait:'実施前', progress:'実施中', done:'完了'}[baseStatus];
  var dateLine = actual ? ('<span>予定 '+plan+'</span><span>実績 '+actual+'</span>') : ('<span>予定 '+plan+'</span>');
  var delayMark = delayed ? '<span class="badge delay">⚠ 遅延</span>' : '';
  return '<div class="status-chip"><div class="badge-row"><span class="badge '+cls+'">'+label+'</span>'+delayMark+'</div><div class="dates">'+dateLine+'</div></div>';
}
function overall(status){
  var cls = {wait:'wait', progress:'progress', done:'done', delay:'delay'}[status];
  var label = {wait:'実施前', progress:'実施中', done:'完了', delay:'遅延あり'}[status];
  return '<span class="overall '+cls+'">'+label+'</span>';
}
var rows = [
 {year:'2026年度', id:'PJ-2601', name:'G新人研修（NTTデータ金融共催）', customer:'NTTデータ金融', pm:'細野 恵美 / 山口 直人', month:'2026/09', overall:'progress',
  steps:['done','na','na','done','na','done','done','progress','wait','wait','wait','wait','wait']},
 {year:'2026年度', id:'PJ-2602', name:'ビジネス基礎研修 定期開催', customer:'株式会社ABC商事', pm:'木村 隆 / 田中 誠', month:'2026/09', overall:'delay',
  steps:['done','wait-delay','wait','wait','wait','wait','wait','wait','wait','wait','wait','wait','wait']},
 {year:'2026年度', id:'PJ-2603', name:'次世代リーダー育成プログラム', customer:'DEFホールディングス', pm:'小林 由美 / 高橋 健・中島 拓海', month:'2026/10', overall:'progress',
  steps:['done','done','progress','wait','wait','wait','wait','wait','wait','wait','wait','wait','wait']},
 {year:'2026年度', id:'PJ-2604', name:'グローバル基礎コース 公募', customer:'（公募）', pm:'小林 由美 / 伊藤 美咲', month:'2026/09', overall:'done',
  steps:['done','done','done','na','na','done','na','done','done','done','done','progress','wait']},
 {year:'2026年度', id:'PJ-2605', name:'マネジメント基礎研修', customer:'CECトラスト', pm:'松本 健二 / 渡辺 直樹', month:'2026/10', overall:'wait',
  steps:['wait','wait','wait','wait','wait','wait','wait','wait','wait','wait','wait','wait','wait']},
 {year:'2026年度', id:'PJ-2606', name:'システム基盤実践研修', customer:'NTTデータUNIV', pm:'市村 拓也 / 山口 直人', month:'2026/09', overall:'delay',
  steps:['done','done','done','done','wait-delay','wait','wait','wait','wait','wait','wait','wait','wait']},
 {year:'2026年度', id:'PJ-2607', name:'新人フォローアップ研修', customer:'グループ各社', pm:'岡田 沙織 / 佐藤 一郎', month:'2026/11', overall:'progress',
  steps:['done','progress','wait','wait','wait','wait','wait','wait','wait','wait','wait','wait','wait']}
];
var dates = ['08/10','08/20','08/25','08/29','09/03','09/08','09/10','09/17','09/24','10/05','10/20','11/10','11/25'];
var tbody = document.getElementById('tbody');
rows.forEach(function(r){
  var tr = document.createElement('tr');
  var html = '';
  html += '<td class="sticky" style="left:0;">'+r.year+'</td>';
  html += '<td class="sticky" style="left:90px; font-weight:700;">'+r.id+'</td>';
  html += '<td class="sticky" style="left:240px;">'+r.name+'</td>';
  html += '<td class="sticky" style="left:460px;">'+r.customer+'</td>';
  html += '<td class="sticky" style="left:570px;">'+r.pm+'</td>';
  html += '<td class="sticky" style="left:770px;">'+r.month+'</td>';
  html += '<td class="sticky shadow" style="left:870px;">'+overall(r.overall)+'</td>';
  r.steps.forEach(function(s, i){
    var actual = (s==='done') ? dates[i] : '';
    html += '<td>'+chip(s, dates[i], actual)+'</td>';
  });
  html += '<td class="row-actions"><a class="link-btn" href="anken_progress_modify.html">編集</a></td>';
  tr.innerHTML = html;
  tbody.appendChild(tr);
});

if (location.search.indexOf('scrolled=1') !== -1) {
  document.getElementById('scrollArea').scrollLeft = 1000;
}
</script>
<script src="js/select.js" defer></script>

<script>
(function () {
  var table = document.querySelector('#scrollArea table');
  var thead = table.querySelector('thead');
  var tbody = table.querySelector('tbody');
  var allHeads = Array.prototype.slice.call(thead.querySelectorAll('tr th'));
  var heads = Array.prototype.slice.call(thead.querySelectorAll('tr th.sticky'));
  var MIN = 5;
  var fixed = false;
  function updateTableWidth() {
    var sum = allHeads.reduce(function (a, th) { return a + th.getBoundingClientRect().width; }, 0);
    table.style.width = sum + 'px';
  }
  function fixLayout() {
    if (fixed || !tbody.querySelector('tr')) return;
    fixed = true;
    allHeads.forEach(function (th) { th.style.width = th.getBoundingClientRect().width + 'px'; });
    table.style.tableLayout = 'fixed';
    updateTableWidth();
  }
  function layout() {
    fixLayout();
    var lefts = [];
    var acc = 0;
    heads.forEach(function (th, i) {
      lefts[i] = acc;
      th.style.left = acc + 'px';
      acc += th.getBoundingClientRect().width;
    });
    tbody.querySelectorAll('tr').forEach(function (tr) {
      for (var i = 0; i < heads.length; i++) {
        var td = tr.children[i];
        if (td) td.style.left = lefts[i] + 'px';
      }
    });
    updateTableWidth();
  }
  heads.forEach(function (th, idx) {
    th.style.position = 'sticky';
    var h = document.createElement('div');
    h.className = 'col-resize';
    th.appendChild(h);
    h.addEventListener('mousedown', function (e) {
      e.preventDefault();
      var startX = e.clientX;
      var group = e.shiftKey ? heads.slice(0, idx + 1) : [th];
      var startWs = group.map(function (g) { return g.getBoundingClientRect().width; });
      var startTotal = startWs.reduce(function (a, b) { return a + b; }, 0);
      var startTable = allHeads.reduce(function (a, th) { return a + th.getBoundingClientRect().width; }, 0);
      function move(ev) {
        var minStart = Math.min.apply(null, startWs);
        var target = Math.max(startTotal * MIN / minStart, startTotal + ev.clientX - startX);
        var f = target / startTotal;
        group.forEach(function (g, j) {
          var w = (startWs[j] * f) + 'px';
          g.style.width = g.style.minWidth = g.style.maxWidth = w;
        });
        var nonSticky = allHeads.filter(function (th) { return !th.classList.contains('sticky'); });
        if (nonSticky.length) {
          var lastTh = nonSticky[nonSticky.length - 1];
          var sumNow = allHeads.reduce(function (a, th) { return a + th.getBoundingClientRect().width; }, 0);
          lastTh.style.width = (lastTh.getBoundingClientRect().width + startTable - sumNow) + 'px';
        }
        layout();
      }
      function up() {
        document.removeEventListener('mousemove', move);
        document.removeEventListener('mouseup', up);
      }
      document.addEventListener('mousemove', move);
      document.addEventListener('mouseup', up);
    });
  });
  new MutationObserver(layout).observe(tbody, { childList: true });
  layout();
})();
</script>
</body>
</html>

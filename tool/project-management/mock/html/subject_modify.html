<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/subject_modify.css">
</head>
<body>
<div class="app">
  <iframe src="sidebar.html?active=master&sub=subject" width="220" height="1040" style="border:0; flex-shrink:0; display:block;" title="サイドバー"></iframe>
  <div class="overlay">
    <div class="modal">
      <div class="modal-header">
        <div>
          <h2>科目編集</h2>
          <div class="sub" id="subLine">科目の情報を編集します</div>
        </div>
        <a class="close-x" href="subject_list.html">✕</a>
      </div>
      <div class="modal-body">
        <div class="form-field">
          <label>科目コード</label>
          <div class="form-control readonly" id="subjectCode"></div>
        </div>
        <div class="form-field"></div>
        <div class="form-field full">
          <label>科目区分<span class="req">必須</span></label>
          <div class="radio-group" id="subjectTypeGroup"></div>
        </div>
        <div class="form-field full">
          <label>科目名<span class="req">必須</span></label>
          <input type="text" class="form-control" id="subjectName">
        </div>
        <div class="form-field full">
          <label>版<span class="req">必須</span></label>
          <div class="chip-box" id="subjectVersions"><span class="chip-add">版を追加</span></div>
        </div>
        <div class="form-field toggle-field">
          <label>稼働状況</label>
          <div class="toggle-row" id="statusRow"><div class="toggle" id="statusToggle"><div class="knob"></div></div><span id="statusLabel">稼働中</span></div>
        </div>
      </div>
      <div class="modal-footer">
        <a class="search-btn" href="subject_list.html">キャンセル</a>
        <div id="saveBtn" class="btn primary">保存</div>
      </div>
    </div>
  </div>
</div>
<script src="js/storage/subject-type/store/subject-type-store.js"></script>
<script src="js/storage/subject/store/subject-store.js"></script>
<script src="js/storage/subject/screens/subject-editor.js"></script>
<script src="js/storage/subject/entry/subject-modify.js"></script>
<script src="js/select.js" defer></script>
<script src="js/toggle.js" defer></script>
<script src="js/sidebar-toggle.js" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/style_vender_assign.css">
</head>
<body>
<div class="app">
  <div id="sidebar-slot" data-active="assign"></div>
  <script src="js/access.js"></script>
<script src="js/sidebar.js"></script>
  <div class="main">
    <div id="topbar-slot" data-title="登壇依頼一覧"></div>
    <script src="js/topbar.js"></script>
    <div class="content">
            <div class="filter-panel">
        <div class="field"><label>実施状況</label><div class="control small js-select" data-practice-options data-match-class="col-practice" data-practice-default="BEFORE"><span class="caret">▾</span></div></div>
        <div class="field"><label>年度</label><div class="control small js-select" data-options="すべて,2024,2025,2026,2027">すべて<span class="caret">▾</span></div></div>
        <div class="field"><label>キーワード検索（コース）</label><input type="text" class="field-control-input" placeholder="コースコード・コース名で検索"></div>
        <div class="field"><label>クラス区分</label><div class="control small js-select" data-master-options="ClassTypeStore" data-match-attr="data-class-types">すべて<span class="caret">▾</span></div></div>
        <div class="field"><label>開始日</label><div class="control small js-date"><span class="caret">▾</span></div></div>
        <div class="tilde">〜</div>
        <div class="field"><label>終了日</label><div class="control small js-date"><span class="caret">▾</span></div></div>
        <div class="field"><label>講師ベンダー</label><div class="control wide js-select" id="vendorFilter" data-match-attr="data-vendors" data-options="すべて">すべて<span class="caret">▾</span></div></div>
        <div class="nav-btn">検索</div>
        <div class="nav-btn" id="resetFilter">リセット</div>
      </div>
      <div class="list-toolbar">
        <a class="nav-btn" href="vender_assign_request_modify.html">依頼枠更新</a>
        <a class="nav-btn" href="vender_assign_export.html">依頼</a>
        <a class="nav-btn" id="importLink" href="vender_assign_import.html">反映</a>
        <a class="nav-btn" href="vender_assign_request_history.html">履歴</a>
      </div>
      <div class="table-card">
        <div class="table-meta">
          <div style="display:flex; align-items:center; gap:16px;">
            <div class="count"><b id="venderCount">0</b> 件</div>
            <div class="field" style="flex-direction:row; align-items:center; gap:8px;"><label>表示形式</label><div class="seg" id="viewTabs"><button type="button" class="seg-opt is-active" data-view="table">表</button><button type="button" class="seg-opt" data-view="calendar">日ごと</button></div></div>
          </div>
        </div>
        <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th class="sticky">実施状況</th>
              <th class="sticky">顧客</th>
              <th class="sticky">年度</th>
              <th class="sticky">コース</th>
              <th class="sticky">レッスンNo</th>
              <th class="sticky">クラス区分</th>
              <th class="sticky">開始日</th>
              <th class="sticky">終了日</th>
              <th>日数</th>
              <th>予定講師数<br>（メイン）</th>
              <th class="no-sort">講師（メイン）</th>
              <th>予定講師数<br>（サブ）</th>
              <th class="no-sort">講師（サブ）</th>
              <th>予定講師数<br>（特別）</th>
              <th class="no-sort">講師（特別）</th>
              <th class="no-sort">聴講</th>
              <th class="no-sort">動機付け</th>
              <th class="no-sort">契約番号（メイン講師）</th>
              <th class="no-sort">契約番号（サブ講師）</th>
              <th class="no-sort">cectrust文書管理番号</th>
              <th class="no-sort">備考</th>
              <th class="col-actions">操作</th>
            </tr>
          </thead>
          <tbody id="venderBody"></tbody>
        </table>
        </div>
        <div id="calendarView" class="cal-view" style="display:none;"></div>
        <div class="pagination"></div>
      </div>
    </div>
  </div>
</div>
<script src="js/storage/practice-status/store/practice-status-store.js"></script>
<script src="js/storage/operating-status/store/operating-status-store.js"></script>
<script src="js/html-util.js"></script>
<script src="js/storage/location/store/location-store.js"></script>
<script src="js/storage/teacher-vender/store/teacher-vender-store.js"></script>
<script src="js/storage/course/store/course-store.js"></script>
<script src="js/storage/project/store/project-store.js"></script>
<script src="js/storage/class/store/class-store.js"></script>
<script src="js/storage/slot-status/store/slot-status-store.js"></script>
<script src="js/storage/vender-assign/store/vender-assign-store.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script src="js/message-dialog.js"></script>
<script src="js/storage/customer/store/customer-store.js"></script>
<script src="js/storage/motivation-company-type/store/motivation-company-type-store.js"></script>
<script src="js/scroll-keep.js"></script>
<script src="js/day-table.js"></script>
<script src="js/storage/vender-assign/screens/vender-assign-lines.js"></script>
<script src="js/storage/closed-day/store/closed-day-store.js"></script>
<script src="js/storage/custom-attribute/store/custom-attribute-store.js"></script>
<script src="js/storage/custom-attribute/screens/custom-attribute-fields.js"></script>
<script src="js/storage/class-type/store/class-type-store.js"></script>
<script src="js/master-options.js"></script>
<script src="js/storage/vender-assign/screens/vender-assign-list.js"></script>
<script src="js/filter-memory.js" defer></script>
<script src="js/select.js" defer></script>
<script src="js/datepicker.js" defer></script>
<script src="js/table-sort.js" defer></script>
<script src="js/column-resize.js" defer></script>
<script src="js/list-filter-auto.js"></script>
<script src="js/list-filter.js"></script>
<script src="js/pagination.js"></script>
<script src="js/filter-collapse.js"></script>
</body>
</html>

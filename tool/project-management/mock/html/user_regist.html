<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/user_regist.css">
</head>
<body>
<div class="app">
  <iframe src="sidebar.html?active=master&sub=user" width="220" height="1040" style="border:0; flex-shrink:0; display:block;" title="サイドバー"></iframe>
  <div class="overlay">
    <div class="modal">
      <div class="modal-header">
        <div>
          <h2>ユーザー登録</h2>
          <div class="sub" id="subLine">新規のユーザーアカウントを登録します</div>
        </div>
        <a class="close-x" href="user_list.html">✕</a>
      </div>
      <div class="modal-body">
        <div class="form-field">
          <label>ユーザーコード</label>
          <div class="form-control readonly" id="userCode"></div>
        </div>
        <div class="form-field"></div>
        <div class="form-field">
          <label>ユーザー名<span class="req">必須</span></label>
          <input type="text" class="form-control" id="userName">
        </div>
        <div class="form-field full">
          <label>メールアドレス（ログインID）<span class="req">必須</span></label>
          <input type="email" class="form-control" id="userEmail">
        </div>
        <div class="form-field full" id="passwordField">
          <label>初期パスワード<span class="req">必須</span></label>
          <input type="password" class="form-control" id="userPassword" placeholder="編集時は空欄のまま変更しません">
        </div>
        <div class="form-field">
          <label>権限<span class="req">必須</span></label>
          <div class="radio-group" id="authorityGroup"></div>
        </div>
        <div class="form-field toggle-field">
          <label>稼働状況</label>
          <div class="toggle-row" id="statusRow"><div class="toggle" id="statusToggle"><div class="knob"></div></div><span id="statusLabel">稼働中</span></div>
        </div>
      </div>
      <div class="modal-footer">
        <a class="search-btn" href="user_list.html">キャンセル</a>
        <div id="saveBtn" class="btn primary">保存</div>
      </div>
    </div>
  </div>
</div>
<script src="js/storage/user-role/store/user-role-store.js"></script>
<script src="js/storage/user/store/user-store.js"></script>
<script src="js/storage/user/screens/user-editor.js"></script>
<script src="js/storage/user/entry/user-regist.js"></script>
<script src="js/select.js" defer></script>
<script src="js/toggle.js" defer></script>
<script src="js/sidebar-toggle.js" defer></script>
</body>
</html>

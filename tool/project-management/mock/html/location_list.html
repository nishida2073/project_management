<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/style_list.css">
</head>
<body>
<div class="app">
  <iframe src="sidebar.html?active=master&sub=location" width="220" height="1040" style="border:0; flex-shrink:0; display:block;" title="サイドバー"></iframe>

  <div class="main">
    <div class="topbar">
      <div class="crumb-block">
        <div class="crumb">マスタ管理<span>／</span>ロケーション</div>
        <p class="crumb-sub">ロケーション情報を管理します</p>
      </div>
      <div class="user"><span>山田 太郎（BD事業部）</span><div class="avatar">山田</div></div>
    </div>

    <div class="content">
      <div class="toolbar">
        <div class="left">
          <h1>ロケーション一覧</h1>
        </div>
        <div class="btn-group">
          <a class="search-btn" href="location_regist.html">新規登録</a>
        </div>
      </div>

      <div class="filter-panel">
        <div class="field"><label>キーワード検索</label><input type="text" class="field-control-input" placeholder="ロケーションコード・ロケーション名で検索"></div>
        <div class="field"><label>ロケーション区分</label><div class="control small js-select" data-options="すべて,駒場,成城,外部会場">すべて<span class="caret">▾</span></div></div>
        <div class="field"><label>稼働状況</label><div class="control small js-select" data-options="すべて,稼働中,停止中">すべて<span class="caret">▾</span></div></div>
        <div class="search-btn">検索</div>
      </div>

      <div class="table-card">
        <div class="table-meta"><div class="count">全 <b id="locationCount">0</b> 件</div></div>
        <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>ロケーションコード</th>
              <th>ロケーション区分</th>
              <th>ロケーション名</th>
              <th>電話番号</th>
              <th>住所</th>
              <th>稼働状況</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="locationBody"></tbody>
        </table>
        </div>
        <div class="pagination">
          <div class="page-btn">‹</div><div class="page-btn active">1</div><div class="page-btn">›</div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="js/select.js" defer></script>
<script src="js/sidebar-toggle.js" defer></script>
<script src="js/column-resize.js" defer></script>
<script src="js/storage/location-type/store/location-type-store.js"></script>
<script src="js/storage/location/store/location-store.js"></script>
<script src="js/storage/location/screens/location-list.js"></script>
<script src="js/list-filter.js"></script><script src="js/pagination.js"></script>
<script src="js/filter-collapse.js"></script>
</body>
</html>

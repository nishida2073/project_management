<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/style_progress.css">
<link rel="stylesheet" href="css/style_tag.css">
</head>
<body>
<div class="app">
  <div id="sidebar-slot" data-active="project-progress"></div>
  <script src="js/sidebar.js"></script>
  <div class="main">
    <div class="topbar">
      <div class="crumb-block">
        <div class="crumb">案件進捗一覧</div>
      </div>
      <div class="user"><span>山田 太郎（BD事業部）</span><div class="avatar">山田</div></div>
    </div>
    <div class="content">
            <div class="filter-panel">
        <div class="field"><label>年度</label><div class="control small js-select" id="fYear" data-hide-class="col-year" data-options="すべて,2024,2025,2026,2027">すべて<span class="caret">▾</span></div></div>
        <div class="field"><label>キーワード検索</label><input type="text" id="fKeyword" class="field-control-input" placeholder="案件コード・案件名で検索"></div>
        <div class="field"><label>顧客名</label><div class="control wide js-select" id="fCustomer" data-hide-class="col-customer" data-options="すべて">すべて<span class="caret">▾</span></div></div>
        <div class="field"><label>管理担当者</label><div class="control js-select" id="fManager" data-hide-class="col-manager" data-options="すべて">すべて<span class="caret">▾</span></div></div>
        <div class="field"><label>全体進捗</label><div class="control small js-select" id="fOverall" data-hide-class="col-overall" data-task-progress-options>すべて<span class="caret">▾</span></div></div>
        <div class="search-btn" id="fSearch">検索</div>
        <div class="search-btn" id="resetFilter">リセット</div>
      </div>
      <div class="table-card">
        <div class="table-meta"><div class="count"><b id="projectCount">0</b> 件</div></div>
        <div class="table-scroll" id="scrollArea">
        <table>
          <thead>
            <tr id="headRow">
              <th class="sticky col-year">年度</th>
              <th class="sticky">案件コード</th>
              <th class="sticky">案件名</th>
              <th class="sticky col-customer">顧客名</th>
              <th class="sticky col-manager">管理担当者</th>
              <th class="sticky">実施開始月</th>
              <th class="sticky col-overall">全体進捗</th>
              <th class="col-actions">操作</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
        </div>
        <div class="pagination"></div>
      </div>
    </div>
  </div>
</div>
<script src="js/storage/job-type/store/job-type-store.js"></script>
<script src="js/storage/staff-role/store/staff-role-store.js"></script>
<script src="js/storage/step-status/store/step-status-store.js"></script>
<script src="js/storage/task-progress/store/task-progress-store.js"></script>
<script src="js/storage/operating-status/store/operating-status-store.js"></script>
<script src="js/html-util.js"></script>
<script src="js/storage/customer/store/customer-store.js"></script>
<script src="js/storage/staff/store/staff-store.js"></script>
<script src="js/storage/project/store/project-store.js"></script>
<script src="js/storage/project-progress/store/project-progress-store.js"></script>
<script src="js/list-filter-auto.js"></script>
<script src="js/storage/project-progress/screens/project-progress-list.js"></script>
<script src="js/select.js" defer></script>
<script src="js/storage/holiday/store/holiday-store.js"></script>
<script src="js/datepicker.js" defer></script>
<script src="js/table-sort.js" defer></script>
<script src="js/column-resize.js" defer></script>

<script src="js/pagination.js"></script>
<script src="js/filter-collapse.js"></script>
<script src="js/filter-memory.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/style_list.css">
</head>
<body>
<div class="app">
  <iframe src="sidebar.html?active=project-progress" width="220" height="1040" style="border:0; flex-shrink:0; display:block;" title="サイドバー"></iframe>
  <div class="main">
    <div class="topbar">
      <div class="crumb-block">
        <div class="crumb">案件管理<span>／</span>進捗管理</div>
        <p class="crumb-sub">案件の進捗を管理します</p>
      </div>
      <div class="user"><span>山田 太郎（BD事業部）</span><div class="avatar">山田</div></div>
    </div>
    <div class="content">
      <div class="toolbar">
        <div class="left">
          <h1>案件進捗一覧</h1>
        </div>
        <div class="btn-group">
        </div>
      </div>
      <div class="filter-panel">
        <div class="field"><label>年度</label><div class="control small js-select" id="fYear" data-options="すべて,2024年度,2025年度,2026年度,2027年度">すべて<span class="caret">▾</span></div></div>
        <div class="field"><label>キーワード検索</label><input type="text" id="fKeyword" class="field-control-input" placeholder="案件コード・案件名で検索"></div>
        <div class="field"><label>顧客名</label><div class="control wide js-select" id="fCustomer" data-options="すべて">すべて<span class="caret">▾</span></div></div>
        <div class="field"><label>管理担当者</label><div class="control js-select" id="fManager" data-options="すべて">すべて<span class="caret">▾</span></div></div>
        <div class="field"><label>全体進捗</label><div class="control small js-select" id="fOverall" data-options="すべて,実施前,実施中,完了,遅延">すべて<span class="caret">▾</span></div></div>
        <div class="search-btn" id="fSearch">検索</div>
      </div>
      <div class="table-card">
        <div class="table-meta"><div class="count">全 <b id="projectCount">0</b> 件</div></div>
        <div class="table-scroll" id="scrollArea">
        <table>
          <thead>
            <tr id="headRow">
              <th class="sticky" style="left:0;">年度</th>
              <th class="sticky" style="left:90px;">案件コード</th>
              <th class="sticky" style="left:240px;">案件名</th>
              <th class="sticky" style="left:460px;">顧客名</th>
              <th class="sticky" style="left:660px;">管理担当者</th>
              <th class="sticky" style="left:860px;">実施開始月</th>
              <th class="sticky" style="left:960px;">全体進捗</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
        </div>
        <div class="pagination"><div class="page-btn">‹</div><div class="page-btn active">1</div><div class="page-btn">›</div></div>
      </div>
    </div>
  </div>
</div>
<script src="js/storage/customer/store/customer-store.js"></script>
<script src="js/storage/staff/store/staff-store.js"></script>
<script src="js/storage/project/store/project-store.js"></script>
<script src="js/storage/project-progress/store/project-progress-store.js"></script>
<script src="js/storage/project-progress/screens/project-progress-list.js"></script>
<script src="js/select.js" defer></script>
<script src="js/storage/holiday/store/holiday-store.js"></script>
<script src="js/datepicker.js" defer></script>
<script src="js/sidebar-toggle.js" defer></script>
<script src="js/column-resize.js" defer></script>

<script src="js/pagination.js"></script>
<script src="js/filter-collapse.js"></script>
</body>
</html>

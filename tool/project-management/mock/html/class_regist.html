<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/style_regist.css">
</head>
<body>
<div class="app">
  <div id="sidebar-slot" data-active="class"></div>
  <script src="js/access.js"></script>
<script src="js/sidebar.js"></script>

  <div class="overlay">
    <div class="modal">
      <div class="modal-resize"></div>
      <div class="modal-header">
        <div>
          <h2 class="modal-header-title">クラス登録</h2>
        </div>
        <a class="close-x" href="class_list.html">✕</a>
      </div>
      <div class="modal-body">
        <div class="form-section">案件</div>
        <div class="form-field">
          <label>年度</label>
          <div class="form-control js-select" id="projectYear" data-options="2024,2025,2026,2027" data-target="#projectCode" data-options-map='{}'>2026<span class="caret">▾</span></div>
        </div>
        <div class="form-field">
          <label>案件コード</label>
          <div class="form-control js-select" id="projectCode" data-options="" data-target="#projectName" data-map='{}' data-target2="#projectSalesType" data-map2='{}' data-class-map2='{}' data-target3="#projectParticipationType" data-map3='{}' data-class-map3='{}'><span class="caret">▾</span></div>
        </div>
        <div class="form-field full">
          <label>案件情報</label>
          <div class="form-value">
            <span id="projectName"></span>
            <span class="tag violet" id="projectSalesType"></span>
            <span class="tag blue" id="projectParticipationType"></span>
          </div>
        </div>
        <div class="form-section">コース</div>
        <div class="form-field">
          <label>年度<span class="req">必須</span></label>
          <div class="form-control js-select" id="courseYear" data-options="2024,2025,2026,2027" data-target="#courseCode" data-options-map='{}'>2026<span class="caret">▾</span></div>
        </div>
        <div class="form-field"></div>
        <div class="form-field">
          <label>コースコード<span class="req">必須</span></label>
          <div class="form-control js-select" id="courseCode" data-options="" data-target="#courseName" data-map='{}' data-target2="#courseParticipationType" data-map2='{}' data-class-map2='{}' data-target3="#courseDeliveryType" data-map3='{}' data-class-map3='{}' data-target4="#courseSchedule" data-map4='{}'><span class="caret">▾</span></div>
        </div>
        <div class="form-field">
          <label>版<span class="req">必須</span></label>
          <div class="form-control js-select" id="version" data-options="1.0,1.1">1.0<span class="caret">▾</span></div>
        </div>
        <div class="form-field full">
          <label>コース情報</label>
          <div class="form-value">
            <span id="courseName"></span>
            <span class="tag blue" id="courseParticipationType"></span>
            <span id="courseRecommend" style="font-size:12px;color:#9aa4b5;">推奨：<span class="tag blue" id="courseDeliveryType"></span> <span id="courseSchedule"></span> <span id="courseTeachers"></span></span>
          </div>
        </div>
        <div class="form-section">クラス</div>
        <div class="form-field">
          <label>クラスID</label>
          <div class="form-control readonly" id="classId">自動採番</div>
        </div>
        <div class="form-field">
          <label>レッスンNo</label>
          <div class="form-control readonly" id="lessonNo">001</div>
        </div>
        <div class="form-field">
          <label>開始日<span class="req">必須</span></label>
          <div class="form-control js-date" id="start" data-no-closed-day><span class="caret">▾</span></div>
        </div>
        <div class="form-field">
          <label>終了日<span class="req">必須</span></label>
          <div class="form-control js-date" id="end" data-no-closed-day><span class="caret">▾</span></div>
        </div>
        <div class="form-field">
          <label>日数</label>
          <div class="form-control readonly" id="classDays"></div>
        </div>
        <div class="form-field form-spacer" aria-hidden="true"></div>
        <div class="form-field">
          <label>開始時刻</label>
          <div class="form-control js-select" id="startTime" data-options="08:00,08:30,09:00,09:30,10:00,10:30,11:00,11:30,12:00,12:30,13:00,13:30,14:00,14:30,15:00,15:30,16:00,16:30,17:00,17:30,18:00,18:30,19:00,19:30,20:00,20:30,21:00,21:30,22:00,22:30,23:00,23:30">選択してください<span class="caret">▾</span></div>
        </div>
        <div class="form-field">
          <label>終了時刻</label>
          <div class="form-control js-select" id="endTime" data-options="08:00,08:30,09:00,09:30,10:00,10:30,11:00,11:30,12:00,12:30,13:00,13:30,14:00,14:30,15:00,15:30,16:00,16:30,17:00,17:30,18:00,18:30,19:00,19:30,20:00,20:30,21:00,21:30,22:00,22:30,23:00,23:30">選択してください<span class="caret">▾</span></div>
        </div>
        <div class="form-field full">
          <label>実施形態<span class="req">必須</span></label>
          <div class="radio-group">
            <div class="master-radio" data-master-radio="DeliveryTypeStore" data-radio-name="deliveryType"></div>
          </div>
        </div>
        <div class="form-field">
          <label>管理担当者（複数選択可）</label>
          <div class="chip-box js-chip-select" id="manager" data-options="" data-chip-class="tag-like blue"><span class="chip-add">追加</span></div>
        </div>
        <div class="form-section">ロケーション</div>
        <div class="form-field full">
          <label>ロケーション区分<span class="req">必須</span></label>
          <div class="radio-group" data-target="#locationName">
            <div class="master-radio" data-master-radio="LocationTypeStore" data-radio-name="locationType"></div>
          </div>
        </div>
        <div class="form-field">
          <label>ロケーション名</label>
          <div class="form-control js-select" id="locationName" data-allow-input data-options=""><span class="caret">▾</span></div>
        </div>
        <div class="form-field">
          <label>演習室</label>
          <input type="text" class="form-control" id="practiceRoom">
        </div>
        <div class="form-field">
          <label>共用PCグループ</label>
          <div class="form-control js-select" id="sharedPcGroup" data-options=""><span class="caret">▾</span></div>
        </div>
        <div class="form-section">受講生</div>
        <div class="form-field">
          <label>受講人数</label>
          <div class="form-control number-select" id="people" data-options="10,15,20,24,30,35,40,50">
            <input type="text" inputmode="numeric" value="">
            <span class="caret">▾</span>
          </div>
        </div>
        <div class="form-section">講師</div>
        <div class="form-field">
          <label>予定講師数（メイン）<span class="req">必須</span></label>
          <div class="form-control number-select" id="mainTeachers" data-options="0,1,2,3,4,5">
            <input type="text" inputmode="numeric" value="">
            <span class="caret">▾</span>
          </div>
        </div>
        <div class="form-field">
          <label>予定講師数（サブ）<span class="req">必須</span></label>
          <div class="form-control number-select" id="subTeachers" data-options="0,1,2,3,4,5">
            <input type="text" inputmode="numeric" value="">
            <span class="caret">▾</span>
          </div>
        </div>
        <div class="form-field">
          <label>予定講師数（特別）</label>
          <div class="form-control number-select" id="specialTeachers" data-options="0,1,2,3,4,5">
            <input type="text" inputmode="numeric" value="">
            <span class="caret">▾</span>
          </div>
        </div>
        <div class="form-field full">
          <label>備考（特別講師）</label>
          <textarea class="form-control textarea auto-grow" data-min="68" id="specialMemo" placeholder="例）特別講師の依頼条件など"></textarea>
        </div>
        <div class="form-section">OliveOne</div>
        <div class="form-field">
          <label>アンケート暗証番号</label>
          <div class="form-control readonly" id="surveyPin">自動採番</div>
        </div>
        <div class="form-field">
          <label>テスト暗証番号</label>
          <div class="form-control readonly" id="testPin">自動採番</div>
        </div>
        <div class="form-section">クラス構成</div>
        <div class="form-field full">
          <label>クラスの関連（複数選択可）</label>
          <div class="chip-box js-chip-select" id="relatedClasses" data-options="" data-chip-class="tag-like blue"><span class="chip-add">追加</span></div>
        </div>
        <div class="form-section">タスク</div>
        <div class="form-field">
          <label>タスク区分<span class="req">必須</span></label>
          <div class="radio-group" id="taskTypeGroup"></div>
        </div>
        <div class="form-section">その他</div>
        <div class="form-field full">
          <label>備考</label>
          <textarea class="form-control textarea auto-grow" data-min="68" id="memo" placeholder="例）欠席者ありのため人数変更の可能性あり"></textarea>
        </div>
        <div class="form-field toggle-field">
          <label>稼働状態</label>
          <div class="toggle-row" id="statusRow"><div class="toggle" id="statusToggle"><div class="knob"></div></div><span id="statusLabel" data-status="ACTIVE"></span></div>
        </div>
        <div id="customAttributes" class="contents"></div>
      </div>
      <div class="modal-footer">
        <a class="nav-btn" id="cancelLink" href="class_list.html">キャンセル</a>
        <div id="saveBtn" class="btn primary">保存</div>
      </div>
    </div>
  </div>
</div>
${tags%
}
<script src="js/storage/slot-status/store/slot-status-store.js"></script>
<script src="js/storage/practice-status/store/practice-status-store.js"></script>
<script src="js/storage/operating-status/store/operating-status-store.js"></script>
<script src="js/html-util.js"></script>
<script src="js/storage/project/store/project-store.js"></script>
<script src="js/storage/delivery-type/store/delivery-type-store.js"></script>
<script src="js/storage/participation-type/store/participation-type-store.js"></script>
<script src="js/storage/sales-type/store/sales-type-store.js"></script>
<script src="js/storage/course/store/course-store.js"></script>
<script src="js/storage/location/store/location-store.js"></script>
<script src="js/storage/shared-pc-group/store/shared-pc-group-store.js"></script>
<script src="js/storage/staff/store/staff-store.js"></script>
<script src="js/storage/staff-role/store/staff-role-store.js"></script>
<script src="js/storage/job-type/store/job-type-store.js"></script>
<script src="js/storage/closed-day/store/closed-day-store.js"></script>
<script src="js/storage/location-type/store/location-type-store.js"></script>
<script src="js/storage/subject/store/subject-store.js"></script>
<script src="js/storage/task-type/store/task-type-store.js"></script>
<script src="js/storage/class/store/class-store.js"></script>
<script src="js/master-options.js"></script>
<script src="js/storage/custom-attribute/store/custom-attribute-store.js"></script>
<script src="js/storage/custom-attribute/screens/custom-attribute-fields.js"></script>
<script src="js/storage/class/screens/class-editor.js"></script>
<script src="js/storage/class/entry/class-regist.js"></script>
<script src="js/select.js" defer></script>
<script src="js/datepicker.js" defer></script>
<script src="js/number-select.js" defer></script>
<script src="js/sub-rows.js" defer></script>
<script src="js/chip-select.js" defer></script>
<script src="js/toggle.js" defer></script>
<script src="js/message-dialog.js"></script>
<script src="js/memo-area.js" defer></script>
<script src="js/modal-resize.js"></script>
</body>
</html>

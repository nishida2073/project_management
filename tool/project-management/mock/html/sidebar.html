<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/style.css">
<style>
  html, body { width: auto; height: 100%; margin: 0; }
  .sidebar { min-height: 100%; }
  html, body { overflow-x: hidden; overflow-y: auto; scrollbar-width: none; -ms-overflow-style: none; }
  html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }
  .sidebar-toggle { position: fixed; top: 14px; right: 8px; width: 28px; height: 28px; border: 1px solid #3a4a68; border-radius: 6px; background: transparent; color: #cdd7ea; font-size: 14px; cursor: pointer; z-index: 1; }
  body.collapsed .sidebar > *:not(.sidebar-toggle) { display: none; }
  body.collapsed .sidebar-toggle { right: auto; left: 8px; }
  .nav-group-title { cursor: pointer; user-select: none; position: relative; padding-right: 28px; }
  .nav-group-title::after { content: '▾'; position: absolute; right: 20px; top: 50%; transform: translateY(-50%); font-size: 11px; color: #8fa2c4; }
  .nav-group-title.collapsed::after { content: '▸'; }
  .nav-item.acc-hidden { display: none; }
</style>
</head>
<body>
<div class="sidebar">
  <button type="button" class="sidebar-toggle" aria-label="サイドバーの開閉">☰</button>
  <div class="logo" id="resetStorage" title="保存データを初期化します">研修管理システム<span>Training Product Suite（構想中）</span></div>
<div class="nav-group-title">案件管理</div>
  <a class="nav-item" data-key="project" href="project_list.html" target="_parent">案件</a>
  <a class="nav-item" data-key="project-progress" href="project_progress_list.html" target="_parent">進捗管理</a>
<div class="nav-group-title">コース管理</div>
  <a class="nav-item" data-sub="course" href="course_list.html" target="_parent">コース</a>
<div class="nav-group-title">クラス管理</div>
  <a class="nav-item" data-key="class" href="class_list.html" target="_parent">クラス</a>
  <a class="nav-item" data-key="assign" href="class_vender_list.html" target="_parent">登壇管理</a>
  <a class="nav-item" data-key="unei" href="class_progress_list.html" target="_parent">進捗管理</a>
  
  <div class="nav-group-title">マスタ管理</div>
  <a class="nav-item" data-sub="subject" href="subject_list.html" target="_parent">科目</a>
  <a class="nav-item" data-sub="location" href="location_list.html" target="_parent">ロケーション</a>
  <a class="nav-item" data-sub="customer" href="customer_list.html" target="_parent">顧客</a>
  <a class="nav-item" data-sub="vendor" href="vendor_list.html" target="_parent">講師ベンダー</a>
  <a class="nav-item" data-sub="staff" href="staff_list.html" target="_parent">担当者</a>
  <a class="nav-item" data-sub="task" href="task_list.html" target="_parent">タスク</a>
  <div class="nav-group-title">システム管理</div>
  <a class="nav-item" data-sub="user" href="user_list.html" target="_parent">ユーザー</a>
</div>
<script>
  var params = new URLSearchParams(location.search);
  var active = params.get('active');
  var subKey = params.get('sub');

  document.querySelectorAll('.nav-item[data-key]').forEach(function (el) {
    el.classList.add(el.getAttribute('data-key') === active ? 'active' : 'disabled');
  });

  document.querySelectorAll('.nav-item[data-sub]').forEach(function (el) {
    el.classList.add(el.getAttribute('data-sub') === subKey ? 'active' : 'disabled');
  });
  (function () {
    var btn = document.querySelector('.sidebar-toggle');
    function apply() { document.body.classList.toggle('collapsed', window.innerWidth < 100); }
    btn.addEventListener('click', function () { window.parent.postMessage({ type: 'sidebar-toggle' }, '*'); });
    window.addEventListener('resize', apply);
    apply();
  })();
  (function () {
    var KEY = 'sidebarCollapsedGroups';
    function load() {
      try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; }
    }
    function save(list) {
      try { localStorage.setItem(KEY, JSON.stringify(list)); } catch (e) {}
    }
    function setGroup(title, collapsed) {
      title.classList.toggle('collapsed', collapsed);
      var el = title.nextElementSibling;
      while (el && !el.classList.contains('nav-group-title')) {
        el.classList.toggle('acc-hidden', collapsed);
        el = el.nextElementSibling;
      }
    }
    function collapsedNames() {
      return Array.prototype.slice.call(document.querySelectorAll('.nav-group-title.collapsed'))
        .map(function (t) { return t.textContent.trim(); });
    }
    var saved = load();
    document.querySelectorAll('.nav-group-title').forEach(function (title) {
      var name = title.textContent.trim();
      setGroup(title, !Array.isArray(saved) || saved.indexOf(name) >= 0);
      title.addEventListener('click', function () {
        setGroup(title, !title.classList.contains('collapsed'));
        save(collapsedNames());
      });
    });
  })();

  document.getElementById('resetStorage').addEventListener('click', function () {
    if (!confirm('保存されたデータをすべて消去して、初期状態に戻します。よろしいですか？')) return;
    window.parent.postMessage({ type: 'reset-storage' }, '*');
  });
</script>
</body>
</html>

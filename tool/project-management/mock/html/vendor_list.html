<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/vendor_list.css">
</head>
<body>
<div class="app">
  <iframe src="sidebar.html?active=master&sub=vendor" width="220" height="1040" style="border:0; flex-shrink:0; display:block;" title="サイドバー"></iframe>

  <div class="main">
    <div class="topbar">
      <div class="crumb-block">
        <div class="crumb">マスタ管理<span>／</span>講師ベンダー</div>
        <p class="crumb-sub">講師ベンダー情報を管理します</p>
      </div>
      <div class="user"><span>山田 太郎（BD事業部）</span><div class="avatar">山田</div></div>
    </div>

    <div class="body-area">

      <div class="content">
        <div class="toolbar">
          <div class="left">
            <h1>講師ベンダー一覧</h1>
          </div>
          <div class="btn-group">
            <a class="search-btn" href="vendor_regist.html">新規登録</a>
          </div>
        </div>
        <div class="filter-panel">
          <div class="field"><label>キーワード検索</label><input type="text" class="field-control-input" placeholder="講師ベンダーコード・講師ベンダー名で検索"></div>
          <div class="field"><label>契約年度</label><div class="control small js-select" data-options="すべて,2026年度,2025年度,2024年度">すべて<span class="caret">▾</span></div></div>
          <div class="field"><label>契約区分</label><div class="control js-select" data-options="すべて,業務委託,業務提携">すべて<span class="caret">▾</span></div></div>
          <div class="field"><label>稼働状況</label><div class="control js-select" data-options="すべて,稼働中,停止中">すべて<span class="caret">▾</span></div></div>
          <div class="search-btn">検索</div>
        </div>

        <div class="table-card">
          <div class="table-meta"><div class="count">全 <b id="vendorCount">0</b> 件</div></div>
          <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>講師ベンダーコード</th>
                <th>講師ベンダー名</th>
                <th>契約区分</th>
                <th>契約年度</th>
                <th>連絡先</th>
                <th>備考</th>
                <th>担当窓口</th>
                <th>稼働状況</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="vendorBody"></tbody>
          </table>
          </div>
          <div class="pagination">
            <div class="page-btn">‹</div><div class="page-btn active">1</div><div class="page-btn">2</div><div class="page-btn">3</div><div class="page-btn">›</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="js/select.js" defer></script>
<script src="js/sidebar-toggle.js" defer></script>
<script src="js/column-resize.js" defer></script>
<script src="js/storage/contract-type/store/contract-type-store.js"></script>
<script src="js/storage/vendor/store/vendor-store.js"></script>
<script src="js/storage/vendor/screens/vendor-list.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/style_regist.css">
</head>
<body>
<div class="app">
  <iframe src="sidebar.html?active=master&sub=course" width="220" height="1040" style="border:0; flex-shrink:0; display:block;" title="サイドバー"></iframe>
  <div class="overlay">
    <div class="modal">
      <div class="modal-header">
        <div>
          <h2>コース登録</h2>
        </div>
        <a class="close-x" href="course_list.html">✕</a>
      </div>
      <div class="modal-body">
        <div class="form-section">科目</div>
        <div class="form-field">
          <label>科目名<span class="req">必須</span></label>
          <div class="form-control js-select" id="subjectSelect" data-options="システム開発入門,基盤技術基礎,AP要件定義基礎,AP設計・製造基礎,AP試験基礎,データモデル設計基礎,基盤構築プロセス基礎,営業基本Ⅰ,営業リスクマネジメントⅠ,IT-PM入門,品質管理入門,システム基盤実践"><span class="caret">▾</span></div>
        </div>
        <div class="form-field full">
          <label>科目情報</label>
          <div class="form-value">
            <span id="subjectCode"></span>
            <span class="tag orange" id="subjectType"></span>
          </div>
        </div>
        <div class="form-section">コース</div>
        <div class="form-field">
          <label>年度<span class="req">必須</span></label>
          <div class="form-control js-select" id="courseYear" data-options="2024年度,2025年度,2026年度,2027年度"><span class="caret">▾</span></div>
        </div>
        <div class="form-field form-spacer" aria-hidden="true"></div>
        <div class="form-field">
          <label>参加区分<span class="req">必須</span></label>
          <div class="radio-group">
            <label class="radio-option"><input type="radio" name="participationType" value="公募"><span class="radio-dot"></span><span class="tag orange">公募</span></label>
            <label class="radio-option"><input type="radio" name="participationType" value="受託"><span class="radio-dot"></span><span class="tag blue">受託</span></label>
          </div>
        </div>
        <div class="form-field form-spacer" aria-hidden="true"></div>
        <div class="form-field">
          <label>コースコード<span class="req">必須</span></label>
          <input type="text" class="form-control" id="courseCode">
        </div>
        <div class="form-field full">
          <label>コース名<span class="req">必須</span></label>
          <input type="text" class="form-control" id="courseName">
        </div>
        <div class="form-section">推奨設定</div>
        <div class="form-field full">
          <label>実施形態<span class="req">必須</span></label>
          <div class="radio-group">
            <label class="radio-option"><input type="radio" name="deliveryType" value="集合"><span class="radio-dot"></span><span class="tag blue">集合</span></label>
            <label class="radio-option"><input type="radio" name="deliveryType" value="オンライン"><span class="radio-dot"></span><span class="tag teal">オンライン</span></label>
            <label class="radio-option"><input type="radio" name="deliveryType" value="ハイブリッド"><span class="radio-dot"></span><span class="tag violet">ハイブリッド</span></label>
          </div>
        </div>
        <div class="form-field">
          <label>日数<span class="req">必須</span></label>
          <div class="form-control number-select" id="days" data-options="1,2,3,4,5">
            <input type="text" inputmode="numeric" value="">
            <span class="caret">▾</span>
          </div>
        </div>
        <div class="form-field" style="grid-column: 1;">
          <label>最小人数（推奨）</label>
          <div class="form-control number-select" id="minPeople" data-options="10,15,20,24,30,35,40,50">
            <input type="text" inputmode="numeric" value="">
            <span class="caret">▾</span>
          </div>
        </div>
        <div class="form-field">
          <label>最大人数（推奨）</label>
          <div class="form-control number-select" id="maxPeople" data-options="10,15,20,24,30,35,40,50">
            <input type="text" inputmode="numeric" value="">
            <span class="caret">▾</span>
          </div>
        </div>
        <div class="form-section">予定</div>
        <div class="form-field full">
          <label>クラス数（月別）</label>
          <div class="month-grid">
            <div class="month-cell"><span class="month-label">4月</span><div class="form-control number-select sm" data-options="0,1,2,3,4,5"><input type="text" inputmode="numeric" value="0"><span class="caret">▾</span></div></div>
            <div class="month-cell"><span class="month-label">5月</span><div class="form-control number-select sm" data-options="0,1,2,3,4,5"><input type="text" inputmode="numeric" value="0"><span class="caret">▾</span></div></div>
            <div class="month-cell"><span class="month-label">6月</span><div class="form-control number-select sm" data-options="0,1,2,3,4,5"><input type="text" inputmode="numeric" value="0"><span class="caret">▾</span></div></div>
            <div class="month-cell"><span class="month-label">7月</span><div class="form-control number-select sm" data-options="0,1,2,3,4,5"><input type="text" inputmode="numeric" value="0"><span class="caret">▾</span></div></div>
            <div class="month-cell"><span class="month-label">8月</span><div class="form-control number-select sm" data-options="0,1,2,3,4,5"><input type="text" inputmode="numeric" value="0"><span class="caret">▾</span></div></div>
            <div class="month-cell"><span class="month-label">9月</span><div class="form-control number-select sm" data-options="0,1,2,3,4,5"><input type="text" inputmode="numeric" value="0"><span class="caret">▾</span></div></div>
            <div class="month-cell"><span class="month-label">10月</span><div class="form-control number-select sm" data-options="0,1,2,3,4,5"><input type="text" inputmode="numeric" value="0"><span class="caret">▾</span></div></div>
            <div class="month-cell"><span class="month-label">11月</span><div class="form-control number-select sm" data-options="0,1,2,3,4,5"><input type="text" inputmode="numeric" value="0"><span class="caret">▾</span></div></div>
            <div class="month-cell"><span class="month-label">12月</span><div class="form-control number-select sm" data-options="0,1,2,3,4,5"><input type="text" inputmode="numeric" value="0"><span class="caret">▾</span></div></div>
            <div class="month-cell"><span class="month-label">1月</span><div class="form-control number-select sm" data-options="0,1,2,3,4,5"><input type="text" inputmode="numeric" value="0"><span class="caret">▾</span></div></div>
            <div class="month-cell"><span class="month-label">2月</span><div class="form-control number-select sm" data-options="0,1,2,3,4,5"><input type="text" inputmode="numeric" value="0"><span class="caret">▾</span></div></div>
            <div class="month-cell"><span class="month-label">3月</span><div class="form-control number-select sm" data-options="0,1,2,3,4,5"><input type="text" inputmode="numeric" value="0"><span class="caret">▾</span></div></div>
          </div>
          <div class="annual-summary">
            <label>クラス数（年間）</label>
            <div class="form-value" id="annualClassCount"></div>
          </div>
        </div>
        <div class="form-field toggle-field">
          <label>稼働状況</label>
          <div class="toggle-row" id="statusRow"><div class="toggle" id="statusToggle"><div class="knob"></div></div><span id="statusLabel">稼働中</span></div>
        </div>
      </div>
      <div class="modal-footer">
        <a class="search-btn" href="course_list.html">キャンセル</a>
        <div id="saveBtn" class="btn primary">保存</div>
      </div>
    </div>
  </div>
</div>
${tags%
}
<script src="js/storage/subject-type/store/subject-type-store.js"></script>
<script src="js/storage/delivery-type/store/delivery-type-store.js"></script>
<script src="js/storage/participation-type/store/participation-type-store.js"></script>
<script src="js/storage/course/store/course-store.js"></script>
<script src="js/storage/subject/store/subject-store.js"></script>
<script src="js/storage/course/screens/course-editor.js"></script>
<script src="js/storage/course/entry/course-regist.js"></script>
<script src="js/select.js" defer></script>
<script src="js/number-select.js" defer></script>
<script src="js/toggle.js" defer></script>
<script src="js/sidebar-toggle.js" defer></script>
<script src="js/message-dialog.js"></script>
</body>
</html>

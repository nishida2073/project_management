<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/style_modify.css">
</head>
<body>
<div class="app">
  <div id="sidebar-slot" data-active="master" data-sub="user"></div>
  <script src="js/access.js"></script>
<script src="js/sidebar.js"></script>
  <div class="overlay">
    <div class="modal">
      <div class="modal-resize"></div>
      <div class="modal-header">
        <div>
          <h2 class="modal-header-title">ユーザー更新</h2>
          <div class="sub" id="subLine"></div>
        </div>
        <a class="close-x" href="user_list.html">✕</a>
      </div>
      <div class="modal-body">
        <div class="form-field">
          <label>ユーザーコード</label>
          <div class="form-control readonly" id="userCode"></div>
        </div>
        <div class="form-field"></div>
        <div class="form-field">
          <label>ユーザー名<span class="req">必須</span></label>
          <input type="text" class="form-control" id="userName">
        </div>
        <div class="form-field full">
          <label>メールアドレス（ログインID）<span class="req">必須</span></label>
          <input type="email" class="form-control" id="userEmail">
        </div>
        <div class="form-field full" id="passwordField">
          <label>パスワード</label>
          <input type="password" class="form-control" id="userPassword">
        </div>
        <div class="form-field">
          <label>権限</label>
          <div class="radio-group" id="authorityGroup"></div>
        </div>
        <div class="form-field"></div>
        <div class="form-divider"></div>
        <div class="form-field">
          <label>実施担当連携</label>
          <div class="form-control readonly staff-view" id="staffSelect"></div>
        </div>
        <div class="form-field"></div>
        <div class="form-field">
          <label>所属区分</label>
          <div class="form-control readonly staff-view" id="affiliationView"></div>
        </div>
        <div class="form-field">
          <label>実施担当ベンダー</label>
          <div class="form-control readonly staff-view" id="venderView"></div>
        </div>
        <div class="form-field">
          <label>担当区分</label>
          <div class="form-control readonly staff-view" id="roleView"></div>
        </div>
        <div class="form-field">
          <label>業務区分</label>
          <div class="form-control readonly staff-view" id="jobView"></div>
        </div>
        <div class="form-field">
          <label>役職</label>
          <div class="form-control readonly staff-view" id="positionView"></div>
        </div>
        <div class="form-section">その他</div>
        <div class="form-field full">
          <label>備考</label>
          <textarea class="form-control textarea auto-grow" data-min="68" id="memo"></textarea>
        </div>
        <div class="form-field toggle-field">
          <label>稼働状態</label>
          <div class="toggle-row" id="statusRow"><div class="toggle" id="statusToggle"><div class="knob"></div></div><span id="statusLabel" data-status="ACTIVE"></span></div>
        </div>
      </div>
      <div class="modal-footer">
        <a class="nav-btn" href="user_list.html">キャンセル</a>
        <div id="saveBtn" class="btn primary">保存</div>
      </div>
    </div>
  </div>
</div>
<script src="js/storage/operating-status/store/operating-status-store.js"></script>
<script src="js/html-util.js"></script>
<script src="js/storage/user-role/store/user-role-store.js"></script>
<script src="js/storage/user/store/user-store.js"></script>
<script src="js/master-options.js"></script>
<script src="js/storage/job-type/store/job-type-store.js"></script>
<script src="js/storage/position/store/position-store.js"></script>
<script src="js/storage/staff-role/store/staff-role-store.js"></script>
<script src="js/storage/staff/store/staff-store.js"></script>
<script src="js/storage/affiliation/store/affiliation-store.js"></script>
<script src="js/storage/staff-vender/store/staff-vender-store.js"></script>
<script src="js/storage/link-state/store/link-state-store.js"></script>
<script src="js/storage/user/screens/user-editor.js"></script>
<script src="js/storage/user/entry/user-modify.js"></script>
<script src="js/select.js" defer></script>
<script src="js/toggle.js" defer></script>
<script src="js/message-dialog.js"></script>
<script src="js/memo-area.js" defer></script>
<script src="js/modal-resize.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <div id="sidebar-slot" data-active="master" data-sub="closedDay"></div>
  <script src="js/message-dialog.js"></script>
<script src="js/access.js"></script>
<script src="js/sidebar.js"></script>
  <div class="main">
    <div id="topbar-slot" data-title="休業日"></div>
    <script src="js/topbar.js"></script>
    <div class="content">
      <div class="list-toolbar">
        <div class="nav-btn" id="closedDayAdd">新規登録</div>
        <div class="nav-btn" id="closedDayImport">インポート</div>
        <div class="nav-btn" id="closedDayExport">エクスポート</div>
        <input type="file" id="closedDayImportFile" class="is-hidden" accept=".xlsx">
      </div>
      <div class="table-card">
        <div class="table-meta">
          <div class="count"><b id="closedDayCount">0</b> 件</div>
        </div>
        <div class="table-scroll table-scroll-x">
        <table>
          <thead>
            <tr>
              <th>日付</th>
              <th>名称</th>
              <th>種別</th>
              <th class="col-actions" data-min-width="180">操作</th>
            </tr>
          </thead>
          <tbody id="closedDayBody"></tbody>
        </table>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="js/storage/operating-status/store/operating-status-store.js"></script>
<script src="js/html-util.js"></script>
<script src="js/storage/closed-day/store/closed-day-store.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script src="js/store-import.js"></script>
<script src="js/storage/closed-day/screens/closed-day-settings.js"></script>
<script src="js/select.js" defer></script>
<script src="js/table-sort.js" defer></script>
<script src="js/datepicker.js" defer></script>
<script src="js/column-resize.js" defer></script>
</body>
</html>

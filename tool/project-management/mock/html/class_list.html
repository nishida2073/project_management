<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <div id="sidebar-slot" data-active="class"></div>
  <script src="js/sidebar.js"></script>

  <div class="main">
    <div class="topbar">
      <div class="crumb-block">
        <div class="crumb">クラス一覧</div>
      </div>
      <div class="user">
        <span>山田 太郎（BD事業部）</span>
        <div class="avatar">山田</div>
      </div>
    </div>

    <div class="content">
      
      <div class="filter-panel">
        <div class="field">
          <label>実施状況</label>
          <div class="control small js-select" data-practice-options data-match-class="col-practice">すべて<span class="caret">▾</span></div>
        </div>
        <div class="field narrow">
          <label>顧客</label>
          <div class="control js-select" id="customerFilter" data-options="すべて" data-match-class="col-customer">すべて<span class="caret">▾</span></div>
        </div>
        <div class="field">
          <label>年度</label>
          <div class="control small js-select" data-options="すべて,2024,2025,2026,2027">すべて<span class="caret">▾</span></div>
        </div>
        <div class="field">
          <label>キーワード検索（コース）</label>
          <input type="text" class="field-control-input" placeholder="コースコード・コース名で検索">
        </div>
        <div class="field">
          <label>開始日</label>
          <div class="control small js-date"><span class="caret">▾</span></div>
        </div>
        <div class="tilde">〜</div>
        <div class="field">
          <label>終了日</label>
          <div class="control small js-date"><span class="caret">▾</span></div>
        </div>
        <div class="field">
          <label>タスク区分</label>
          <div class="control small js-select" data-master-options="TaskTypeStore">すべて<span class="caret">▾</span></div>
        </div>
        <div class="search-btn">検索</div>
        <div class="search-btn" id="resetFilter">リセット</div>
      </div>

      <div style="display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-bottom: 16px;">
        <a class="search-btn" href="class_regist.html">新規登録</a>
      </div>

      <div class="table-card">
        <div class="table-meta">
          <div class="meta-left">
            <div class="count"><b id="classCount">0</b> 件</div>
            <div class="filter-toggle-wrap"><span class="filter-toggle-label">案件</span><div class="seg" data-hide-class="col-project"><button type="button" class="seg-opt" data-v="show">表示</button><button type="button" class="seg-opt is-active" data-v="hide">非表示</button></div></div>
          </div>
        </div>
        <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th class="sticky">実施状況</th>
              <th class="sticky">顧客</th>
              <th class="sticky">年度</th>
              <th class="sticky col-project">案件</th>
              <th class="sticky col-project">販売区分</th>
              <th class="sticky col-project">参加区分</th>
              <th class="sticky">コース</th>
              <th class="sticky">レッスンNo</th>
              <th class="sticky">タスク区分</th>
              <th>開始日</th>
              <th>終了日</th>
              <th>実施形態</th>
              <th>受講人数</th>
              <th>予定講師数<br>（メイン）</th>
              <th>予定講師数<br>（サブ）</th>
              <th>管理担当者</th>
              <th>ロケーション区分</th>
              <th>ロケーション名</th>
              <th>稼働状態</th>
              <th class="no-sort">備考</th>
              <th class="col-actions">操作</th>
            </tr>
          </thead>
          <tbody id="classBody"></tbody>
        </table>
        </div>
        <div class="pagination"></div>
      </div>
    </div>
  </div>
</div>
${tags%
}
<script src="js/storage/job-type/store/job-type-store.js"></script>
<script src="js/storage/staff-role/store/staff-role-store.js"></script>
<script src="js/master-options.js"></script>
<script src="js/storage/practice-status/store/practice-status-store.js"></script>
<script src="js/storage/operating-status/store/operating-status-store.js"></script>
<script src="js/html-util.js"></script>
<script src="js/storage/project/store/project-store.js"></script>
<script src="js/storage/delivery-type/store/delivery-type-store.js"></script>
<script src="js/storage/participation-type/store/participation-type-store.js"></script>
<script src="js/storage/sales-type/store/sales-type-store.js"></script>
<script src="js/storage/course/store/course-store.js"></script>
<script src="js/storage/location/store/location-store.js"></script>
<script src="js/storage/staff/store/staff-store.js"></script>
<script src="js/storage/location-type/store/location-type-store.js"></script>
<script src="js/storage/task-type/store/task-type-store.js"></script>
<script src="js/storage/class/store/class-store.js"></script>
<script src="js/storage/customer/store/customer-store.js"></script>
<script src="js/storage/class/screens/class-list.js"></script>
<script src="js/select.js" defer></script>
<script src="js/storage/holiday/store/holiday-store.js"></script>
<script src="js/datepicker.js" defer></script>
<script src="js/table-sort.js" defer></script>
<script src="js/column-resize.js" defer></script>
<script src="js/list-filter-auto.js"></script>
<script src="js/list-filter.js"></script><script src="js/pagination.js"></script>
<script src="js/filter-collapse.js"></script>
<script src="js/seg-column-toggle.js"></script>
<script src="js/filter-memory.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <iframe src="sidebar.html?active=class" width="220" height="1040" style="border:0; flex-shrink:0; display:block;" title="サイドバー"></iframe>

  <div class="main">
    <div class="topbar">
      <div class="crumb-block">
        <div class="crumb">クラス一覧</div>
      </div>
      <div class="user">
        <span>山田 太郎（BD事業部）</span>
        <div class="avatar">山田</div>
      </div>
    </div>

    <div class="content">
      
      <div class="filter-panel">
        <div class="field">
          <label>実施状況</label>
          <div class="control small js-select" data-options="すべて,実施前,実施中,実施後" data-match-col="0">すべて<span class="caret">▾</span></div>
        </div>
        <div class="field">
          <label>年度</label>
          <div class="control small js-select" data-options="すべて,2024年度,2025年度,2026年度,2027年度">すべて<span class="caret">▾</span></div>
        </div>
        <div class="field">
          <label>キーワード検索（コース）</label>
          <input type="text" class="field-control-input" placeholder="コースコード・コース名で検索">
        </div>
        <div class="field">
          <label>開始日</label>
          <div class="control small js-date">2026/04/01<span class="caret">▾</span></div>
        </div>
        <div class="tilde">〜</div>
        <div class="field">
          <label>終了日</label>
          <div class="control small js-date">2026/09/30<span class="caret">▾</span></div>
        </div>
        <div class="field">
          <label>タスク区分</label>
          <div class="control small js-select" data-options="すべて,データ,グループ">すべて<span class="caret">▾</span></div>
        </div>
        <div class="field">
          <label>実施形態</label>
          <div class="control small js-select" data-options="すべて,集合,オンライン,ハイブリッド">すべて<span class="caret">▾</span></div>
        </div>
        <div class="field">
          <label>ロケーション区分</label>
          <div class="control small js-select" data-options="すべて,駒場,成城,外部会場">すべて<span class="caret">▾</span></div>
        </div>
        <div class="search-btn">検索</div>
      </div>

      <div style="display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-bottom: 16px;">
        <a class="search-btn" href="class_regist.html">新規登録</a>
      </div>

      <div class="table-card">
        <div class="table-meta">
          <div class="count"><b id="classCount">0</b> 件</div>
        </div>
        <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>実施状況</th>
              <th>年度</th>
              <th>案件</th>
              <th>販売区分</th>
              <th>参加区分</th>
              <th>コース</th>
              <th>レッスンNo</th>
              <th>タスク区分</th>
              <th>開始日</th>
              <th>終了日</th>
              <th>実施形態</th>
              <th>受講人数</th>
              <th>予定講師数<br>（メイン）</th>
              <th>予定講師数<br>（サブ）</th>
              <th>管理担当者</th>
              <th>ロケーション区分</th>
              <th>ロケーション名</th>
              <th>稼働状況</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="classBody"></tbody>
        </table>
        </div>
        <div class="pagination"></div>
      </div>
    </div>
  </div>
</div>
${tags%
}
<script src="js/storage/project/store/project-store.js"></script>
<script src="js/storage/delivery-type/store/delivery-type-store.js"></script>
<script src="js/storage/participation-type/store/participation-type-store.js"></script>
<script src="js/storage/sales-type/store/sales-type-store.js"></script>
<script src="js/storage/course/store/course-store.js"></script>
<script src="js/storage/location/store/location-store.js"></script>
<script src="js/storage/staff/store/staff-store.js"></script>
<script src="js/storage/location-type/store/location-type-store.js"></script>
<script src="js/storage/task-type/store/task-type-store.js"></script>
<script src="js/storage/class/store/class-store.js"></script>
<script src="js/storage/class/screens/class-list.js"></script>
<script src="js/select.js" defer></script>
<script src="js/storage/holiday/store/holiday-store.js"></script>
<script src="js/datepicker.js" defer></script>
<script src="js/sidebar-toggle.js" defer></script>
<script src="js/table-sort.js" defer></script>
<script src="js/column-resize.js" defer></script>
<script src="js/list-filter.js"></script><script src="js/pagination.js"></script>
<script src="js/filter-collapse.js"></script>
</body>
</html>

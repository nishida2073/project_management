<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <iframe src="sidebar.html?active=master&sub=task" width="220" height="1040" style="border:0; flex-shrink:0; display:block;" title="サイドバー"></iframe>

  <div class="main">
    <div class="topbar">
      <div class="crumb-block">
        <div class="crumb">タスク一覧</div>
      </div>
      <div class="user"><span>山田 太郎（BD事業部）</span><div class="avatar">山田</div></div>
    </div>

    <div class="content">
      <div class="filter-panel">
        <div class="field"><label>キーワード検索</label><input type="text" class="field-control-input" placeholder="タスクコード・タスク名で検索"></div>
        <div class="field"><label>タスク区分</label><div class="control small js-select" data-options="すべて,データ,グループ">すべて<span class="caret">▾</span></div></div>
        <div class="field"><label>作業区分</label><div class="control small js-select" data-options="すべて,事前準備,事後対応,特別対応">すべて<span class="caret">▾</span></div></div>
        <div class="field"><label>実務担当区分</label><div class="control small js-select" data-options="すべて,社内,パートナー">すべて<span class="caret">▾</span></div></div>
        <div class="field"><label>稼働状況</label><div class="control small js-select" data-options="すべて,稼働中,停止中">すべて<span class="caret">▾</span></div></div>
        <div class="search-btn">検索</div>
      </div>

      
      <div style="display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-bottom: 16px;">
        <a class="search-btn" href="task_regist.html">新規登録</a>
      </div>

      <div class="table-card">
        <div class="table-meta"><div class="count"><b id="taskCount">0</b> 件</div></div>
        <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>タスクコード</th>
              <th>タスク名</th>
              <th>タスク区分</th>
              <th>作業区分</th>
              <th>作業順</th>
              <th>実務担当区分</th>
              <th>実施担当ベンダー名</th>
              <th>予定開始日数</th>
              <th>稼働状況</th>
              <th class="col-actions">操作</th>
            </tr>
          </thead>
          <tbody id="taskBody"></tbody>
        </table>
        </div>
        <div class="pagination"></div>
      </div>
    </div>
  </div>
</div>
<script src="js/storage/task-type/store/task-type-store.js"></script>
<script src="js/storage/teacher-vender/store/teacher-vender-store.js"></script>
<script src="js/storage/staff-vender/store/staff-vender-store.js"></script>
<script src="js/storage/work-type/store/work-type-store.js"></script>
<script src="js/storage/task/store/task-store.js"></script>
<script src="js/sidebar-toggle.js" defer></script>
<script src="js/table-sort.js" defer></script>
<script src="js/column-resize.js" defer></script>
<script src="js/storage/task/screens/task-list.js"></script>
<script src="js/select.js" defer></script>
<script src="js/list-filter-auto.js"></script>
<script src="js/list-filter.js"></script>
<script src="js/pagination.js"></script>
</body>
</html>
